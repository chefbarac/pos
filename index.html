                    } else {
                        arCard.appendChild(el("div", { class: "stmt-note" }, "AR roll-forward ties ✓"));
                    }
                    if (Math.abs(arReconGap) > 0.05) {
                        arCard.appendChild(
                            el(
                                "div",
                                { class: "stmt-note", style: "color:var(--rust)" },
                                "⚠ AR ledger " + fmtPeso(endingAR) + " vs reconstructed " + fmtPeso(endingARRecon) + " (Δ " + fmtPeso(arReconGap) + ").",
                            ),
                        );
                    }
                    section.appendChild(arCard);

                    // ---- AP reconciliation ----
                    const apCard = el("div", { class: "card stmt-card" });
                    apCard.appendChild(el("div", { class: "stmt-title" }, "Accounts payable reconciliation"));
                    apCard.appendChild(el("div", { class: "stmt-period" }, "Reconstructed from each transaction’s date (not entry date). Credit purchase/expense → +AP; settlement payment → −AP."));
                    apCard.appendChild(stmtRow("Opening AP (start of period)", openingAP, { indent: true }));
                    if (Math.abs(apAtCostingStart) > 0.005 && costingStartAt != null) {
                        apCard.appendChild(stmtRow("Memo: AP outstanding at Costing start", apAtCostingStart, { indent: true }));
                    }
                    apCard.appendChild(stmtRow("+ Credit purchases/expenses in period", creditsInPeriod, { indent: true }));
                    if (invPurchasesCredit > 0) {
                        apCard.appendChild(stmtRow("  of which inventory on credit (period filter)", invPurchasesCredit, { indent: true }));
                    }
                    if (opexCredit > 0) {
                        apCard.appendChild(stmtRow("  of which operating on credit (period filter)", opexCredit, { indent: true }));
                    }
                    apCard.appendChild(stmtRow("− Settlements in period (by payment date)", settlementsInPeriod, { indent: true }));
                    apCard.appendChild(stmtRow("Ending AP (Balance Sheet ledger)", endingAP, { grand: true }));
                    apCard.appendChild(stmtRow("Ending AP (reconstructed from dates)", endingAPRecon, { indent: true }));
                    const apCheck = Math.round((openingAP + creditsInPeriod - settlementsInPeriod - endingAP) * 100) / 100;
                    if (Math.abs(apCheck) > 0.05) {
                        apCard.appendChild(el("div", { class: "stmt-note", style: "color:var(--rust)" }, "⚠ AP rollforward residual: " + fmtPeso(apCheck)));
                    } else {
                        apCard.appendChild(el("div", { class: "stmt-note" }, "AP rollforward ties ✓"));
                    }
                    if (Math.abs(apGap) > 0.05) {
                        apCard.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Open payable expenses (not settled): " + fmtPeso(openPayableExpenses) + " vs ledger AP " + fmtPeso(endingAP) + " (Δ " + fmtPeso(apGap) + ").",
                            ),
                        );
                    }
                    section.appendChild(apCard);

                    // ---- Inventory report + rollforward ----
                    const invCard = el("div", { class: "card stmt-card" });
                    invCard.appendChild(el("div", { class: "stmt-title" }, "Inventory"));
                    invCard.appendChild(
                        el(
                            "div",
                            { class: "stmt-period" },
                            costingSnap.ok ? "At cost for the Balance Sheet · potential sales value is informational only" : "Costing DB not available — open both apps on the same origin",
                        ),
                    );
                    if (costingSnap.ok) {
                        invCard.appendChild(stmtRow("At cost (Balance Sheet)", inventoryValue, { total: true }));
                        invCard.appendChild(stmtRow("Materials tracked", 0, { indent: true, text: String((costingSnap.materials || []).length) }));
                        if (inventoryBelowReorder > 0) {
                            invCard.appendChild(stmtRow("Below reorder", 0, { indent: true, text: String(inventoryBelowReorder) }));
                        }
                        if (potentialFGRevenue != null && isFinite(potentialFGRevenue)) {
                            invCard.appendChild(stmtRow("Potential sales value", potentialFGRevenue, { indent: true }));
                            invCard.appendChild(stmtRow("Potential gross profit", potentialFGProfit || 0, { indent: true, signed: true }));
                        }
                        if (avgMargin != null) {
                            invCard.appendChild(stmtRow("Weighted average margin (all)", avgMargin, { indent: true, pct: true }));
                        }
                        const byCatReport = (costingSnap.metrics && costingSnap.metrics.byCategory) || {};
                        const preferredReport = ["Service", "Merchandise"];
                        const catKeysReport = Object.keys(byCatReport).sort((a, b) => {
                            const ia = preferredReport.indexOf(a);
                            const ib = preferredReport.indexOf(b);
                            if (ia >= 0 && ib >= 0) return ia - ib;
                            if (ia >= 0) return -1;
                            if (ib >= 0) return 1;
                            return a.localeCompare(b);
                        });
                        if (catKeysReport.length) {
                            invCard.appendChild(stmtRow("Margin by category", 0, { section: true }));
                            catKeysReport.forEach((name) => {
                                const b = byCatReport[name];
                                const label =
                                    name +
                                    " (" +
                                    b.count +
                                    " item" +
                                    (b.count === 1 ? "" : "s") +
                                    ")" +
                                    (name === "Service" ? " · typically high" : name === "Merchandise" ? " · typically lower" : "");
                                invCard.appendChild(
                                    stmtRow(label, b.avgMargin != null ? b.avgMargin : 0, {
                                        indent: true,
                                        pct: true,
                                        text: b.avgMargin == null ? "—" : undefined,
                                    }),
                                );
                                invCard.appendChild(stmtRow(name + " potential profit", b.profit || 0, { indent: true, signed: true }));
                            });
                        }
                        if (costingStartAt != null) {
                            invCard.appendChild(
                                el(
                                    "div",
                                    { class: "stmt-note" },
                                    "Costing tracking start: " +
                                        new Date(costingStartAt).toLocaleString("en-PH") +
                                        ". Opening inventory below is intentional physical stock when Costing began (startingQty × cost) — not a discrepancy.",
                                ),
                            );
                        }

                        invCard.appendChild(stmtRow("Historical / pre-costing (books only)", 0, { section: true }));
                        invCard.appendChild(stmtRow("Opening inventory at Costing start (intentional)", systemOpeningInventory, { indent: true }));
                        invCard.appendChild(stmtRow("POS inventory purchases before Costing start", posInvAllPre, { indent: true }));
                        invCard.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Pre-costing POS purchases remain historical financial transactions. They are already represented by opening inventory and are NOT added again to the post-opening roll-forward.",
                            ),
                        );

                        invCard.appendChild(stmtRow("Post-costing inventory rollforward", 0, { section: true }));
                        invCard.appendChild(stmtRow("Opening inventory", rollOpen, { indent: true }));
                        invCard.appendChild(stmtRow("+ Costing stock-ins after start (at cost)", invFlow.ins, { indent: true }));
                        invCard.appendChild(stmtRow("− Stock-outs / COGS (at cost)", invFlow.outs, { indent: true }));
                        if (invFlow.adjustCount > 0) {
                            invCard.appendChild(
                                stmtRow("Adjustments recorded (" + invFlow.adjustCount + " move" + (invFlow.adjustCount === 1 ? "" : "s") + ")", 0, { indent: true, text: "see Costing" }),
                            );
                        }
                        invCard.appendChild(stmtRow("= Calculated ending (Costing moves)", calcEndingFromCosting, { indent: true }));
                        invCard.appendChild(stmtRow("Actual ending inventory (Balance Sheet)", endingInventory, { grand: true }));
                        if (Math.abs(invDiffCosting) > 0.5) {
                            invCard.appendChild(
                                el(
                                    "div",
                                    { class: "stmt-note", style: "color:var(--rust)" },
                                    "⚠ Inventory reconciliation difference: " +
                                        fmtPeso(invDiffCosting) +
                                        ". Calculated " +
                                        fmtPeso(calcEndingFromCosting) +
                                        " vs actual " +
                                        fmtPeso(endingInventory) +
                                        ". Investigate unit-cost changes, missing adjusts, wastage not logged, or moves outside the window.",
                                ),
                            );
                        } else {
                            invCard.appendChild(el("div", { class: "stmt-note" }, "Post-costing Costing rollforward ties ✓"));
                        }

                        invCard.appendChild(stmtRow("Post-costing POS purchase bridge", 0, { section: true }));
                        invCard.appendChild(stmtRow("POS inventory purchases after Costing start (this period)", posInvPurchasesPostCosting, { indent: true }));
                        invCard.appendChild(stmtRow("Costing stock-ins (same window)", invFlow.ins, { indent: true }));
                        invCard.appendChild(stmtRow("Post-start purchases − Costing stock-ins", invPurchaseVsCostingIns, { indent: true, signed: true }));
                        invCard.appendChild(stmtRow("COGS on P&L (" + (cogsEstimated ? "estimated" : cogsSource) + ")", cogs, { indent: true }));
                        if (Math.abs(posInvPurchasesPreCosting) > 0.005) {
                            invCard.appendChild(
                                stmtRow("POS inventory purchases before Costing (this period, excluded from bridge)", posInvPurchasesPreCosting, {
                                    indent: true,
                                }),
                            );
                        }
                        if (Math.abs(invPurchaseVsCostingIns) > 0.5) {
                            invCard.appendChild(
                                el(
                                    "div",
                                    { class: "stmt-note", style: "color:var(--rust)" },
                                    "⚠ Post-costing POS purchases (" +
                                        fmtPeso(posInvPurchasesPostCosting) +
                                        ") do not match Costing stock-ins (" +
                                        fmtPeso(invFlow.ins) +
                                        "). Δ " +
                                        fmtPeso(invPurchaseVsCostingIns) +
                                        ". Link or record stock-ins for restocks made after Costing started.",
                                ),
                            );
                        }
                        if (Math.abs(invDiffPosBridge) > 0.5 && Math.abs(posInvPurchasesPostCosting) > 0.005) {
                            invCard.appendChild(
                                el(
                                    "div",
                                    { class: "stmt-note", style: "color:var(--rust)" },
                                    "⚠ Open " +
                                        fmtPeso(rollOpen) +

                /* ---------- BUSINESS METRICS & VALUATION ---------- */
                /**
                 * Aggregate KPIs for a transaction set. Sales only for revenue/txn metrics.
                 * Transfers and owner moves are excluded from revenue (existing accounting model).
                 */
                function aggregateSalesMetrics(txs, opts) {
                    opts = opts || {};
                    // Default: exclude sales flagged excludeFromForecast (same as Forecast demand baseline).
                    // Pass includeExcluded: true only if you need full books totals.
                    const includeExcluded = !!opts.includeExcluded;
                    const allSales = (txs || []).filter((t) => t.type === "sale");
                    const excludedSales = includeExcluded ? [] : allSales.filter(isExcludedFromForecast);
                    const sales = includeExcluded ? allSales : allSales.filter((t) => !isExcludedFromForecast(t));
                    const expenses = (txs || []).filter((t) => t.type === "expense");
                    let revenue = 0;
                    const amounts = [];
                    const byCategory = {};
                    const byPayment = {};
                    const byItem = {}; // name -> { qty, revenue, count }
                    const byDow = [0, 0, 0, 0, 0, 0, 0]; // Sun..Sat revenue
                    const byDowTx = [0, 0, 0, 0, 0, 0, 0];
                    const byHour = new Array(24).fill(0);
                    const byHourTx = new Array(24).fill(0);
                    const dayKeys = new Set();

                    sales.forEach((t) => {
                        const amt = Number(t.amount) || 0;
                        revenue += amt;
                        amounts.push(amt);
                        const pay = t.payment || "other";
                        byPayment[pay] = (byPayment[pay] || 0) + amt;

                        const d = new Date(t.date);
                        if (!isNaN(d.getTime())) {
                            byDow[d.getDay()] += amt;
                            byDowTx[d.getDay()]++;
                            byHour[d.getHours()] += amt;
                            byHourTx[d.getHours()]++;
                            dayKeys.add(d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()));
                        }

                        txLines(t).forEach((ln) => {
                            const cat = ln.category || t.category || "Other";
                            const item = (ln.item || ln.name || t.item || "Item").trim() || "Item";
                            const la = Number(ln.amount) || 0;
                            const q = Number(ln.qty) || 0;
                            byCategory[cat] = (byCategory[cat] || 0) + la;
                            if (!byItem[item]) byItem[item] = { name: item, category: cat, qty: 0, revenue: 0, count: 0 };
                            byItem[item].qty += q > 0 ? q : 1;
                            byItem[item].revenue += la;
                            byItem[item].count += 1;
                        });
                    });

                    const txnCount = sales.length;
                    const avgTxn = txnCount ? revenue / txnCount : 0;
                    const medTxn = medianOf(amounts);
                    const operatingDays = dayKeys.size || 0;

                    const excludedCount = excludedSales.length;
                    const excludedRevenue = excludedSales.reduce((s, t) => s + (Number(t.amount) || 0), 0);
                    return {
                        revenue,
                        txnCount,
                        avgTxn,
                        medTxn,
                        expenseTotal: sumBy(expenses, () => true),
                        byCategory,
                        byPayment,
                        byItem,
                        byDow,
                        byDowTx,
                        byHour,
                        byHourTx,
                        operatingDays,
                        amounts,
                        excludedCount,
                        excludedRevenue,
                    };
                }

                async function estimatePeriodCogsAndOpex(periodTxs, periodFrom, periodTo) {
                    let cogs = null;
                    let cogsSource = "none";
                    let avgMargin = null;
                    let opex = 0;
                    let inventoryValue = 0;
                    let costingOk = false;
                    // Baseline metrics: sales with excludeFromForecast are omitted (realistic expectations).
                    const baselineTxs = (periodTxs || []).filter((t) => t.type !== "sale" || !isExcludedFromForecast(t));
                    try {
                        const snap = await loadCostingInventorySnapshot();
                        costingOk = !!snap.ok;
                        if (snap.ok) {
                            const inv = typeof computeInventoryAtCost === "function" ? computeInventoryAtCost(snap.materials || []) : { total: 0 };
                            inventoryValue = inv.total || 0;
                            if (snap.metrics && snap.metrics.avgMargin != null && isFinite(snap.metrics.avgMargin)) {
                                avgMargin = snap.metrics.avgMargin;
                            }
                            // Prefer margin-based COGS on baseline revenue so excluded one-offs do not distort GP.
                            // Stock-out COGS is period-wide and may include materials for excluded sales.
                            const matNames = typeof materialNameSetFromSnap === "function" ? materialNameSetFromSnap(snap) : new Set();
                            if (typeof splitExpensesInventoryVsOpex === "function") {
                                const split = splitExpensesInventoryVsOpex(baselineTxs, matNames);
                                opex = split.opexTotal;
                            } else {
                                opex = sumBy(baselineTxs, (t) => t.type === "expense");
                            }
                        } else {
                            opex = sumBy(baselineTxs, (t) => t.type === "expense");
                        }
                    } catch (e) {
                        opex = sumBy(baselineTxs, (t) => t.type === "expense");
                    }
                    const revenue = sumBy(baselineTxs, (t) => t.type === "sale");
                    if (avgMargin != null && revenue > 0) {
                        cogs = revenue * (1 - avgMargin / 100);
                        cogsSource = "margin-estimate";
                    } else if (typeof computePeriodCogsFromMoves === "function" && periodFrom && periodTo) {
                        try {
                            const snap2 = await loadCostingInventorySnapshot();
                            if (snap2.ok) {
                                const cogsRes = computePeriodCogsFromMoves(snap2.moves || [], snap2.materials || [], periodFrom, periodTo);
                                if (cogsRes && cogsRes.hasData) {
                                    cogs = cogsRes.cogs;
                                    cogsSource = "stock-outs";
                                }
                            }
                        } catch (e2) {}
                    }
                    if (cogs == null) cogs = 0;
                    return { cogs, cogsSource, avgMargin, opex, inventoryValue, costingOk, revenue };
                }

                function scoreBusinessHealth(ctx) {
                    // Returns null if insufficient data
                    const checks = [];
                    let score = 50;
                    let factors = 0;

                    if (ctx.revenueGrowth != null && isFinite(ctx.revenueGrowth)) {
                        factors++;
                        if (ctx.revenueGrowth >= 15) {
                            score += 12;
                            checks.push({ ok: true, text: "Revenue growing " + fmtGrowth(ctx.revenueGrowth) });
                        } else if (ctx.revenueGrowth >= 0) {
                            score += 6;
                            checks.push({ ok: true, text: "Revenue stable/up " + fmtGrowth(ctx.revenueGrowth) });
                        } else if (ctx.revenueGrowth > -10) {
                            score -= 4;
                            checks.push({ ok: false, text: "Revenue soft " + fmtGrowth(ctx.revenueGrowth) });
                        } else {
                            score -= 12;
                            checks.push({ ok: false, text: "Revenue down " + fmtGrowth(ctx.revenueGrowth) });
                        }
                    }

                    if (ctx.grossMarginPct != null && isFinite(ctx.grossMarginPct)) {
                        factors++;
                        if (ctx.grossMarginPct >= 40) {
                            score += 10;
                            checks.push({ ok: true, text: "Gross margin healthy (" + fmtPct(ctx.grossMarginPct) + ")" });
                        } else if (ctx.grossMarginPct >= 25) {
                            score += 5;
                            checks.push({ ok: true, text: "Gross margin OK (" + fmtPct(ctx.grossMarginPct) + ")" });
                        } else {
                            score -= 8;
                            checks.push({ ok: false, text: "Gross margin thin (" + fmtPct(ctx.grossMarginPct) + ")" });
                        }
                    }

                    if (ctx.txnGrowth != null && isFinite(ctx.txnGrowth)) {
                        factors++;
                        if (ctx.txnGrowth >= 10) {
                            score += 8;
                            checks.push({ ok: true, text: "Transaction volume up " + fmtGrowth(ctx.txnGrowth) });
                        } else if (ctx.txnGrowth >= 0) {
                            score += 3;
                            checks.push({ ok: true, text: "Transaction volume stable" });
                        } else {
                            score -= 6;
                            checks.push({ ok: false, text: "Fewer transactions " + fmtGrowth(ctx.txnGrowth) });
                        }
                    }

                    if (ctx.avgTxnGrowth != null && isFinite(ctx.avgTxnGrowth)) {
                        factors++;
                        if (ctx.avgTxnGrowth >= 5) {
                            score += 6;
                            checks.push({ ok: true, text: "Average ticket growing" });
                        } else if (ctx.avgTxnGrowth < -8) {
                            score -= 6;
                            checks.push({ ok: false, text: "Average transaction value declining" });
                        }
                    }

                    if (ctx.liquid != null && ctx.payable != null) {
                        factors++;
                        if (ctx.liquid > ctx.payable * 1.5) {
                            score += 8;
                            checks.push({ ok: true, text: "Cash covers payables comfortably" });
                        } else if (ctx.liquid >= ctx.payable) {
                            score += 3;
                            checks.push({ ok: true, text: "Cash covers payables" });
                        } else if (ctx.payable > 0) {
                            score -= 10;
                            checks.push({ ok: false, text: "High outstanding payables vs liquid cash" });
                        }
                    }

                    if (ctx.netMarginPct != null && isFinite(ctx.netMarginPct)) {
                        factors++;
                        if (ctx.netMarginPct >= 15) {
                            score += 8;
                            checks.push({ ok: true, text: "Net margin solid (" + fmtPct(ctx.netMarginPct) + ")" });
                        } else if (ctx.netMarginPct < 0) {
                            score -= 12;
                            checks.push({ ok: false, text: "Negative net margin" });
                        } else if (ctx.netMarginPct < 5) {
                            score -= 4;
                            checks.push({ ok: false, text: "Thin net margin (" + fmtPct(ctx.netMarginPct) + ")" });
                        }
                    }

                    if (factors < 3) return { score: null, checks: [], message: "Insufficient data for a reliable health score." };
                    score = Math.max(0, Math.min(100, Math.round(score)));
                    return { score, checks, message: null };
                }

                        ["month", "Month"],
                        ["quarter", "Quarter"],
                        ["year", "Year"],
                        ["custom", "Custom"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.metricsRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.metricsRange = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    rangeCard.appendChild(rangeRow);
                    if (App.metricsRange === "custom") {
                        const crow = el("div", { class: "addrow", style: "margin-top:8px" });
                        const fromInp = el("input", { type: "date", class: "finput", value: (App.metricsCustom && App.metricsCustom.from) || "" });
                        const toInp = el("input", { type: "date", class: "finput", value: (App.metricsCustom && App.metricsCustom.to) || "" });
                        const apply = el("button", { type: "button", class: "smallbtn" }, "Apply");
                        apply.addEventListener("click", () => {
                            App.metricsCustom = { from: fromInp.value || null, to: toInp.value || null };
                            softRender();
                        });
                        crow.appendChild(fromInp);
                        crow.appendChild(toInp);
                        crow.appendChild(apply);
                        rangeCard.appendChild(crow);
                    }
                    wrap.appendChild(rangeCard);

                    const allTxs = await allTx();
                    const bounds = reportPeriodBounds(App.metricsRange, App.metricsCustom);
                    const periodFrom = bounds.from;
                    const periodTo = bounds.to;
                    const periodTxs = periodFrom == null ? allTxs : allTxs.filter((t) => inRange(t.date, periodFrom, periodTo));
                    const prevBounds = previousPeriodBounds(periodFrom || startOfDay(new Date(0)), periodTo || endOfDay(new Date()));
                    const prevTxs = prevBounds.from && prevBounds.to ? allTxs.filter((t) => inRange(t.date, prevBounds.from, prevBounds.to)) : [];

                    const cur = aggregateSalesMetrics(periodTxs);
                    const prev = aggregateSalesMetrics(prevTxs);
                    const pl = await estimatePeriodCogsAndOpex(periodTxs, periodFrom, periodTo);
                    const prevPl = await estimatePeriodCogsAndOpex(prevTxs, prevBounds.from, prevBounds.to);

                    const grossProfit = pl.revenue - pl.cogs;
                    const netIncome = grossProfit - pl.opex;
                    const grossMarginPct = pl.revenue > 0 ? (grossProfit / pl.revenue) * 100 : null;
                    const netMarginPct = pl.revenue > 0 ? (netIncome / pl.revenue) * 100 : null;
                    const profitPerTxn = cur.txnCount ? netIncome / cur.txnCount : null;
                    const gpPerTxn = cur.txnCount ? grossProfit / cur.txnCount : null;

                    const revenueGrowth = prev.txnCount || prev.revenue ? growthPct(cur.revenue, prev.revenue) : null;
                    const txnGrowth = prev.txnCount || prev.revenue ? growthPct(cur.txnCount, prev.txnCount) : null;
                    const gpGrowth = prev.revenue || prev.txnCount ? growthPct(grossProfit, prevPl.revenue - prevPl.cogs) : null;
                    const netGrowth = prev.revenue || prev.txnCount ? growthPct(netIncome, prevPl.revenue - prevPl.cogs - prevPl.opex) : null;
                    const avgTxnGrowth = prev.avgTxn ? growthPct(cur.avgTxn, prev.avgTxn) : null;

                    const bal = await computeAccountBalances(allTxs);
                    const liquid = (bal.cash || 0) + (bal.gcash || 0) + (bal.bank || 0);
                    let assetValue = 0;
                    try {
                        const assets = await companyAssets();
                        assetValue = assets.reduce((s, a) => s + (Number(a.currentValue != null ? a.currentValue : a.cost) || 0), 0);
                    } catch (e) {}

                    const periodLabel = metricsPeriodLabel(App.metricsRange);

                    // ---- How much are we selling? ----
                    wrap.appendChild(el("div", { class: "section-title" }, "REVENUE · " + periodLabel.toUpperCase()));
                    wrap.appendChild(
                        el("div", { class: "summary-grid" }, [
                            summaryCard("Total revenue", cur.revenue, "sales"),
                            summaryCardText("vs prior period", prev.revenue || prev.txnCount ? fmtPeso(prev.revenue) : "n/a", ""),
                            summaryCardText(
                                "Revenue growth",
                                revenueGrowth != null ? fmtGrowth(revenueGrowth) : "Insufficient data",
                                revenueGrowth != null && revenueGrowth >= 0 ? "sales" : "expenses",
                            ),
                            summaryCard("Avg transaction", cur.avgTxn, "sales"),
                        ]),
                    );
                    if (cur.medTxn != null || cur.excludedCount) {
                        const bits = [];
                        if (cur.medTxn != null) bits.push("Median transaction: " + fmtPeso(cur.medTxn));
                        bits.push("Prior period revenue: " + fmtPeso(prev.revenue));
                        bits.push("Source: POS sales only (excludes transfers)");
                        if (cur.excludedCount) {
                            bits.push("Excluded from metrics (excl. forecast): " + cur.excludedCount + " sale(s) · " + fmtPeso(cur.excludedRevenue));
                        }
                        wrap.appendChild(el("div", { class: "help-text" }, bits.join(" · ") + "."));
                    } else if (cur.excludedCount) {
                        wrap.appendChild(
                            el(
                                "div",
                                { class: "help-text" },
                                "Excluded from metrics (excl. forecast): " + cur.excludedCount + " sale(s) · " + fmtPeso(cur.excludedRevenue) + " — same rule as Forecast demand baseline.",
                            ),
                        );
                    }

                    // ---- Transactions ----
                    wrap.appendChild(el("div", { class: "section-title" }, "TRANSACTIONS"));
                    const txnCards = [
                        summaryCardText("Sale transactions", String(cur.txnCount), "sales"),
                        summaryCardText("Txn growth", txnGrowth != null ? fmtGrowth(txnGrowth) : "—", txnGrowth != null && txnGrowth >= 0 ? "sales" : "expenses"),
                        summaryCardText("Operating days (with sales)", String(cur.operatingDays), ""),
                        summaryCard("Revenue / operating day", cur.operatingDays ? cur.revenue / cur.operatingDays : 0, "sales"),
                    ];
                    wrap.appendChild(el("div", { class: "summary-grid" }, txnCards));
                    wrap.appendChild(
                        el(
                            "div",
                            { class: "help-text" },
                            "A transaction is one completed sale/order — not unique customers. " +
                                (cur.operatingDays ? "Transactions per operating day: " + (cur.txnCount / cur.operatingDays).toFixed(1) + "." : "No sales days in this period."),
                        ),
                    );

                    // Optional operating hours efficiency
                    const hoursCfg = App.operatingHours;
                    if (hoursCfg && hoursCfg.open && hoursCfg.close && cur.operatingDays) {
                        const [oh, om] = hoursCfg.open.split(":").map(Number);
                        const [ch, cm] = hoursCfg.close.split(":").map(Number);
                        let hoursPerDay = ch + cm / 60 - (oh + om / 60);
                        if (hoursPerDay <= 0) hoursPerDay = 8;
                        const totalHours = hoursPerDay * cur.operatingDays;
                        wrap.appendChild(
                            el("div", { class: "summary-grid" }, [
                                summaryCard("Revenue / hour", totalHours ? cur.revenue / totalHours : 0, "sales"),
                                summaryCardText("Txn / hour", totalHours ? (cur.txnCount / totalHours).toFixed(2) : "—", ""),
                                summaryCard("Gross profit / hour", totalHours ? grossProfit / totalHours : 0, "sales"),
                            ]),
                        );
                    } else {
                        wrap.appendChild(el("div", { class: "help-text" }, "Configure optional operating hours below to unlock revenue/profit per hour. Not required for other metrics."));
                    }

                    // ---- Profitability ----
                    wrap.appendChild(el("div", { class: "section-title" }, "PROFITABILITY"));
                    const profitCards = [
                        summaryCard("Gross revenue", pl.revenue, "sales"),
                        summaryCard("COGS" + (pl.cogsSource === "margin-estimate" ? " (est.)" : ""), pl.cogs, "expenses"),
                        summaryCard("Gross profit", grossProfit, grossProfit >= 0 ? "sales" : "expenses"),
                        summaryCardText("Gross margin", grossMarginPct != null ? fmtPct(grossMarginPct) : "—", "sales"),
                        summaryCard("Operating expenses", pl.opex, "expenses"),
                        summaryCard("Net income", netIncome, netIncome >= 0 ? "sales" : "expenses"),
                        summaryCardText("Net margin", netMarginPct != null ? fmtPct(netMarginPct) : "—", netIncome >= 0 ? "sales" : "expenses"),
                        summaryCard("Profit / transaction", profitPerTxn != null ? profitPerTxn : 0, "sales"),
                    ];
                    wrap.appendChild(el("div", { class: "summary-grid" }, profitCards));
                    const cogsNote =
                        pl.cogsSource === "stock-outs"
                            ? "COGS from Costing stock-outs in period."
                            : pl.cogsSource === "margin-estimate"
                              ? "COGS estimated from Costing average product margin — label as estimated."
                              : "COGS unavailable (no Costing consumption data). Treated as ₱0 for display.";
                    wrap.appendChild(
                        el("div", { class: "help-text" }, cogsNote + " Inventory purchases are not treated as opex when Costing materials are linked. Same model as Financial Statements."),
                    );
                    if (gpGrowth != null || netGrowth != null) {
                        wrap.appendChild(
                            el(
                                "div",
                                { class: "help-text" },
                                "Gross profit growth: " +
                                    (gpGrowth != null ? fmtGrowth(gpGrowth) : "Insufficient data") +
                                    " · Net profit growth: " +
                                    (netGrowth != null ? fmtGrowth(netGrowth) : "Insufficient data") +
                                    " · Avg ticket growth: " +
                                    (avgTxnGrowth != null ? fmtGrowth(avgTxnGrowth) : "—"),
                            ),
                        );
                    }

                    // ---- Service / product performance ----
                    wrap.appendChild(el("div", { class: "section-title" }, "SERVICE / PRODUCT PERFORMANCE"));
                    const itemRows = Object.values(cur.byItem)
                        .map((it) => {
                            const estCogs = pl.avgMargin != null && it.revenue > 0 ? it.revenue * (1 - pl.avgMargin / 100) : null;
                            const gp = estCogs != null ? it.revenue - estCogs : null;
                            const gm = it.revenue > 0 && gp != null ? (gp / it.revenue) * 100 : null;
                            const share = cur.revenue > 0 ? (it.revenue / cur.revenue) * 100 : 0;
                            return Object.assign({}, it, { estCogs, gp, gm, share });
                        })
                        .sort((a, b) => b.revenue - a.revenue);

                    const topByRev = itemRows.slice(0, 8);
                    const topByGp = itemRows
                        .filter((r) => r.gp != null)
                        .slice()
                        .sort((a, b) => b.gp - a.gp)
                        .slice(0, 8);

                    const perfCard = el("div", { class: "card" });
                    perfCard.appendChild(el("div", { class: "chartcard-title" }, "Top by revenue"));
                    if (!topByRev.length) {
                        perfCard.appendChild(el("div", { class: "empty small" }, "No sales line items in this period."));
                    } else {
                        topByRev.forEach((r, i) => {
                            perfCard.appendChild(
                                el("div", { class: "toprow" }, [
                                    el("span", { class: "toprow-rank" }, String(i + 1)),
                                    el("span", { class: "toprow-name" }, r.name + " · qty " + Math.round(r.qty) + (r.gm != null ? " · GM " + fmtPct(r.gm) : "") + " · " + r.share.toFixed(0) + "%"),
                                    el("span", { class: "toprow-amt" }, fmtPeso(r.revenue)),
                                ]),
                            );
                        });
                    }
                    if (topByGp.length) {
                        perfCard.appendChild(el("div", { class: "chartcard-title", style: "margin-top:12px" }, "Most profitable (est. gross profit)"));
                        perfCard.appendChild(
                            el(
                                "div",
                                { class: "help-text" },
                                pl.avgMargin != null
                                    ? "Gross profit per item uses Costing avg margin " + fmtPct(pl.avgMargin) + " (estimated unless item-level recipes are applied)."
                                    : "Item-level COGS unavailable — rank by revenue only until Costing margins exist.",
                            ),
                        );
                        topByGp.forEach((r, i) => {
                            perfCard.appendChild(
                                el("div", { class: "toprow" }, [
                                    el("span", { class: "toprow-rank" }, String(i + 1)),
                                    el("span", { class: "toprow-name" }, r.name + (r.gm != null ? " · GM " + fmtPct(r.gm) : "")),
                                    el("span", { class: "toprow-amt" }, fmtPeso(r.gp)),
                                ]),
                            );
                        });
                    }
                    wrap.appendChild(perfCard);

                    // ---- Sales mix ----
                    wrap.appendChild(el("div", { class: "section-title" }, "SALES MIX"));
                    const mixCard = el("div", { class: "card" });
                    const catEntries = Object.entries(cur.byCategory).sort((a, b) => b[1] - a[1]);
                    if (catEntries.length) {
                        mixCard.appendChild(el("div", { class: "chartcard-title" }, "Revenue by category"));
                        const maxCat = Math.max(...catEntries.map((e) => e[1]), 1);
                        catEntries.forEach(([cat, amt]) => {
                            mixCard.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, cat),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: "width:" + ((amt / maxCat) * 100).toFixed(0) + "%" })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                    }
                    const payEntries = Object.entries(cur.byPayment).sort((a, b) => b[1] - a[1]);
                    if (payEntries.length) {
                        mixCard.appendChild(el("div", { class: "chartcard-title", style: "margin-top:12px" }, "Revenue by payment method"));
                        const maxPay = Math.max(...payEntries.map((e) => e[1]), 1);
                        payEntries.forEach(([pay, amt]) => {
                            mixCard.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, paymentLabel(pay)),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill alt", style: "width:" + ((amt / maxPay) * 100).toFixed(0) + "%" })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                    }
                    if (!catEntries.length && !payEntries.length) {
                        mixCard.appendChild(el("div", { class: "empty small" }, "No mix data for this period."));
                    }
                    wrap.appendChild(mixCard);

                    // ---- Time analysis ----
                    wrap.appendChild(el("div", { class: "section-title" }, "WHEN WE'RE BUSIEST"));
                    const timeCard = el("div", { class: "card" });
                    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                    // Show Mon-Sun order
                    const order = [1, 2, 3, 4, 5, 6, 0];
                    const maxDow = Math.max(...cur.byDow, 1);
                    timeCard.appendChild(el("div", { class: "chartcard-title" }, "Sales by day of week"));
                    order.forEach((di) => {
                        const amt = cur.byDow[di];
                        const n = cur.byDowTx[di];
                        const avg = n ? amt / n : 0;
                        timeCard.appendChild(
                            el("div", { class: "barrow" }, [
                                el("div", { class: "barrow-label" }, dayNames[di]),
                                el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: "width:" + ((amt / maxDow) * 100).toFixed(0) + "%" })]),
                                el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                            ]),
                        );
                        if (n) {
                            timeCard.appendChild(el("div", { class: "help-text", style: "margin:-4px 0 6px 102px" }, n + " txn · avg " + fmtPeso(avg)));
                        }
                    });
                    const peakDay = order.reduce((best, di) => (cur.byDow[di] > cur.byDow[best] ? di : best), order[0]);
                    const weakDay = order.reduce((best, di) => (cur.byDow[di] < cur.byDow[best] ? di : best), order[0]);
                    if (cur.revenue > 0) {
                        timeCard.appendChild(el("div", { class: "help-text" }, "Strongest: " + dayNames[peakDay] + " · Weakest: " + dayNames[weakDay] + "."));
                    }

                    timeCard.appendChild(el("div", { class: "chartcard-title", style: "margin-top:14px" }, "Sales by hour"));
                    const hourHasData = cur.byHourTx.some((n) => n > 0);
                    if (!hourHasData) {
                        timeCard.appendChild(el("div", { class: "empty small" }, "Hourly analysis unavailable — no transaction timestamps in period."));
                    } else {
                        const maxH = Math.max(...cur.byHour, 1);
                        // Show only hours with activity or 8-20 for readability
                        for (let h = 0; h < 24; h++) {
                            if (cur.byHourTx[h] === 0 && (h < 7 || h > 21)) continue;
                            const label = (h < 10 ? "0" : "") + h + ":00";
                            timeCard.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, label),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill alt", style: "width:" + ((cur.byHour[h] / maxH) * 100).toFixed(0) + "%" })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(cur.byHour[h])),
                                ]),
                            );
                        }
                        const peakHour = cur.byHour.indexOf(Math.max(...cur.byHour));
                        timeCard.appendChild(el("div", { class: "help-text" }, "Peak hour: " + peakHour + ":00 · " + cur.byHourTx[peakHour] + " transactions."));
                    }
                    wrap.appendChild(timeCard);

                    // ---- Customer tracking disclaimer ----
                    wrap.appendChild(el("div", { class: "section-title" }, "CUSTOMER TRACKING"));
                    wrap.appendChild(
                        el(
                            "div",
                            { class: "card" },
                            el(
                                "div",
                                { class: "help-text" },
                                "Customer-level retention metrics require optional customer identification. Current business metrics are based on transaction-level data. Walk-in sales do not need customer profiles.",
                            ),
                        ),
                    );

                    // ---- Inventory / assets ----
                    wrap.appendChild(el("div", { class: "section-title" }, "INVENTORY & ASSETS"));
                    wrap.appendChild(
                        el("div", { class: "summary-grid" }, [
                            summaryCard("Inventory at cost", pl.inventoryValue, "sales"),
                            summaryCard("Fixed assets (book)", assetValue, "sales"),
                            summaryCard("Liquid cash", liquid, "sales"),
                            summaryCard("Accounts payable", bal.payable || 0, (bal.payable || 0) > 0 ? "expenses" : "sales"),
                        ]),
                    );
                    wrap.appendChild(
                        el(
                            "div",
                            { class: "help-text" },
                            "Inventory turnover and machine utilization need extra tracking beyond POS tickets. Figures above are calculated from existing Costing stock and Forecast asset records when available.",
                        ),
                    );

                    // ---- Business valuation ----
                    wrap.appendChild(el("div", { class: "section-title" }, "BUSINESS VALUE"));
                    const valCard = el("div", { class: "card" });
                    valCard.appendChild(el("div", { class: "help-text" }, "Management estimate / planning tool — not a professional appraisal or market selling price."));

                    const totalAssets = liquid + (bal.receivable || 0) + pl.inventoryValue + assetValue;
                    const totalLiab = bal.payable || 0;
                    const nav = totalAssets - totalLiab;

                    // Annualize net income from selected period
                    let annualizedProfit = null;
                    if (periodFrom && periodTo && pl.revenue > 0) {
                        const days = Math.max(1, (periodTo.getTime() - periodFrom.getTime()) / 86400000);
                        annualizedProfit = (netIncome / days) * 365;
                    } else if (App.metricsRange === "year") {
                        annualizedProfit = netIncome;
                    }

                    const mult = App.valuationMultiples || { low: 1.5, base: 2.0, high: 2.5 };
                    const earnLow = annualizedProfit != null ? annualizedProfit * mult.low : null;
                    const earnBase = annualizedProfit != null ? annualizedProfit * mult.base : null;
                    const earnHigh = annualizedProfit != null ? annualizedProfit * mult.high : null;

                    valCard.appendChild(el("div", { class: "chartcard-title" }, "A. Net asset value"));
                    valCard.appendChild(stmtRow("Total business assets", totalAssets));
                    valCard.appendChild(stmtRow("Total liabilities", totalLiab));
                    valCard.appendChild(stmtRow("Net asset value", nav, { total: true, signed: true }));

                    valCard.appendChild(el("div", { class: "chartcard-title", style: "margin-top:14px" }, "B. Earnings-based value"));
                    if (annualizedProfit == null) {
                        valCard.appendChild(el("div", { class: "empty small" }, "Insufficient historical data to annualize profit."));
                    } else {
                        valCard.appendChild(stmtRow("Annualized sustainable profit (from period)", annualizedProfit, { signed: true }));
                        valCard.appendChild(el("div", { class: "help-text" }, "Annualized = period net income ÷ period days × 365. Adjust multiples for risk and growth."));
                        const multRow = el("div", { class: "frow", style: "margin-top:8px" });
                        ["low", "base", "high"].forEach((k) => {
                            const col = el("div", { class: "fcol" });
                            col.appendChild(el("label", { class: "flabel" }, k.charAt(0).toUpperCase() + k.slice(1) + " ×"));
                            const inp = el("input", {
                                type: "number",
                                class: "finput",
                                value: mult[k],
                                min: "0.1",
                                step: "0.1",
                            });
                            inp.addEventListener("change", () => {
                                App.valuationMultiples = Object.assign({}, App.valuationMultiples, { [k]: parseFloat(inp.value) || mult[k] });
                                softRender();
                            });
                            col.appendChild(inp);
                            multRow.appendChild(col);
                        });
                        valCard.appendChild(multRow);
                        valCard.appendChild(stmtRow("Low (×" + mult.low + ")", earnLow));
                        valCard.appendChild(stmtRow("Base (×" + mult.base + ")", earnBase, { total: true }));
                        valCard.appendChild(stmtRow("High (×" + mult.high + ")", earnHigh));
                    }

                    valCard.appendChild(el("div", { class: "chartcard-title", style: "margin-top:14px" }, "C. Combined view"));
                    valCard.appendChild(stmtRow("Net asset value", nav, { signed: true }));
                    if (earnBase != null) {
                        const lowEst = Math.min(nav, earnLow);
                        const highEst = Math.max(nav, earnHigh);
                        const baseEst = (nav + earnBase) / 2;
                        valCard.appendChild(stmtRow("Earnings value (base)", earnBase));
                        valCard.appendChild(stmtRow("Low estimated value", lowEst, { signed: true }));
                        valCard.appendChild(stmtRow("Base estimated value", baseEst, { total: true, signed: true }));
                        valCard.appendChild(stmtRow("High estimated value", highEst, { signed: true }));
                    }
                    wrap.appendChild(valCard);

                    // ---- Health score ----
                    wrap.appendChild(el("div", { class: "section-title" }, "BUSINESS HEALTH"));
                    const health = scoreBusinessHealth({
                        revenueGrowth,
                        txnGrowth,
                        avgTxnGrowth,
                        grossMarginPct,
                        netMarginPct,
                        liquid,
                        payable: bal.payable || 0,
                    });
                    const healthCard = el("div", { class: "card" });
                    if (health.score == null) {
                        healthCard.appendChild(el("div", { class: "empty small" }, health.message || "Insufficient data"));
                    } else {
                        healthCard.appendChild(el("div", { class: "hero-amount", style: "color:var(--ink);font-size:36px" }, health.score + " / 100"));
                        healthCard.appendChild(el("div", { class: "hero-label", style: "color:var(--ink-soft)" }, "BUSINESS HEALTH SCORE"));
                        const pos = health.checks.filter((c) => c.ok);
                        const neg = health.checks.filter((c) => !c.ok);
                        if (pos.length) {
                            healthCard.appendChild(el("div", { class: "flabel", style: "margin-top:12px" }, "Positive"));
                            pos.forEach((c) => healthCard.appendChild(el("div", { class: "help-text", style: "color:var(--green)" }, "• " + c.text)));
                        }
                        if (neg.length) {
                            healthCard.appendChild(el("div", { class: "flabel", style: "margin-top:8px" }, "Needs attention"));
                            neg.forEach((c) => healthCard.appendChild(el("div", { class: "help-text", style: "color:var(--rust)" }, "• " + c.text)));
                        }
                    }
                    wrap.appendChild(healthCard);

                    // ---- Optional operating hours ----
                    wrap.appendChild(el("div", { class: "section-title" }, "OPTIONAL · OPERATING HOURS"));
                    const ohCard = el("div", { class: "card form" });
                    ohCard.appendChild(el("div", { class: "help-text" }, "Optional. Enables revenue and profit per operating hour. Does not affect POS checkout."));
                    const oh = App.operatingHours || { open: "08:00", close: "18:00" };
                    const ohRow = el("div", { class: "frow" });
                    const openInp = el("input", { type: "time", class: "finput", value: oh.open || "08:00" });
                    const closeInp = el("input", { type: "time", class: "finput", value: oh.close || "18:00" });
                    ohRow.appendChild(el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Open"), openInp]));
                    ohRow.appendChild(el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Close"), closeInp]));
                    ohCard.appendChild(ohRow);
                    const saveOh = el("button", { type: "button", class: "bigbtn ghost small2" }, "Save hours");
                    saveOh.addEventListener("click", () => {
                        App.operatingHours = { open: openInp.value || "08:00", close: closeInp.value || "18:00" };
                        toast("Operating hours saved for this session");
                        softRender();
                    });
                    ohCard.appendChild(saveOh);
                    wrap.appendChild(ohCard);

                    wrap.appendChild(el("div", { class: "footnote" }, "Business Metrics · calculated on demand from POS transactions · same accounting rules as Reports & Forecast"));

                    return wrap;
                }

                /* ---------- FORECAST ---------- */
                const DEFAULT_ASSET_SEED = [
                    { name: "PC / Computer", category: "Equipment", cost: 0, currentValue: 0 },
                    { name: "Printer", category: "Equipment", cost: 0, currentValue: 0 },
                    { name: "Laminator", category: "Equipment", cost: 0, currentValue: 0 },
                ];
                const DEFAULT_RECURRING_SEED = [
                    { name: "Electricity", amount: 0, frequency: "monthly" },
                    { name: "WiFi / Internet", amount: 0, frequency: "monthly" },
                    { name: "Labor / Salary", amount: 0, frequency: "monthly" },
                    { name: "Maintenance", amount: 0, frequency: "monthly" },
                ];

                async function companyAssets() {
                    const cid = await getActiveCompanyId();
                    return (await dbGetAll("assets")).filter((a) => a.companyId === cid);
                }
                async function companyRecurring() {
                    const cid = await getActiveCompanyId();
                    return (await dbGetAll("recurringExpenses")).filter((r) => r.companyId === cid);
                }
                async function companyPlanned() {
                    const cid = await getActiveCompanyId();
                    return (await dbGetAll("plannedExpenses")).filter((p) => p.companyId === cid);
                }
                async function companyOtherIncome() {
                    const cid = await getActiveCompanyId();
                    return (await dbGetAll("otherIncome")).filter((o) => o.companyId === cid);
                }

                async function seedForecastIfEmpty() {
                    const cid = await getActiveCompanyId();
                    if (cid == null) return;
                    const assets = await companyAssets();
                    if (assets.length === 0) {
                        for (const a of DEFAULT_ASSET_SEED) {
                            await dbAdd("assets", Object.assign({ companyId: cid, purchaseDate: "", notes: "", createdAt: new Date().toISOString() }, a));
                        }
                    }
                    const rec = await companyRecurring();
                    if (rec.length === 0) {
                        for (const r of DEFAULT_RECURRING_SEED) {
                            await dbAdd("recurringExpenses", Object.assign({ companyId: cid, notes: "", createdAt: new Date().toISOString() }, r));
                        }
                    }
                    // Optional example row for external income (e.g. copra) — only if store is empty
                    const other = await companyOtherIncome();
                    if (other.length === 0) {
                        await dbAdd("otherIncome", {
                            companyId: cid,
                            name: "Copra sale",
                            amount: 0,
                            frequency: "monthly",
                            expectedDate: "",
                            notes: "Optional external income — set amount and frequency when expected",
                            createdAt: new Date().toISOString(),
                        });
                    }
                }

                /** Expected other income over a horizon (days). monthly/weekly/daily prorated; one-time counted if due in window or no date. */
                function otherIncomeInWindow(items, horizonDays, now, horizonEnd) {
                    let total = 0;
                    const details = [];
                    (items || []).forEach((o) => {
                        if (o.received) return;
                        const amt = Number(o.amount) || 0;
                        if (amt <= 0) return;
                        const freq = o.frequency || "one-time";
                        let inWindow = 0;
                        if (freq === "monthly") inWindow = (amt / 30) * horizonDays;
                        else if (freq === "weekly") inWindow = (amt / 7) * horizonDays;
                        else if (freq === "daily") inWindow = amt * horizonDays;
                        else if (freq === "yearly") inWindow = (amt / 365) * horizonDays;
                        else {
                            // one-time: include if expectedDate in window, or no date (treat as expected within horizon)
                            if (!o.expectedDate) inWindow = amt;
                            else {
                                const d = startOfDay(new Date(o.expectedDate));
                                if (d >= now && d <= horizonEnd) inWindow = amt;
                            }
                        }
                        if (inWindow > 0) {
                            total += inWindow;
                            details.push({ name: o.name, amount: inWindow, frequency: freq });
                        }
                    });
                    return { total, details };
                }

                function monthlyFromFrequency(amount, frequency) {
                    const a = Number(amount) || 0;
                    if (frequency === "weekly") return a * (52 / 12);
                    if (frequency === "daily") return a * 30;
                    if (frequency === "yearly") return a / 12;
                    return a; // monthly
                }

                function daysInHorizon(horizonDays, targetDateStr) {
                    if (targetDateStr) {
                        const target = startOfDay(new Date(targetDateStr));
                        const now = startOfDay(new Date());
                        const diff = Math.round((target - now) / 86400000);
                        return Math.max(1, diff);
                    }
                    return Math.max(1, Number(horizonDays) || 30);
                }

                /** Sales marked excludeFromForecast stay in books/inventory but are ignored by Forecast averages & demand. */
                function isExcludedFromForecast(t) {
                    return !!(t && t.excludeFromForecast);
                }

                /** Average daily sales from the last N days (calendar days). Excludes forecast-excluded sales. */
                async function computeAvgDailySales(lookbackDays) {
                    const txs = await allTx();
                    const now = new Date();
                    const from = startOfDay(now);
                    from.setDate(from.getDate() - (lookbackDays - 1));
                    const inRangeSales = txs.filter((t) => t.type === "sale" && inRange(t.date, from, endOfDay(now)));
                    const excluded = inRangeSales.filter(isExcludedFromForecast);
                    const sales = inRangeSales.filter((t) => !isExcludedFromForecast(t));
                    const total = sumBy(sales, () => true);
                    const excludedTotal = sumBy(excluded, () => true);
                    const cashLike = sumBy(sales, (t) => t.payment === "cash" || t.payment === "gcash" || t.payment === "bank");
                    const creditSales = sumBy(sales, (t) => t.payment === "receivable");
                    // Daily revenue series for variability (calendar days)
                    const byDay = {};
                    sales.forEach((t) => {
                        const k = String(t.date || "").slice(0, 10);
                        if (!k) return;
                        byDay[k] = (byDay[k] || 0) + (Number(t.amount) || 0);
                    });
                    const dayValues = [];
                    for (let i = 0; i < lookbackDays; i++) {
                        const d = new Date(from);
                        d.setDate(from.getDate() + i);
                        const key = d.toISOString().slice(0, 10);
                        dayValues.push(byDay[key] || 0);
                    }
                    const mean = total / lookbackDays;
                    let variance = 0;
                    dayValues.forEach((v) => {
                        variance += (v - mean) * (v - mean);
                    });
                    variance = lookbackDays > 1 ? variance / lookbackDays : 0;
                    const stdDev = Math.sqrt(variance);
                    const cv = mean > 0 ? stdDev / mean : null; // coefficient of variation
                    // Use calendar days so quiet days pull the average down realistically
                    return {
                        total,
                        avgDaily: mean,
                        avgWeekly: mean * 7,
                        avgMonthly: mean * 30,
                        count: sales.length,
                        lookbackDays,
                        excludedCount: excluded.length,
                        excludedTotal,
                        cashLikeTotal: cashLike,
                        creditSalesTotal: creditSales,
                        cashSalesRatio: total > 0 ? cashLike / total : 1,
                        stdDev,
                        coefficientOfVariation: cv,
                        activeDays: dayValues.filter((v) => v > 0).length,
                    };
                }

                /**
                 * Match Costing's materialCurrentQty:
                 * startingQty + sum(in) − sum(out), with type "adjust" setting absolute qty.
                 * Previously we only summed moves (from 0), so POS sales stock-outs without
                 * matching stock-ins showed negative inventory even when startingQty was set.
                 */
                function costingMaterialCurrentQty(mat, moves) {
                    let qty = Number(mat.startingQty) || 0;
                    const sorted = (moves || [])
                        .filter((m) => m.materialId === mat.id)
                        .slice()
                        .sort((a, b) => (a.date || 0) - (b.date || 0) || (a.id || 0) - (b.id || 0));
                    sorted.forEach((m) => {
                        const q = Number(m.qty) || 0;
                        if (m.type === "in") qty += q;
                        else if (m.type === "out") qty -= q;
                        else if (m.type === "adjust") qty = q;
                    });
                    return qty;
                }

                /** Materials on hand × costPerUnit (negative stock treated as 0 for valuation). */
                function computeInventoryAtCost(materials) {
                    const lines = [];
                    let total = 0;
                    let belowReorder = 0;
                    (materials || []).forEach((m) => {
                        const stock = Number(m.stock);
                        const qty = isFinite(stock) ? Math.max(0, stock) : 0;
                        const unitCost = Number(m.costPerUnit);
                        const cost = isFinite(unitCost) ? unitCost : 0;
                        const value = qty * cost;
                        if (m.reorderAt != null && isFinite(Number(m.reorderAt)) && stock <= Number(m.reorderAt)) belowReorder++;
                        if (value > 0 || qty > 0) {
                            lines.push({
                                name: m.name || "Material",
                                stock: qty,
                                unit: m.unit || "",
                                unitCost: cost,
                                value,
                            });
                        }
                        total += value;
                    });
                    lines.sort((a, b) => b.value - a.value);
                    return { total, lines, belowReorder };
                }

                function fmtNumish(n) {
                    const v = Number(n);
                    if (!isFinite(v)) return "—";
                    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
                    return v.toLocaleString("en-PH", { maximumFractionDigits: 2 });
                }

                /**
                 * Classify a POS expense line as an inventory purchase (asset) vs true operating expense.
                 * Inventory: restock/stocks/materials for future use or resale.
                 * Opex: tips, utilities, rent, fees, transport, etc.
                 * Prefer Costing material name matches when available.
                 */
                function isInventoryPurchaseLine(category, item, materialNameSet) {
                    const cat = (category || "").toLowerCase().trim();
                    const it = (item || "").toLowerCase().trim();
                    const blob = cat + " " + it;
                    // Explicit operating costs — never inventory
                    if (/\b(rider|tip|utilit|electric|wifi|internet|rent|salary|labor|wage|transport|delivery|fee|interest|software|subscription|misc)\b/.test(blob)) {
                        return false;
                    }
                    // Strong inventory signals in category
                    if (/\b(restock|stocks?|inventory|inventories|printing\s*stocks?|supplies?\s*stocks?)\b/.test(cat)) return true;
                    if (/\b(bond\s*paper|photo\s*paper|sticker|laminat|ink|toner|film|pouch)\b/.test(cat)) return true;
                    // Default shop category used for materials restock in this app
                    if (cat === "supplies & materials" || cat === "supplies and materials" || cat === "restock") return true;
                    // Match Costing material names (item or category)
                    if (materialNameSet && materialNameSet.size) {
                        if (it && materialNameSet.has(it)) return true;
                        if (cat && materialNameSet.has(cat)) return true;
                        for (const mn of materialNameSet) {
                            if (!mn) continue;
                            if (it && (it === mn || it.includes(mn) || mn.includes(it))) return true;
                        }
                    }
                    return false;
                }

                function materialNameSetFromSnap(snap) {
                    const s = new Set();
                    (snap && snap.materials ? snap.materials : []).forEach((m) => {
                        const n = (m.name || "").toLowerCase().trim();
                        if (n) s.add(n);
                    });
                    return s;
                }

                /** Split expense transactions into inventory purchases vs operating expenses (by line). */
                function splitExpensesInventoryVsOpex(txs, materialNameSet) {
                    let invTotal = 0,
                        opexTotal = 0;
                    const invByCat = {};
                    const opexByCat = {};
                    const invTxIds = new Set();
                    (txs || [])
                        .filter((t) => t.type === "expense")
                        .forEach((t) => {
                            const lines = txLines(t);
                            lines.forEach((ln) => {
                                const cat = ln.category || t.category || "Other";
                                const item = ln.item || t.item || "";
                                const amt = Number(ln.amount) || 0;
                                if (isInventoryPurchaseLine(cat, item, materialNameSet)) {
                                    invTotal += amt;
                                    invByCat[cat] = (invByCat[cat] || 0) + amt;
                                    if (t.id != null) invTxIds.add(t.id);
                                } else {
                                    opexTotal += amt;
                                    opexByCat[cat] = (opexByCat[cat] || 0) + amt;
                                }
                            });
                        });
                    return {
                        invTotal,
                        opexTotal,
                        invByCat,
                        opexByCat,
                        invTxIds,
                        invCats: Object.entries(invByCat).sort((a, b) => b[1] - a[1]),
                        opexCats: Object.entries(opexByCat).sort((a, b) => b[1] - a[1]),
                    };
                }

                /** COGS from Costing stock-outs in [from,to] × material costPerUnit. */
                function computePeriodCogsFromMoves(moves, materials, from, to) {
                    const costById = {};
                    (materials || []).forEach((m) => {
                        costById[m.id] = Number(m.costPerUnit) || 0;
                    });
                    let cogs = 0;
                    let outQty = 0;
                    let moveCount = 0;
                    const fromT = from ? from.getTime() : 0;
                    const toT = to ? to.getTime() : Number.POSITIVE_INFINITY;
                    (moves || []).forEach((m) => {
                        if (m.type !== "out") return;
                        const d = Number(m.date) || Number(m.createdAt) || 0;
                        if (d < fromT || d > toT) return;
                        const q = Number(m.qty) || 0;
                        if (q <= 0) return;
                        cogs += q * (costById[m.materialId] || 0);
                        outQty += q;
                        moveCount++;
                    });
                    return { cogs, outQty, moveCount, hasData: moveCount > 0 };
                }

                /**
                 * Period inventory flow from Costing moves at current unit costs.
                 * ins = stock-ins, outs = stock-outs (consumption/COGS), adjustCount = absolute adjusts.
                 * Does not invent values to force a tie with POS purchases.
                 */
                function computePeriodInventoryFlow(moves, materials, from, to) {
                    const costById = {};
                    (materials || []).forEach((m) => {
                        costById[m.id] = Number(m.costPerUnit) || 0;
                    });
                    let ins = 0,
                        outs = 0,
                        adjustValue = 0;
                    let inCount = 0,
                        outCount = 0,
                        adjustCount = 0;
                    const fromT = from ? from.getTime() : 0;
                    const toT = to ? to.getTime() : Number.POSITIVE_INFINITY;
                    (moves || []).forEach((m) => {
                        const d = Number(m.date) || Number(m.createdAt) || 0;
                        if (d < fromT || d > toT) return;
                        const q = Number(m.qty) || 0;
                        const cost = costById[m.materialId] || 0;
                        if (m.type === "in") {
                            if (q > 0) {
                                ins += q * cost;
                                inCount++;
                            }
                        } else if (m.type === "out") {
                            if (q > 0) {
                                outs += q * cost;
                                outCount++;
                            }
                        } else if (m.type === "adjust") {
                            // Adjust sets absolute qty; value impact is not a simple +/- of m.qty alone.
                            // Track count so diagnostics can surface that adjusts exist.
                            adjustCount++;
                            adjustValue += q * cost; // informational: level × cost after adjust
                        }
                    });
                    return { ins, outs, adjustValue, inCount, outCount, adjustCount };
                }

                /** Transaction effective time — always the business date, not entry time. */
                function txTimeMs(t) {
                    const ms = new Date(t.date).getTime();
                    return isFinite(ms) ? ms : 0;
                }

                /**
                 * Reconstruct Accounts Payable as of a moment from startingPayable + dated transactions.
                 * asOfExclusive: if set, only include txs with date < asOfExclusive (opening balance at that instant).
                 * if null, include all txs → current/ending AP from history.
                 * Settlements = transfers with toAccount === "payable" (cash/GCash/bank → payable).
                 */
                function reconstructPayableBalance(txs, company, asOfExclusive) {
                    let ap = Number(company && company.startingPayable) || 0;
                    (txs || []).forEach((t) => {
                        const tt = txTimeMs(t);
                        if (asOfExclusive != null && tt >= asOfExclusive) return;
                        const amt = Number(t.amount) || 0;
                        if (amt <= 0) return;
                        if (t.type === "expense" && t.payment === "payable") {
                            ap += amt;
                        } else if (t.type === "transfer" && t.toAccount === "payable") {
                            // Pay AP: cash leaves, liability decreases
                            ap -= amt;
                        } else if (t.type === "transfer" && t.fromAccount === "payable") {
                            // Rare: increase liability / reverse
                            ap += amt;
                        }
                    });
                    return ap;
                }

                function sumPayableCreditsInWindow(txs, fromMs, toMs) {
                    let n = 0;
                    (txs || []).forEach((t) => {
                        if (t.type !== "expense" || t.payment !== "payable") return;
                        const tt = txTimeMs(t);
                        if (fromMs != null && tt < fromMs) return;
                        if (toMs != null && tt > toMs) return;
                        n += Number(t.amount) || 0;
                    });
                    return n;
                }

                function sumPayableSettlementsInWindow(txs, fromMs, toMs) {

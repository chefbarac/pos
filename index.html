<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWPF7650WK"></script>

            gtag("config", "G-ZWPF7650WK");

        <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🖥️</text></svg>' />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#23302A" />
        <title>Little Ledger — POS &amp; Cash Flow</title>
        <style>
            :root {
                --paper: #f6f1e4;
                --paper-card: #fffdf8;
                --ink: #23302a;
                --ink-soft: #6b7268;
                --green: #3f7a5c;
                --green-soft: #e6efe7;
                --rust: #b5502e;
                --rust-soft: #f5e7e0;
                --gold: #c99a3e;
                --border: #dfd5bc;
                --border-soft: #eae2cd;
                --radius: 14px;
                --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
                --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--paper);
                color: var(--ink);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: radial-gradient(rgba(35, 48, 42, 0.035) 1px, transparent 1px);
                background-size: 3px 3px;
                pointer-events: none;
                z-index: 0;
            }

            #shell {
                max-width: 480px;
                margin: 0 auto;
                min-height: 100vh;
                min-height: 100dvh;
                background: var(--paper);
                position: relative;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
                padding-bottom: calc(72px + env(safe-area-inset-bottom));
            }

            #app {
                position: relative;
                z-index: 1;
            }

            .page {
                padding: 16px 16px 8px;
                animation: fadein 0.18s ease;
            }
            @keyframes fadein {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .page-title {
                font-size: 22px;
                font-weight: 700;
                letter-spacing: -0.01em;
                margin: 4px 0 14px;
            }

            /* ---------- Hero / receipt tape ---------- */
            .hero {
                background: var(--ink);
                color: var(--paper);
                border-radius: var(--radius) var(--radius) 0 0;
                padding: 20px 20px 22px;
                margin: 0 -16px;
            }
            .hero-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 14px;
            }
            .eyebrow {
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 11px;
                font-weight: 700;
                color: var(--gold);
            }
            .eyebrow.muted {
                color: rgba(246, 241, 228, 0.55);
                font-weight: 600;
            }
            .hero-amount {
                font-family: var(--mono);
                font-size: 40px;
                font-weight: 700;
                letter-spacing: -0.01em;
                line-height: 1.05;
            }
            .hero-label {
                font-size: 10.5px;
                letter-spacing: 0.12em;
                color: rgba(246, 241, 228, 0.6);
                margin-top: 4px;
                font-weight: 700;
            }
            .hero-row {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }
            .hero-stat {
                flex: 1;
                background: rgba(246, 241, 228, 0.08);
                border-radius: 10px;
                padding: 10px 12px;
            }
            .hs-label {
                font-size: 10.5px;
                color: rgba(246, 241, 228, 0.6);
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 3px;
            }
            .hs-value {
                font-family: var(--mono);
                font-size: 17px;
                font-weight: 700;
            }
            .hs-value.sales {
                color: #8fd4ac;
            }
            .hs-value.expenses {
                color: #f0a98a;
            }

            .tear {
                height: 12px;
                margin: 0 -16px;
                background: radial-gradient(circle at 8px 0, transparent 7px, var(--ink) 7.5px) 0 0 / 16px 16px repeat-x;
            }

            /* ---------- Account balance strip ---------- */
            .balancecard {
                background: var(--paper-card);
                border: 1px dashed var(--border);
                border-radius: 0 0 var(--radius) var(--radius);
                margin: 0 -16px 18px;
                display: flex;
            }
            .balitem {
                flex: 1;
                padding: 13px 12px 15px;
                min-width: 0;
            }
            .balitem + .balitem {
                border-left: 1px dotted var(--border);
            }
            .bal-label {
                font-size: 10px;
                letter-spacing: 0.08em;
                color: var(--ink-soft);
                font-weight: 700;
                margin-bottom: 3px;
                text-transform: uppercase;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .bal-value {
                font-family: var(--mono);
                font-weight: 700;
                color: var(--ink);
                font-size: 15px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .balitem.lead .bal-value {
                font-size: 19px;
            }

            /* ---------- Quick actions ---------- */
            .quickrow {
                display: flex;
                gap: 8px;
                margin-bottom: 22px;
            }
            .quickbtn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 14px 6px;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 700;
                font-size: 14px;
                border: 1px solid var(--border);
            }
            .quickbtn-sale {
                background: var(--green);
                color: #fff;
                border-color: var(--green);
            }
            .quickbtn-expense {
                background: var(--paper-card);
                color: var(--rust);
                border-color: var(--rust);
            }
            .quickbtn-transfer {
                background: var(--paper-card);
                color: var(--gold);
                border-color: var(--gold);
            }
            .qb-icon {
                font-size: 17px;
                line-height: 1;
            }

            /* ---------- Sections & bars ---------- */
            .section {
                margin-bottom: 22px;
            }
            .section-title {
                font-size: 11px;
                letter-spacing: 0.1em;
                font-weight: 700;
                color: var(--ink-soft);
                margin: 22px 0 10px;
            }
            .section .section-title {
                margin-top: 0;
            }

            .barrow {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
            }
            .barrow-label {
                width: 92px;
                flex-shrink: 0;
                font-size: 12.5px;
                color: var(--ink-soft);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .barrow-track {
                flex: 1;
                background: var(--border-soft);
                border-radius: 6px;
                height: 8px;
                overflow: hidden;
            }
            .barrow-fill {
                height: 100%;
                background: var(--green);
                border-radius: 6px;
            }
            .barrow-fill.alt {
                background: var(--gold);
            }
            .barrow-amt {
                font-family: var(--mono);
                font-size: 12.5px;
                font-weight: 600;
                width: 68px;
                text-align: right;
                flex-shrink: 0;
            }

            /* ---------- Transaction rows ---------- */
            .txrow {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 11px 2px;
                border-bottom: 1px dotted var(--border);
                cursor: pointer;
            }
            .txrow:last-child {
                border-bottom: none;
            }
            .txrow-title {
                font-size: 14.5px;
                font-weight: 600;
            }
            .txrow-sub {
                font-size: 11.5px;
                color: var(--ink-soft);
                margin-top: 2px;
            }
            .txrow-amt {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 14.5px;
                flex-shrink: 0;
                padding-left: 10px;
            }
            .txrow-amt.sales {
                color: var(--green);
            }
            .txrow-amt.expenses {
                color: var(--rust);
            }
            .txrow-amt.transfer {
                color: var(--gold);
            }

            .daysep {
                font-size: 11px;
                letter-spacing: 0.06em;
                font-weight: 700;
                color: var(--ink-soft);
                margin: 16px 0 4px;
                text-transform: uppercase;
            }
            .daysep:first-child {
                margin-top: 0;
            }

            .periodtotal {
                display: flex;
                justify-content: space-between;
                font-family: var(--mono);
                font-weight: 700;
                font-size: 13px;
                color: var(--ink-soft);
                margin-bottom: 6px;
                padding: 0 2px;
            }
            .periodtotal .sales {
                color: var(--green);
            }
            .periodtotal .expenses {
                color: var(--rust);
            }

            /* ---------- Empty states ---------- */
            .empty {
                text-align: center;
                padding: 28px 12px;
                color: var(--ink-soft);
            }
            .empty.small {
                padding: 14px 4px;
                font-size: 12.5px;
            }
            .empty-title {
                font-weight: 700;
                color: var(--ink);
                margin-bottom: 4px;
            }
            .empty-sub {
                font-size: 12.5px;
            }

            /* ---------- Cards & forms ---------- */
            .card {
                background: var(--paper-card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px;
                margin-bottom: 16px;
            }
            .form {
                display: flex;
                flex-direction: column;
            }
            .flabel {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--ink-soft);
                margin: 12px 0 6px;
            }
            .flabel:first-child {
                margin-top: 0;
            }
            .finput {
                width: 100%;
                padding: 11px 12px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: #fff;
                font-size: 15px;
                color: var(--ink);
                font-family: var(--sans);
            }
            .finput:focus {
                outline: 2px solid var(--gold);
                outline-offset: 1px;
            }
            .famount {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 20px;
            }

            .frow {
                display: flex;
                gap: 10px;
            }
            .fcol {
                flex: 1;
            }

            .stepper {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .step-btn {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: #fff;
                font-size: 18px;
                font-weight: 700;
                color: var(--ink);
                flex-shrink: 0;
            }
            .steppernum {
                text-align: center;
                padding: 11px 4px;
            }

            .chiprow {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 4px;
            }
            .chip {
                border: 1px solid var(--border);
                background: #fff;
                color: var(--ink);
                padding: 8px 13px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 600;
                white-space: nowrap;
            }
            .chip.active {
                background: var(--ink);
                color: var(--paper);
                border-color: var(--ink);
            }
            .chip.pay.active {
                background: var(--green);
                border-color: var(--green);
                color: #fff;
            }
            .chip.preset {
                background: var(--green-soft);
                border-color: var(--border);
                font-weight: 600;
            }
            .chip.removable {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding-right: 8px;
            }
            .chip-x {
                background: none;
                border: none;
                font-size: 16px;
                color: var(--rust);
                font-weight: 700;
                line-height: 1;
                padding: 0 2px;
            }

            .tabbar {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
            }
            .tab {
                flex: 1;
                padding: 11px;
                border-radius: 12px;
                border: 1px solid var(--border);
                background: #fff;
                font-weight: 700;
                font-size: 14px;
                color: var(--ink-soft);
            }
            .tab.active.sale {
                background: var(--green);
                color: #fff;
                border-color: var(--green);
            }
            .tab.active.expense {
                background: var(--rust);
                color: #fff;
                border-color: var(--rust);
            }
            .tab.active.transfer {
                background: var(--gold);
                color: #fff;
                border-color: var(--gold);
            }

            .bigbtn {
                width: 100%;
                padding: 14px;
                border-radius: 12px;
                border: none;
                font-weight: 700;
                font-size: 15.5px;
                margin-top: 18px;
                color: #fff;
                background: var(--ink);
            }
            .bigbtn.sale {
                background: var(--green);
            }
            .bigbtn.expense {
                background: var(--rust);
            }
            .bigbtn.transfer {
                background: var(--gold);
            }
            .bigbtn.ghost {
                background: #fff;
                color: var(--ink);
                border: 1px solid var(--border);
                margin-top: 10px;
            }
            .bigbtn.danger {
                background: #fff;
                color: var(--rust);
                border: 1px solid var(--rust);
                margin-top: 10px;
            }
            .bigbtn.small2 {
                padding: 11px;
                font-size: 13.5px;
                margin-top: 10px;
            }
            .filelabel {
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .hidden-file {
                display: none;
            }

            .addrow {
                display: flex;
                gap: 8px;
                margin-top: 10px;
                align-items: center;
            }
            .addrow .finput {
                flex: 1;
            }
            .smallbtn {
                padding: 10px 16px;
                border-radius: 10px;
                border: none;
                background: var(--ink);
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                flex-shrink: 0;
            }
            .help-text {
                font-size: 12.5px;
                color: var(--ink-soft);
                line-height: 1.5;
                margin-bottom: 6px;
            }
            .footnote {
                text-align: center;
                font-size: 11.5px;
                color: var(--ink-soft);
                margin: 20px 0 8px;
            }

            .presetlist {
                margin: 8px 0;
            }
            .presetrow {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 0;
                border-bottom: 1px dotted var(--border);
            }
            .presetrow:last-child {
                border-bottom: none;
            }
            .presetrow-name {
                flex: 1;
                font-size: 13.5px;
                font-weight: 600;
            }
            .presetrow-price {
                font-family: var(--mono);
                font-size: 13px;
                color: var(--ink-soft);
            }
            .presetrow-reorder {
                display: flex;
                flex-direction: column;
                gap: 2px;
                flex-shrink: 0;
            }
            .reorder-btn {
                width: 26px;
                height: 20px;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: #fff;
                color: var(--ink-soft);
                font-size: 11px;
                line-height: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .reorder-btn:disabled {
                opacity: 0.3;
            }
            .reorder-btn:not(:disabled):active {
                background: var(--green-soft);
                color: var(--ink);
            }

            /* ---------- Line items (receipt builder) ---------- */
            .linelist {
                margin: 4px 0 2px;
            }
            .linerow {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 0;
                border-bottom: 1px dotted var(--border);
            }
            .linerow:last-child {
                border-bottom: none;
            }
            .linerow-main {
                flex: 1;
                min-width: 0;
            }
            .linerow-title {
                font-size: 13.5px;
                font-weight: 600;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .linerow-sub {
                font-size: 11.5px;
                color: var(--ink-soft);
                margin-top: 1px;
            }
            .linerow-amt {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 13.5px;
                flex-shrink: 0;
            }
            .lineentry {
                border: 1px dashed var(--border);
                border-radius: 12px;
                padding: 12px;
                margin-top: 4px;
                background: var(--green-soft);
            }
            .totalsblock {
                margin-top: 4px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
            }
            .totalsrow {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 4px 0;
                font-size: 13.5px;
                color: var(--ink-soft);
            }
            .totalsrow .val {
                font-family: var(--mono);
                font-weight: 600;
                color: var(--ink);
            }
            .totalsrow.grand {
                font-size: 16px;
                font-weight: 700;
                color: var(--ink);
                padding-top: 8px;
                margin-top: 4px;
                border-top: 1px dotted var(--border);
            }
            .totalsrow.grand .val {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 18px;
            }
            .totalsrow.change .val {
                color: var(--green);
            }
            .totalsrow.change.short .val {
                color: var(--rust);
            }

            /* ---------- Summary grid (Reports) ---------- */
            .summary-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 8px;
            }
            .summary-card {
                background: var(--paper-card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px 14px;
            }
            .sc-label {
                font-size: 10.5px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--ink-soft);
                margin-bottom: 4px;
                font-weight: 700;
            }
            .sc-value {
                font-family: var(--mono);
                font-size: 18px;
                font-weight: 700;
            }
            .sc-value.sales {
                color: var(--green);
            }
            .sc-value.expenses {
                color: var(--rust);
            }

            .toprow {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 0;
                border-bottom: 1px dotted var(--border);
            }
            .toprow:last-child {
                border-bottom: none;
            }
            .toprow-rank {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: var(--gold);
                color: #fff;
                font-size: 11px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .toprow-name {
                flex: 1;
                font-size: 13.5px;
                font-weight: 600;
            }
            .toprow-amt {
                font-family: var(--mono);
                font-size: 13px;
                font-weight: 700;
                color: var(--ink-soft);
            }

            /* ---------- Modal ---------- */
            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(35, 48, 42, 0.45);
                display: flex;
                align-items: flex-end;
                justify-content: center;
                z-index: 800;
            }
            .modal {
                background: var(--paper-card);
                width: 100%;
                max-width: 480px;
                border-radius: 18px 18px 0 0;
                padding: 18px 18px 24px;
                max-height: 88vh;
                overflow-y: auto;
                animation: slideup 0.2s ease;
            }
            @keyframes slideup {
                from {
                    transform: translateY(16px);
                    opacity: 0;
                }
                to {
                    transform: none;
                    opacity: 1;
                }
            }
            .modal-title {
                font-size: 17px;
                font-weight: 700;
                margin-bottom: 6px;
            }
            .modal-btnrow {
                display: flex;
                gap: 8px;
                margin-top: 18px;
            }
            .modal-btnrow .bigbtn {
                margin-top: 0;
                flex: 1;
            }

            /* ---------- Bottom nav (lives outside #shell so no ancestor can clip it) ---------- */
            #bottomnav {
                position: fixed;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                max-width: 480px;
                background: var(--paper-card);
                border-top: 1px solid var(--border);
                display: flex;
                z-index: 500;
                padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
            }
            .navbtn {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                background: none;
                border: none;
                color: var(--ink-soft);
                font-size: 10.5px;
                font-weight: 700;
                padding: 6px 2px;
                border-radius: 10px;
                text-decoration: none;
            }
            .navbtn .navicon {
                font-size: 18px;
                line-height: 1;
            }
            .navbtn.active {
                color: var(--green);
            }
            .navbtn.active .navicon {
                transform: scale(1.05);
            }
            .nav-brand {
                display: none;
            }

            /* ---------- Toasts ---------- */
            #toastHost {
                position: fixed;
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 900;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                width: 100%;
                max-width: 440px;
                padding: 0 16px;
                pointer-events: none;
            }
            .toast {
                background: var(--ink);
                color: var(--paper);
                padding: 10px 18px;
                border-radius: 30px;
                font-size: 13px;
                font-weight: 600;
                opacity: 0;
                transform: translateY(-8px);
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            }
            .toast.show {
                opacity: 1;
                transform: none;
            }

            /* ---------- Focus visibility ---------- */
            button:focus-visible,
            input:focus-visible,
            a:focus-visible {
                outline: 2px solid var(--gold);
                outline-offset: 2px;
            }

            /* ---------- Reduced motion ---------- */
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
            }

            /* ---------- Wide screens: 480–859px gets a comfortably centered phone-width column ---------- */
            @media (min-width: 481px) and (max-width: 859px) {
                #shell {
                    margin-top: 24px;
                    margin-bottom: 24px;
                    min-height: calc(100dvh - 48px);
                    border-radius: 20px;
                }
            }

            /* ---------- Wide screens: 860px+ gets a real desktop layout — sidebar nav, wider content ---------- */
            @media (min-width: 860px) {
                #shell {
                    max-width: none;
                    margin: 0 0 0 220px;
                    min-height: 100vh;
                    min-height: 100dvh;
                    box-shadow: none;
                    padding-bottom: 40px;
                }
                #app {
                    max-width: 640px;
                    margin: 0 auto;
                    padding: 8px 24px 0;
                }
                .page {
                    padding: 20px 0 8px;
                }

                #bottomnav {
                    position: fixed;
                    top: 0;
                    left: 0;
                    bottom: 0;
                    transform: none;
                    width: 220px;
                    max-width: none;
                    height: 100vh;
                    height: 100dvh;
                    flex-direction: column;
                    align-items: stretch;
                    justify-content: flex-start;
                    gap: 4px;
                    border-top: none;
                    border-right: 1px solid var(--border);
                    padding: 0 12px 24px;
                }
                .nav-brand {
                    display: block;
                    font-family: var(--mono);
                    font-weight: 700;
                    font-size: 13px;
                    letter-spacing: 0.06em;
                    color: var(--ink);
                    padding: 22px 10px 18px;
                    text-transform: uppercase;
                }
                .nav-brand span {
                    color: var(--gold);
                }
                .navbtn {
                    flex-direction: row;
                    justify-content: flex-start;
                    gap: 12px;
                    padding: 11px 12px;
                    font-size: 14px;
                    border-radius: 10px;
                }
                .navbtn.active {
                    background: var(--green-soft);
                }
                .navbtn .navicon {
                    font-size: 17px;
                    width: 20px;
                    text-align: center;
                }

                .summary-grid {
                    grid-template-columns: repeat(4, 1fr);
                }
                .hero {
                    padding: 26px 28px 28px;
                }
                .hero-amount {
                    font-size: 46px;
                }
                .card {
                    padding: 20px 22px;
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="toastHost"></div>
            <main id="app"></main>
        </div>

        <nav id="bottomnav">
            <div class="nav-brand">Little<span>Ledger</span></div>
            <a href="#/home" class="navbtn" data-route="home"><span class="navicon">&#8962;</span><span>Home</span></a>
            <a href="#/add" class="navbtn" data-route="add"><span class="navicon">&#43;</span><span>Add</span></a>
            <a href="#/history" class="navbtn" data-route="history"><span class="navicon">&#8801;</span><span>History</span></a>
            <a href="#/reports" class="navbtn" data-route="reports"><span class="navicon">&#9776;</span><span>Reports</span></a>
            <a href="#/settings" class="navbtn" data-route="settings"><span class="navicon">&#9881;</span><span>Settings</span></a>
        </nav>

        <script>
            /* ============ Little Ledger POS — app logic ============ */
            (function () {
                "use strict";

                /* ---------- IndexedDB layer ---------- */
                const DB_NAME = "littleLedgerDB";
                const DB_VERSION = 2;
                let dbPromise = null;

                function openDB() {
                    if (dbPromise) return dbPromise;
                    dbPromise = new Promise((resolve, reject) => {
                        const req = indexedDB.open(DB_NAME, DB_VERSION);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            const tx = e.target.transaction;
                            let txStore, presetStore;
                            if (!db.objectStoreNames.contains("transactions")) {
                                txStore = db.createObjectStore("transactions", { keyPath: "id", autoIncrement: true });
                                txStore.createIndex("date", "date");
                                txStore.createIndex("type", "type");
                                txStore.createIndex("category", "category");
                                txStore.createIndex("companyId", "companyId");
                            } else {
                                txStore = tx.objectStore("transactions");
                                if (!txStore.indexNames.contains("companyId")) txStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("presets")) {
                                presetStore = db.createObjectStore("presets", { keyPath: "id", autoIncrement: true });
                                presetStore.createIndex("companyId", "companyId");
                            } else {
                                presetStore = tx.objectStore("presets");
                                if (!presetStore.indexNames.contains("companyId")) presetStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("settings")) {
                                db.createObjectStore("settings", { keyPath: "key" });
                            }
                            if (!db.objectStoreNames.contains("companies")) {
                                db.createObjectStore("companies", { keyPath: "id", autoIncrement: true });
                            }
                        };
                        req.onsuccess = (e) => resolve(e.target.result);
                        req.onerror = (e) => reject(e.target.error);
                    });
                    return dbPromise;
                }

                function reqP(req) {
                    return new Promise((resolve, reject) => {
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                }

                async function dbAdd(storeName, value) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    const p = reqP(tx.objectStore(storeName).add(value));
                    return p;
                }
                async function dbPut(storeName, value) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).put(value));
                }
                async function dbDelete(storeName, key) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).delete(key));
                }
                async function dbGetAll(storeName) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readonly");
                    return reqP(tx.objectStore(storeName).getAll());
                }
                async function dbClear(storeName) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).clear());
                }
                async function dbGet(storeName, key) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readonly");
                    return reqP(tx.objectStore(storeName).get(key));
                }

                /* ---------- Settings & company helpers ---------- */
                const DEFAULT_SALE_CATEGORIES = ["Document Printing", "Ukay-Ukay", "School Supplies"];
                const DEFAULT_EXPENSE_CATEGORIES = ["Restock", "Supplies & Materials", "Utilities", "Rent", "Transportation", "Other"];
                const DEFAULT_PRESET_SEED = [
                    { type: "sale", category: "Document Printing", name: "Photocopy (B&W)", price: 2 },
                    { type: "sale", category: "Document Printing", name: "Print — Colored", price: 10 },
                    { type: "sale", category: "Document Printing", name: "Print — B&W", price: 5 },
                    { type: "sale", category: "Document Printing", name: "Scan to file", price: 10 },
                    { type: "sale", category: "School Supplies", name: "Ballpen", price: 10 },
                    { type: "sale", category: "School Supplies", name: "Notebook", price: 25 },
                    { type: "sale", category: "School Supplies", name: "Bond Paper (per sheet)", price: 2 },
                ];

                async function getSetting(key, fallback) {
                    const rec = await dbGet("settings", key);
                    return rec ? rec.value : fallback;
                }
                async function setSetting(key, value) {
                    return dbPut("settings", { key, value });
                }

                async function listCompanies() {
                    const all = await dbGetAll("companies");
                    return all.sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
                }
                async function getActiveCompanyId() {
                    let id = await getSetting("activeCompanyId", null);
                    const companies = await listCompanies();
                    if (id == null || !companies.some((c) => c.id === id)) {
                        id = companies.length ? companies[0].id : null;
                        if (id != null) await setSetting("activeCompanyId", id);
                    }
                    return id;
                }
                async function getActiveCompany() {
                    const id = await getActiveCompanyId();
                    if (id == null) return null;
                    return dbGet("companies", id);
                }
                async function updateActiveCompany(patch) {
                    const company = await getActiveCompany();
                    if (!company) return null;
                    const updated = Object.assign({}, company, patch);
                    await dbPut("companies", updated);
                    return updated;
                }
                async function seedDefaultPresetsForCompany(companyId) {
                    for (let i = 0; i < DEFAULT_PRESET_SEED.length; i++) {
                        await dbAdd("presets", Object.assign({ companyId, order: i }, DEFAULT_PRESET_SEED[i]));
                    }
                }
                async function createCompany(name) {
                    const company = {
                        name: (name || "").trim() || "New Company",
                        categories: { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                        startingCash: 0,
                        startingGcash: 0,
                        startingBank: 0,
                        createdAt: new Date().toISOString(),
                    };
                    const id = await dbAdd("companies", company);
                    await seedDefaultPresetsForCompany(id);
                    return id;
                }

                async function seedIfEmpty() {
                    const companies = await dbGetAll("companies");
                    if (companies.length === 0) {
                        // One-time migration from the old single-tenant schema (global settings) into the first company.
                        const legacyName = await dbGet("settings", "businessName");
                        const legacyCats = await dbGet("settings", "categories");
                        const legacyCash = await dbGet("settings", "startingCash");
                        const legacyGcash = await dbGet("settings", "startingGcash");
                        const legacyBank = await dbGet("settings", "startingBank");
                        const company = {
                            name: (legacyName && legacyName.value) || "My Shop",
                            categories: (legacyCats && legacyCats.value) || { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                            startingCash: (legacyCash && legacyCash.value) || 0,
                            startingGcash: (legacyGcash && legacyGcash.value) || 0,
                            startingBank: (legacyBank && legacyBank.value) || 0,
                            createdAt: new Date().toISOString(),
                        };
                        const id = await dbAdd("companies", company);
                        await setSetting("activeCompanyId", id);

                        // Carry over any pre-existing transactions/presets (from the old single-tenant version) into this company.
                        const oldTx = await dbGetAll("transactions");
                        for (const t of oldTx) {
                            if (t.companyId == null) {
                                t.companyId = id;
                                await dbPut("transactions", t);
                            }
                        }
                        const oldPresets = await dbGetAll("presets");
                        for (const p of oldPresets) {
                            if (p.companyId == null) {
                                p.companyId = id;
                                await dbPut("presets", p);
                            }
                        }

                        for (const k of ["businessName", "categories", "startingCash", "startingGcash", "startingBank"]) {
                            const rec = await dbGet("settings", k);
                            if (rec) await dbDelete("settings", k);
                        }

                        if (oldPresets.length === 0) await seedDefaultPresetsForCompany(id);
                    } else {
                        // Make sure there's always a valid active company pointer.
                        await getActiveCompanyId();
                        // Guard: a company created before preset seeding existed shouldn't be stuck empty.
                        const cid = await getActiveCompanyId();
                        const presets = (await dbGetAll("presets")).filter((p) => p.companyId === cid);
                        const anyTx = (await dbGetAll("transactions")).some((t) => t.companyId === cid);
                        if (presets.length === 0 && !anyTx) await seedDefaultPresetsForCompany(cid);
                    }
                }

                /* ---------- Utils ---------- */
                function fmtPeso(n) {
                    const v = Number(n) || 0;
                    return "\u20b1" + v.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
                function pad2(n) {
                    return String(n).padStart(2, "0");
                }
                function toLocalInputValue(d) {
                    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
                }
                function fmtDateHeader(dateStr) {
                    const d = new Date(dateStr);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const that = new Date(d);
                    that.setHours(0, 0, 0, 0);
                    const diffDays = Math.round((today - that) / 86400000);
                    const opts = { weekday: "short", month: "short", day: "numeric" };
                    if (diffDays === 0) return "Today · " + d.toLocaleDateString("en-PH", opts);
                    if (diffDays === 1) return "Yesterday · " + d.toLocaleDateString("en-PH", opts);
                    return d.toLocaleDateString("en-PH", opts);
                }
                function fmtTime(dateStr) {
                    const d = new Date(dateStr);
                    return d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
                }
                function startOfDay(d) {
                    const x = new Date(d);
                    x.setHours(0, 0, 0, 0);
                    return x;
                }
                function endOfDay(d) {
                    const x = new Date(d);
                    x.setHours(23, 59, 59, 999);
                    return x;
                }
                function startOfWeek(d) {
                    const x = startOfDay(d);
                    const day = x.getDay();
                    const diff = day === 0 ? 6 : day - 1;
                    x.setDate(x.getDate() - diff);
                    return x;
                }
                function startOfMonth(d) {
                    const x = startOfDay(d);
                    x.setDate(1);
                    return x;
                }

                function uid() {
                    return "id" + Date.now() + Math.random().toString(16).slice(2);
                }

                /* Return the line items for a transaction. Sale/expense records created before the
                   multi-line-item feature only had a single item/category/qty/unitPrice/amount on the
                   record itself — treat that as a one-line list so every render path can just use .lines(). */
                function txLines(t) {
                    if (Array.isArray(t.items) && t.items.length) return t.items;
                    if (t.type === "sale" || t.type === "expense") {
                        return [{ category: t.category, item: t.item, qty: t.qty, unitPrice: t.unitPrice, amount: t.amount }];
                    }
                    return [];
                }

                function el(tag, attrs, children) {
                    const node = document.createElement(tag);
                    if (attrs)
                        for (const k in attrs) {
                            if (k === "class") node.className = attrs[k];
                            else if (k === "html") node.innerHTML = attrs[k];
                            else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
                            else node.setAttribute(k, attrs[k]);
                        }
                    if (children)
                        for (const c of [].concat(children)) {
                            if (c == null) continue;
                            node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
                        }
                    return node;
                }
                function qs(sel, root) {
                    return (root || document).querySelector(sel);
                }
                function qsa(sel, root) {
                    return Array.from((root || document).querySelectorAll(sel));
                }

                function toast(msg) {
                    const host = qs("#toastHost");
                    const t = el("div", { class: "toast" }, msg);
                    host.appendChild(t);
                    requestAnimationFrame(() => t.classList.add("show"));
                    setTimeout(() => {
                        t.classList.remove("show");
                        setTimeout(() => t.remove(), 250);
                    }, 2200);
                }

                /* ---------- App state ---------- */
                const App = {
                    addType: "sale", // 'sale' | 'expense' | 'transfer'
                    selectedCategory: null,
                    transferFrom: "gcash",
                    transferTo: "cash",
                    saleLines: [], // line items staged for the transaction currently being built on the Add page
                    historyFilters: { range: "today", type: "all", category: "all", search: "", from: null, to: null },
                    reportRange: "today",
                    reportCustom: { from: null, to: null },
                    editingId: null,
                };

                /* ---------- Routing ---------- */
                function currentRoute() {
                    const h = location.hash.replace("#/", "") || "home";
                    return h.split("?")[0];
                }
                window.addEventListener("hashchange", render);

                async function render() {
                    const route = currentRoute();
                    qsa(".navbtn").forEach((b) => b.classList.toggle("active", b.dataset.route === route));
                    const main = qs("#app");
                    main.innerHTML = "";
                    if (route === "home") main.appendChild(await renderHome());
                    else if (route === "add") main.appendChild(await renderAdd());
                    else if (route === "history") main.appendChild(await renderHistory());
                    else if (route === "reports") main.appendChild(await renderReports());
                    else if (route === "settings") main.appendChild(await renderSettings());
                    else main.appendChild(await renderHome());
                    window.scrollTo(0, 0);
                }

                /* ---------- Data queries ---------- */
                async function allTx() {
                    const cid = await getActiveCompanyId();
                    const all = await dbGetAll("transactions");
                    return all.filter((t) => t.companyId === cid);
                }
                async function companyPresets() {
                    const cid = await getActiveCompanyId();
                    const all = await dbGetAll("presets");
                    return all.filter((p) => p.companyId === cid);
                }

                /* Sort presets for display. Presets carry an explicit `order` (position within their
                   category) once the user has touched reordering or Settings has backfilled it; presets
                   that predate the `order` field fall back to their original (insertion/id) sequence,
                   keeping the sort stable via each preset's index in the input array. */
                function sortPresets(list) {
                    return list
                        .map((p, i) => ({ p, i }))
                        .sort((a, b) => {
                            const oa = a.p.order != null ? a.p.order : a.i;
                            const ob = b.p.order != null ? b.p.order : b.i;
                            return oa - ob;
                        })
                        .map((x) => x.p);
                }

                async function computeAccountBalances(txsOverride) {
                    const company = await getActiveCompany();
                    const startCash = company ? company.startingCash : 0;
                    const startGcash = company ? company.startingGcash : 0;
                    const startBank = company ? company.startingBank : 0;
                    const txs = txsOverride || (await allTx());
                    const bal = { cash: Number(startCash) || 0, gcash: Number(startGcash) || 0, bank: Number(startBank) || 0 };
                    for (const t of txs) {
                        if (t.type === "sale" && bal.hasOwnProperty(t.payment)) bal[t.payment] += Number(t.amount) || 0;
                        else if (t.type === "expense" && bal.hasOwnProperty(t.payment)) bal[t.payment] -= Number(t.amount) || 0;
                        else if (t.type === "transfer") {
                            if (bal.hasOwnProperty(t.fromAccount)) bal[t.fromAccount] -= Number(t.amount) || 0;
                            if (bal.hasOwnProperty(t.toAccount)) bal[t.toAccount] += Number(t.amount) || 0;
                        }
                    }
                    return bal;
                }

                function inRange(dateStr, from, to) {
                    const d = new Date(dateStr).getTime();
                    return d >= from.getTime() && d <= to.getTime();
                }

                function sumBy(txs, pred) {
                    return txs.filter(pred).reduce((s, t) => s + Number(t.amount || 0), 0);
                }

                /* ---------- HOME ---------- */
                async function renderHome() {
                    const txs = await allTx();
                    const company = await getActiveCompany();
                    const businessName = company ? company.name : "My Shop";
                    const now = new Date();
                    const todayFrom = startOfDay(now),
                        todayTo = endOfDay(now);
                    const todayTx = txs.filter((t) => inRange(t.date, todayFrom, todayTo));
                    const todaySales = sumBy(todayTx, (t) => t.type === "sale");
                    const todayExpenses = sumBy(todayTx, (t) => t.type === "expense");
                    const todayNet = todaySales - todayExpenses;
                    const bal = await computeAccountBalances(txs);

                    const wrap = el("div", { class: "page" });

                    wrap.appendChild(
                        el("div", { class: "hero" }, [
                            el("div", { class: "hero-top" }, [
                                el("span", { class: "eyebrow" }, businessName),
                                el("span", { class: "eyebrow muted" }, now.toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" })),
                            ]),
                            el("div", { class: "hero-amount" }, fmtPeso(todayNet)),
                            el("div", { class: "hero-label" }, "TODAY'S NET CASH FLOW"),
                            el("div", { class: "hero-row" }, [
                                el("div", { class: "hero-stat" }, [el("div", { class: "hs-label" }, "Sales"), el("div", { class: "hs-value sales" }, fmtPeso(todaySales))]),
                                el("div", { class: "hero-stat" }, [el("div", { class: "hs-label" }, "Expenses"), el("div", { class: "hs-value expenses" }, fmtPeso(todayExpenses))]),
                            ]),
                        ]),
                    );
                    wrap.appendChild(el("div", { class: "tear" }));

                    wrap.appendChild(
                        el("div", { class: "balancecard" }, [
                            el("div", { class: "balitem lead" }, [el("div", { class: "bal-label" }, "Cash on Hand"), el("div", { class: "bal-value" }, fmtPeso(bal.cash))]),
                            el("div", { class: "balitem" }, [el("div", { class: "bal-label" }, "GCash"), el("div", { class: "bal-value" }, fmtPeso(bal.gcash))]),
                            el("div", { class: "balitem" }, [el("div", { class: "bal-label" }, "Bank"), el("div", { class: "bal-value" }, fmtPeso(bal.bank))]),
                        ]),
                    );

                    const quick = el("div", { class: "quickrow" }, [
                        el(
                            "a",
                            {
                                href: "#/add",
                                class: "quickbtn quickbtn-sale",
                                onclick: () => {
                                    App.addType = "sale";
                                    App.saleLines = [];
                                },
                            },
                            [el("span", { class: "qb-icon" }, "+"), el("span", {}, "Sale")],
                        ),
                        el(
                            "a",
                            {
                                href: "#/add",
                                class: "quickbtn quickbtn-expense",
                                onclick: () => {
                                    App.addType = "expense";
                                    App.saleLines = [];
                                },
                            },
                            [el("span", { class: "qb-icon" }, "−"), el("span", {}, "Expense")],
                        ),
                        el(
                            "a",
                            {
                                href: "#/add",
                                class: "quickbtn quickbtn-transfer",
                                onclick: () => {
                                    App.addType = "transfer";
                                },
                            },
                            [el("span", { class: "qb-icon" }, "\u21c4"), el("span", {}, "Transfer")],
                        ),
                    ]);
                    wrap.appendChild(quick);

                    // category breakdown for today (spread across each transaction's line items)
                    const catTotals = {};
                    todayTx
                        .filter((t) => t.type === "sale")
                        .forEach((t) => {
                            txLines(t).forEach((ln) => {
                                catTotals[ln.category] = (catTotals[ln.category] || 0) + (Number(ln.amount) || 0);
                            });
                        });
                    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                    if (catEntries.length) {
                        const max = Math.max(...catEntries.map((e) => e[1]));
                        const section = el("div", { class: "section" }, [el("div", { class: "section-title" }, "TODAY BY CATEGORY")]);
                        catEntries.forEach(([cat, amt]) => {
                            section.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, cat),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: `width:${((amt / max) * 100).toFixed(0)}%` })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                        wrap.appendChild(section);
                    }

                    // recent transactions
                    const recent = txs
                        .slice()
                        .sort((a, b) => new Date(b.date) - new Date(a.date))
                        .slice(0, 6);
                    const recSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "RECENT ACTIVITY")]);
                    if (recent.length === 0) {
                        recSection.appendChild(
                            el("div", { class: "empty" }, [
                                el("div", { class: "empty-title" }, "Nothing recorded yet"),
                                el("div", { class: "empty-sub" }, "Tap “New Sale” to log your first transaction."),
                            ]),
                        );
                    } else {
                        recent.forEach((t) => recSection.appendChild(txRow(t)));
                    }
                    wrap.appendChild(recSection);

                    return wrap;
                }

                function txRow(t) {
                    const isSale = t.type === "sale";
                    const isTransfer = t.type === "transfer";
                    const lines = txLines(t);
                    const row = el("div", { class: "txrow", "data-id": t.id });
                    let title = t.item;
                    let subtitle;
                    if (isTransfer) {
                        subtitle = `${accountLabel(t.fromAccount)} \u2192 ${accountLabel(t.toAccount)} · ${fmtTime(t.date)}`;
                    } else if (lines.length > 1) {
                        title = `${lines.length} items`;
                        const catSet = Array.from(new Set(lines.map((l) => l.category))).join(", ");
                        subtitle = `${catSet} · ${fmtTime(t.date)} · ${paymentLabel(t.payment)}`;
                    } else {
                        subtitle = `${t.category} · ${fmtTime(t.date)} · ${paymentLabel(t.payment)}`;
                    }
                    row.appendChild(el("div", { class: "txrow-main" }, [el("div", { class: "txrow-title" }, title), el("div", { class: "txrow-sub" }, subtitle)]));
                    const amtClass = isSale ? "sales" : isTransfer ? "transfer" : "expenses";
                    const sign = isSale ? "+" : isTransfer ? "" : "\u2212";
                    row.appendChild(el("div", { class: "txrow-amt " + amtClass }, sign + fmtPeso(t.amount)));
                    row.addEventListener("click", () => openEditModal(t.id));
                    return row;
                }
                function paymentLabel(p) {
                    if (p === "cash") return "Cash";
                    if (p === "gcash") return "GCash";
                    if (p === "bank") return "Bank";
                    return "Other";
                }
                function accountLabel(a) {
                    if (a === "cash") return "Cash";
                    if (a === "gcash") return "GCash";
                    if (a === "bank") return "Bank";
                    if (a === "owner") return "Owner";
                    return a || "";
                }
                function buildAccountChips(selectedValue, onChange, opts) {
                    const accounts = (opts && opts.accounts) || ["cash", "gcash", "bank", "owner"];
                    const row = el("div", { class: "chiprow" });
                    accounts.forEach((a) => {
                        const chip = el("button", { type: "button", class: "chip" + (a === selectedValue ? " active" : "") }, accountLabel(a));
                        chip.dataset.value = a;
                        chip.addEventListener("click", () => {
                            qsa(".chip", row).forEach((c) => c.classList.remove("active"));
                            chip.classList.add("active");
                            onChange(a);
                        });
                        row.appendChild(chip);
                    });
                    return row;
                }

                /* ---------- ADD ---------- */
                const TRANSFER_QUICK_TYPES = [
                    { label: "GCash Cash-out", from: "gcash", to: "cash" },
                    { label: "Cash-in to GCash", from: "cash", to: "gcash" },
                    { label: "Bank Withdrawal", from: "bank", to: "cash" },
                    { label: "Bank Deposit", from: "cash", to: "bank" },
                    { label: "Owner Withdrawal", from: "cash", to: "owner" },
                    { label: "Owner Investment", from: "owner", to: "cash" },
                ];

                function lineSubtotal() {
                    return App.saleLines.reduce((s, ln) => s + (Number(ln.amount) || 0), 0);
                }

                async function renderAdd() {
                    const company = await getActiveCompany();
                    const cats = company ? company.categories : { sale: DEFAULT_SALE_CATEGORIES, expense: DEFAULT_EXPENSE_CATEGORIES };
                    const presetsAll = await companyPresets();
                    const isTransfer = App.addType === "transfer";
                    const isLineBased = App.addType === "sale" || App.addType === "expense";
                    if (isLineBased && (!App.selectedCategory || !cats[App.addType].includes(App.selectedCategory))) {
                        App.selectedCategory = cats[App.addType][0];
                    }

                    const wrap = el("div", { class: "page" });

                    const tabs = el("div", { class: "tabbar" }, [
                        el(
                            "button",
                            {
                                class: "tab" + (App.addType === "sale" ? " active sale" : ""),
                                onclick: () => {
                                    App.addType = "sale";
                                    App.selectedCategory = null;
                                    App.saleLines = [];
                                    render();
                                },
                            },
                            "Sale",
                        ),
                        el(
                            "button",
                            {
                                class: "tab" + (App.addType === "expense" ? " active expense" : ""),
                                onclick: () => {
                                    App.addType = "expense";
                                    App.selectedCategory = null;
                                    App.saleLines = [];
                                    render();
                                },
                            },
                            "Expense",
                        ),
                        el(
                            "button",
                            {
                                class: "tab" + (App.addType === "transfer" ? " active transfer" : ""),
                                onclick: () => {
                                    App.addType = "transfer";
                                    render();
                                },
                            },
                            "Transfer",
                        ),
                    ]);
                    wrap.appendChild(tabs);

                    const form = el("form", { class: "card form" });

                    if (isTransfer) {
                        form.appendChild(el("label", { class: "flabel" }, "Quick Type"));
                        const typeRow = el("div", { class: "chiprow" });
                        TRANSFER_QUICK_TYPES.forEach((tp) => {
                            const chip = el("button", { type: "button", class: "chip" }, tp.label);
                            chip.addEventListener("click", () => {
                                App.transferFrom = tp.from;
                                App.transferTo = tp.to;
                                render();
                                const itemInp = qs("#f-item");
                                if (itemInp && !itemInp.value.trim()) itemInp.value = tp.label;
                            });
                            typeRow.appendChild(chip);
                        });
                        form.appendChild(typeRow);

                        form.appendChild(el("label", { class: "flabel" }, "From"));
                        form.appendChild(
                            buildAccountChips(App.transferFrom, (v) => {
                                App.transferFrom = v;
                            }),
                        );
                        form.appendChild(el("label", { class: "flabel" }, "To"));
                        form.appendChild(
                            buildAccountChips(App.transferTo, (v) => {
                                App.transferTo = v;
                            }),
                        );

                        const itemLabel = "Description (optional)";
                        form.appendChild(el("label", { class: "flabel" }, itemLabel));
                        form.appendChild(el("input", { id: "f-item", type: "text", class: "finput", placeholder: "e.g. Cashed out for restock", autocomplete: "off" }));

                        form.appendChild(el("label", { class: "flabel" }, "Amount"));
                        form.appendChild(
                            el("input", { id: "f-amount", type: "number", class: "finput famount", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal", required: "required" }),
                        );

                        form.appendChild(el("label", { class: "flabel" }, "Date & Time"));
                        form.appendChild(el("input", { id: "f-date", type: "datetime-local", class: "finput", value: toLocalInputValue(new Date()) }));

                        form.appendChild(el("label", { class: "flabel" }, "Note (optional)"));
                        form.appendChild(el("input", { id: "f-note", type: "text", class: "finput", placeholder: "Optional note..." }));

                        const saveBtn = el("button", { type: "submit", class: "bigbtn transfer" }, "Save Transfer");
                        form.appendChild(saveBtn);

                        form.addEventListener("submit", async (e) => {
                            e.preventDefault();
                            const amount = parseFloat(qs("#f-amount").value);
                            if (!amount || amount <= 0) {
                                toast("Please enter a valid amount");
                                return;
                            }
                            if (App.transferFrom === App.transferTo) {
                                toast("Choose two different accounts");
                                return;
                            }
                            const item = qs("#f-item").value.trim() || `${accountLabel(App.transferFrom)} \u2192 ${accountLabel(App.transferTo)}`;
                            const record = {
                                type: "transfer",
                                companyId: await getActiveCompanyId(),
                                category: "Transfer",
                                item,
                                qty: null,
                                unitPrice: null,
                                amount,
                                payment: null,
                                fromAccount: App.transferFrom,
                                toAccount: App.transferTo,
                                date: new Date(qs("#f-date").value || Date.now()).toISOString(),
                                note: qs("#f-note").value.trim(),
                                createdAt: new Date().toISOString(),
                            };
                            await dbAdd("transactions", record);
                            toast("Transfer saved");
                            render();
                        });

                        wrap.appendChild(form);
                        return wrap;
                    }

                    /* ----- Sale / Expense: multi-line item builder ----- */
                    const isSale = App.addType === "sale";

                    // Already-added lines for this transaction
                    if (App.saleLines.length) {
                        form.appendChild(el("label", { class: "flabel" }, `Items (${App.saleLines.length})`));
                        const list = el("div", { class: "linelist" });
                        App.saleLines.forEach((ln, idx) => {
                            const sub = `${ln.category}${ln.qty ? " · qty " + ln.qty : ""}`;
                            const lineRow = el("div", { class: "linerow" }, [
                                el("div", { class: "linerow-main" }, [el("div", { class: "linerow-title" }, ln.item), el("div", { class: "linerow-sub" }, sub)]),
                                el("div", { class: "linerow-amt" }, fmtPeso(ln.amount)),
                                el(
                                    "button",
                                    {
                                        type: "button",
                                        class: "chip-x",
                                        onclick: () => {
                                            App.saleLines.splice(idx, 1);
                                            render();
                                        },
                                    },
                                    "×",
                                ),
                            ]);
                            list.appendChild(lineRow);
                        });
                        form.appendChild(list);
                    }

                    // Line-entry sub-form: builds ONE line item, then "Add Item" pushes it into App.saleLines
                    const entry = el("div", { class: "lineentry" });

                    const chipRow = el("div", { class: "chiprow" });
                    cats[App.addType].forEach((c) => {
                        const chip = el("button", { type: "button", class: "chip" + (c === App.selectedCategory ? " active" : "") }, c);
                        chip.addEventListener("click", () => {
                            App.selectedCategory = c;
                            render();
                        });
                        chipRow.appendChild(chip);
                    });
                    entry.appendChild(el("label", { class: "flabel" }, "Category"));
                    entry.appendChild(chipRow);

                    if (isSale) {
                        const presets = sortPresets(presetsAll.filter((p) => p.type === "sale" && p.category === App.selectedCategory));
                        if (presets.length) {
                            entry.appendChild(el("label", { class: "flabel" }, "Quick items"));
                            const presetRow = el("div", { class: "chiprow" });
                            presets.forEach((p) => {
                                const chip = el("button", { type: "button", class: "chip preset" }, `${p.name} · ${fmtPeso(p.price)}`);
                                chip.addEventListener("click", () => {
                                    qs("#ln-item").value = p.name;
                                    qs("#ln-price").value = p.price;
                                    qs("#ln-qty").value = qs("#ln-qty").value || 1;
                                    recalcLineAmount();
                                });
                                presetRow.appendChild(chip);
                            });
                            entry.appendChild(presetRow);
                        }
                    }

                    entry.appendChild(el("label", { class: "flabel" }, isSale ? "Item / Service" : "Description"));
                    entry.appendChild(
                        el("input", {
                            id: "ln-item",
                            type: "text",
                            class: "finput",
                            placeholder: isSale ? "e.g. Photocopy, Used shirt..." : "e.g. Restock ballpens",
                            autocomplete: "off",
                        }),
                    );

                    const row = el("div", { class: "frow" });
                    const qtyBlock = el("div", { class: "fcol" }, [
                        el("label", { class: "flabel" }, "Qty"),
                        el("div", { class: "stepper" }, [
                            el(
                                "button",
                                {
                                    type: "button",
                                    class: "step-btn",
                                    onclick: (e) => {
                                        e.preventDefault();
                                        stepLineQty(-1);
                                    },
                                },
                                "−",
                            ),
                            el("input", { id: "ln-qty", type: "number", class: "finput steppernum", value: "1", min: "0", step: "any", oninput: recalcLineAmount }),
                            el(
                                "button",
                                {
                                    type: "button",
                                    class: "step-btn",
                                    onclick: (e) => {
                                        e.preventDefault();
                                        stepLineQty(1);
                                    },
                                },
                                "+",
                            ),
                        ]),
                    ]);
                    const priceBlock = el("div", { class: "fcol" }, [
                        el("label", { class: "flabel" }, "Unit Price"),
                        el("input", { id: "ln-price", type: "number", class: "finput", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal", oninput: recalcLineAmount }),
                    ]);
                    row.appendChild(qtyBlock);
                    row.appendChild(priceBlock);
                    entry.appendChild(row);

                    entry.appendChild(el("label", { class: "flabel" }, "Line Amount"));
                    entry.appendChild(el("input", { id: "ln-amount", type: "number", class: "finput famount", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal" }));

                    const addLineBtn = el("button", { type: "button", class: "bigbtn ghost small2" }, "+ Add Item to Transaction");
                    addLineBtn.addEventListener("click", () => {
                        const item = qs("#ln-item").value.trim();
                        const amount = parseFloat(qs("#ln-amount").value);
                        if (!item) {
                            toast("Enter an item or description");
                            return;
                        }
                        if (!amount || amount <= 0) {

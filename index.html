                    let n = 0;
                    (txs || []).forEach((t) => {
                        if (t.type !== "transfer" || t.toAccount !== "payable") return;
                        const tt = txTimeMs(t);
                        if (fromMs != null && tt < fromMs) return;
                        if (toMs != null && tt > toMs) return;
                        n += Number(t.amount) || 0;
                    });
                    return n;
                }

                /** Build sorted diagnostic timeline of capital, AP, inventory, costing start. */
                function buildAccountingTimeline(allTxs, costingStartAt, systemOpeningInventory) {
                    const events = [];
                    (allTxs || []).forEach((t) => {
                        const tt = txTimeMs(t);
                        const amt = Number(t.amount) || 0;
                        if (t.type === "transfer" && t.fromAccount === "owner") {
                            events.push({
                                t: tt,
                                kind: "capital",
                                label: "Owner contribution" + (t.item ? " — " + t.item : ""),
                                detail: "+ capital " + amt,
                                amount: amt,
                            });
                        } else if (t.type === "transfer" && t.toAccount === "owner") {
                            events.push({
                                t: tt,
                                kind: "capital",
                                label: "Owner drawing" + (t.item ? " — " + t.item : ""),
                                detail: "− capital " + amt,
                                amount: -amt,
                            });
                        } else if (t.type === "transfer" && t.fromAccount === "businessFunds") {
                            events.push({
                                t: tt,
                                kind: "capital",
                                label: "From Business Funds" + (t.item ? " — " + t.item : ""),
                                detail: "+ business funds " + amt,
                                amount: amt,
                            });
                        } else if (t.type === "expense" && t.payment === "payable") {
                            const invish = /stock|restock|inventory|spay|spaylater|paper|ink|film|laminat/i.test((t.category || "") + " " + (t.item || "") + " " + (t.note || ""));
                            events.push({
                                t: tt,
                                kind: "ap-credit",
                                label: (invish ? "Credit purchase (AP)" : "Credit expense (AP)") + (t.item ? " — " + t.item : ""),
                                detail: "+AP " + amt + (t.category ? " · " + t.category : ""),
                                amount: amt,
                            });
                        } else if (t.type === "transfer" && t.toAccount === "payable") {
                            events.push({
                                t: tt,
                                kind: "ap-settle",
                                label: "AP settlement from " + (t.fromAccount || "?") + (t.item ? " — " + t.item : ""),
                                detail: "−AP " + amt + " · −" + (t.fromAccount || "cash"),
                                amount: -amt,
                            });
                        }
                    });
                    if (costingStartAt != null) {
                        events.push({
                            t: costingStartAt,
                            kind: "costing-start",
                            label: "Costing system started",
                            detail: "Opening inventory (intentional) " + systemOpeningInventory,
                            amount: systemOpeningInventory,
                        });
                    }
                    events.sort((a, b) => a.t - b.t || String(a.kind).localeCompare(b.kind));
                    return events;
                }

                /**
                 * Reconstruct Accounts Receivable as of a moment from startingReceivable + dated txs.
                 * Credit sales increase AR; collections (transfer from receivable → cash/gcash/bank) decrease AR.
                 */
                function reconstructReceivableBalance(txs, company, asOfExclusive) {
                    let ar = Number(company && company.startingReceivable) || 0;
                    (txs || []).forEach((t) => {
                        const tt = txTimeMs(t);
                        if (asOfExclusive != null && tt >= asOfExclusive) return;
                        const amt = Number(t.amount) || 0;
                        if (amt <= 0) return;
                        if (t.type === "sale" && t.payment === "receivable") {
                            ar += amt;
                        } else if (t.type === "transfer" && t.fromAccount === "receivable") {
                            ar -= amt;
                        } else if (t.type === "transfer" && t.toAccount === "receivable") {
                            ar += amt;
                        } else if (t.type === "expense" && t.payment === "receivable") {
                            // paying expense from AR (unusual) reduces AR
                            ar -= amt;
                        }
                    });
                    return ar;
                }

                /**
                 * Generic source-data diagnostics for financial statements.
                 * Never mutates raw transactions — only flags possible entry issues.
                 * ctx: object with computed statement fields and source lists.
                 */
                function collectStatementDiagnostics(ctx) {
                    const warnings = [];
                    const eps = 0.05;
                    const {
                        allTxs,
                        company,
                        costingSnap,
                        endingAP,
                        endingAPRecon,
                        apReconGap,
                        endingAR,
                        endingARRecon,
                        arReconGap,
                        openingAP,
                        creditsInPeriod,
                        settlementsInPeriod,
                        openingAR,
                        creditSalesPeriod,
                        collections,
                        systemOpeningInventory,
                        rollOpen,
                        invFlow,
                        endingInventory,
                        calcEndingFromCosting,
                        invDiffCosting,
                        posInvPurchasesPostCosting,
                        invPurchaseVsCostingIns,
                        totalAssets,
                        liabilities,
                        calculatedEquity,
                        equityUnexplained,
                        seedCashCapital,
                        openingInventoryEquity,
                        apAtCostingStart,
                        openingEquityAtStart,
                        fixedAssets,
                        inventoryPurchases,
                        matNames,
                    } = ctx;

                    // AP ledger vs date reconstruction
                    if (apReconGap != null && Math.abs(apReconGap) > eps) {
                        warnings.push({
                            code: "AP_LEDGER_MISMATCH",
                            message:
                                "AP ledger balance (" + fmtPeso(endingAP) + ") does not match reconstruction from transaction dates (" + fmtPeso(endingAPRecon) + "). Δ " + fmtPeso(apReconGap) + ".",
                            refs: [],
                        });
                    }

                    // AR ledger vs date reconstruction
                    if (arReconGap != null && Math.abs(arReconGap) > eps) {
                        warnings.push({
                            code: "AR_LEDGER_MISMATCH",
                            message:
                                "AR ledger balance (" + fmtPeso(endingAR) + ") does not match reconstruction from transaction dates (" + fmtPeso(endingARRecon) + "). Δ " + fmtPeso(arReconGap) + ".",
                            refs: [],
                        });
                    }

                    // AP period roll-forward
                    if (openingAP != null && creditsInPeriod != null && settlementsInPeriod != null && endingAP != null) {
                        const apRoll = Math.round((openingAP + creditsInPeriod - settlementsInPeriod - endingAP) * 100) / 100;
                        if (Math.abs(apRoll) > eps) {
                            warnings.push({
                                code: "AP_ROLLFORWARD_GAP",
                                message:
                                    "AP roll-forward does not tie: open " +
                                    fmtPeso(openingAP) +
                                    " + credits " +
                                    fmtPeso(creditsInPeriod) +
                                    " − settlements " +
                                    fmtPeso(settlementsInPeriod) +
                                    " ≠ ending " +
                                    fmtPeso(endingAP) +
                                    " (Δ " +
                                    fmtPeso(apRoll) +
                                    ").",
                                refs: [],
                            });
                        }
                    }

                    // Settlements without prior payable history (heuristic)
                    (allTxs || []).forEach((t) => {
                        if (t.type !== "transfer" || t.toAccount !== "payable") return;
                        const amt = Number(t.amount) || 0;
                        if (amt <= 0) return;
                        // Flag very large settlement relative to reconstructed ending (soft)
                    });

                    // Inventory Costing roll-forward residual
                    if (invDiffCosting != null && Math.abs(invDiffCosting) > 0.5) {
                        warnings.push({
                            code: "INV_ROLLFORWARD_GAP",
                            message:
                                "Inventory roll-forward difference: calculated " +
                                fmtPeso(calcEndingFromCosting) +
                                " vs actual ending " +
                                fmtPeso(endingInventory) +
                                " (Δ " +
                                fmtPeso(invDiffCosting) +
                                "). Check unit costs, adjustments, or moves outside the window.",
                            refs: [],
                        });
                    }

                    // POS inventory purchases after costing start with no matching stock-ins
                    if (invPurchaseVsCostingIns != null && Math.abs(invPurchaseVsCostingIns) > 0.5 && (posInvPurchasesPostCosting || 0) > 0.5) {
                        warnings.push({
                            code: "INV_PURCHASE_NO_STOCK_IN",
                            message:
                                "Inventory purchases after inventory tracking started (" +
                                fmtPeso(posInvPurchasesPostCosting) +
                                ") differ from recorded stock-ins (" +
                                fmtPeso(invFlow && invFlow.ins) +
                                "). Δ " +
                                fmtPeso(invPurchaseVsCostingIns) +
                                ". Link purchases to stock-ins or record movements.",
                            refs: [],
                        });
                    }

                    // Opening balance equation at accounting/costing start
                    if (openingEquityAtStart != null && seedCashCapital != null) {
                        const openAssetsApprox = (seedCashCapital || 0) + (openingInventoryEquity || 0) + (Number(fixedAssets) || 0);
                        // Note: FA may have been acquired after start — using current FA is imperfect; still useful signal
                        const openLiab = apAtCostingStart || 0;
                        const openEq = openingEquityAtStart;
                        // By construction openEq = seedCash + openInv - apAtStart; FA not in openEq
                        // If FA exist without funding path, equity gap later will show
                    }

                    // Equity equation
                    if (equityUnexplained != null && Math.abs(equityUnexplained) > eps) {
                        warnings.push({
                            code: "EQUITY_EQUATION_GAP",
                            message:
                                "Assets − Liabilities (" +
                                fmtPeso((totalAssets || 0) - (liabilities || 0)) +
                                ") does not equal calculated equity (" +
                                fmtPeso(calculatedEquity) +
                                "). Unexplained difference " +
                                fmtPeso(equityUnexplained) +
                                ". Not absorbed into retained earnings.",
                            refs: [],
                        });
                    }

                    // Transfers misclassified as sale/expense (heuristic: transfer-like notes on sale)
                    (allTxs || []).forEach((t) => {
                        const amt = Number(t.amount) || 0;
                        if (amt <= 0) return;
                        const blob = ((t.item || "") + " " + (t.note || "") + " " + (t.category || "")).toLowerCase();
                        if (t.type === "sale" && /\b(owner|contribution|capital|transfer from|loan from|inject)\b/.test(blob)) {
                            warnings.push({
                                code: "POSSIBLE_CONTRIB_AS_REVENUE",
                                message: "Sale may be an owner contribution or funding transfer: " + (t.item || t.note || "sale") + " on " + (t.date || "") + " for " + fmtPeso(amt) + ".",
                                refs: [{ id: t.id, date: t.date, amount: amt, type: t.type }],
                            });
                        }
                        if (t.type === "expense" && /\b(owner|drawing|withdraw|personal)\b/.test(blob)) {
                            warnings.push({
                                code: "POSSIBLE_DRAWING_AS_EXPENSE",
                                message: "Expense may be an owner drawing: " + (t.item || t.note || t.category || "expense") + " on " + (t.date || "") + " for " + fmtPeso(amt) + ".",
                                refs: [{ id: t.id, date: t.date, amount: amt, type: t.type }],
                            });
                        }
                    });

                    // Duplicate detection (same date, type, amount, payment within same day)
                    const seen = new Map();
                    (allTxs || []).forEach((t) => {
                        const amt = Number(t.amount) || 0;
                        if (amt <= 0) return;
                        const key = [t.type, t.date, amt.toFixed(2), t.payment || "", t.fromAccount || "", t.toAccount || "", (t.item || "").toLowerCase()].join("|");
                        if (seen.has(key)) {
                            const prev = seen.get(key);
                            warnings.push({
                                code: "POSSIBLE_DUPLICATE",
                                message: "Possible duplicate transaction on " + (t.date || "") + ": " + t.type + " " + fmtPeso(amt) + (t.item ? " — " + t.item : "") + ".",
                                refs: [
                                    { id: prev.id, date: prev.date, amount: amt, type: t.type },
                                    { id: t.id, date: t.date, amount: amt, type: t.type },
                                ],
                            });
                        } else {
                            seen.set(key, t);
                        }
                    });

                    // Settlement exceeds reconstructed AP (soft)
                    if (settlementsInPeriod != null && endingAP != null && settlementsInPeriod > 0) {
                        // no hard fail
                    }

                    // Cap warnings list size for UI
                    return warnings.slice(0, 50);
                }

                /**
                 * Inventory value at a point in time: startingQty + moves up to asOf, × costPerUnit.
                 * Uses current costPerUnit (same as Costing snapshot — not a full historical cost layer).
                 */
                function inventoryValueAt(materialsRaw, moves, asOfDate) {
                    const asOf = asOfDate ? asOfDate.getTime() : Date.now();
                    let total = 0;
                    (materialsRaw || []).forEach((mat) => {
                        let qty = Number(mat.startingQty) || 0;
                        const sorted = (moves || [])
                            .filter((m) => m.materialId === mat.id && (Number(m.date) || Number(m.createdAt) || 0) <= asOf)
                            .slice()
                            .sort((a, b) => (a.date || 0) - (b.date || 0) || (a.id || 0) - (b.id || 0));
                        sorted.forEach((m) => {
                            const q = Number(m.qty) || 0;
                            if (m.type === "in") qty += q;
                            else if (m.type === "out") qty -= q;
                            else if (m.type === "adjust") qty = q;
                        });
                        const unit = Number(mat.costPerUnit) || Number(mat.unitCost) || 0;
                        total += Math.max(0, qty) * unit;
                    });
                    return total;
                }

                async function loadCostingInventorySnapshot() {
                    const result = {
                        materials: [],
                        products: [],
                        moves: [],
                        ok: false,
                        message: "",
                        metrics: {},
                        costingStartAt: null,
                        openingInventoryAtStart: 0,
                    };
                    if (!isCostingLinkEnabled()) {
                        result.message = "Costing link is off — enable in Settings → Link Costing inventory";
                        return result;
                    }
                    try {
                        const cdb = await openCostingDB();
                        if (!cdb.objectStoreNames.contains("materials")) {
                            result.message = "Costing materials not available";
                            return result;
                        }
                        const materials = await costingReq(cdb.transaction("materials", "readonly").objectStore("materials").getAll());
                        const products = cdb.objectStoreNames.contains("products") ? await costingReq(cdb.transaction("products", "readonly").objectStore("products").getAll()) : [];
                        let moves = [];
                        if (cdb.objectStoreNames.contains("stockMoves")) {
                            moves = await costingReq(cdb.transaction("stockMoves", "readonly").objectStore("stockMoves").getAll());
                        }
                        result.moves = moves || [];
                        result.materials = (materials || []).map((m) => {
                            const stock = costingMaterialCurrentQty(m, moves);
                            return {
                                id: m.id,
                                name: m.name || "Material",
                                unit: m.unit || "",
                                stock,
                                startingQty: Number(m.startingQty) || 0,
                                // Costing field is reorderLevel (not reorderAt)
                                reorderAt: m.reorderLevel != null ? Number(m.reorderLevel) : m.reorderAt != null ? Number(m.reorderAt) : null,
                                costPerUnit: Number(m.costPerUnit) || Number(m.unitCost) || null,
                                createdAt: m.createdAt != null ? Number(m.createdAt) || m.createdAt : null,
                            };
                        });
                        result.products = products || [];
                        // Same weighted avg margin as Costing Products tab (sellable units × product margin)
                        result.metrics = computeCostingProductMetrics(result.products, result.materials, moves);

                        // Costing-system start: earliest material createdAt or earliest stock move
                        let startMs = null;
                        result.materials.forEach((m) => {
                            const t = m.createdAt != null ? Number(m.createdAt) : NaN;
                            if (isFinite(t) && t > 0) startMs = startMs == null ? t : Math.min(startMs, t);
                        });
                        (moves || []).forEach((mv) => {
                            const t = Number(mv.date) || Number(mv.createdAt) || 0;
                            if (t > 0) startMs = startMs == null ? t : Math.min(startMs, t);
                        });
                        result.costingStartAt = startMs;
                        // Intentional opening inventory when Costing began = Σ startingQty × costPerUnit
                        // (physical stock already on hand — not a discrepancy, not reconstructed from POS history)
                        result.openingInventoryAtStart = result.materials.reduce((s, m) => {
                            const q = Number(m.startingQty) || 0;
                            const c = Number(m.costPerUnit) || 0;
                            return s + Math.max(0, q) * c;
                        }, 0);

                        result.ok = true;
                        return result;
                    } catch (e) {
                        result.message = String(e && e.message ? e.message : e);
                        return result;
                    }
                }

                /**
                 * Mirrors Costing's Products summary chips:
                 * - product margin = (sellingPrice − costItems sum) / sellingPrice × 100
                 * - avg margin = Σ(margin × sellableUnits) / Σ(sellableUnits)
                 * Sellable units: bottleneck from non-optional recipe lines vs material stock;
                 * products with no recipe count as 1 unit so list prices still roll up.
                 */
                function computeCostingProductMetrics(products, materials, moves) {
                    const empty = {
                        avgMargin: null,
                        productCount: 0,
                        unitsSum: 0,
                        totalCost: 0,
                        totalRevenue: 0,
                        totalProfit: 0,
                        simpleAvgMargin: null,
                        byCategory: {},
                    };
                    if (!products || !products.length) return empty;

                    const stockById = {};
                    (materials || []).forEach((m) => {
                        // materials may already have .stock from snapshot, else recompute
                        stockById[m.id] = m.stock != null ? Number(m.stock) : costingMaterialCurrentQty(m, moves);
                    });

                    function recipeLines(p) {
                        if (!p || !p.costItems) return [];
                        return p.costItems
                            .filter((c) => c.materialId && c.invQty != null && Number(c.invQty) > 0 && !c.optional)
                            .map((c) => ({ materialId: c.materialId, qty: Number(c.invQty) || 0 }));
                    }

                    // Allocate stock across products in name order (same spirit as Costing bottleneck)
                    const remaining = Object.assign({}, stockById);
                    const unitsById = {};
                    products
                        .slice()
                        .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
                        .forEach((p) => {
                            const lines = recipeLines(p);
                            if (!lines.length) {
                                unitsById[p.id] = 1;
                                return;
                            }
                            let max = Infinity;
                            lines.forEach((ln) => {
                                const avail = remaining[ln.materialId] != null ? remaining[ln.materialId] : 0;
                                const per = Number(ln.qty) || 0;
                                if (per <= 0) return;
                                max = Math.min(max, avail / per);
                            });
                            const units = isFinite(max) ? Math.max(0, Math.floor(max)) : 0;
                            unitsById[p.id] = units;
                            lines.forEach((ln) => {
                                remaining[ln.materialId] = (remaining[ln.materialId] || 0) - units * (Number(ln.qty) || 0);
                            });
                        });

                    let totalCost = 0,
                        totalRevenue = 0,
                        marginWeighted = 0,
                        unitsSum = 0,
                        simpleMarginSum = 0,
                        simpleCount = 0;
                    const byCat = {};

                    products.forEach((p) => {
                        const cost = (p.costItems || []).reduce((s, c) => s + (Number(c.amount) || 0), 0);
                        const price = Number(p.sellingPrice) || 0;
                        const profit = price - cost;
                        const margin = price > 0 ? (profit / price) * 100 : 0;
                        const lines = recipeLines(p);
                        const units = lines.length ? Number(unitsById[p.id]) || 0 : 1;
                        totalCost += units * cost;
                        totalRevenue += units * price;
                        if (units > 0 && isFinite(margin)) {
                            marginWeighted += margin * units;
                            unitsSum += units;
                        }
                        if (price > 0 && isFinite(margin)) {
                            simpleMarginSum += margin;
                            simpleCount++;
                        }

                        // Service / Merchandise (and any other Costing category)
                        const catKey = (p.category || "").trim() || "Uncategorized";
                        if (!byCat[catKey]) {
                            byCat[catKey] = {
                                count: 0,
                                cost: 0,
                                revenue: 0,
                                profit: 0,
                                marginWeighted: 0,
                                unitsSum: 0,
                                simpleMarginSum: 0,
                                simpleCount: 0,
                                avgMargin: null,
                                simpleAvgMargin: null,
                            };
                        }
                        const bucket = byCat[catKey];
                        bucket.count += 1;
                        bucket.cost += units * cost;
                        bucket.revenue += units * price;
                        bucket.profit = bucket.revenue - bucket.cost;
                        if (units > 0 && isFinite(margin)) {
                            bucket.marginWeighted += margin * units;
                            bucket.unitsSum += units;
                        }
                        if (price > 0 && isFinite(margin)) {
                            bucket.simpleMarginSum += margin;
                            bucket.simpleCount++;
                        }
                    });

                    Object.keys(byCat).forEach((k) => {
                        const b = byCat[k];
                        b.avgMargin = b.unitsSum ? b.marginWeighted / b.unitsSum : b.simpleCount ? b.simpleMarginSum / b.simpleCount : null;
                        b.simpleAvgMargin = b.simpleCount ? b.simpleMarginSum / b.simpleCount : null;
                    });

                    const totalProfit = totalRevenue - totalCost;
                    return {
                        avgMargin: unitsSum ? marginWeighted / unitsSum : simpleCount ? simpleMarginSum / simpleCount : null,
                        simpleAvgMargin: simpleCount ? simpleMarginSum / simpleCount : null,
                        productCount: products.length,
                        unitsSum,
                        totalCost,
                        totalRevenue,
                        totalProfit,
                        byCategory: byCat,
                    };
                }

                /** Top sold item names from POS history — drives equipment / consumable suggestions. */
                /**
                 * Returns { byAmount, byQty, all } so demand can be judged by unit volume,
                 * not only peso value (high unit price can overstate demand for low-volume SKUs).
                 */
                async function topSoldItems(lookbackDays, limit) {
                    const txs = await allTx();
                    const now = new Date();
                    const from = startOfDay(now);
                    from.setDate(from.getDate() - (lookbackDays - 1));
                    const totals = {};
                    const qtys = {};
                    txs.filter((t) => t.type === "sale" && inRange(t.date, from, endOfDay(now)) && !isExcludedFromForecast(t)).forEach((t) => {
                        txLines(t).forEach((ln) => {
                            const name = (ln.item || "").trim();
                            if (!name) return;
                            totals[name] = (totals[name] || 0) + (Number(ln.amount) || 0);
                            qtys[name] = (qtys[name] || 0) + (Number(ln.qty) || 1);
                        });
                    });
                    const all = Object.keys(totals).map((name) => ({
                        name,
                        amount: totals[name],
                        qty: qtys[name],
                        unitPrice: qtys[name] > 0 ? totals[name] / qtys[name] : 0,
                    }));
                    const lim = limit || 10;
                    const byAmount = all
                        .slice()
                        .sort((a, b) => b.amount - a.amount)
                        .slice(0, lim);
                    const byQty = all
                        .slice()
                        .sort((a, b) => b.qty - a.qty || b.amount - a.amount)
                        .slice(0, lim);
                    return { byAmount, byQty, all };
                }

                /**
                 * Bucket POS line quantities by equipment-ish category keywords.
                 * qty = sum of POS line qty for matched product names.
                 * Unit is always "line qty as entered" — may mean pages, sheets, or jobs
                 * depending on how the user records sales. Never converts between units.
                 */
                function categorizeDemand(topByQty, topByAmount) {
                    const buckets = {
                        print: { qty: 0, amount: 0, labels: [], unit: "line qty (print-named products)" },
                        laminate: { qty: 0, amount: 0, labels: [], unit: "line qty (lamination products)" },
                        photo: { qty: 0, amount: 0, labels: [], unit: "line qty (photo/ID products)" },
                        ukay: { qty: 0, amount: 0, labels: [], unit: "line qty (apparel products)" },
                        supplies: { qty: 0, amount: 0, labels: [], unit: "line qty (supplies products)" },
                        other: { qty: 0, amount: 0, labels: [], unit: "line qty (uncategorized products)" },
                    };
                    function bucket(name) {
                        const n = (name || "").toLowerCase();
                        if (/laminat/.test(n)) return "laminate";
                        if (/print|photocopy|xerox|copy|scan|document|b&w|b\/w|\bbw\b|colored|bond paper|graphics/.test(n)) return "print";
                        if (/photo|picture|\bid\b|passport/.test(n)) return "photo";
                        if (/ukay|shirt|clothes|apparel/.test(n)) return "ukay";
                        if (/ballpen|notebook|pencil|paper|supplies|glue|\bpen\b/.test(n)) return "supplies";
                        return "other";
                    }
                    const seen = new Set();
                    [...(topByQty || []), ...(topByAmount || [])].forEach((t) => {
                        if (!t || seen.has(t.name)) return;
                        seen.add(t.name);
                        const b = bucket(t.name);
                        buckets[b].qty += Number(t.qty) || 0;
                        buckets[b].amount += Number(t.amount) || 0;
                        buckets[b].labels.push({ name: t.name, qty: Number(t.qty) || 0, amount: Number(t.amount) || 0 });
                    });
                    return buckets;
                }

                function equipmentHintsFromSales(topByQty, topByAmount, lookbackDays) {
                    const buckets = categorizeDemand(topByQty, topByAmount);
                    const ranked = Object.entries(buckets)
                        .filter(([k]) => k !== "other")
                        .map(([key, v]) => ({ key, qty: v.qty, amount: v.amount, labels: v.labels, unit: v.unit }))
                        .filter((x) => x.qty > 0 || x.amount > 0)
                        .sort((a, b) => b.qty - a.qty || b.amount - a.amount);

                    const hints = [];
                    const mismatches = [];
                    const leader = ranked[0];
                    const byKey = (k) => ranked.find((r) => r.key === k);
                    const lb = lookbackDays || 30;
                    const topVol = (topByQty || [])[0];

                    function checkMismatch(categoryKey, categoryQty) {
                        if (!topVol) return;
                        const labels = buckets[categoryKey].labels || [];
                        const inCat = labels.some((l) => l.name === topVol.name);
                        if (!inCat && Number(topVol.qty) > 0 && Math.abs(Number(topVol.qty) - Number(categoryQty)) > 0.5) {
                            mismatches.push({
                                metricA: {
                                    name: "Top product by POS line qty",
                                    value: topVol.qty,
                                    unit: "line qty (as entered on sale lines)",
                                    product: topVol.name,
                                    source: "POS topSoldItems byQty",
                                    lookbackDays: lb,
                                },
                                metricB: {
                                    name: categoryKey + " category workload",
                                    value: categoryQty,
                                    unit: buckets[categoryKey].unit,
                                    product: labels.map((l) => l.name).join(", ") || "(none in category)",
                                    source: "categorizeDemand keyword bucket on top products",
                                    lookbackDays: lb,
                                },
                            });
                        }
                    }

                    const print = byKey("print");
                    const laminate = byKey("laminate");
                    const photo = byKey("photo");
                    const ukay = byKey("ukay");

                    if (print && (print.qty > 0 || print.amount > 0)) {
                        checkMismatch("print", print.qty);
                        const volLead = !leader || leader.key === "print" || print.qty >= (leader.qty || 0) * 0.5;
                        hints.push({
                            equipment: "Printer / capacity",
                            demandMetric: "Print-category POS line quantity",
                            volume: print.qty,
                            unit: print.unit,
                            revenue: print.amount,
                            lookbackDays: lb,
                            products: (print.labels || []).map((l) => l.name + " (" + Math.round(l.qty) + ")").join(", "),
                            reason:
                                "Print-category volume " +
                                Math.round(print.qty) +
                                " line-qty / " +
                                fmtPeso(print.amount) +
                                " over " +
                                lb +
                                "d. Line qty is as entered (pages, jobs, or sheets) — not auto-converted.",
                            priority: volLead || print.qty >= 20 ? "high" : "medium",
                            confidence: "medium",
                        });
                    }
                    if (laminate && laminate.qty > 0) {
                        const qtyLead = leader && leader.key === "laminate";
                        hints.push({
                            equipment: "Laminator",
                            demandMetric: "Lamination-category POS line quantity",
                            volume: laminate.qty,
                            unit: laminate.unit,
                            revenue: laminate.amount,
                            lookbackDays: lb,
                            products: (laminate.labels || []).map((l) => l.name + " (" + Math.round(l.qty) + ")").join(", "),
                            reason: "Lamination volume " + Math.round(laminate.qty) + " line-qty / " + fmtPeso(laminate.amount) + " over " + lb + "d. Rank capacity by units, not revenue alone.",
                            priority: qtyLead ? "high" : laminate.qty >= 15 ? "medium" : "low",
                            confidence: "medium",
                        });
                    }
                    if (photo && photo.qty > 0) {
                        hints.push({
                            equipment: "Photo / ID setup",
                            demandMetric: "Photo-category POS line quantity",
                            volume: photo.qty,
                            unit: photo.unit,
                            revenue: photo.amount,
                            lookbackDays: lb,
                            products: (photo.labels || []).map((l) => l.name + " (" + Math.round(l.qty) + ")").join(", "),
                            reason: "Photo/ID volume " + Math.round(photo.qty) + " line-qty over " + lb + "d.",
                            priority: photo.qty >= 10 ? "medium" : "low",
                            confidence: "medium",
                        });
                    }
                    if (ukay && (ukay.qty > 0 || ukay.amount > 0)) {
                        hints.push({
                            equipment: "Display / storage",
                            demandMetric: "Apparel-category POS line quantity",
                            volume: ukay.qty,
                            unit: ukay.unit,
                            revenue: ukay.amount,
                            lookbackDays: lb,
                            products: (ukay.labels || []).map((l) => l.name).join(", "),
                            reason: "Apparel volume is space-driven more than print hardware.",
                            priority: "low",
                            confidence: "low",
                        });
                    }
                    if (!hints.length && (topByQty || []).length) {
                        hints.push({
                            equipment: "Review top SKUs by line quantity",
                            demandMetric: "Top POS line quantity",
                            volume: topVol ? topVol.qty : 0,
                            unit: "line qty (as entered)",
                            revenue: topVol ? topVol.amount : 0,
                            lookbackDays: lb,
                            products: topVol ? topVol.name : "",
                            reason: "No category keyword match — use top-by-qty products for capacity decisions.",
                            priority: "low",
                            confidence: "low",
                        });
                    }
                    return { hints, mismatches, buckets };
                }

                /**
                 * Per-material replenishment from independent consumption sources only.
                 * Priority:
                 *  1) Costing stockMoves type "out" for this materialId in lookback (actual usage)
                 *  2) BOM/recipe: POS product sales qty × invQty on costItems for this materialId
                 *  3) Exact material name match to a POS line (low-confidence heuristic)
                 * Never shares another material's dailyUse. No recommendation if data is insufficient.
                 */
                function replenishmentSuggestions(materials, topItems, avgDailySales, lookbackDays, opts) {
                    const lb = Math.max(1, Number(lookbackDays) || 30);
                    const options = opts || {};
                    const moves = options.moves || [];
                    const products = options.products || [];
                    const coverageDays = options.coverageDays != null ? Number(options.coverageDays) : 30;
                    const safetyStockFactor = options.safetyStockFactor != null ? Number(options.safetyStockFactor) : 0;
                    const now = Date.now();
                    const fromMs = now - lb * 24 * 60 * 60 * 1000;

                    // POS qty by exact product/item name (case-insensitive)
                    const salesQtyByName = {};
                    (topItems || []).forEach((ti) => {
                        const n = (ti.name || "").toLowerCase().trim();
                        if (!n) return;
                        salesQtyByName[n] = (salesQtyByName[n] || 0) + (Number(ti.qty) || 0);
                    });

                    function outsForMaterial(materialId) {
                        let qty = 0;
                        let moveCount = 0;
                        (moves || []).forEach((m) => {
                            if (m.type !== "out") return;
                            if (String(m.materialId) !== String(materialId)) return;
                            const t = Number(m.date) || Number(m.createdAt) || 0;
                            if (t && t < fromMs) return;
                            const q = Number(m.qty) || 0;
                            if (q <= 0) return;
                            qty += q;
                            moveCount++;
                        });
                        return { qty, moveCount };
                    }

                    function bomConsumptionForMaterial(materialId) {
                        let qty = 0;
                        const links = [];
                        (products || []).forEach((p) => {
                            const lines = (p.costItems || []).filter((c) => c.materialId != null && String(c.materialId) === String(materialId) && !c.optional && Number(c.invQty) > 0);
                            if (!lines.length) return;
                            const pname = (p.name || "").toLowerCase().trim();
                            const sold = salesQtyByName[pname] || 0;
                            if (sold <= 0) return;
                            lines.forEach((ln) => {
                                const per = Number(ln.invQty) || 0;
                                const used = sold * per;
                                qty += used;
                                links.push({ product: p.name, soldQty: sold, perUnit: per, used: used });
                            });
                        });
                        return { qty, links };
                    }

                    function exactNameSalesQty(materialName) {
                        const n = (materialName || "").toLowerCase().trim();
                        if (!n) return 0;
                        if (salesQtyByName[n] != null) return salesQtyByName[n];
                        return 0;
                    }

                    const suggestions = [];
                    const skipped = [];

                    (materials || []).forEach((m) => {
                        const stock = Number(m.stock) || 0;
                        const reorder = m.reorderAt != null ? Number(m.reorderAt) : null;
                        const unit = m.unit || "pcs";
                        const unitCost = m.costPerUnit != null ? Number(m.costPerUnit) : null;

                        // --- Independent consumption for THIS material only ---
                        let historicalConsumption = 0;
                        let method = "";
                        let confidence = "";
                        let formula = "";
                        let source = "";
                        let detailLinks = [];

                        const outs = outsForMaterial(m.id);
                        if (outs.qty > 0) {
                            historicalConsumption = outs.qty;
                            method = "actual stock-outs";
                            confidence = "high";
                            source = "Costing stockMoves type=out for materialId " + m.id + " (" + outs.moveCount + " moves in lookback)";
                            formula = "consumption " + historicalConsumption + " from stock-outs / " + lb + "d lookback";
                        } else {
                            const bom = bomConsumptionForMaterial(m.id);
                            if (bom.qty > 0) {
                                historicalConsumption = bom.qty;
                                method = "BOM/recipe × POS product sales";
                                confidence = "medium";
                                source = "Product costItems (invQty) × POS sales qty by exact product name";
                                detailLinks = bom.links;
                                formula = "consumption " + historicalConsumption + " = Σ(product sold qty × material per unit) over " + lb + "d";
                            } else {
                                const exactQty = exactNameSalesQty(m.name);
                                if (exactQty > 0) {
                                    historicalConsumption = exactQty;
                                    method = "exact name match heuristic";
                                    confidence = "low";
                                    source = "POS line name equals material name (heuristic — not BOM)";
                                    formula =
                                        "consumption " +
                                        historicalConsumption +
                                        ' = POS qty for exact name "' +
                                        (m.name || "") +
                                        '" / ' +
                                        lb +
                                        "d (1:1 assumed; may overstate if name is a finished good)";
                                }
                            }
                        }

                        if (historicalConsumption <= 0) {
                            // Prefer no misleading recommendation
                            if (reorder != null && stock <= reorder) {
                                skipped.push({
                                    name: m.name,
                                    stock,
                                    unit,
                                    reorderAt: reorder,
                                    reason: "Insufficient material consumption data for replenishment estimate (no stock-outs, BOM×sales, or exact-name sales in lookback).",
                                });
                            }
                            return;
                        }

                        const dailyUse = historicalConsumption / lb;
                        const safetyStock = dailyUse * coverageDays * safetyStockFactor;
                        const targetStock = dailyUse * coverageDays + safetyStock;
                        const suggestedQty = Math.max(0, Math.ceil(targetStock - stock));
                        const daysLeft = dailyUse > 0 ? stock / dailyUse : null;

                        // Only surface when action may be needed
                        const belowReorder = reorder != null && stock <= reorder;
                        const lowDays = daysLeft != null && daysLeft < coverageDays;
                        if (!belowReorder && !lowDays && suggestedQty <= 0) return;

                        suggestions.push({
                            name: m.name,
                            materialId: m.id,
                            stock,
                            unit,
                            unitCost,
                            reorderAt: reorder,
                            historicalConsumption,
                            lookbackDays: lb,
                            dailyUse,
                            coverageDays,
                            safetyStock,
                            targetStock,
                            suggestedQty,
                            daysLeft: daysLeft != null ? Math.round(daysLeft * 10) / 10 : null,
                            method,
                            confidence,
                            formula,
                            source,
                            detailLinks,
                            priority: stock <= 0 ? "critical" : daysLeft != null && daysLeft < 7 ? "high" : belowReorder ? "medium" : "low",
                            insufficientHistory: confidence === "low",
                        });
                    });

                    return {
                        suggestions: suggestions.sort((a, b) => {
                            const rank = { critical: 0, high: 1, medium: 2, low: 3 };
                            return (rank[a.priority] || 9) - (rank[b.priority] || 9);
                        }),
                        skipped,
                    };
                }

                async function renderForecast() {
                    await seedForecastIfEmpty();
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "Forecast"));
                    wrap.appendChild(
                        el(
                            "div",
                            { class: "help-text" },
                            "Decision support only — not formal accounting. Actual balances come from POS/Costing; projections use configurable history and your assumptions. Forecasts never change source transactions.",
                        ),
                    );

                    const company = await getActiveCompany();
                    const businessName = company ? company.name : "My Shop";
                    const bal = await computeAccountBalances();
                    const liquid = (bal.cash || 0) + (bal.gcash || 0) + (bal.bank || 0);
                    const assets = await companyAssets();
                    const recurring = await companyRecurring();
                    const planned = await companyPlanned();
                    const assetValue = assets.reduce((s, a) => s + (Number(a.currentValue != null ? a.currentValue : a.cost) || 0), 0);
                    const currentAssets = liquid + (bal.receivable || 0);

                    if (App.forecastLookbackDays == null) App.forecastLookbackDays = 30;
                    const lookbackDays = App.forecastLookbackDays || 30;
                    const salesStats = await computeAvgDailySales(lookbackDays);
                    const sold = await topSoldItems(lookbackDays, 8);
                    const topByAmount = sold.byAmount || [];
                    const topByQty = sold.byQty || [];
                    const topItems = topByAmount;
                    const horizonDays = daysInHorizon(App.forecastHorizonDays, App.forecastTargetDate);
                    const monthlyRecurring = recurring.reduce((s, r) => s + monthlyFromFrequency(r.amount, r.frequency), 0);
                    const recurringConfigured = recurring.some((r) => (Number(r.amount) || 0) > 0);
                    const otherIncomeList = await companyOtherIncome();
                    const projectedRevenue = salesStats.avgDaily * horizonDays;
                    const costingSnap = await loadCostingInventorySnapshot();
                    const costingMetrics = costingSnap.metrics || {};
                    const invValueActual = costingSnap.ok ? (costingSnap.materials || []).reduce((s, m) => s + Math.max(0, Number(m.stock) || 0) * (Number(m.costPerUnit) || 0), 0) : 0;
                    const valuation = currentAssets + assetValue + invValueActual;
                    const avgMarginPct = costingMetrics.avgMargin != null && isFinite(costingMetrics.avgMargin) ? costingMetrics.avgMargin : null;
                    const marginIsEstimate = avgMarginPct == null;
                    // Gross margin % → Gross profit; COGS rate = 100 − margin (never apply margin twice)
                    const projectedGrossProfit = avgMarginPct != null ? projectedRevenue * (avgMarginPct / 100) : null;
                    const projectedCogs = avgMarginPct != null ? projectedRevenue - projectedGrossProfit : null;
                    const cogsRatePct = avgMarginPct != null ? 100 - avgMarginPct : null;
                    const projectedRecurring = (monthlyRecurring / 30) * horizonDays;
                    const now = startOfDay(new Date());
                    const horizonEnd = new Date(now);
                    horizonEnd.setDate(horizonEnd.getDate() + horizonDays);
                    const plannedUnpaid = planned.filter((p) => !p.paid);
                    const plannedMissingDate = plannedUnpaid.filter((p) => !p.dueDate);
                    const plannedInWindow = plannedUnpaid
                        .filter((p) => {
                            if (!p.dueDate) return true; // unknown due → include as caution
                            const d = startOfDay(new Date(p.dueDate));
                            return d >= now && d <= horizonEnd;
                        })
                        .reduce((s, p) => s + (Number(p.amount) || 0), 0);
                    // Existing AP is already a liability — do not add again as planned unless user scheduled extra payments
                    const existingAP = Number(bal.payable) || 0;
                    const otherInc = otherIncomeInWindow(otherIncomeList, horizonDays, now, horizonEnd);
                    const otherIncomeInWindowAmt = otherInc.total;

                    // Cash projection: revenue ≠ cash. Use historical cash-like share; AR collections separate & partial.
                    const cashSalesRatio = salesStats.cashSalesRatio != null ? salesStats.cashSalesRatio : 1;
                    const projectedCashSales = projectedRevenue * cashSalesRatio;
                    const projectedCreditSales = projectedRevenue - projectedCashSales;
                    // Expected collections from *existing* AR only (conservative: assume half collected in horizon unless history empty)
                    // Does not invent collection of new credit sales within the same short horizon
                    const existingAR = Number(bal.receivable) || 0;
                    const arCollectionRate = 0.5; // explicit assumption — labeled in UI
                    const expectedArCollections = existingAR * arCollectionRate;
                    // Inventory replenishment cash (optional) — sum suggested order × unit cost when available
                    const equipResult = equipmentHintsFromSales(topByQty, topByAmount, lookbackDays);
                    const equipHints = equipResult.hints || [];
                    const demandMetricMismatches = equipResult.mismatches || [];
                    const replenishResult = replenishmentSuggestions(costingSnap.materials || [], topByQty.length ? topByQty : topItems, salesStats.avgDaily, lookbackDays, {
                        moves: costingSnap.moves || [],
                        products: costingSnap.products || [],
                        coverageDays: App.forecastCoverageDays != null ? App.forecastCoverageDays : 30,
                        safetyStockFactor: App.forecastSafetyStockFactor != null ? App.forecastSafetyStockFactor : 0,
                    });
                    const replenish = replenishResult.suggestions || [];
                    const replenishSkipped = replenishResult.skipped || [];
                    let projectedInventorySpend = 0;
                    replenish.forEach((r) => {
                        const unitCost = r.unitCost != null ? Number(r.unitCost) : 0;
                        if (unitCost > 0 && r.suggestedQty > 0) projectedInventorySpend += r.suggestedQty * unitCost;
                    });

                    // Projected liquid cash at horizon (total across cash/gcash/bank — internal transfers net to zero)
                    const projectedCash = liquid + projectedCashSales + expectedArCollections + otherIncomeInWindowAmt - projectedRecurring - plannedInWindow - projectedInventorySpend;

                    // Forecast confidence / diagnostics (read-only)
                    const forecastWarnings = [];
                    if (salesStats.count < 5 || salesStats.activeDays < 3) {
                        forecastWarnings.push({ code: "SHORT_SALES_HISTORY", message: "Sales history in the lookback is thin — average daily sales may be unreliable." });
                    }
                    if (salesStats.coefficientOfVariation != null && salesStats.coefficientOfVariation > 1) {
                        forecastWarnings.push({ code: "HIGH_SALES_VARIABILITY", message: "Sales are highly variable day-to-day (CV > 1). Treat averages as rough guidance only." });
                    }
                    if (!recurringConfigured) {
                        forecastWarnings.push({ code: "NO_RECURRING_COSTS", message: "No recurring costs recorded. Operating cash outflow may be understated." });
                    }
                    if (marginIsEstimate) {
                        forecastWarnings.push({
                            code: "ESTIMATED_MARGIN",
                            message: "No product margin from Costing — gross profit / COGS projection is unavailable or would require an assumed margin.",
                        });
                    }
                    if (plannedMissingDate.length) {
                        forecastWarnings.push({
                            code: "PLANNED_NO_DATE",
                            message: plannedMissingDate.length + " planned expense(s) have no due date and are included in the horizon as a caution.",
                        });
                    }
                    if (!costingSnap.ok) {
                        forecastWarnings.push({ code: "NO_COSTING", message: "Inventory/Costing data not linked — inventory outlook and margin-based GP use limited inputs." });
                    }
                    if (replenishSkipped.length) {
                        forecastWarnings.push({
                            code: "INSUFFICIENT_MATERIAL_CONSUMPTION",
                            message: replenishSkipped.length + " material(s) below reorder lack reliable consumption data — no order qty invented.",
                        });
                    }
                    if (replenish.some((r) => r.confidence === "low")) {
                        forecastWarnings.push({
                            code: "LOW_CONFIDENCE_NAME_MATCH",
                            message: "Some replenishment lines use exact name match only (low confidence) — verify BOM/stock-outs.",
                        });
                    }
                    if (otherIncomeInWindowAmt > 0) {
                        forecastWarnings.push({ code: "UNCERTAIN_OTHER_INCOME", message: "Projected cash includes expected other income — arrival timing is not guaranteed." });
                    }

                    // Short demand note for AI / UI when revenue leader ≠ volume leader
                    let demandNote = "";
                    let demandMismatch = null;
                    if (topByQty[0] && topByAmount[0] && topByQty[0].name !== topByAmount[0].name) {
                        demandMismatch = {
                            byVolume: {
                                name: topByQty[0].name,
                                qty: topByQty[0].qty,
                                amount: topByQty[0].amount,
                                source: "POS sales ranked by unit quantity (lookback " + lookbackDays + "d)",
                            },
                            byRevenue: {
                                name: topByAmount[0].name,
                                qty: topByAmount[0].qty,
                                amount: topByAmount[0].amount,
                                source: "POS sales ranked by revenue ₱ (lookback " + lookbackDays + "d)",
                            },
                        };
                        demandNote =
                            "⚠ Forecast metric/source mismatch: volume leader “" +
                            topByQty[0].name +
                            "” (qty " +
                            Math.round(topByQty[0].qty) +
                            ", " +
                            fmtPeso(topByQty[0].amount) +
                            ") vs revenue leader “" +
                            topByAmount[0].name +
                            "” (qty " +
                            Math.round(topByAmount[0].qty) +
                            ", " +
                            fmtPeso(topByAmount[0].amount) +
                            "). Both values kept as reported — not merged or overwritten.";

                        const monthsCovered = monthlyRecurring > 0 ? cashAfter / monthlyRecurring : null;
                        const volTop = topByQty[0] ? topByQty[0].name + " (qty " + Math.round(topByQty[0].qty) + ")" : "n/a";
                        let verdict = "";
                        let risk = "Enter a price";
                        if (price <= 0) {
                            verdict = "Enter a purchase price to run the stress test.";
                            risk = "—";
                        } else if (cashAfter < 0 && otherIncomeInWindowAmt + liquid < price) {
                            risk = "Insufficient buffer";
                            verdict = "Liquid cash plus expected other income in the horizon does not cover this purchase. Consider credit, delay, or lower amount.";
                        } else if (cashAfter < 0) {
                            risk = "High risk";
                            verdict = "Short on liquid today; relies on other income (~" + fmtPeso(otherIncomeInWindowAmt) + ") arriving on time. Existing AP " + fmtPeso(existingAP) + " still due.";
                        } else if (!recurringConfigured) {
                            risk = "Manageable*";
                            verdict = "Appears fundable on recorded cash, but recurring costs are not configured — true buffer may be thinner. Volume signal: " + volTop + ".";
                        } else if (monthsCovered != null && monthsCovered < 1) {
                            risk = "High risk";
                            verdict = "Remaining cash covers under 1 month of recorded fixed costs after purchase.";
                        } else if (monthsCovered != null && monthsCovered < 2) {
                            risk = "Tight";
                            verdict = "Under ~2 months of fixed-cost cover after purchase. Confirm demand and obligations.";
                        } else if (projectedAfter < monthlyRecurring) {
                            risk = "Tight";
                            verdict = "Horizon cash after purchase is below one month of recurring costs. Volume leader: " + volTop + ".";
                        } else if (projectedAfter < liquid * 0.35) {
                            risk = "Manageable";
                            verdict = "Fundable with a reduced buffer. Factor AP " + fmtPeso(existingAP) + " and inventory needs.";
                        } else {
                            risk = "Comfortable";
                            verdict =
                                "Recorded data shows a workable buffer after this purchase (including optional other income). Still allow for maintenance, stock, and delayed collections. Volume: " +
                                volTop +
                                ".";
                        }
                        // attach risk label for UI
                        // verdict remains detailed; risk is short label
                        return {
                            name,
                            amount: price,
                            cashAfter,
                            projectedAfter,
                            monthsCovered,
                            withOtherIncome,
                            otherIncomeInWindow: otherIncomeInWindowAmt,
                            liquidNow: liquid,
                            projectedCashBefore: projectedCash,
                            horizonDays,
                            volTop,
                            risk,
                            verdict,

                async function txTemplateManager() {

                                    "No packs yet. Create one below, or on Add fill a transaction and tap “Save as template” (you can add more steps to the same pack name).",
                                ),
                            );
                            return;
                        }
                        templates.forEach((tpl, idx) => {
                            const steps = templateSteps(tpl);
                            const types = Array.from(new Set(steps.map((s) => s.type).filter(Boolean)));
                            const typeHint = types.length ? types.map((t) => (t === "sale" ? "S" : t === "expense" ? "E" : "T")).join("+") : "?";
                            const nameInp = el("input", {
                                type: "text",

                                value: tpl.name || "",
                                title: "Pack name",
                            });
                            nameInp.addEventListener("change", async () => {
                                const name = nameInp.value.trim();
                                if (!name) {
                                    nameInp.value = tpl.name || "";
                                    return;
                                }
                                await dbPut("txTemplates", Object.assign({}, tpl, { name }));
                                tpl.name = name;
                                toast("Name saved");
                            });
                            const meta = el(
                                "div",
                                { class: "help-text", style: "width:100%;margin:0 0 2px 34px;font-size:11.5px" },

                                    " step" +
                                    (steps.length === 1 ? "" : "s") +
                                    " · " +
                                    typeHint +
                                    (steps.length
                                        ? " — " +
                                          steps
                                              .slice(0, 3)
                                              .map((s) => stepSummary(s) || s.type)
                                              .join("; ") +
                                          (steps.length > 3 ? "…" : "")
                                        : ""),
                            );

                            const upBtn = el("button", { type: "button", class: "reorder-btn" }, "▲");
                            const downBtn = el("button", { type: "button", class: "reorder-btn" }, "▼");
                            if (idx === 0) upBtn.setAttribute("disabled", "disabled");
                            if (idx === templates.length - 1) downBtn.setAttribute("disabled", "disabled");
                            upBtn.addEventListener("click", async () => {
                                if (idx === 0) return;
                                const other = templates[idx - 1];
                                const myOrder = tpl.order != null ? tpl.order : idx;
                                const otherOrder = other.order != null ? other.order : idx - 1;
                                await dbPut("txTemplates", Object.assign({}, tpl, { order: otherOrder }));
                                await dbPut("txTemplates", Object.assign({}, other, { order: myOrder }));
                                refresh();
                            });
                            downBtn.addEventListener("click", async () => {
                                if (idx === templates.length - 1) return;
                                const other = templates[idx + 1];
                                const myOrder = tpl.order != null ? tpl.order : idx;
                                const otherOrder = other.order != null ? other.order : idx + 1;
                                await dbPut("txTemplates", Object.assign({}, tpl, { order: otherOrder }));
                                await dbPut("txTemplates", Object.assign({}, other, { order: myOrder }));

                                nameInp,
                                runBtn,
                                editBtn,
                                delBtn,
                                meta,
                            ]);
                            list.appendChild(row);
                        });
                    }

                    card.appendChild(list);

                    const newBtn = el("button", { type: "button", class: "bigbtn sale small2" }, "New cut-off pack");

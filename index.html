                }
                function paymentLabel(p) {
                    if (p === "cash") return "Cash";
                    if (p === "gcash") return "GCash";
                    if (p === "bank") return "Bank";
                    if (p === "receivable") return "Receivable";
                    if (p === "payable") return "Payable";
                    return "Other";
                }
                function accountLabel(a) {
                    if (a === "cash") return "Cash";
                    if (a === "gcash") return "GCash";
                    if (a === "bank") return "Bank";
                    if (a === "receivable") return "Receivable";
                    if (a === "payable") return "Payable";
                    if (a === "owner") return "Owner";
                    if (a === "businessFunds") return "Business Funds";
                    return a || "";
                }
                function buildAccountChips(selectedValue, onChange, opts) {
                    const accounts = (opts && opts.accounts) || ["cash", "gcash", "bank", "receivable", "payable", "owner", "businessFunds"];
                    const row = el("div", { class: "chiprow" });
                    accounts.forEach((a) => {
                        const chip = el("button", { type: "button", class: "chip" + (a === selectedValue ? " active" : "") }, accountLabel(a));
                        chip.dataset.value = a;
                        chip.addEventListener("click", () => {
                            qsa(".chip", row).forEach((c) => c.classList.remove("active"));
                            chip.classList.add("active");
                            onChange(a);
                        });
                        row.appendChild(chip);
                    });
                    return row;
                }

                /** Normalize legacy single-type templates into steps[] */
                function templateSteps(tpl) {
                    if (!tpl) return [];
                    if (Array.isArray(tpl.steps) && tpl.steps.length) return tpl.steps;
                    // Legacy single-record template
                    if (tpl.type === "transfer") {
                        return [
                            {
                                type: "transfer",
                                fromAccount: tpl.fromAccount,
                                toAccount: tpl.toAccount,
                                item: tpl.item || tpl.name,
                                amount: tpl.amount,
                                note: tpl.note || "",
                            },
                        ];
                    }
                    if (tpl.type === "sale" || tpl.type === "expense") {
                        const items =
                            Array.isArray(tpl.items) && tpl.items.length
                                ? tpl.items
                                : [
                                      {
                                          category: tpl.category,
                                          item: tpl.item || tpl.name,
                                          qty: tpl.qty,
                                          unitPrice: tpl.unitPrice,
                                          amount: tpl.amount,
                                      },
                                  ];
                        return [
                            {
                                type: tpl.type,
                                category: tpl.category || (items[0] && items[0].category),
                                item: tpl.item || (items.length === 1 ? items[0].item : items.length + " items"),
                                amount: tpl.amount != null ? tpl.amount : items.reduce((s, ln) => s + (Number(ln.amount) || 0), 0),
                                payment: tpl.payment || "cash",
                                note: tpl.note || "",
                                items: items,
                            },
                        ];
                    }
                    return [];
                }

                function stepSummary(step) {
                    if (!step) return "";
                    if (step.type === "transfer") {
                        return accountLabel(step.fromAccount) + " → " + accountLabel(step.toAccount) + (step.item ? " · " + step.item : "");
                    }
                    const items = step.items || [];
                    if (items.length > 1) return items.length + " lines · " + (step.item || step.type);
                    return (step.item || step.type || "") + (step.category ? " · " + step.category : "");
                }

                function applyTxTemplate(tpl) {
                    if (!tpl) return;
                    const steps = templateSteps(tpl);
                    if (!steps.length) {
                        toast("Empty template");
                        return;
                    }
                    // Multi-step (or always for packs): open run modal so amounts can be tweaked then all saved
                    if (steps.length > 1 || tpl.steps) {
                        openRunTemplateModal(tpl);
                        return;
                    }
                    // Single step: prefill Add form (legacy behavior)
                    const step = steps[0];
                    App.addType = step.type || App.addType;
                    if (step.type === "transfer") {
                        if (step.fromAccount) App.transferFrom = step.fromAccount;
                        if (step.toAccount) App.transferTo = step.toAccount;
                        render().then(() => {
                            const itemInp = qs("#f-item");
                            const amtInp = qs("#f-amount");
                            const noteInp = qs("#f-note");
                            if (itemInp) itemInp.value = step.item || tpl.name || "";
                            if (amtInp && step.amount != null) amtInp.value = Number(step.amount) || "";
                            if (noteInp && step.note) noteInp.value = step.note;
                            toast("Template applied — edit amount if needed");
                        });
                        return;
                    }
                    App.saleLines = [];
                    if (Array.isArray(step.items) && step.items.length) {
                        App.saleLines = step.items.map((ln) => ({
                            category: ln.category || step.category || App.selectedCategory,
                            item: ln.item || ln.name || "",
                            qty: ln.qty != null ? ln.qty : null,
                            unitPrice: ln.unitPrice != null ? ln.unitPrice : null,
                            amount: Number(ln.amount) || 0,
                        }));
                    } else if (step.item || step.amount) {
                        App.saleLines = [
                            {
                                category: step.category || App.selectedCategory,
                                item: step.item || tpl.name || "",
                                qty: step.qty != null ? step.qty : null,
                                unitPrice: step.unitPrice != null ? step.unitPrice : null,
                                amount: Number(step.amount) || 0,
                            },
                        ];
                    }
                    if (step.category) App.selectedCategory = step.category;
                    App._pendingTemplatePayment = step.payment || null;
                    App._pendingTemplateNote = step.note || "";
                    render().then(() => {
                        if (App._pendingTemplatePayment) {
                            const payRow = qs("#f-payment-row");
                            if (payRow) {
                                qsa(".chip.pay", payRow).forEach((c) => {
                                    c.classList.toggle("active", c.dataset.value === App._pendingTemplatePayment);
                                });
                            }
                            App._pendingTemplatePayment = null;
                        }
                        if (App._pendingTemplateNote) {
                            const noteInp = qs("#f-note");
                            if (noteInp) noteInp.value = App._pendingTemplateNote;
                            App._pendingTemplateNote = "";
                        }
                        toast("Template applied — edit amount if needed");
                    });
                }

                function closeTemplateModal() {
                    const ov = qs("#tpl-modal-overlay");
                    if (ov) ov.remove();
                }

                async function openRunTemplateModal(tpl) {
                    closeTemplateModal();
                    const steps = templateSteps(tpl).map((s) => Object.assign({}, s, { items: s.items ? s.items.map((ln) => Object.assign({}, ln)) : s.items }));
                    const company = await getActiveCompany();
                    const cats = company ? company.categories : { sale: DEFAULT_SALE_CATEGORIES, expense: DEFAULT_EXPENSE_CATEGORIES };

                    const overlay = el("div", { class: "overlay", id: "tpl-modal-overlay" });
                    overlay.addEventListener("click", (e) => {
                        if (e.target === overlay) closeTemplateModal();
                    });
                    const modal = el("div", { class: "modal" });
                    modal.appendChild(el("div", { class: "modal-title" }, tpl.name || "Run template"));
                    modal.appendChild(el("div", { class: "help-text" }, "Edit amounts for this cut-off, then record all steps as separate transactions (sale / expense / transfer)."));

                    const list = el("div", { class: "presetlist" });
                    const amountInputs = [];

                    steps.forEach((step, idx) => {
                        const typeBadge = el(
                            "span",
                            {
                                class: "badge-inv " + (step.type === "sale" ? "ok" : step.type === "expense" ? "missing" : "ok"),
                                style: "margin-right:6px",
                            },
                            step.type === "sale" ? "SALE" : step.type === "expense" ? "EXPENSE" : "TRANSFER",
                        );
                        const title = el("div", { class: "txrow-title" }, [typeBadge, document.createTextNode(stepSummary(step) || "Step " + (idx + 1))]);
                        const amtInp = el("input", {
                            type: "number",
                            class: "finput famount",
                            value: step.amount != null ? step.amount : "",
                            min: "0",
                            step: "0.01",
                            inputmode: "decimal",
                            style: "max-width:140px;margin-top:6px",
                        });
                        amountInputs.push(amtInp);
                        const skipLab = el("label", { style: "display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--ink-soft)" }, [
                            el("input", { type: "checkbox", class: "tpl-skip", "data-idx": String(idx) }),
                            document.createTextNode("Skip this step"),
                        ]);
                        const block = el("div", { class: "card", style: "padding:12px;margin-bottom:10px" }, [title, el("div", { class: "flabel" }, "Amount"), amtInp, skipLab]);
                        list.appendChild(block);
                    });
                    modal.appendChild(list);

                    const btnRow = el("div", { class: "modal-btnrow" });
                    const cancelBtn = el("button", { type: "button", class: "bigbtn ghost" }, "Cancel");
                    cancelBtn.addEventListener("click", closeTemplateModal);
                    const runBtn = el("button", { type: "button", class: "bigbtn sale" }, "Record all");
                    runBtn.addEventListener("click", async () => {
                        const cid = await getActiveCompanyId();
                        const nowIso = new Date().toISOString();
                        let saved = 0;
                        for (let i = 0; i < steps.length; i++) {
                            const skip = modal.querySelector('.tpl-skip[data-idx="' + i + '"]');
                            if (skip && skip.checked) continue;
                            const step = steps[i];
                            const amount = parseFloat(amountInputs[i].value) || 0;
                            if (amount <= 0 && step.type !== "transfer") {
                                // allow 0? skip zero amounts to avoid junk
                                if (amount <= 0) continue;
                            }
                            if (step.type === "transfer") {
                                if (amount <= 0) continue;
                                if (!step.fromAccount || !step.toAccount || step.fromAccount === step.toAccount) continue;
                                await dbAdd("transactions", {
                                    type: "transfer",
                                    companyId: cid,
                                    category: "Transfer",
                                    item: step.item || accountLabel(step.fromAccount) + " → " + accountLabel(step.toAccount),
                                    qty: null,
                                    unitPrice: null,
                                    amount,
                                    payment: null,
                                    fromAccount: step.fromAccount,
                                    toAccount: step.toAccount,
                                    date: nowIso,
                                    note: step.note || "",
                                    createdAt: nowIso,
                                });
                                saved++;
                            } else if (step.type === "sale" || step.type === "expense") {
                                let items = Array.isArray(step.items) && step.items.length ? step.items.map((ln) => Object.assign({}, ln)) : null;
                                if (items && items.length === 1) {
                                    items[0].amount = amount;
                                } else if (items && items.length > 1) {
                                    // scale line amounts proportionally to new total
                                    const oldTotal = items.reduce((s, ln) => s + (Number(ln.amount) || 0), 0) || 1;
                                    items = items.map((ln) => Object.assign({}, ln, { amount: Math.round(((Number(ln.amount) || 0) / oldTotal) * amount * 100) / 100 }));
                                } else {
                                    items = [
                                        {
                                            category: step.category || (cats[step.type] && cats[step.type][0]) || "Other",
                                            item: step.item || step.type,
                                            qty: null,
                                            unitPrice: null,
                                            amount,
                                        },
                                    ];
                                }
                                if (amount <= 0) continue;
                                const record = {
                                    type: step.type,
                                    companyId: cid,
                                    category: items[0].category,
                                    item: items.length === 1 ? items[0].item : items.length + " items",
                                    qty: items.length === 1 ? items[0].qty : null,
                                    unitPrice: items.length === 1 ? items[0].unitPrice : null,
                                    amount,
                                    payment: step.payment || "cash",
                                    date: nowIso,
                                    note: step.note || "",
                                    createdAt: nowIso,
                                    items: items,
                                };
                                const newId = await dbAdd("transactions", record);
                                record.id = newId;
                                if (step.type === "sale") {
                                    await applyCostingInventoryForSale(record);
                                }
                                saved++;
                            }
                        }
                        closeTemplateModal();
                        if (saved) {
                            toast(saved + " transaction" + (saved === 1 ? "" : "s") + " recorded");
                            loadCostingProductNames(true).catch(() => {});
                            loadRecordedPosSaleIds(true).catch(() => {});
                            if (currentRoute() === "add" || currentRoute() === "home" || currentRoute() === "history") softRender();
                            else location.hash = "#/home";
                        } else {
                            toast("Nothing recorded — check amounts");
                        }
                    });
                    btnRow.appendChild(cancelBtn);
                    btnRow.appendChild(runBtn);
                    modal.appendChild(btnRow);
                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);
                }

                    function paintSteps() {
                        stepsHost.innerHTML = "";
                        if (!steps.length) {
                            stepsHost.appendChild(el("div", { class: "empty small" }, "No steps yet — add a sale, expense, or transfer below."));
                            return;
                        }
                        steps.forEach((step, idx) => {

                            const head = el("div", { class: "txrow-title" }, typeLab + " · " + (stepSummary(step) || "step " + (idx + 1)));
                            const amtInp = el("input", {

                                step: "0.01",
                                style: "max-width:120px",
                            });
                            amtInp.addEventListener("change", () => {
                                step.amount = parseFloat(amtInp.value) || 0;
                                if (Array.isArray(step.items) && step.items.length === 1) step.items[0].amount = step.amount;
                            });
                            const descInp = el("input", {
                                type: "text",
                                class: "finput",
                                value: step.item || "",
                                placeholder: "Description",
                            });
                            descInp.addEventListener("change", () => {
                                step.item = descInp.value.trim();
                                if (Array.isArray(step.items) && step.items.length === 1) step.items[0].item = step.item;
                            });
                            const upBtn = el("button", { type: "button", class: "reorder-btn" }, "▲");
                            const downBtn = el("button", { type: "button", class: "reorder-btn" }, "▼");
                            if (idx === 0) upBtn.setAttribute("disabled", "disabled");
                            if (idx === steps.length - 1) downBtn.setAttribute("disabled", "disabled");
                            upBtn.addEventListener("click", () => {
                                if (idx === 0) return;
                                const tmp = steps[idx - 1];
                                steps[idx - 1] = steps[idx];
                                steps[idx] = tmp;
                                paintSteps();
                            });
                            downBtn.addEventListener("click", () => {
                                if (idx === steps.length - 1) return;
                                const tmp = steps[idx + 1];
                                steps[idx + 1] = steps[idx];
                                steps[idx] = tmp;
                                paintSteps();
                            });
                            const delBtn = el("button", { type: "button", class: "chip-x" }, "×");
                            delBtn.addEventListener("click", () => {
                                steps.splice(idx, 1);
                                paintSteps();
                            });
                            const row = el("div", { class: "card", style: "padding:10px 12px;margin-bottom:8px" }, [
                                el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:6px" }, [
                                    el("div", { class: "presetrow-reorder" }, [upBtn, downBtn]),
                                    el("div", { style: "flex:1;min-width:0" }, head),
                                    delBtn,
                                ]),
                                el("div", { class: "frow" }, [
                                    el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Description"), descInp]),
                                    el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Amount"), amtInp]),
                                ]),
                            ]);
                            // Extra controls for transfer / payment
                            if (step.type === "transfer") {
                                const fromSel = el("select", { class: "finput" });
                                const toSel = el("select", { class: "finput" });
                                ["cash", "gcash", "bank", "receivable", "payable", "owner", "businessFunds"].forEach((a) => {
                                    const o1 = el("option", { value: a }, accountLabel(a));
                                    const o2 = el("option", { value: a }, accountLabel(a));
                                    if (a === step.fromAccount) o1.selected = true;
                                    if (a === step.toAccount) o2.selected = true;
                                    fromSel.appendChild(o1);
                                    toSel.appendChild(o2);
                                });
                                fromSel.addEventListener("change", () => (step.fromAccount = fromSel.value));
                                toSel.addEventListener("change", () => (step.toAccount = toSel.value));
                                row.appendChild(
                                    el("div", { class: "frow", style: "margin-top:6px" }, [
                                        el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "From"), fromSel]),
                                        el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "To"), toSel]),
                                    ]),
                                );
                            } else {
                                const paySel = el("select", { class: "finput" });
                                const pays = step.type === "sale" ? ["cash", "gcash", "bank", "receivable", "other"] : ["cash", "gcash", "bank", "payable", "other"];
                                pays.forEach((p) => {
                                    const o = el("option", { value: p }, paymentLabel(p));
                                    if ((step.payment || "cash") === p) o.selected = true;
                                    paySel.appendChild(o);
                                });
                                paySel.addEventListener("change", () => (step.payment = paySel.value));
                                const catSel = el("select", { class: "finput" });
                                (cats[step.type] || []).forEach((c) => {
                                    const o = el("option", { value: c }, c);
                                    if ((step.category || "") === c) o.selected = true;
                                    catSel.appendChild(o);
                                });
                                catSel.addEventListener("change", () => {
                                    step.category = catSel.value;
                                    if (Array.isArray(step.items) && step.items[0]) step.items[0].category = catSel.value;
                                });
                                row.appendChild(
                                    el("div", { class: "frow", style: "margin-top:6px" }, [
                                        el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Category"), catSel]),
                                        el("div", { class: "fcol" }, [el("label", { class: "flabel" }, "Payment"), paySel]),
                                    ]),
                                );
                            }
                            stepsHost.appendChild(row);
                        });
                    }
                    paintSteps();

                    // Add step builders
                    modal.appendChild(el("div", { class: "flabel" }, "Add step"));
                    const addRow = el("div", { class: "chiprow" });
                    function pushStep(step) {
                        steps.push(step);
                        paintSteps();
                    }
                    [
                        ["expense", "Expense"],
                        ["transfer", "Transfer"],
                        ["sale", "Sale"],
                    ].forEach(([type, lab]) => {
                        const chip = el("button", { type: "button", class: "chip" }, "+ " + lab);
                        chip.addEventListener("click", () => {
                            if (type === "transfer") {
                                pushStep({
                                    type: "transfer",
                                    fromAccount: "bank",
                                    toAccount: "gcash",
                                    item: "Transfer",
                                    amount: 0,
                                    note: "",
                                });
                            } else {
                                const cat = (cats[type] && cats[type][0]) || "Other";
                                pushStep({
                                    type: type,
                                    category: cat,
                                    item: lab,
                                    amount: 0,
                                    payment: "cash",
                                    note: "",
                                    items: [{ category: cat, item: lab, qty: null, unitPrice: null, amount: 0 }],
                                });
                            }
                        });
                        addRow.appendChild(chip);
                    });
                    modal.appendChild(addRow);

                    const btnRow = el("div", { class: "modal-btnrow" });
                    const cancelBtn = el("button", { type: "button", class: "bigbtn ghost" }, "Cancel");
                    cancelBtn.addEventListener("click", closeTemplateModal);
                    const saveBtn = el("button", { type: "button", class: "bigbtn sale" }, "Save pack");
                    saveBtn.addEventListener("click", async () => {
                        const name = nameInp.value.trim();
                        if (!name) {
                            toast("Enter a pack name");
                            return;
                        }
                        if (!steps.length) {
                            toast("Add at least one step");
                            return;
                        }
                        const cid = await getActiveCompanyId();
                        const existing = await companyTxTemplates();
                        const nextOrder = tpl && tpl.order != null ? tpl.order : existing.length ? Math.max(...existing.map((t) => (t.order != null ? t.order : 0))) + 1 : 0;
                        const record = {
                            companyId: cid,
                            name,
                            order: nextOrder,
                            createdAt: (tpl && tpl.createdAt) || new Date().toISOString(),
                            steps: steps.map((s) => Object.assign({}, s)),
                            // clear legacy single-type fields so templateSteps prefers steps[]
                            type: null,
                            item: null,
                            amount: steps.reduce((sum, s) => sum + (Number(s.amount) || 0), 0),
                        };
                        if (tpl && tpl.id != null) {
                            record.id = tpl.id;
                            await dbPut("txTemplates", record);
                        } else {
                            await dbAdd("txTemplates", record);
                        }
                        closeTemplateModal();
                        toast('Pack "' + name + '" saved');
                        if (typeof onSaved === "function") onSaved();
                        else softRender();
                    });
                    btnRow.appendChild(cancelBtn);
                    btnRow.appendChild(saveBtn);
                    modal.appendChild(btnRow);
                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);
                }

                /** Save whatever is currently on the Add form as a new single-step pack (or append to named pack). */
                async function saveCurrentAsTemplate(opts) {
                    opts = opts || {};
                    const type = App.addType;
                    const cid = await getActiveCompanyId();
                    if (cid == null) {
                        toast("No active company");
                        return;
                    }
                    let step = null;
                    if (type === "transfer") {
                        const amount = parseFloat(qs("#f-amount") ? qs("#f-amount").value : "") || opts.amount || 0;
                        const item = (qs("#f-item") ? qs("#f-item").value.trim() : "") || opts.defaultName || "Transfer";
                        const note = qs("#f-note") ? qs("#f-note").value.trim() : "";
                        step = {
                            type: "transfer",
                            fromAccount: App.transferFrom,
                            toAccount: App.transferTo,
                            item,
                            amount,
                            note,
                        };
                    } else {
                        let items = App.saleLines.slice();
                        if (!items.length) {
                            const item = qs("#ln-item") ? qs("#ln-item").value.trim() : "";
                            const amount = parseFloat(qs("#ln-amount") ? qs("#ln-amount").value : "") || 0;
                            if (item && amount > 0) {
                                items = [
                                    {
                                        category: App.selectedCategory,
                                        item,
                                        qty: parseFloat(qs("#ln-qty") ? qs("#ln-qty").value : "") || null,
                                        unitPrice: parseFloat(qs("#ln-price") ? qs("#ln-price").value : "") || null,
                                        amount,
                                    },
                                ];
                            }
                        }
                        if (!items.length) {
                            toast("Add at least one item before saving a template");
                            return;
                        }
                        const payChip = qs("#f-payment-row .chip.pay.active");
                        const payment = payChip ? payChip.dataset.value : "cash";
                        const note = qs("#f-note") ? qs("#f-note").value.trim() : "";
                        const total = items.reduce((s, ln) => s + (Number(ln.amount) || 0), 0);
                        step = {
                            type: type,
                            category: items[0].category || App.selectedCategory,
                            item: items.length === 1 ? items[0].item : items.length + " items",
                            amount: total,
                            payment,
                            note,
                            items: items.map((ln) => ({
                                category: ln.category,
                                item: ln.item,
                                qty: ln.qty,
                                unitPrice: ln.unitPrice,
                                amount: ln.amount,
                            })),
                        };
                    }

                    // Offer: new pack vs add step to existing pack
                    const packs = await companyTxTemplates();
                    const choice = prompt(
                        "Save as:\n• Type a NEW pack name, or\n• Type exact name of an existing pack to ADD this step\n\nExisting: " + (packs.length ? packs.map((p) => p.name).join(", ") : "(none)"),
                        opts.defaultName || step.item || "Cut-off",
                    );
                    if (choice == null) return;
                    const name = choice.trim();
                    if (!name) {
                        toast("Name required");
                        return;
                    }
                    const existing = packs.find((p) => (p.name || "").toLowerCase() === name.toLowerCase());
                    if (existing) {
                        const steps = templateSteps(existing);
                        steps.push(step);
                        const updated = Object.assign({}, existing, {
                            steps,
                            type: null,
                            amount: steps.reduce((s, x) => s + (Number(x.amount) || 0), 0),
                        });
                        await dbPut("txTemplates", updated);
                        toast('Added step to "' + existing.name + '" (' + steps.length + " steps)");
                    } else {
                        const nextOrder = packs.length ? Math.max(...packs.map((t) => (t.order != null ? t.order : 0))) + 1 : 0;
                        await dbAdd("txTemplates", {
                            companyId: cid,
                            name,
                            order: nextOrder,
                            createdAt: new Date().toISOString(),
                            steps: [step],
                            amount: Number(step.amount) || 0,
                        });
                        toast('Pack "' + name + '" created');
                    }
                    softRender();
                }

                /* ---------- ADD ---------- */
                function lineSubtotal() {
                    return App.saleLines.reduce((s, ln) => s + (Number(ln.amount) || 0), 0);
                }

                async function renderAdd() {
                    const company = await getActiveCompany();
                    const cats = company ? company.categories : { sale: DEFAULT_SALE_CATEGORIES, expense: DEFAULT_EXPENSE_CATEGORIES };
                    const presetsAll = await companyPresets();
                    const isTransfer = App.addType === "transfer";

                    }

                    const wrap = el("div", { class: "page" });

                    const tabs = el("div", { class: "tabbar" }, [
                        el(

                        el(

                                    App.selectedCategory = null;
                                    App.saleLines = [];
                                    render();
                                },
                            },
                            "Expense",
                        ),
                        el(
                            "button",
                            {
                                class: "tab" + (App.addType === "transfer" ? " active transfer" : ""),
                                onclick: () => {
                                    App.addType = "transfer";
                                    render();
                                },
                            },
                            "Transfer",
                        ),
                    ]);
                    wrap.appendChild(tabs);

                    const form = el("form", { class: "card form" });

                    if (isTransfer) {
                        form.appendChild(el("label", { class: "flabel" }, "From"));
                        form.appendChild(
                            buildAccountChips(App.transferFrom, (v) => {
                                App.transferFrom = v;
                            }),
                        );
                        form.appendChild(el("label", { class: "flabel" }, "To"));
                        form.appendChild(
                            buildAccountChips(App.transferTo, (v) => {
                                App.transferTo = v;
                            }),
                        );

                        const itemLabel = "Description (optional)";
                        form.appendChild(el("label", { class: "flabel" }, itemLabel));
                        form.appendChild(el("input", { id: "f-item", type: "text", class: "finput", placeholder: "e.g. Cashed out for restock", autocomplete: "off" }));

                        form.appendChild(el("label", { class: "flabel" }, "Amount"));
                        form.appendChild(
                            el("input", { id: "f-amount", type: "number", class: "finput famount", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal", required: "required" }),
                        );

                        form.appendChild(el("label", { class: "flabel" }, "Date & Time"));
                        form.appendChild(el("input", { id: "f-date", type: "datetime-local", class: "finput", value: toLocalInputValue(new Date()) }));

                        form.appendChild(el("label", { class: "flabel" }, "Note (optional)"));
                        form.appendChild(el("input", { id: "f-note", type: "text", class: "finput", placeholder: "Optional note..." }));

                        const saveBtn = el("button", { type: "submit", class: "bigbtn transfer" }, "Save Transfer");
                        form.appendChild(saveBtn);
                        /* const saveTplBtn = el("button", { type: "button", class: "bigbtn ghost small2" }, "Save into cut-off pack");
                        saveTplBtn.addEventListener("click", () => {
                            const def = (qs("#f-item") && qs("#f-item").value.trim()) || accountLabel(App.transferFrom) + " → " + accountLabel(App.transferTo);
                            saveCurrentAsTemplate({ defaultName: def });
                        });
                        form.appendChild(saveTplBtn); */

                        form.addEventListener("submit", async (e) => {
                            e.preventDefault();
                            const amount = parseFloat(qs("#f-amount").value);
                            if (!amount || amount <= 0) {
                                toast("Please enter a valid amount");
                                return;
                            }
                            if (App.transferFrom === App.transferTo) {
                                toast("Choose two different accounts");
                                return;
                            }
                            const item = qs("#f-item").value.trim() || `${accountLabel(App.transferFrom)} \u2192 ${accountLabel(App.transferTo)}`;
                            const record = {
                                type: "transfer",
                                companyId: await getActiveCompanyId(),
                                category: "Transfer",
                                item,
                                qty: null,
                                unitPrice: null,
                                amount,
                                payment: null,
                                fromAccount: App.transferFrom,
                                toAccount: App.transferTo,
                                date: new Date(qs("#f-date").value || Date.now()).toISOString(),
                                note: qs("#f-note").value.trim(),
                                createdAt: new Date().toISOString(),
                            };
                            await dbAdd("transactions", record);
                            toast("Transfer saved");
                            render();
                        });

                        wrap.appendChild(form);
                        return wrap;
                    }

                    /* ----- Sale / Expense: multi-line item builder ----- */
                    const isSale = App.addType === "sale";

                    // Already-added lines for this transaction
                    if (App.saleLines.length) {
                        form.appendChild(el("label", { class: "flabel" }, `Items (${App.saleLines.length})`));
                        const list = el("div", { class: "linelist" });
                        App.saleLines.forEach((ln, idx) => {
                            const sub = `${ln.category}${ln.qty ? " · qty " + ln.qty : ""}`;
                            const missingCosting = isSale && !hasCostingProduct(ln.item);
                            const titleKids = missingCosting ? [document.createTextNode(ln.item + " "), el("span", { class: "badge-warn" }, "no Costing")] : [ln.item];
                            const lineRow = el("div", { class: "linerow" }, [
                                el("div", { class: "linerow-main" }, [
                                    el("div", { class: "linerow-title" }, titleKids),
                                    el("div", { class: "linerow-sub" }, sub + (missingCosting ? " · no stock recipe" : "")),
                                ]),
                                el("div", { class: "linerow-amt" }, fmtPeso(ln.amount)),
                                el(
                                    "button",
                                    {
                                        type: "button",
                                        class: "chip-x",
                                        onclick: () => {
                                            App.saleLines.splice(idx, 1);
                                            render();
                                        },
                                    },
                                    "×",
                                ),
                            ]);
                            list.appendChild(lineRow);
                        });
                        form.appendChild(list);
                    }

                    // Line-entry sub-form: builds ONE line item, then "Add Item" pushes it into App.saleLines
                    const entry = el("div", { class: "lineentry" });

                    const chipRow = el("div", { class: "chiprow" });
                    cats[App.addType].forEach((c) => {
                        const chip = el("button", { type: "button", class: "chip" + (c === App.selectedCategory ? " active" : "") }, c);
                        chip.addEventListener("click", () => {
                            App.selectedCategory = c;
                            render();
                        });
                        chipRow.appendChild(chip);
                    });
                    entry.appendChild(el("label", { class: "flabel" }, "Category"));
                    entry.appendChild(chipRow);

                    if (isSale) {
                        await loadCostingProductNames(false);
                        const presets = sortPresets(presetsAll.filter((p) => p.type === "sale" && p.category === App.selectedCategory));
                        if (presets.length) {
                            entry.appendChild(el("label", { class: "flabel" }, "Search items"));

                            function applyPreset(p) {
                                qs("#ln-item").value = p.name;
                                qs("#ln-price").value = p.price;
                                qs("#ln-qty").value = qs("#ln-qty").value || 1;
                                recalcLineAmount();
                            }

                            const searchWrap = el("div", { class: "preset-search-wrap" });
                            const searchInp = el("input", {
                                type: "search",
                                class: "finput",
                                placeholder: "Search " + presets.length + " items…",
                                autocomplete: "off",
                                id: "preset-search",
                            });
                            const suggest = el("div", { class: "preset-suggest", id: "preset-suggest" });
                            searchWrap.appendChild(searchInp);
                            searchWrap.appendChild(suggest);
                            entry.appendChild(searchWrap);

                            let activeIdx = -1;
                            function filteredPresets(q) {
                                const key = (q || "").toLowerCase().trim();
                                if (!key) return presets.slice(0, 40);
                                return presets.filter((p) => (p.name || "").toLowerCase().includes(key)).slice(0, 40);
                            }
                            function renderSuggest(q, show) {
                                const list = filteredPresets(q);
                                suggest.innerHTML = "";
                                activeIdx = -1;
                                if (!show) {
                                    suggest.classList.remove("open");
                                    return;
                                }
                                if (!list.length) {
                                    suggest.appendChild(el("div", { class: "preset-suggest-empty" }, "No matching items"));
                                    suggest.classList.add("open");
                                    return;
                                }
                                list.forEach((p, idx) => {
                                    const missing = !hasCostingProduct(p.name);
                                    const leftKids = [p.name];
                                    if (missing) leftKids.push(el("span", { class: "badge-warn" }, "no Costing"));
                                    const btn = el("button", { type: "button", class: "preset-suggest-item" }, [el("span", {}, leftKids), el("span", { class: "ps-price" }, fmtPeso(p.price))]);
                                    if (missing) btn.title = "Not in Costing products — no auto stock deduct";
                                    btn.addEventListener("mousedown", (ev) => {
                                        ev.preventDefault();
                                        applyPreset(p);
                                        searchInp.value = "";
                                        renderSuggest("", false);
                                    });
                                    suggest.appendChild(btn);
                                });
                                suggest.classList.add("open");
                            }
                            searchInp.addEventListener("focus", () => renderSuggest(searchInp.value, true));
                            searchInp.addEventListener("input", () => renderSuggest(searchInp.value, true));
                            searchInp.addEventListener("blur", () => setTimeout(() => renderSuggest("", false), 160));
                            searchInp.addEventListener("keydown", (ev) => {
                                const items = [...suggest.querySelectorAll(".preset-suggest-item")];
                                const list = filteredPresets(searchInp.value);
                                if (ev.key === "ArrowDown") {
                                    ev.preventDefault();
                                    if (!suggest.classList.contains("open")) renderSuggest(searchInp.value, true);
                                    activeIdx = Math.min(items.length - 1, activeIdx + 1);
                                    items.forEach((b, bi) => b.classList.toggle("active", bi === activeIdx));
                                    if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: "nearest" });
                                } else if (ev.key === "ArrowUp") {
                                    ev.preventDefault();
                                    activeIdx = Math.max(0, activeIdx - 1);
                                    items.forEach((b, bi) => b.classList.toggle("active", bi === activeIdx));
                                    if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: "nearest" });
                                } else if (ev.key === "Enter") {
                                    const pick = activeIdx >= 0 ? list[activeIdx] : list[0];
                                    if (pick) {
                                        ev.preventDefault();
                                        applyPreset(pick);
                                        searchInp.value = "";
                                        renderSuggest("", false);
                                    }
                                } else if (ev.key === "Escape") {
                                    renderSuggest("", false);
                                    searchInp.blur();
                                }
                            });
                        }
                    }

                    entry.appendChild(el("label", { class: "flabel" }, isSale ? "Item / Service" : "Description"));
                    entry.appendChild(
                        el("input", {
                            id: "ln-item",
                            type: "text",
                            class: "finput",
                            placeholder: isSale ? "e.g. Photocopy, Used shirt..." : "e.g. Restock ballpens",
                            autocomplete: "off",
                        }),
                    );

                    const row = el("div", { class: "frow" });
                    const qtyBlock = el("div", { class: "fcol" }, [
                        el("label", { class: "flabel" }, "Qty"),
                        el("div", { class: "stepper" }, [
                            el(
                                "button",
                                {
                                    type: "button",
                                    class: "step-btn",
                                    onclick: (e) => {
                                        e.preventDefault();
                                        stepLineQty(-1);
                                    },
                                },
                                "−",
                            ),
                            el("input", { id: "ln-qty", type: "number", class: "finput steppernum", value: "1", min: "0", step: "any", oninput: recalcLineAmount }),
                            el(
                                "button",
                                {
                                    type: "button",
                                    class: "step-btn",
                                    onclick: (e) => {
                                        e.preventDefault();
                                        stepLineQty(1);
                                    },
                                },
                                "+",
                            ),
                        ]),
                    ]);
                    const priceBlock = el("div", { class: "fcol" }, [
                        el("label", { class: "flabel" }, "Unit Price"),
                        el("input", { id: "ln-price", type: "number", class: "finput", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal", oninput: recalcLineAmount }),
                    ]);
                    row.appendChild(qtyBlock);
                    row.appendChild(priceBlock);
                    entry.appendChild(row);

                    entry.appendChild(el("label", { class: "flabel" }, "Line Amount"));
                    entry.appendChild(el("input", { id: "ln-amount", type: "number", class: "finput famount", placeholder: "0.00", min: "0", step: "0.01", inputmode: "decimal" }));

                    const addLineBtn = el("button", { type: "button", class: "bigbtn ghost small2" }, "+ Add Item to Transaction");
                    addLineBtn.addEventListener("click", () => {
                        const item = qs("#ln-item").value.trim();
                        const amount = parseFloat(qs("#ln-amount").value);
                        if (!item) {
                            toast("Enter an item or description");
                            return;
                        }
                        if (!amount || amount <= 0) {
                            toast("Enter a valid line amount");
                            return;
                        }
                        App.saleLines.push({
                            category: App.selectedCategory,
                            item,
                            qty: parseFloat(qs("#ln-qty").value) || null,
                            unitPrice: parseFloat(qs("#ln-price").value) || null,
                            amount,
                        });
                        render();
                        toast("Item added");
                    });
                    entry.appendChild(addLineBtn);
                    form.appendChild(entry);

                    // Totals block — subtotal is the sum of all added lines; total mirrors it (no fees/discounts modeled yet)
                    const subtotal = lineSubtotal();
                    const totals = el("div", { class: "totalsblock" });
                    totals.appendChild(el("div", { class: "totalsrow" }, [el("span", {}, "Subtotal"), el("span", { class: "val" }, fmtPeso(subtotal))]));
                    totals.appendChild(el("div", { class: "totalsrow grand" }, [el("span", {}, "Total"), el("span", { class: "val", id: "totalDisplay" }, fmtPeso(subtotal))]));
                    form.appendChild(totals);

                    let payRow = null;
                    form.appendChild(el("label", { class: "flabel" }, "Payment Method"));
                    payRow = el("div", { class: "chiprow", id: "f-payment-row" });
                    const paymentOptions = isSale ? ["cash", "gcash", "bank", "receivable", "other"] : ["cash", "gcash", "bank", "payable", "other"];
                    paymentOptions.forEach((p, i) => {
                        const chip = el("button", { type: "button", class: "chip pay" + (i === 0 ? " active" : "") }, paymentLabel(p));
                        chip.dataset.value = p;
                        chip.addEventListener("click", () => {
                            qsa(".chip.pay", payRow).forEach((c) => c.classList.remove("active"));
                            chip.classList.add("active");
                            updateChangeDue();
                            // Amount tendered only applies to cash-like payments
                            const tenderWrap = qs("#f-tendered-wrap");
                            if (tenderWrap) tenderWrap.style.display = p === "receivable" || p === "payable" ? "none" : "";
                        });
                        payRow.appendChild(chip);
                    });
                    form.appendChild(payRow);

                    // Change computation (most relevant for sales paid in cash; hidden for receivable)
                    let changeRow = null;
                    if (isSale) {
                        const tenderWrap = el("div", { id: "f-tendered-wrap" });
                        tenderWrap.appendChild(el("label", { class: "flabel" }, "Amount Tendered (optional)"));
                        const tenderedInp = el("input", {
                            id: "f-tendered",
                            type: "number",
                            class: "finput",
                            placeholder: "0.00",
                            min: "0",
                            step: "0.01",
                            inputmode: "decimal",
                            oninput: updateChangeDue,
                        });
                        tenderWrap.appendChild(tenderedInp);
                        changeRow = el("div", { class: "totalsrow change", id: "changeRow" }, [el("span", {}, "Change Due"), el("span", { class: "val", id: "changeDisplay" }, fmtPeso(0))]);
                        tenderWrap.appendChild(changeRow);
                        form.appendChild(tenderWrap);
                    }

                    function updateChangeDue() {
                        if (!isSale) return;
                        const total = lineSubtotal();
                        const tendered = parseFloat(qs("#f-tendered") ? qs("#f-tendered").value : "") || 0;
                        const changeDisplay = qs("#changeDisplay");
                        const row = qs("#changeRow");
                        if (!changeDisplay || !row) return;
                        const diff = tendered - total;
                        if (!tendered) {
                            changeDisplay.textContent = fmtPeso(0);
                            row.classList.remove("short");
                        } else if (diff < 0) {
                            changeDisplay.textContent = "Short " + fmtPeso(Math.abs(diff));
                            row.classList.add("short");
                        } else {
                            changeDisplay.textContent = fmtPeso(diff);
                            row.classList.remove("short");
                        }
                    }

                    form.appendChild(el("label", { class: "flabel" }, "Date & Time"));
                    form.appendChild(el("input", { id: "f-date", type: "datetime-local", class: "finput", value: toLocalInputValue(new Date()) }));

                    form.appendChild(el("label", { class: "flabel" }, "Note (optional)"));
                    form.appendChild(el("input", { id: "f-note", type: "text", class: "finput", placeholder: "Optional note..." }));

                    const saveLabel = isSale ? "Save Sale" : "Save Expense";
                    const saveBtn = el("button", { type: "submit", class: "bigbtn " + App.addType }, saveLabel);
                    form.appendChild(saveBtn);
                    /* const saveTplBtn = el("button", { type: "button", class: "bigbtn ghost small2" }, "Save into cut-off pack");
                    saveTplBtn.addEventListener("click", () => {
                        let def = "";
                        if (App.saleLines.length === 1) def = App.saleLines[0].item || "";
                        else if (App.saleLines.length > 1) def = App.saleLines.length + " items";
                        else if (qs("#ln-item")) def = qs("#ln-item").value.trim();
                        saveCurrentAsTemplate({ defaultName: def || (isSale ? "Sale template" : "Expense template") });
                    });
                    form.appendChild(saveTplBtn); */

                    form.addEventListener("submit", async (e) => {
                        e.preventDefault();

                        // If the person filled out the line-entry fields but forgot to tap "Add Item",
                        // fold that pending line in automatically so it isn't silently dropped.
                        const pendingItem = qs("#ln-item").value.trim();
                        const pendingAmount = parseFloat(qs("#ln-amount").value);
                        if (pendingItem && pendingAmount > 0) {
                            App.saleLines.push({
                                category: App.selectedCategory,
                                item: pendingItem,
                                qty: parseFloat(qs("#ln-qty").value) || null,
                                unitPrice: parseFloat(qs("#ln-price").value) || null,
                                amount: pendingAmount,
                            });
                        }

                        if (App.saleLines.length === 0) {
                            toast("Add at least one item");
                            return;
                        }

                        const subtotal = lineSubtotal();
                        const total = subtotal; // no taxes/discounts modeled — total mirrors subtotal
                        const payChip = qs(".chip.pay.active", payRow);
                        const payment = payChip ? payChip.dataset.value : "cash";

                        let tendered = null,
                            change = null;
                        if (isSale) {
                            const tVal = parseFloat(qs("#f-tendered").value);
                            if (tVal > 0) {
                                tendered = tVal;
                                change = +(tVal - total).toFixed(2);
                            }
                        }

                        // Keep top-level item/category/qty/unitPrice populated from the first line for
                        // backward compatibility with anything reading the flat fields directly.
                        const first = App.saleLines[0];
                        const record = {
                            type: App.addType,
                            companyId: await getActiveCompanyId(),
                            category: App.saleLines.length === 1 ? first.category : "Multiple",
                            item: App.saleLines.length === 1 ? first.item : App.saleLines.map((l) => l.item).join(", "),
                            qty: App.saleLines.length === 1 ? first.qty : null,
                            unitPrice: App.saleLines.length === 1 ? first.unitPrice : null,
                            items: App.saleLines.slice(),
                            subtotal,
                            amount: total,
                            payment,
                            tendered,
                            change,
                            fromAccount: null,
                            toAccount: null,
                            date: new Date(qs("#f-date").value || Date.now()).toISOString(),
                            note: qs("#f-note").value.trim(),
                            createdAt: new Date().toISOString(),
                        };
                        if (isSale && isCostingLinkEnabled()) {
                            await loadCostingProductNames(false);
                            const missingNames = [...new Set(App.saleLines.map((l) => l.item).filter((n) => n && !hasCostingProduct(n)))];
                            if (missingNames.length) {
                                const ok = confirm("These items are not in Costing products (no auto stock deduct):\n\n• " + missingNames.join("\n• ") + "\n\nSave sale anyway?");
                                if (!ok) return;
                            }
                        }

                        const newId = await dbAdd("transactions", record);
                        record.id = newId;
                        App.saleLines = [];
                        if (isSale) {
                            const inv = await applyCostingInventoryForSale(record);
                            const base = "Sale saved";
                            let msg = inv.message || "";
                            if (inv.deducted > 0 && !msg) msg = "Stock −" + inv.deducted;
                            toast(msg ? base + " · " + msg : base);
                            // refresh name + recorded caches
                            loadCostingProductNames(true).catch(() => {});
                            loadRecordedPosSaleIds(true).catch(() => {});
                        } else {
                            toast("Expense saved");
                        }
                        render();
                    });

                    wrap.appendChild(form);
                    return wrap;
                }

                function stepLineQty(delta) {
                    const inp = qs("#ln-qty");
                    const v = Math.max(0, (parseFloat(inp.value) || 0) + delta);
                    inp.value = v;
                    recalcLineAmount();
                }
                function recalcLineAmount() {
                    const qty = parseFloat(qs("#ln-qty") ? qs("#ln-qty").value : "") || 0;
                    const price = parseFloat(qs("#ln-price") ? qs("#ln-price").value : "") || 0;
                    if (qty && price) {
                        qs("#ln-amount").value = (qty * price).toFixed(2);
                    }
                }

                /* ---------- HISTORY ---------- */
                async function renderHistory() {
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "History"));

                    const filterCard = el("div", { class: "card filters" });
                    const rangeRow = el("div", { class: "chiprow" });
                    [
                        ["today", "Today"],
                        ["week", "This Week"],
                        ["month", "This Month"],
                        ["all", "All Time"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.historyFilters.range === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.historyFilters.range = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    filterCard.appendChild(rangeRow);

                    const typeRow = el("div", { class: "chiprow" });
                    [
                        ["all", "All"],
                        ["sale", "Sales"],
                        ["expense", "Expenses"],
                        ["transfer", "Transfers"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.historyFilters.type === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.historyFilters.type = val;
                            softRender();
                        });
                        typeRow.appendChild(chip);
                    });
                    filterCard.appendChild(typeRow);

                    const invRow = el("div", { class: "chiprow" });
                    [
                        ["all", "All"],
                        ["no_costing", "No Costing"],
                        ["not_in_inventory", "Not in inventory"],
                        ["receivable", "Receivable"],
                        ["collected", "Collected"],
                        ["payable", "Payable"],
                        ["settled", "Settled AP"],
                        ["excl_forecast", "Excl. forecast"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.historyFilters.inventory === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.historyFilters.inventory = val;
                            // Sale-only filters force type=sale; payable filters force type=expense
                            if (val === "payable" || val === "settled") {
                                if (App.historyFilters.type !== "expense") App.historyFilters.type = "expense";
                            } else if (val !== "all" && App.historyFilters.type !== "sale") {
                                App.historyFilters.type = "sale";
                            }
                            softRender();
                        });
                        invRow.appendChild(chip);
                    });
                    filterCard.appendChild(invRow);

                    const search = el("input", { type: "text", class: "finput", placeholder: "Search item or note...", value: App.historyFilters.search });
                    search.addEventListener("input", (e) => {
                        App.historyFilters.search = e.target.value;
                        renderHistoryList();
                    });
                    filterCard.appendChild(search);

                    wrap.appendChild(filterCard);

                    const listHost = el("div", { id: "historyList" });
                    wrap.appendChild(listHost);

                    async function renderHistoryList() {
                        listHost.innerHTML = "";
                        await Promise.all([loadRecordedPosSaleIds(false), loadCostingProductNames(false)]);
                        let txs = await allTx();
                        const now = new Date();
                        const f = App.historyFilters;
                        if (f.range === "today") txs = txs.filter((t) => inRange(t.date, startOfDay(now), endOfDay(now)));
                        else if (f.range === "week") txs = txs.filter((t) => inRange(t.date, startOfWeek(now), endOfDay(now)));
                        else if (f.range === "month") txs = txs.filter((t) => inRange(t.date, startOfMonth(now), endOfDay(now)));
                        if (f.type !== "all") txs = txs.filter((t) => t.type === f.type);
                        if (f.inventory === "no_costing") {
                            txs = txs.filter((t) => {
                                if (t.type !== "sale") return false;
                                return txLines(t).some((ln) => ln.item && !hasCostingProduct(ln.item));
                            });
                        } else if (f.inventory === "not_in_inventory") {
                            txs = txs.filter((t) => t.type === "sale" && isSaleRecordedInInventory(t) === false);
                        } else if (f.inventory === "receivable") {
                            // Outstanding credit sales (payment=receivable, not yet marked paid)
                            txs = txs.filter((t) => t.type === "sale" && t.payment === "receivable" && !t.collectedAt);
                        } else if (f.inventory === "collected") {
                            // Receivable sales that were later marked as paid
                            txs = txs.filter((t) => t.type === "sale" && t.payment === "receivable" && !!t.collectedAt);
                        } else if (f.inventory === "payable") {
                            txs = txs.filter((t) => t.type === "expense" && t.payment === "payable" && !t.settledAt);
                        } else if (f.inventory === "settled") {
                            txs = txs.filter((t) => t.type === "expense" && t.payment === "payable" && !!t.settledAt);
                        } else if (f.inventory === "excl_forecast") {
                            txs = txs.filter((t) => t.type === "sale" && isExcludedFromForecast(t));
                        }
                        if (f.search) {
                            const s = f.search.toLowerCase();
                            txs = txs.filter((t) => (t.item || "").toLowerCase().includes(s) || (t.note || "").toLowerCase().includes(s) || (t.category || "").toLowerCase().includes(s));
                        }
                        txs.sort((a, b) => new Date(b.date) - new Date(a.date));

                        if (txs.length === 0) {
                            const emptySub =
                                f.inventory === "no_costing"
                                    ? "No sales with unknown Costing product names in this range."
                                    : f.inventory === "not_in_inventory"
                                      ? "All sales in this range are already recorded in inventory."
                                      : f.inventory === "receivable"
                                        ? "No outstanding receivable sales in this range."
                                        : f.inventory === "collected"
                                          ? "No collected receivable sales in this range."
                                          : f.inventory === "payable"
                                            ? "No open accounts-payable expenses in this range."
                                            : f.inventory === "settled"
                                              ? "No settled payable expenses in this range."
                                              : f.inventory === "excl_forecast"
                                                ? "No sales marked “exclude from Forecast” in this range."
                                                : "Try a different filter or date range.";
                            listHost.appendChild(el("div", { class: "empty" }, [el("div", { class: "empty-title" }, "No transactions found"), el("div", { class: "empty-sub" }, emptySub)]));
                            return;
                        }

                        let lastHeader = null;
                        let periodTotal = 0;
                        txs.forEach((t) => {
                            if (t.type === "sale") periodTotal += t.amount;
                            else if (t.type === "expense") periodTotal -= t.amount;
                        });
                        listHost.appendChild(
                            el("div", { class: "periodtotal" }, [
                                el("span", {}, `${txs.length} transaction${txs.length === 1 ? "" : "s"}`),
                                el("span", { class: periodTotal >= 0 ? "sales" : "expenses" }, (periodTotal >= 0 ? "+" : "") + fmtPeso(periodTotal)),
                            ]),
                        );

                        txs.forEach((t) => {
                            const header = fmtDateHeader(t.date);
                            if (header !== lastHeader) {
                                listHost.appendChild(el("div", { class: "daysep" }, header));
                                lastHeader = header;
                            }
                            listHost.appendChild(txRow(t));
                        });
                    }

                    await renderHistoryList();
                    return wrap;
                }

                /* ---------- Edit / Delete Modal ---------- */
                async function openEditModal(id) {
                    const t = await dbGet("transactions", id);
                    if (!t) return;
                    const isTransfer = t.type === "transfer";
                    const lines = txLines(t);
                    const overlay = el("div", { class: "overlay" });
                    const modal = el("div", { class: "modal" });

                    const titleMap = { sale: "Edit Sale", expense: "Edit Expense", transfer: "Edit Transfer" };
                    modal.appendChild(el("div", { class: "modal-title" }, titleMap[t.type] || "Edit Transaction"));

                    // Line-item breakdown — item names are editable so you can align them with Costing products
                    let lineNameInputs = [];
                    if (!isTransfer && lines.length) {
                        modal.appendChild(el("label", { class: "flabel" }, `Items (${lines.length}) — edit names to match Costing`));
                        const list = el("div", { class: "linelist" });

                            const sub = `${ln.category}${ln.qty ? " · qty " + ln.qty : ""}`;

                                    el("div", { class: "linerow-main", style: "flex:1 1 140px" }, [nameInp, el("div", { class: "linerow-sub" }, sub)]),
                                    el("div", { class: "linerow-amt" }, fmtPeso(ln.amount)),
                                ]),
                            );
                        });
                        modal.appendChild(list);
                        if (lines.length > 1) {
                            modal.appendChild(el("div", { class: "totalsrow" }, [el("span", {}, "Subtotal"), el("span", { class: "val" }, fmtPeso(t.subtotal != null ? t.subtotal : t.amount))]));
                        }
                    } else if (!isTransfer) {
                        modal.appendChild(el("label", { class: "flabel" }, t.type === "sale" ? "Item / Service" : "Description"));
                        const itemInp0 = el("input", { type: "text", class: "finput", value: t.item });

                        modal.appendChild(itemInp0);
                    }

                    modal.appendChild(el("label", { class: "flabel" }, isTransfer ? "Description" : "Total Amount"));
                    const amtInp = el("input", { type: "number", class: "finput", value: t.amount, min: "0", step: "0.01" });
                    if (isTransfer) {

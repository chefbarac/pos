                            toast("Enter a valid line amount");
                            return;
                        }
                        App.saleLines.push({
                            category: App.selectedCategory,
                            item,
                            qty: parseFloat(qs("#ln-qty").value) || null,
                            unitPrice: parseFloat(qs("#ln-price").value) || null,
                            amount,
                        });
                        render();
                        toast("Item added");
                    });
                    entry.appendChild(addLineBtn);
                    form.appendChild(entry);

                    // Totals block — subtotal is the sum of all added lines; total mirrors it (no fees/discounts modeled yet)
                    const subtotal = lineSubtotal();
                    const totals = el("div", { class: "totalsblock" });
                    totals.appendChild(el("div", { class: "totalsrow" }, [el("span", {}, "Subtotal"), el("span", { class: "val" }, fmtPeso(subtotal))]));
                    totals.appendChild(el("div", { class: "totalsrow grand" }, [el("span", {}, "Total"), el("span", { class: "val", id: "totalDisplay" }, fmtPeso(subtotal))]));
                    form.appendChild(totals);

                    let payRow = null;
                    form.appendChild(el("label", { class: "flabel" }, "Payment Method"));
                    payRow = el("div", { class: "chiprow", id: "f-payment-row" });
                    ["cash", "gcash", "bank", "other"].forEach((p, i) => {
                        const chip = el("button", { type: "button", class: "chip pay" + (i === 0 ? " active" : "") }, paymentLabel(p));
                        chip.dataset.value = p;
                        chip.addEventListener("click", () => {
                            qsa(".chip.pay", payRow).forEach((c) => c.classList.remove("active"));
                            chip.classList.add("active");
                            updateChangeDue();
                        });
                        payRow.appendChild(chip);
                    });
                    form.appendChild(payRow);

                    // Change computation (most relevant for sales, but useful whenever cash physically changes hands)
                    let changeRow = null;
                    if (isSale) {
                        form.appendChild(el("label", { class: "flabel" }, "Amount Tendered (optional)"));
                        const tenderedInp = el("input", {
                            id: "f-tendered",
                            type: "number",
                            class: "finput",
                            placeholder: "0.00",
                            min: "0",
                            step: "0.01",
                            inputmode: "decimal",
                            oninput: updateChangeDue,
                        });
                        form.appendChild(tenderedInp);

                        changeRow = el("div", { class: "totalsrow change", id: "changeRow" }, [el("span", {}, "Change Due"), el("span", { class: "val", id: "changeDisplay" }, fmtPeso(0))]);
                        form.appendChild(changeRow);
                    }

                    function updateChangeDue() {
                        if (!isSale) return;
                        const total = lineSubtotal();
                        const tendered = parseFloat(qs("#f-tendered") ? qs("#f-tendered").value : "") || 0;
                        const changeDisplay = qs("#changeDisplay");
                        const row = qs("#changeRow");
                        if (!changeDisplay || !row) return;
                        const diff = tendered - total;
                        if (!tendered) {
                            changeDisplay.textContent = fmtPeso(0);
                            row.classList.remove("short");
                        } else if (diff < 0) {
                            changeDisplay.textContent = "Short " + fmtPeso(Math.abs(diff));
                            row.classList.add("short");
                        } else {
                            changeDisplay.textContent = fmtPeso(diff);
                            row.classList.remove("short");
                        }
                    }

                    form.appendChild(el("label", { class: "flabel" }, "Date & Time"));
                    form.appendChild(el("input", { id: "f-date", type: "datetime-local", class: "finput", value: toLocalInputValue(new Date()) }));

                    form.appendChild(el("label", { class: "flabel" }, "Note (optional)"));
                    form.appendChild(el("input", { id: "f-note", type: "text", class: "finput", placeholder: "Optional note..." }));

                    const saveLabel = isSale ? "Save Sale" : "Save Expense";
                    const saveBtn = el("button", { type: "submit", class: "bigbtn " + App.addType }, saveLabel);
                    form.appendChild(saveBtn);

                    form.addEventListener("submit", async (e) => {
                        e.preventDefault();

                        // If the person filled out the line-entry fields but forgot to tap "Add Item",
                        // fold that pending line in automatically so it isn't silently dropped.
                        const pendingItem = qs("#ln-item").value.trim();
                        const pendingAmount = parseFloat(qs("#ln-amount").value);
                        if (pendingItem && pendingAmount > 0) {
                            App.saleLines.push({
                                category: App.selectedCategory,
                                item: pendingItem,
                                qty: parseFloat(qs("#ln-qty").value) || null,
                                unitPrice: parseFloat(qs("#ln-price").value) || null,
                                amount: pendingAmount,
                            });
                        }

                        if (App.saleLines.length === 0) {
                            toast("Add at least one item");
                            return;
                        }

                        const subtotal = lineSubtotal();
                        const total = subtotal; // no taxes/discounts modeled — total mirrors subtotal
                        const payChip = qs(".chip.pay.active", payRow);
                        const payment = payChip ? payChip.dataset.value : "cash";

                        let tendered = null,
                            change = null;
                        if (isSale) {
                            const tVal = parseFloat(qs("#f-tendered").value);
                            if (tVal > 0) {
                                tendered = tVal;
                                change = +(tVal - total).toFixed(2);
                            }
                        }

                        // Keep top-level item/category/qty/unitPrice populated from the first line for
                        // backward compatibility with anything reading the flat fields directly.
                        const first = App.saleLines[0];
                        const record = {
                            type: App.addType,
                            companyId: await getActiveCompanyId(),
                            category: App.saleLines.length === 1 ? first.category : "Multiple",
                            item: App.saleLines.length === 1 ? first.item : App.saleLines.map((l) => l.item).join(", "),
                            qty: App.saleLines.length === 1 ? first.qty : null,
                            unitPrice: App.saleLines.length === 1 ? first.unitPrice : null,
                            items: App.saleLines.slice(),
                            subtotal,
                            amount: total,
                            payment,
                            tendered,
                            change,
                            fromAccount: null,
                            toAccount: null,
                            date: new Date(qs("#f-date").value || Date.now()).toISOString(),
                            note: qs("#f-note").value.trim(),
                            createdAt: new Date().toISOString(),
                        };
                        await dbAdd("transactions", record);
                        App.saleLines = [];
                        toast((isSale ? "Sale" : "Expense") + " saved");
                        render();
                    });

                    wrap.appendChild(form);
                    return wrap;
                }

                function stepLineQty(delta) {
                    const inp = qs("#ln-qty");
                    const v = Math.max(0, (parseFloat(inp.value) || 0) + delta);
                    inp.value = v;
                    recalcLineAmount();
                }
                function recalcLineAmount() {
                    const qty = parseFloat(qs("#ln-qty") ? qs("#ln-qty").value : "") || 0;
                    const price = parseFloat(qs("#ln-price") ? qs("#ln-price").value : "") || 0;
                    if (qty && price) {
                        qs("#ln-amount").value = (qty * price).toFixed(2);
                    }
                }

                /* ---------- HISTORY ---------- */
                async function renderHistory() {
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "History"));

                    const filterCard = el("div", { class: "card filters" });
                    const rangeRow = el("div", { class: "chiprow" });
                    [
                        ["today", "Today"],
                        ["week", "This Week"],
                        ["month", "This Month"],
                        ["all", "All Time"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.historyFilters.range === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.historyFilters.range = val;
                            render();
                        });
                        rangeRow.appendChild(chip);
                    });
                    filterCard.appendChild(rangeRow);

                    const typeRow = el("div", { class: "chiprow" });
                    [
                        ["all", "All"],
                        ["sale", "Sales"],
                        ["expense", "Expenses"],
                        ["transfer", "Transfers"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.historyFilters.type === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.historyFilters.type = val;
                            render();
                        });
                        typeRow.appendChild(chip);
                    });
                    filterCard.appendChild(typeRow);

                    const search = el("input", { type: "text", class: "finput", placeholder: "Search item or note...", value: App.historyFilters.search });
                    search.addEventListener("input", (e) => {
                        App.historyFilters.search = e.target.value;
                        renderHistoryList();
                    });
                    filterCard.appendChild(search);

                    wrap.appendChild(filterCard);

                    const listHost = el("div", { id: "historyList" });
                    wrap.appendChild(listHost);

                    async function renderHistoryList() {
                        listHost.innerHTML = "";
                        let txs = await allTx();
                        const now = new Date();
                        const f = App.historyFilters;
                        if (f.range === "today") txs = txs.filter((t) => inRange(t.date, startOfDay(now), endOfDay(now)));
                        else if (f.range === "week") txs = txs.filter((t) => inRange(t.date, startOfWeek(now), endOfDay(now)));
                        else if (f.range === "month") txs = txs.filter((t) => inRange(t.date, startOfMonth(now), endOfDay(now)));
                        if (f.type !== "all") txs = txs.filter((t) => t.type === f.type);
                        if (f.search) {
                            const s = f.search.toLowerCase();
                            txs = txs.filter((t) => (t.item || "").toLowerCase().includes(s) || (t.note || "").toLowerCase().includes(s) || (t.category || "").toLowerCase().includes(s));
                        }
                        txs.sort((a, b) => new Date(b.date) - new Date(a.date));

                        if (txs.length === 0) {
                            listHost.appendChild(
                                el("div", { class: "empty" }, [
                                    el("div", { class: "empty-title" }, "No transactions found"),
                                    el("div", { class: "empty-sub" }, "Try a different filter or date range."),
                                ]),
                            );
                            return;
                        }

                        let lastHeader = null;
                        let periodTotal = 0;
                        txs.forEach((t) => {
                            if (t.type === "sale") periodTotal += t.amount;
                            else if (t.type === "expense") periodTotal -= t.amount;
                        });
                        listHost.appendChild(
                            el("div", { class: "periodtotal" }, [
                                el("span", {}, `${txs.length} transaction${txs.length === 1 ? "" : "s"}`),
                                el("span", { class: periodTotal >= 0 ? "sales" : "expenses" }, (periodTotal >= 0 ? "+" : "") + fmtPeso(periodTotal)),
                            ]),
                        );

                        txs.forEach((t) => {
                            const header = fmtDateHeader(t.date);
                            if (header !== lastHeader) {
                                listHost.appendChild(el("div", { class: "daysep" }, header));
                                lastHeader = header;
                            }
                            listHost.appendChild(txRow(t));
                        });
                    }

                    await renderHistoryList();
                    return wrap;
                }

                /* ---------- Edit / Delete Modal ---------- */
                async function openEditModal(id) {
                    const t = await dbGet("transactions", id);
                    if (!t) return;
                    const isTransfer = t.type === "transfer";
                    const lines = txLines(t);
                    const overlay = el("div", { class: "overlay" });
                    const modal = el("div", { class: "modal" });

                    const titleMap = { sale: "Edit Sale", expense: "Edit Expense", transfer: "Edit Transfer" };
                    modal.appendChild(el("div", { class: "modal-title" }, titleMap[t.type] || "Edit Transaction"));

                    // Show the line-item breakdown (read-only here — remove/re-add items via the Add page for now)
                    if (!isTransfer && lines.length) {

                /* ---------- REPORTS ---------- */
                async function renderReports() {
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "Reports"));

                    const rangeCard = el("div", { class: "card" });
                    const rangeRow = el("div", { class: "chiprow" });
                    [
                        ["today", "Today"],
                        ["week", "This Week"],
                        ["month", "This Month"],
                        ["all", "All Time"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.reportRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.reportRange = val;
                            render();
                        });
                        rangeRow.appendChild(chip);
                    });
                    rangeCard.appendChild(rangeRow);
                    wrap.appendChild(rangeCard);

                    let txs = await allTx();
                    const now = new Date();
                    if (App.reportRange === "today") txs = txs.filter((t) => inRange(t.date, startOfDay(now), endOfDay(now)));
                    else if (App.reportRange === "week") txs = txs.filter((t) => inRange(t.date, startOfWeek(now), endOfDay(now)));
                    else if (App.reportRange === "month") txs = txs.filter((t) => inRange(t.date, startOfMonth(now), endOfDay(now)));

                    const sales = sumBy(txs, (t) => t.type === "sale");
                    const expenses = sumBy(txs, (t) => t.type === "expense");
                    const net = sales - expenses;
                    const cashIn = sumBy(txs, (t) => t.type === "sale" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.toAccount === "cash");
                    const cashOut = sumBy(txs, (t) => t.type === "expense" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.fromAccount === "cash");
                    const cashNet = cashIn - cashOut;

                    const summary = el("div", { class: "summary-grid" }, [
                        summaryCard("Total Sales", sales, "sales"),
                        summaryCard("Total Expenses", expenses, "expenses"),
                        summaryCard("Net Cash Flow", net, net >= 0 ? "sales" : "expenses"),
                        summaryCard("Cash Movement", cashNet, cashNet >= 0 ? "sales" : "expenses"),
                    ]);
                    wrap.appendChild(summary);

                    // account balances (all-time, not period-scoped — this is a point-in-time snapshot)
                    const allTxs = await allTx();
                    const bal = await computeAccountBalances(allTxs);
                    const balSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "ACCOUNT BALANCES (ALL-TIME)")]);
                    balSection.appendChild(
                        el("div", { class: "summary-grid" }, [summaryCard("Cash", bal.cash, "sales"), summaryCard("GCash", bal.gcash, "sales"), summaryCard("Bank", bal.bank, "sales")]),
                    );
                    wrap.appendChild(balSection);

                    // fund transfers this period
                    const transfers = txs.filter((t) => t.type === "transfer").sort((a, b) => new Date(b.date) - new Date(a.date));
                    const transferSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "FUND TRANSFERS THIS PERIOD")]);
                    if (transfers.length === 0) {
                        transferSection.appendChild(el("div", { class: "empty small" }, "No GCash, bank, or owner transfers in this period."));
                    } else {
                        transfers.forEach((t) => transferSection.appendChild(txRow(t)));
                    }
                    wrap.appendChild(transferSection);

                    // category breakdown (sales) — spread across each transaction's line items
                    const catTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            catTotals[ln.category] = (catTotals[ln.category] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                    const catSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY CATEGORY")]);
                    if (catEntries.length === 0) {
                        catSection.appendChild(el("div", { class: "empty small" }, "No sales in this period yet."));
                    } else {
                        const max = Math.max(...catEntries.map((e) => e[1]));
                        catEntries.forEach(([cat, amt]) => {
                            catSection.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, cat),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: `width:${((amt / max) * 100).toFixed(0)}%` })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                    }
                    wrap.appendChild(catSection);

                    // payment method breakdown
                    const payTotals = { cash: 0, gcash: 0, bank: 0, other: 0 };
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        payTotals[t.payment] = (payTotals[t.payment] || 0) + t.amount;
                    });
                    const paySection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY PAYMENT METHOD")]);
                    const payMax = Math.max(1, ...Object.values(payTotals));
                    Object.entries(payTotals).forEach(([p, amt]) => {
                        paySection.appendChild(
                            el("div", { class: "barrow" }, [
                                el("div", { class: "barrow-label" }, paymentLabel(p)),
                                el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill alt", style: `width:${((amt / payMax) * 100).toFixed(0)}%` })]),
                                el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                            ]),
                        );
                    });
                    wrap.appendChild(paySection);

                    // top items — spread across each transaction's line items
                    const itemTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            itemTotals[ln.item] = (itemTotals[ln.item] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const topItems = Object.entries(itemTotals)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 5);
                    if (topItems.length) {
                        const topSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "TOP ITEMS")]);
                        topItems.forEach(([name, amt], i) => {
                            topSection.appendChild(
                                el("div", { class: "toprow" }, [
                                    el("span", { class: "toprow-rank" }, String(i + 1)),
                                    el("span", { class: "toprow-name" }, name),
                                    el("span", { class: "toprow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                        wrap.appendChild(topSection);
                    }

                    return wrap;
                }
                function summaryCard(label, amount, cls) {
                    return el("div", { class: "summary-card" }, [el("div", { class: "sc-label" }, label), el("div", { class: "sc-value " + cls }, fmtPeso(amount))]);
                }

                function categoryManager(cats, type) {
                    const card = el("div", { class: "card" });
                    const list = el("div", { class: "chiprow" });
                    function refreshList() {
                        list.innerHTML = "";
                        cats[type].forEach((c) => {
                            const chip = el("span", { class: "chip removable" }, [el("span", {}, c), el("button", { type: "button", class: "chip-x" }, "×")]);
                            chip.querySelector(".chip-x").addEventListener("click", async () => {
                                if (cats[type].length <= 1) {
                                    toast("Keep at least one category");
                                    return;
                                }
                                cats[type] = cats[type].filter((x) => x !== c);
                                await updateActiveCompany({ categories: cats });
                                refreshList();
                            });
                            list.appendChild(chip);
                        });
                    }
                    refreshList();
                    card.appendChild(list);

                    const addRow = el("div", { class: "addrow" });
                    const inp = el("input", { type: "text", class: "finput", placeholder: "Add category..." });
                    const addBtn = el("button", { type: "button", class: "smallbtn" }, "Add");
                    addBtn.addEventListener("click", async () => {
                        const v = inp.value.trim();
                        if (!v) return;
                        if (cats[type].includes(v)) {
                            toast("Category already exists");
                            return;
                        }
                        cats[type].push(v);
                        await updateActiveCompany({ categories: cats });
                        inp.value = "";
                        refreshList();
                    });
                    addRow.appendChild(inp);
                    addRow.appendChild(addBtn);
                    card.appendChild(addRow);
                    return card;
                }

                async function presetManager(cats) {
                    const card = el("div", { class: "card" });
                    const catSelect = el("select", { class: "finput" });
                    cats.sale.forEach((c) => catSelect.appendChild(el("option", { value: c }, c)));
                    card.appendChild(el("label", { class: "flabel" }, "Category"));
                    card.appendChild(catSelect);

                    const list = el("div", { class: "presetlist" });
                    card.appendChild(list);

                    async function refresh() {
                        list.innerHTML = "";
                        let presets = sortPresets((await companyPresets()).filter((p) => p.category === catSelect.value));

                        // Backfill a stable `order` on presets that predate the reordering feature, so
                        // dragging via the up/down buttons has real values to swap from the start.
                        let needsBackfill = presets.some((p) => p.order == null);
                        if (needsBackfill) {
                            for (let i = 0; i < presets.length; i++) {
                                if (presets[i].order !== i) {
                                    presets[i] = Object.assign({}, presets[i], { order: i });
                                    await dbPut("presets", presets[i]);
                                }
                            }
                        }

                        if (presets.length === 0) {
                            list.appendChild(el("div", { class: "empty small" }, "No quick items yet for this category."));
                        }
                        presets.forEach((p, idx) => {
                            const upBtn = el("button", { type: "button", class: "reorder-btn" }, "\u25b2");
                            const downBtn = el("button", { type: "button", class: "reorder-btn" }, "\u25bc");
                            if (idx === 0) upBtn.setAttribute("disabled", "disabled");
                            if (idx === presets.length - 1) downBtn.setAttribute("disabled", "disabled");
                            upBtn.addEventListener("click", async () => {
                                if (idx === 0) return;
                                const other = presets[idx - 1];
                                const myOrder = p.order;
                                await dbPut("presets", Object.assign({}, p, { order: other.order }));
                                await dbPut("presets", Object.assign({}, other, { order: myOrder }));
                                refresh();
                            });
                            downBtn.addEventListener("click", async () => {
                                if (idx === presets.length - 1) return;
                                const other = presets[idx + 1];
                                const myOrder = p.order;
                                await dbPut("presets", Object.assign({}, p, { order: other.order }));
                                await dbPut("presets", Object.assign({}, other, { order: myOrder }));
                                refresh();
                            });
                            const row = el("div", { class: "presetrow" }, [
                                el("div", { class: "presetrow-reorder" }, [upBtn, downBtn]),
                                el("span", { class: "presetrow-name" }, p.name),
                                el("span", { class: "presetrow-price" }, fmtPeso(p.price)),
                                el("button", { type: "button", class: "chip-x" }, "×"),
                            ]);
                            row.querySelector(".chip-x").addEventListener("click", async () => {
                                await dbDelete("presets", p.id);
                                refresh();
                            });
                            list.appendChild(row);
                        });
                    }
                    catSelect.addEventListener("change", refresh);
                    await refresh();

                    const addRow = el("div", { class: "addrow" });
                    const nameInp = el("input", { type: "text", class: "finput", placeholder: "Item name" });
                    const priceInp = el("input", { type: "number", class: "finput", placeholder: "Price", min: "0", step: "0.01", style: "max-width:100px" });
                    const addBtn = el("button", { type: "button", class: "smallbtn" }, "Add");
                    addBtn.addEventListener("click", async () => {
                        const name = nameInp.value.trim();
                        const price = parseFloat(priceInp.value);
                        if (!name || !price) {
                            toast("Enter a name and price");
                            return;
                        }
                        const cid = await getActiveCompanyId();
                        const existingInCat = (await companyPresets()).filter((p) => p.category === catSelect.value);
                        const nextOrder = existingInCat.length ? Math.max(...existingInCat.map((p) => (p.order != null ? p.order : 0))) + 1 : 0;
                        await dbAdd("presets", { type: "sale", category: catSelect.value, name, price, companyId: cid, order: nextOrder });
                        nameInp.value = "";
                        priceInp.value = "";
                        refresh();
                    });
                    addRow.appendChild(nameInp);
                    addRow.appendChild(priceInp);
                    addRow.appendChild(addBtn);
                    card.appendChild(addRow);

                    return card;
                }

                /* ---------- Export / Import ---------- */
                async function exportDB() {
                    const [transactions, presets, settingsArr, companies] = await Promise.all([dbGetAll("transactions"), dbGetAll("presets"), dbGetAll("settings"), dbGetAll("companies")]);
                    const payload = {
                        app: "little-ledger-pos",
                        exportedAt: new Date().toISOString(),
                        version: 2,
                        transactions,
                        presets,
                        settings: settingsArr,
                        companies,
                    };
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
                    a.href = url;
                    a.download = `little-ledger-backup-${stamp}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    toast("Database exported");
                }

                async function importDB(file) {
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);
                        if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.presets) || !Array.isArray(data.settings)) {
                            toast("This file doesn\u2019t look like a valid backup");
                            return;
                        }
                        if (!confirm(`Import ${data.transactions.length} transaction(s)? This replaces ALL data currently on this device.`)) return;

                        await dbClear("transactions");
                        await dbClear("presets");
                        await dbClear("settings");
                        await dbClear("companies");

                        const hasCompanies = Array.isArray(data.companies) && data.companies.length > 0;
                        if (hasCompanies) {
                            for (const c of data.companies) await dbPut("companies", c);
                            for (const t of data.transactions) await dbPut("transactions", t);
                            for (const p of data.presets) await dbPut("presets", p);
                            for (const s of data.settings) await dbPut("settings", s);
                        } else {
                            // Old single-tenant backup (no companies array) — wrap everything into one company.
                            const legacySettings = {};
                            for (const s of data.settings) legacySettings[s.key] = s.value;
                            const company = {
                                name: legacySettings.businessName || "My Shop",
                                categories: legacySettings.categories || { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                                startingCash: legacySettings.startingCash || 0,
                                startingGcash: legacySettings.startingGcash || 0,
                                startingBank: legacySettings.startingBank || 0,
                                createdAt: new Date().toISOString(),
                            };
                            const cid = await dbAdd("companies", company);
                            for (const t of data.transactions) {
                                t.companyId = cid;
                                await dbPut("transactions", t);
                            }
                            for (const p of data.presets) {
                                p.companyId = cid;
                                await dbPut("presets", p);
                            }
                            await setSetting("activeCompanyId", cid);
                        }
                        toast("Database imported successfully");
                        location.hash = "#/home";
                    } catch (err) {
                        console.error(err);
                        toast("Could not read that file");
                    }
                }

                /* ---------- Init ---------- */
                async function init() {
                    await openDB();
                    await seedIfEmpty();
                    qsa(".navbtn").forEach((b) =>
                        b.addEventListener("click", (e) => {
                            if (b.dataset.route === "add") {
                                App.selectedCategory = null;
                                App.saleLines = [];
                            }
                        }),
                    );
                    if (!location.hash) {
                        // Setting the hash triggers the 'hashchange' listener, which calls render() itself —
                        // don't also call render() here or the first page loads (and re-queries IndexedDB) twice.
                        location.hash = "#/home";
                    } else {
                        // Hash was already set (e.g. reload/deep link) — no hashchange event will fire, so render directly.
                        render();
                    }
                }

                document.addEventListener("DOMContentLoaded", init);
            })();
        </script>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("sw.js").catch((err) => {
                        console.error("SW registration failed:", err);
                    });
                });

                // Auto-refresh once when a new SW version takes control.
                let refreshing = false;
                navigator.serviceWorker.addEventListener("controllerchange", () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            }
        </script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWPF7650WK"></script>

            gtag("config", "G-ZWPF7650WK");

        <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🖥️</text></svg>' />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#23302A" />
        <title>Little Ledger — POS &amp; Cash Flow</title>
        <style>
            :root {
                --paper: #f6f1e4;
                --paper-card: #fffdf8;
                --ink: #23302a;
                --ink-soft: #6b7268;
                --green: #3f7a5c;
                --green-soft: #e6efe7;
                --rust: #b5502e;
                --rust-soft: #f5e7e0;
                --gold: #c99a3e;
                --border: #dfd5bc;
                --border-soft: #eae2cd;
                --radius: 14px;
                --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
                --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--paper);
                color: var(--ink);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: radial-gradient(rgba(35, 48, 42, 0.035) 1px, transparent 1px);
                background-size: 3px 3px;
                pointer-events: none;
                z-index: 0;
            }

            #shell {
                max-width: 480px;
                margin: 0 auto;
                min-height: 100vh;
                min-height: 100dvh;
                background: var(--paper);
                position: relative;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
                padding-bottom: calc(72px + env(safe-area-inset-bottom));
            }

            #app {
                position: relative;
                z-index: 1;
            }

            .page {
                padding: 16px 16px 8px;
                animation: fadein 0.18s ease;
            }
            @keyframes fadein {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .page-title {
                font-size: 22px;
                font-weight: 700;
                letter-spacing: -0.01em;
                margin: 4px 0 14px;
            }

            /* ---------- Hero / receipt tape ---------- */
            .hero {
                background: var(--ink);
                color: var(--paper);
                border-radius: var(--radius) var(--radius) 0 0;
                padding: 20px 20px 22px;
                margin: 0 -16px;
            }
            .hero-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 14px;
            }
            .eyebrow {
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 11px;
                font-weight: 700;
                color: var(--gold);
            }
            .eyebrow.muted {
                color: rgba(246, 241, 228, 0.55);
                font-weight: 600;
            }
            .hero-amount {
                font-family: var(--mono);
                font-size: 40px;
                font-weight: 700;
                letter-spacing: -0.01em;
                line-height: 1.05;
            }
            .hero-label {
                font-size: 10.5px;
                letter-spacing: 0.12em;
                color: rgba(246, 241, 228, 0.6);
                margin-top: 4px;
                font-weight: 700;
            }
            .hero-row {
                display: flex;
                gap: 10px;
                margin-top: 18px;
            }
            .hero-stat {
                flex: 1;
                background: rgba(246, 241, 228, 0.08);
                border-radius: 10px;
                padding: 10px 12px;
            }
            .hs-label {
                font-size: 10.5px;
                color: rgba(246, 241, 228, 0.6);
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 3px;
            }
            .hs-value {
                font-family: var(--mono);
                font-size: 17px;
                font-weight: 700;
            }
            .hs-value.sales {
                color: #8fd4ac;
            }
            .hs-value.expenses {
                color: #f0a98a;
            }

            .tear {
                height: 12px;
                margin: 0 -16px;
                background: radial-gradient(circle at 8px 0, transparent 7px, var(--ink) 7.5px) 0 0 / 16px 16px repeat-x;
            }

            /* ---------- Account balance strip ---------- */
            .balancecard {
                background: var(--paper-card);
                border: 1px dashed var(--border);
                border-radius: 0 0 var(--radius) var(--radius);
                margin: 0 -16px 18px;
                display: flex;
            }
            .balitem {
                flex: 1;
                padding: 13px 12px 15px;
                min-width: 0;
            }
            .balitem + .balitem {
                border-left: 1px dotted var(--border);
            }
            .bal-label {
                font-size: 10px;
                letter-spacing: 0.08em;
                color: var(--ink-soft);
                font-weight: 700;
                margin-bottom: 3px;
                text-transform: uppercase;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .bal-value {
                font-family: var(--mono);
                font-weight: 700;
                color: var(--ink);
                font-size: 15px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .balitem.lead .bal-value {
                font-size: 19px;
            }

            /* ---------- Quick actions ---------- */
            .quickrow {
                display: flex;
                gap: 8px;
                margin-bottom: 22px;
            }
            .quickbtn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 14px 6px;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 700;
                font-size: 14px;
                border: 1px solid var(--border);
            }
            .quickbtn-sale {
                background: var(--green);
                color: #fff;
                border-color: var(--green);
            }
            .quickbtn-expense {
                background: var(--paper-card);
                color: var(--rust);
                border-color: var(--rust);
            }
            .quickbtn-transfer {
                background: var(--paper-card);
                color: var(--gold);
                border-color: var(--gold);
            }
            .qb-icon {
                font-size: 17px;
                line-height: 1;
            }

            /* ---------- Sections & bars ---------- */
            .section {
                margin-bottom: 22px;
            }
            .section-title {
                font-size: 11px;
                letter-spacing: 0.1em;
                font-weight: 700;
                color: var(--ink-soft);
                margin: 22px 0 10px;
            }
            .section .section-title {
                margin-top: 0;
            }

            .barrow {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
            }
            .barrow-label {
                width: 92px;
                flex-shrink: 0;
                font-size: 12.5px;
                color: var(--ink-soft);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .barrow-track {
                flex: 1;
                background: var(--border-soft);
                border-radius: 6px;
                height: 8px;
                overflow: hidden;
            }
            .barrow-fill {
                height: 100%;
                background: var(--green);
                border-radius: 6px;
            }
            .barrow-fill.alt {
                background: var(--gold);
            }
            .barrow-amt {
                font-family: var(--mono);
                font-size: 12.5px;
                font-weight: 600;
                width: 68px;
                text-align: right;
                flex-shrink: 0;
            }

            /* ---------- Transaction rows ---------- */
            .txrow {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 11px 2px;
                border-bottom: 1px dotted var(--border);
                cursor: pointer;
            }
            .txrow:last-child {
                border-bottom: none;
            }
            .txrow-title {
                font-size: 14.5px;
                font-weight: 600;
            }
            .txrow-title .sale-id {
                font-family: var(--mono);
                font-size: 11.5px;
                font-weight: 700;
                color: var(--ink-soft);
                margin-right: 6px;
            }
            .txrow-sub {
                font-size: 11.5px;
                color: var(--ink-soft);
                margin-top: 2px;
            }
            .badge-inv {
                display: inline-block;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                border-radius: 4px;
                padding: 1px 5px;
                margin-left: 5px;
                vertical-align: middle;
            }
            .badge-inv.missing {
                color: var(--rust);
                background: var(--rust-soft);
            }
            .badge-inv.ok {
                color: var(--green);
                background: var(--green-soft);
            }
            .txrow-amt {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 14.5px;
                flex-shrink: 0;
                padding-left: 10px;
            }
            .txrow-amt.sales {
                color: var(--green);
            }
            .txrow-amt.expenses {
                color: var(--rust);
            }
            .txrow-amt.transfer {
                color: var(--gold);
            }

            .daysep {
                font-size: 11px;
                letter-spacing: 0.06em;
                font-weight: 700;
                color: var(--ink-soft);
                margin: 16px 0 4px;
                text-transform: uppercase;
            }
            .daysep:first-child {
                margin-top: 0;
            }

            .periodtotal {
                display: flex;
                justify-content: space-between;
                font-family: var(--mono);
                font-weight: 700;
                font-size: 13px;
                color: var(--ink-soft);
                margin-bottom: 6px;
                padding: 0 2px;
            }
            .periodtotal .sales {
                color: var(--green);
            }
            .periodtotal .expenses {
                color: var(--rust);
            }

            /* ---------- Empty states ---------- */
            .empty {
                text-align: center;
                padding: 28px 12px;
                color: var(--ink-soft);
            }
            .empty.small {
                padding: 14px 4px;
                font-size: 12.5px;
            }
            .empty-title {
                font-weight: 700;
                color: var(--ink);
                margin-bottom: 4px;
            }
            .empty-sub {
                font-size: 12.5px;
            }

            /* ---------- Cards & forms ---------- */
            .card {
                background: var(--paper-card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px;
                margin-bottom: 16px;
            }
            .form {
                display: flex;
                flex-direction: column;
            }
            .flabel {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--ink-soft);
                margin: 12px 0 6px;
            }
            .flabel:first-child {
                margin-top: 0;
            }
            .finput {
                width: 100%;
                padding: 11px 12px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: #fff;
                font-size: 15px;
                color: var(--ink);
                font-family: var(--sans);
            }
            .finput:focus {
                outline: 2px solid var(--gold);
                outline-offset: 1px;
            }
            .famount {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 20px;
            }

            .frow {
                display: flex;
                gap: 10px;
            }
            .fcol {
                flex: 1;
            }

            .stepper {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .step-btn {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: #fff;
                font-size: 18px;
                font-weight: 700;
                color: var(--ink);
                flex-shrink: 0;
            }
            .steppernum {
                text-align: center;
                padding: 11px 4px;
            }

            .chiprow {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 4px;
            }
            .chip {
                border: 1px solid var(--border);
                background: #fff;
                color: var(--ink);
                padding: 8px 13px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 600;
                white-space: nowrap;
            }
            .chip.active {
                background: var(--ink);
                color: var(--paper);
                border-color: var(--ink);
            }
            .chip.pay.active {
                background: var(--green);
                border-color: var(--green);
                color: #fff;
            }
            .chip.preset {
                background: var(--green-soft);
                border-color: var(--border);
                font-weight: 600;
            }
            .chip.preset.no-costing {
                border-color: var(--gold);
                box-shadow: inset 0 0 0 1px rgba(201, 154, 62, 0.35);
            }
            .preset-search-wrap {
                position: relative;
                margin-bottom: 4px;
            }
            .preset-suggest {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: calc(100% + 4px);
                max-height: 220px;
                overflow-y: auto;
                background: var(--paper-card);
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                z-index: 40;
            }
            .preset-suggest.open {
                display: block;
            }
            .preset-suggest-item {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 10px 12px;
                border: none;
                background: none;
                text-align: left;
                font-size: 13.5px;
                font-weight: 600;
                color: var(--ink);
                font-family: var(--sans);
                cursor: pointer;
            }
            .preset-suggest-item:hover,
            .preset-suggest-item.active {
                background: var(--green-soft);
            }
            .preset-suggest-item .ps-price {
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--ink-soft);
                flex-shrink: 0;
            }
            .preset-suggest-empty {
                padding: 12px;
                font-size: 12.5px;
                color: var(--ink-soft);
                text-align: center;
            }
            .badge-warn {
                display: inline-block;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #8a6a1a;
                background: rgba(201, 154, 62, 0.2);
                border-radius: 4px;
                padding: 1px 5px;
                margin-left: 5px;
                vertical-align: middle;
            }
            .linerow-title .badge-warn {
                font-size: 9px;
            }
            .chip.removable {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding-right: 8px;
            }
            .chip-x {
                background: none;
                border: none;
                font-size: 16px;
                color: var(--rust);
                font-weight: 700;
                line-height: 1;
                padding: 0 2px;
            }

            .tabbar {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
            }
            .tab {
                flex: 1;
                padding: 11px;
                border-radius: 12px;
                border: 1px solid var(--border);
                background: #fff;
                font-weight: 700;
                font-size: 14px;
                color: var(--ink-soft);
            }
            .tab.active.sale {
                background: var(--green);
                color: #fff;
                border-color: var(--green);
            }
            .tab.active.expense {
                background: var(--rust);
                color: #fff;
                border-color: var(--rust);
            }
            .tab.active.transfer {
                background: var(--gold);
                color: #fff;
                border-color: var(--gold);
            }

            .bigbtn {
                width: 100%;
                padding: 14px;
                border-radius: 12px;
                border: none;
                font-weight: 700;
                font-size: 15.5px;
                margin-top: 18px;
                color: #fff;
                background: var(--ink);
            }
            .bigbtn.sale {
                background: var(--green);
            }
            .bigbtn.expense {
                background: var(--rust);
            }
            .bigbtn.transfer {
                background: var(--gold);
            }
            .bigbtn.ghost {
                background: #fff;
                color: var(--ink);
                border: 1px solid var(--border);
                margin-top: 10px;
            }
            .bigbtn.danger {
                background: #fff;
                color: var(--rust);
                border: 1px solid var(--rust);
                margin-top: 10px;
            }
            .bigbtn.small2 {
                padding: 11px;
                font-size: 13.5px;
                margin-top: 10px;
            }
            .filelabel {
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .hidden-file {
                display: none;
            }

            .addrow {
                display: flex;
                gap: 8px;
                margin-top: 10px;
                align-items: center;
            }
            .addrow .finput {
                flex: 1;
            }
            .smallbtn {
                padding: 10px 16px;
                border-radius: 10px;
                border: none;
                background: var(--ink);
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                flex-shrink: 0;
            }
            .help-text {
                font-size: 12.5px;
                color: var(--ink-soft);
                line-height: 1.5;
                margin-bottom: 6px;
            }
            .footnote {
                text-align: center;
                font-size: 11.5px;
                color: var(--ink-soft);
                margin: 20px 0 8px;
            }

            .presetlist {
                margin: 8px 0;
            }
            .presetrow {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 0;
                border-bottom: 1px dotted var(--border);
            }
            .presetrow:last-child {
                border-bottom: none;
            }
            .presetrow-name {
                flex: 1;
                font-size: 13.5px;
                font-weight: 600;
                min-width: 0;
            }
            .presetrow-name.finput {
                font-size: 13.5px;
                font-weight: 600;
                padding: 7px 9px;
            }
            .presetrow-price {
                font-family: var(--mono);
                font-size: 13px;
                color: var(--ink-soft);
            }
            .presetrow-price.finput {
                width: 88px;
                flex-shrink: 0;
                font-family: var(--mono);
                font-size: 13px;
                padding: 7px 8px;
                text-align: right;
            }
            .presetrow-cat {
                max-width: 110px;
                flex-shrink: 0;
                font-size: 12px;
                padding: 7px 6px;
            }
            .presetrow-reorder {
                display: flex;
                flex-direction: column;
                gap: 2px;
                flex-shrink: 0;
            }
            .reorder-btn {
                width: 26px;
                height: 20px;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: #fff;
                color: var(--ink-soft);
                font-size: 11px;
                line-height: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .reorder-btn:disabled {
                opacity: 0.3;
            }
            .reorder-btn:not(:disabled):active {
                background: var(--green-soft);
                color: var(--ink);
            }

            /* ---------- Line items (receipt builder) ---------- */
            .linelist {
                margin: 4px 0 2px;
            }
            .linerow {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 0;
                border-bottom: 1px dotted var(--border);
            }
            .linerow:last-child {
                border-bottom: none;
            }
            .linerow-main {
                flex: 1;
                min-width: 0;
            }
            .linerow-title {
                font-size: 13.5px;
                font-weight: 600;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .linerow-sub {
                font-size: 11.5px;
                color: var(--ink-soft);
                margin-top: 1px;
            }
            .linerow-amt {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 13.5px;
                flex-shrink: 0;
            }
            .lineentry {
                border: 1px dashed var(--border);
                border-radius: 12px;
                padding: 12px;
                margin-top: 4px;
                background: var(--green-soft);
            }
            .totalsblock {
                margin-top: 4px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
            }
            .totalsrow {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 4px 0;
                font-size: 13.5px;
                color: var(--ink-soft);
            }
            .totalsrow .val {
                font-family: var(--mono);
                font-weight: 600;
                color: var(--ink);
            }
            .totalsrow.grand {
                font-size: 16px;
                font-weight: 700;
                color: var(--ink);
                padding-top: 8px;
                margin-top: 4px;
                border-top: 1px dotted var(--border);
            }
            .totalsrow.grand .val {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 18px;
            }
            .totalsrow.change .val {
                color: var(--green);
            }
            .stmt-card {
                margin-bottom: 14px;
            }
            .stmt-title {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--ink);
                margin-bottom: 4px;
            }
            .stmt-period {
                font-size: 12px;
                color: var(--ink-soft);
                margin-bottom: 10px;
            }
            .stmt-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
                padding: 6px 0;
                font-size: 13.5px;
                border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
            }
            .stmt-row:last-child {
                border-bottom: none;
            }
            .stmt-row.indent span:first-child {
                padding-left: 14px;
                color: var(--ink-soft);
            }
            .stmt-row.section-head {
                font-weight: 700;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                color: var(--ink-soft);
                border-bottom: none;
                padding-top: 12px;
                padding-bottom: 2px;
            }
            .stmt-row.total {

{
  "imports": {
    "yjs": "https://esm.sh/yjs@13.6.18",
    "y-indexeddb": "https://esm.sh/y-indexeddb@9.0.12?deps=yjs@13.6.18",
    "y-websocket": "https://esm.sh/y-websocket@2.0.4?deps=yjs@13.6.18",
    "y-protocols": "https://esm.sh/y-protocols@1.0.6",

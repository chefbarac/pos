<script type="module">
import * as Y from "yjs";
import { IndexeddbPersistence } from "y-indexeddb";
import { WebsocketProvider } from "y-websocket";

class PosSyncManager {
  constructor() {
    this.ydoc = null;
    this.provider = null;
    this.persistence = null;
    this.status = "disconnected";
    this._statusHandlers = new Set();
    this.host = localStorage.getItem("pos_sync_host") || "ws://localhost:1234";
    this.key = localStorage.getItem("pos_sync_key") || "";
    this.yTransactions = null;
    this.yPresets = null;
    this.yCompanies = null;
    this.ySettings = null;
    this.yAssets = null;
    this.yRecurring = null;
    this.yPlanned = null;
    this.yOtherIncome = null;
    this.yTxTemplates = null;
    this._onRemote = null;
  }

  onStatus(fn) {
    this._statusHandlers.add(fn);
    fn(this.status);
    return () => this._statusHandlers.delete(fn);
  }
  _setStatus(s) {
    this.status = s;
    this._statusHandlers.forEach((fn) => fn(s));
  }
  setConfig(host, key) {
    this.host = (host || "").trim();
    this.key = (key || "").trim();
    localStorage.setItem("pos_sync_host", this.host);
    localStorage.setItem("pos_sync_key", this.key);
  }
  getConfig() {
    return { host: this.host, key: this.key };
  }
  isConnected() {
    return this.status === "connected";
  }

  async connect(onRemoteChange) {
    if (!this.host || !this.key) throw new Error("Host and Sync Key required");
    this.disconnect();
    this._onRemote = onRemoteChange;
    this._setStatus("connecting");

    this.ydoc = new Y.Doc();
    this.yTransactions = this.ydoc.getMap("transactions");
    this.yPresets = this.ydoc.getMap("presets");
    this.yCompanies = this.ydoc.getMap("companies");
    this.ySettings = this.ydoc.getMap("settings");
    this.yAssets = this.ydoc.getMap("assets");
    this.yRecurring = this.ydoc.getMap("recurringExpenses");
    this.yPlanned = this.ydoc.getMap("plannedExpenses");
    this.yOtherIncome = this.ydoc.getMap("otherIncome");
    this.yTxTemplates = this.ydoc.getMap("txTemplates");

    this.persistence = new IndexeddbPersistence("pos_yjs_" + this.key, this.ydoc);
    await this.persistence.whenSynced;

    this.provider = new WebsocketProvider(this.host, this.key, this.ydoc, { connect: true });
    this.provider.on("status", (e) => {
      if (e.status === "connected") this._setStatus("connected");
      else if (e.status === "disconnected") this._setStatus("disconnected");
    });
    this.provider.on("connection-error", () => this._setStatus("error"));

    const emit = () => {
      if (this._onRemote) this._onRemote(this.exportAll());
    };
    [
      this.yTransactions, this.yPresets, this.yCompanies, this.ySettings,
      this.yAssets, this.yRecurring, this.yPlanned, this.yOtherIncome, this.yTxTemplates
    ].forEach((m) => m && m.observe(emit));

    setTimeout(() => {
      if (this.provider && this.provider.wsconnected) this._setStatus("connected");
    }, 800);
  }

  disconnect() {
    if (this.provider) { this.provider.destroy(); this.provider = null; }
    if (this.persistence) { this.persistence.destroy(); this.persistence = null; }
    if (this.ydoc) { this.ydoc.destroy(); this.ydoc = null; }
    this._setStatus("disconnected");
  }

  bootstrap(local) {
    if (!this.yTransactions) return;
    const apply = (ymap, arr) => {
      (arr || []).forEach((rec) => {
        if (rec == null || rec.id == null) return;
        const key = String(rec.id);
        const existing = ymap.get(key);
        if (!existing) ymap.set(key, rec);
        else if ((rec.updatedAt || rec.createdAt || 0) >= (existing.updatedAt || existing.createdAt || 0)) {
          ymap.set(key, rec);
        }
      });
    };
    apply(this.yTransactions, local.transactions);
    apply(this.yPresets, local.presets);
    apply(this.yCompanies, local.companies);
    apply(this.yAssets, local.assets);
    apply(this.yRecurring, local.recurringExpenses);
    apply(this.yPlanned, local.plannedExpenses);
    apply(this.yOtherIncome, local.otherIncome);
    apply(this.yTxTemplates, local.txTemplates);
    if (local.settings) {
      Object.keys(local.settings).forEach((k) => {
        if (!this.ySettings.has(k)) this.ySettings.set(k, local.settings[k]);
      });
    }
  }

  exportAll() {
    const toArr = (ymap) => (ymap ? Array.from(ymap.values()) : []);
    return {
      transactions: toArr(this.yTransactions),
      presets: toArr(this.yPresets),
      companies: toArr(this.yCompanies),
      assets: toArr(this.yAssets),
      recurringExpenses: toArr(this.yRecurring),
      plannedExpenses: toArr(this.yPlanned),
      otherIncome: toArr(this.yOtherIncome),
      txTemplates: toArr(this.yTxTemplates),
      settings: this.ySettings ? Object.fromEntries(this.ySettings.entries()) : {},
    };
  }

  pushRecord(store, record) {
    if (!this.isConnected() || !record || record.id == null) return;
    const map = {
      transactions: this.yTransactions,
      presets: this.yPresets,
      companies: this.yCompanies,
      assets: this.yAssets,
      recurringExpenses: this.yRecurring,
      plannedExpenses: this.yPlanned,
      otherIncome: this.yOtherIncome,
      txTemplates: this.yTxTemplates,
    }[store];
    if (map) map.set(String(record.id), record);
  }

  pushSetting(key, value) {
    if (!this.isConnected() || !this.ySettings) return;
    this.ySettings.set(key, value);
  }
}

window.PosSync = new PosSyncManager();
</script>

        <script>
            /* ============ Little Ledger POS — app logic ============ */
            (function () {
                "use strict";

                /* ---------- Costing inventory (cross-DB, same origin) ---------- */
                const COSTING_DB_NAME = "documentingCostingDB";
                const COSTING_DB_VERSION = 3; // must match Costing app

                /** Cached set of Costing product names (lowercase). null = not loaded yet. */
                let costingProductNames = null;
                let costingNamesPromise = null;

                async function loadCostingProductNames(force) {
                    if (!force && costingProductNames) return costingProductNames;
                    if (!force && costingNamesPromise) return costingNamesPromise;
                    costingNamesPromise = (async () => {
                        try {
                            const cdb = await openCostingDB();
                            if (!cdb.objectStoreNames.contains("products")) {
                                costingProductNames = new Set();
                                return costingProductNames;
                            }
                            const products = await costingReq(cdb.transaction("products", "readonly").objectStore("products").getAll());
                            costingProductNames = new Set((products || []).map((p) => (p.name || "").toLowerCase().trim()).filter(Boolean));
                            return costingProductNames;
                        } catch (e) {
                            console.warn("[inventory] could not load Costing product names", e);
                            costingProductNames = costingProductNames || new Set();
                            return costingProductNames;
                        } finally {
                            costingNamesPromise = null;
                        }
                    })();
                    return costingNamesPromise;
                }

                function hasCostingProduct(name) {
                    if (!costingProductNames) return true; // unknown yet — don't badge until loaded
                    const key = (name || "").toLowerCase().trim();
                    if (!key) return true;
                    return costingProductNames.has(key);
                }

                /** Set of POS transaction ids that already have stockMoves in Costing (source pos-sale). null = not loaded. */
                let recordedPosSaleIds = null;
                let recordedPosPromise = null;

                async function loadRecordedPosSaleIds(force) {
                    if (!force && recordedPosSaleIds) return recordedPosSaleIds;
                    if (!force && recordedPosPromise) return recordedPosPromise;
                    recordedPosPromise = (async () => {
                        try {
                            const cdb = await openCostingDB();
                            if (!cdb.objectStoreNames.contains("stockMoves")) {
                                recordedPosSaleIds = new Set();
                                return recordedPosSaleIds;
                            }
                            const moves = await costingReq(cdb.transaction("stockMoves", "readonly").objectStore("stockMoves").getAll());
                            const outIds = new Set();
                            const reverseIds = new Set();
                            (moves || []).forEach((m) => {
                                if (m.source === "pos-sale-reverse" && m.transactionId != null) {
                                    reverseIds.add(m.transactionId);
                                    return;
                                }
                                if (m.type === "out" && m.source === "pos-sale" && m.transactionId != null) {
                                    outIds.add(m.transactionId);
                                    return;
                                }
                                if (m.type === "out") {
                                    const note = String(m.note || "");
                                    const m1 = note.match(/Sale #(\d+)/);
                                    const m2 = note.match(/POS#(\d+)/);
                                    if (m1) outIds.add(parseInt(m1[1], 10));
                                    if (m2) outIds.add(parseInt(m2[1], 10));
                                }
                            });
                            // Recorded only if outs exist and not fully reversed
                            const ids = new Set();
                            outIds.forEach((id) => {
                                if (!reverseIds.has(id)) ids.add(id);
                            });
                            recordedPosSaleIds = ids;
                            return recordedPosSaleIds;
                        } catch (e) {
                            console.warn("[inventory] could not load recorded POS sale ids", e);
                            recordedPosSaleIds = recordedPosSaleIds || new Set();
                            return recordedPosSaleIds;
                        } finally {
                            recordedPosPromise = null;
                        }
                    })();
                    return recordedPosPromise;
                }

                function isSaleRecordedInInventory(txOrId) {
                    if (!recordedPosSaleIds) return null; // unknown
                    const id = typeof txOrId === "object" && txOrId ? txOrId.id : txOrId;
                    if (id == null) return false;
                    return recordedPosSaleIds.has(id);
                }

                function openCostingDB() {
                    return new Promise((resolve, reject) => {
                        const req = indexedDB.open(COSTING_DB_NAME, COSTING_DB_VERSION);
                        // Do not create stores here — Costing owns schema. If DB missing, onupgradeneeded may fire with empty upgrade; still ok for readonly.
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                        req.onupgradeneeded = () => {
                            // If user opens POS before Costing ever ran, create minimal stores so writes work.
                            const db = req.result;
                            if (!db.objectStoreNames.contains("materials")) db.createObjectStore("materials", { keyPath: "id", autoIncrement: true });
                            if (!db.objectStoreNames.contains("products")) db.createObjectStore("products", { keyPath: "id", autoIncrement: true });
                            if (!db.objectStoreNames.contains("stockMoves")) db.createObjectStore("stockMoves", { keyPath: "id", autoIncrement: true });
                            if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
                            if (!db.objectStoreNames.contains("orders")) db.createObjectStore("orders", { keyPath: "id", autoIncrement: true });
                            if (!db.objectStoreNames.contains("recipes")) db.createObjectStore("recipes", { keyPath: "id", autoIncrement: true });
                        };
                    });
                }

                function costingReq(req) {
                    return new Promise((resolve, reject) => {
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                }

                function recipeFromCostingProduct(product) {
                    if (!product || !product.costItems) return [];
                    return product.costItems
                        .filter((c) => c.materialId && c.invQty != null && Number(c.invQty) > 0)
                        .map((c) => ({
                            materialId: c.materialId,
                            qty: Number(c.invQty),
                            optional: !!c.optional,
                            label: c.label,
                        }));
                }

                function saleLinesFromTx(tx) {
                    if (tx.items && Array.isArray(tx.items) && tx.items.length) {
                        return tx.items.map((ln) => ({ name: (ln.item || ln.name || "").trim(), qty: Number(ln.qty) || 0 }));
                    }
                    return [{ name: (tx.item || "").trim(), qty: Number(tx.qty) || 1 }];
                }

                function noteWantsOptional(note) {
                    const n = (note || "").toLowerCase();
                    return ["free print", "with print", "include print", "free a4", "+print"].some((t) => n.includes(t));
                }

                /**
                 * Read Costing products/materials; write stockMoves into Costing DB.
                 * Never throws to caller — returns status. Sale already saved in POS.
                 */
                async function applyCostingInventoryForSale(tx, opts) {
                    opts = opts || {};
                    const force = !!opts.force;
                    const result = { ok: true, deducted: 0, lineStatus: [], message: "", skipped: false };
                    try {
                        const cdb = await openCostingDB();
                        if (!cdb.objectStoreNames.contains("products") || !cdb.objectStoreNames.contains("stockMoves")) {
                            result.ok = false;
                            result.message = "Costing inventory not set up yet";
                            return result;
                        }

                        // Idempotency: skip if this POS sale already has stock-outs (unless force)
                        if (tx.id != null) {
                            const existingMoves = await costingReq(cdb.transaction("stockMoves", "readonly").objectStore("stockMoves").getAll());
                            const prior = (existingMoves || []).filter(
                                (m) =>
                                    (m.source === "pos-sale" && m.transactionId === tx.id) ||
                                    (m.note && (String(m.note).indexOf("Sale #" + tx.id) !== -1 || String(m.note).indexOf("POS#" + tx.id) !== -1)),
                            );
                            if (prior.length && !force) {
                                result.skipped = true;
                                result.message = "Already applied (" + prior.length + " stock move" + (prior.length === 1 ? "" : "s") + ")";
                                return result;
                            }
                            if (prior.length && force) {
                                // Replace: delete prior outs for this transaction, then rewrite below
                                const wdel = cdb.transaction("stockMoves", "readwrite");
                                const delStore = wdel.objectStore("stockMoves");
                                for (const m of prior) {
                                    if (m.id != null) delStore.delete(m.id);
                                }
                                await new Promise((resolve, reject) => {
                                    wdel.oncomplete = resolve;
                                    wdel.onerror = () => reject(wdel.error);
                                });
                            }
                        }

                        const products = await costingReq(cdb.transaction("products", "readonly").objectStore("products").getAll());
                        const byName = {};
                        products.forEach((p) => {
                            byName[(p.name || "").toLowerCase().trim()] = p;
                        });

                        const includeOptional = noteWantsOptional(tx.note);
                        const lines = saleLinesFromTx(tx);
                        const merged = {};

                        for (const line of lines) {
                            if (!line.qty) {
                                result.lineStatus.push({ name: line.name, status: "ok", detail: "zero qty" });
                                continue;
                            }
                            const product = byName[(line.name || "").toLowerCase().trim()];
                            if (!product) {
                                result.lineStatus.push({ name: line.name, status: "no_recipe", detail: "name not in Costing products" });
                                continue;
                            }
                            const recipe = recipeFromCostingProduct(product);
                            if (!recipe.length) {
                                result.lineStatus.push({ name: line.name, status: "no_recipe", detail: "no material links in cost breakdown" });
                                continue;
                            }
                            let used = 0;
                            for (const rl of recipe) {
                                if (rl.optional && !includeOptional) continue;
                                const q = (Number(rl.qty) || 0) * line.qty;
                                if (!rl.materialId || q <= 0) continue;
                                merged[rl.materialId] = (merged[rl.materialId] || 0) + q;
                                used++;
                            }
                            result.lineStatus.push({ name: line.name, status: "ok", detail: used ? "deducted" : "no applicable lines" });
                        }

                        const note = "POS Sale #" + (tx.id || "?") + " — " + lines.map((l) => l.qty + "× " + l.name).join(", ");
                        const entries = Object.entries(merged);
                        if (entries.length) {
                            const wtx = cdb.transaction("stockMoves", "readwrite");
                            const store = wtx.objectStore("stockMoves");
                            for (const [materialId, qty] of entries) {
                                store.add({
                                    materialId: parseInt(materialId, 10),
                                    type: "out",
                                    qty: Number(qty),
                                    note: note,
                                    date: tx.date ? new Date(tx.date).getTime() : Date.now(),
                                    createdAt: Date.now(),
                                    source: "pos-sale",
                                    transactionId: tx.id || null,
                                    companyId: tx.companyId || null,
                                });
                                result.deducted++;
                            }
                            await new Promise((resolve, reject) => {
                                wtx.oncomplete = resolve;
                                wtx.onerror = () => reject(wtx.error);
                            });
                        }

                        const missing = result.lineStatus.filter((s) => s.status === "no_recipe");
                        const parts = [];
                        if (result.deducted) parts.push("Stock −" + result.deducted);
                        if (missing.length) parts.push("No recipe: " + missing.map((m) => m.name).join(", "));
                        result.message = parts.join(" · ");
                        return result;
                    } catch (err) {
                        console.warn("[inventory] deduct skipped", err);
                        result.ok = false;
                        result.message = "Inventory skipped (sale kept)";
                        result.lineStatus.push({ name: "(sale)", status: "error", detail: String(err && err.message ? err.message : err) });
                        return result;
                    }
                }

                /**
                 * Reverse inventory for a POS sale by writing compensating stock-ins (audit trail).
                 * Does not delete original outs. Groups by materialId from prior pos-sale outs for this transactionId.
                 * Multi-item sales are fully covered because all lines share the same transactionId.
                 */
                async function reverseCostingInventoryForSale(tx) {
                    const result = { ok: true, reversed: 0, message: "", skipped: false };
                    if (!tx || tx.type !== "sale" || tx.id == null) {
                        result.skipped = true;
                        result.message = "Not a sale";
                        return result;
                    }
                    try {
                        const cdb = await openCostingDB();
                        if (!cdb.objectStoreNames.contains("stockMoves")) {
                            result.skipped = true;
                            result.message = "No inventory store";
                            return result;
                        }
                        const all = await costingReq(cdb.transaction("stockMoves", "readonly").objectStore("stockMoves").getAll());
                        const priorOuts = (all || []).filter(
                            (m) =>
                                m.type === "out" &&
                                ((m.source === "pos-sale" && m.transactionId === tx.id) ||
                                    (m.note && (String(m.note).indexOf("Sale #" + tx.id) !== -1 || String(m.note).indexOf("POS#" + tx.id) !== -1))),
                        );
                        // Avoid double-reverse: if we already have reverse ins for this sale, skip
                        const priorReverses = (all || []).filter((m) => m.type === "in" && m.source === "pos-sale-reverse" && m.transactionId === tx.id);
                        if (!priorOuts.length) {
                            result.skipped = true;
                            result.message = "No inventory to reverse";
                            return result;
                        }
                        if (priorReverses.length) {
                            result.skipped = true;
                            result.message = "Inventory already reversed (" + priorReverses.length + " in)";
                            return result;
                        }

                        // Net out qty per material (sum outs)
                        const byMat = {};
                        priorOuts.forEach((m) => {
                            const id = m.materialId;
                            if (id == null) return;
                            byMat[id] = (byMat[id] || 0) + (Number(m.qty) || 0);
                        });
                        const entries = Object.entries(byMat).filter(([, q]) => q > 0);
                        if (!entries.length) {
                            result.skipped = true;
                            result.message = "No inventory to reverse";
                            return result;
                        }

                        const note =
                            "Reverse POS Sale #" +
                            tx.id +
                            " — " +
                            (tx.item ||
                                saleLinesFromTx(tx)
                                    .map((l) => l.qty + "× " + l.name)
                                    .join(", "));
                        const wtx = cdb.transaction("stockMoves", "readwrite");
                        const store = wtx.objectStore("stockMoves");
                        for (const [materialId, qty] of entries) {
                            store.add({
                                materialId: parseInt(materialId, 10),
                                type: "in",
                                qty: Number(qty),
                                note: note,
                                date: Date.now(),
                                createdAt: Date.now(),
                                source: "pos-sale-reverse",
                                transactionId: tx.id,
                                companyId: tx.companyId || null,
                                reversesTransactionId: tx.id,
                            });
                            result.reversed++;
                        }
                        await new Promise((resolve, reject) => {
                            wtx.oncomplete = resolve;
                            wtx.onerror = () => reject(wtx.error);
                        });
                        result.message = "Stock +" + result.reversed + " (reverse Sale #" + tx.id + ")";
                        return result;
                    } catch (err) {
                        console.warn("[inventory] reverse failed", err);
                        result.ok = false;
                        result.message = "Could not reverse inventory";
                        return result;
                    }
                }

                async function deleteTransactionWithInventoryReverse(id) {
                    const t = await dbGet("transactions", id);
                    if (!t) return { deleted: false, inv: null };
                    let inv = null;
                    if (t.type === "sale") {
                        inv = await reverseCostingInventoryForSale(t);
                    }
                    await dbDelete("transactions", id);
                    loadRecordedPosSaleIds(true).catch(() => {});
                    return { deleted: true, inv: inv, tx: t };
                }

                /* ---------- IndexedDB layer ---------- */
                const DB_NAME = "littleLedgerDB";
                const DB_VERSION = 5;
                let dbPromise = null;

                function openDB() {
                    if (dbPromise) return dbPromise;
                    dbPromise = new Promise((resolve, reject) => {
                        const req = indexedDB.open(DB_NAME, DB_VERSION);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            const tx = e.target.transaction;
                            let txStore, presetStore;
                            if (!db.objectStoreNames.contains("transactions")) {
                                txStore = db.createObjectStore("transactions", { keyPath: "id", autoIncrement: true });
                                txStore.createIndex("date", "date");
                                txStore.createIndex("type", "type");
                                txStore.createIndex("category", "category");
                                txStore.createIndex("companyId", "companyId");
                            } else {
                                txStore = tx.objectStore("transactions");
                                if (!txStore.indexNames.contains("companyId")) txStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("presets")) {
                                presetStore = db.createObjectStore("presets", { keyPath: "id", autoIncrement: true });
                                presetStore.createIndex("companyId", "companyId");
                            } else {
                                presetStore = tx.objectStore("presets");
                                if (!presetStore.indexNames.contains("companyId")) presetStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("settings")) {
                                db.createObjectStore("settings", { keyPath: "key" });
                            }
                            if (!db.objectStoreNames.contains("companies")) {
                                db.createObjectStore("companies", { keyPath: "id", autoIncrement: true });
                            }
                            // Forecast data (company-scoped)
                            if (!db.objectStoreNames.contains("assets")) {
                                const assetStore = db.createObjectStore("assets", { keyPath: "id", autoIncrement: true });
                                assetStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("recurringExpenses")) {
                                const recStore = db.createObjectStore("recurringExpenses", { keyPath: "id", autoIncrement: true });
                                recStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("plannedExpenses")) {
                                const planStore = db.createObjectStore("plannedExpenses", { keyPath: "id", autoIncrement: true });
                                planStore.createIndex("companyId", "companyId");
                            }
                            if (!db.objectStoreNames.contains("otherIncome")) {
                                const incStore = db.createObjectStore("otherIncome", { keyPath: "id", autoIncrement: true });
                                incStore.createIndex("companyId", "companyId");
                            }
                            // Saved transaction templates (recurring cut-offs: groceries, savings, transfers, etc.)
                            if (!db.objectStoreNames.contains("txTemplates")) {
                                const tplStore = db.createObjectStore("txTemplates", { keyPath: "id", autoIncrement: true });
                                tplStore.createIndex("companyId", "companyId");
                                tplStore.createIndex("type", "type");
                            }
                        };
                        req.onsuccess = (e) => resolve(e.target.result);
                        req.onerror = (e) => reject(e.target.error);
                    });
                    return dbPromise;
                }

                function reqP(req) {
                    return new Promise((resolve, reject) => {
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                }

                async function dbAdd(storeName, value) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    const p = reqP(tx.objectStore(storeName).add(value));
                    return p;
                }
                async function dbPut(storeName, value) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).put(value));
                }
                async function dbDelete(storeName, key) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).delete(key));
                }
                async function dbGetAll(storeName) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readonly");
                    return reqP(tx.objectStore(storeName).getAll());
                }
                async function dbClear(storeName) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    return reqP(tx.objectStore(storeName).clear());
                }
                async function dbGet(storeName, key) {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readonly");
                    return reqP(tx.objectStore(storeName).get(key));
                }

                /* ---------- Settings & company helpers ---------- */
                const DEFAULT_SALE_CATEGORIES = ["Document Printing", "Ukay-Ukay", "School Supplies"];
                const DEFAULT_EXPENSE_CATEGORIES = ["Restock", "Supplies & Materials", "Utilities", "Rent", "Transportation", "Other"];
                const DEFAULT_PRESET_SEED = [
                    { type: "sale", category: "Document Printing", name: "Photocopy (B&W)", price: 2 },
                    { type: "sale", category: "Document Printing", name: "Print — Colored", price: 10 },
                    { type: "sale", category: "Document Printing", name: "Print — B&W", price: 5 },
                    { type: "sale", category: "Document Printing", name: "Scan to file", price: 10 },
                    { type: "sale", category: "School Supplies", name: "Ballpen", price: 10 },
                    { type: "sale", category: "School Supplies", name: "Notebook", price: 25 },
                    { type: "sale", category: "School Supplies", name: "Bond Paper (per sheet)", price: 2 },
                ];

                async function getSetting(key, fallback) {
                    const rec = await dbGet("settings", key);
                    return rec ? rec.value : fallback;
                }
                async function setSetting(key, value) {
                    return dbPut("settings", { key, value });
                }

                async function listCompanies() {
                    const all = await dbGetAll("companies");
                    return all.sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
                }
                async function getActiveCompanyId() {
                    let id = await getSetting("activeCompanyId", null);
                    const companies = await listCompanies();
                    if (id == null || !companies.some((c) => c.id === id)) {
                        id = companies.length ? companies[0].id : null;
                        if (id != null) await setSetting("activeCompanyId", id);
                    }
                    return id;
                }
                async function getActiveCompany() {
                    const id = await getActiveCompanyId();
                    if (id == null) return null;
                    return dbGet("companies", id);
                }
                async function updateActiveCompany(patch) {
                    const company = await getActiveCompany();
                    if (!company) return null;
                    const updated = Object.assign({}, company, patch);
                    await dbPut("companies", updated);
                    return updated;
                }
                async function seedDefaultPresetsForCompany(companyId) {
                    for (let i = 0; i < DEFAULT_PRESET_SEED.length; i++) {
                        await dbAdd("presets", Object.assign({ companyId, order: i }, DEFAULT_PRESET_SEED[i]));
                    }
                }
                async function createCompany(name) {
                    const company = {
                        name: (name || "").trim() || "New Company",
                        categories: { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                        startingCash: 0,
                        startingGcash: 0,
                        startingBank: 0,
                        startingReceivable: 0,
                        createdAt: new Date().toISOString(),
                    };
                    const id = await dbAdd("companies", company);
                    await seedDefaultPresetsForCompany(id);
                    return id;
                }

                async function seedIfEmpty() {
                    const companies = await dbGetAll("companies");
                    if (companies.length === 0) {
                        // One-time migration from the old single-tenant schema (global settings) into the first company.
                        const legacyName = await dbGet("settings", "businessName");
                        const legacyCats = await dbGet("settings", "categories");
                        const legacyCash = await dbGet("settings", "startingCash");
                        const legacyGcash = await dbGet("settings", "startingGcash");
                        const legacyBank = await dbGet("settings", "startingBank");
                        const company = {
                            name: (legacyName && legacyName.value) || "My Shop",
                            categories: (legacyCats && legacyCats.value) || { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                            startingCash: (legacyCash && legacyCash.value) || 0,
                            startingGcash: (legacyGcash && legacyGcash.value) || 0,
                            startingBank: (legacyBank && legacyBank.value) || 0,
                            startingReceivable: 0,
                            createdAt: new Date().toISOString(),
                        };
                        const id = await dbAdd("companies", company);
                        await setSetting("activeCompanyId", id);

                        // Carry over any pre-existing transactions/presets (from the old single-tenant version) into this company.
                        const oldTx = await dbGetAll("transactions");
                        for (const t of oldTx) {
                            if (t.companyId == null) {
                                t.companyId = id;
                                await dbPut("transactions", t);
                            }
                        }
                        const oldPresets = await dbGetAll("presets");
                        for (const p of oldPresets) {
                            if (p.companyId == null) {
                                p.companyId = id;
                                await dbPut("presets", p);
                            }
                        }

                        for (const k of ["businessName", "categories", "startingCash", "startingGcash", "startingBank"]) {
                            const rec = await dbGet("settings", k);
                            if (rec) await dbDelete("settings", k);
                        }

                        if (oldPresets.length === 0) await seedDefaultPresetsForCompany(id);
                    } else {
                        // Make sure there's always a valid active company pointer.
                        await getActiveCompanyId();
                        // Guard: a company created before preset seeding existed shouldn't be stuck empty.
                        const cid = await getActiveCompanyId();
                        const presets = (await dbGetAll("presets")).filter((p) => p.companyId === cid);
                        const anyTx = (await dbGetAll("transactions")).some((t) => t.companyId === cid);
                        if (presets.length === 0 && !anyTx) await seedDefaultPresetsForCompany(cid);
                    }
                }

                /* ---------- Utils ---------- */
                function fmtPeso(n) {
                    const v = Number(n) || 0;
                    return "\u20b1" + v.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
                function pad2(n) {
                    return String(n).padStart(2, "0");
                }
                function toLocalInputValue(d) {
                    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
                }
                function fmtDateHeader(dateStr) {
                    const d = new Date(dateStr);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const that = new Date(d);
                    that.setHours(0, 0, 0, 0);
                    const diffDays = Math.round((today - that) / 86400000);
                    const opts = { weekday: "short", month: "short", day: "numeric" };
                    if (diffDays === 0) return "Today · " + d.toLocaleDateString("en-PH", opts);
                    if (diffDays === 1) return "Yesterday · " + d.toLocaleDateString("en-PH", opts);
                    return d.toLocaleDateString("en-PH", opts);
                }
                function fmtTime(dateStr) {
                    const d = new Date(dateStr);
                    return d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
                }
                function startOfDay(d) {
                    const x = new Date(d);
                    x.setHours(0, 0, 0, 0);
                    return x;
                }
                function endOfDay(d) {
                    const x = new Date(d);
                    x.setHours(23, 59, 59, 999);
                    return x;
                }
                function startOfWeek(d) {
                    const x = startOfDay(d);
                    const day = x.getDay();
                    const diff = day === 0 ? 6 : day - 1;
                    x.setDate(x.getDate() - diff);
                    return x;
                }
                function startOfMonth(d) {
                    const x = startOfDay(d);
                    x.setDate(1);
                    return x;
                }

                function uid() {
                    return "id" + Date.now() + Math.random().toString(16).slice(2);
                }

                /* Return the line items for a transaction. Sale/expense records created before the
                   multi-line-item feature only had a single item/category/qty/unitPrice/amount on the
                   record itself — treat that as a one-line list so every render path can just use .lines(). */
                function txLines(t) {
                    if (Array.isArray(t.items) && t.items.length) return t.items;
                    if (t.type === "sale" || t.type === "expense") {
                        return [{ category: t.category, item: t.item, qty: t.qty, unitPrice: t.unitPrice, amount: t.amount }];
                    }
                    return [];
                }

                function el(tag, attrs, children) {
                    const node = document.createElement(tag);
                    if (attrs)
                        for (const k in attrs) {
                            if (k === "class") node.className = attrs[k];
                            else if (k === "html") node.innerHTML = attrs[k];
                            else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
                            else node.setAttribute(k, attrs[k]);
                        }
                    if (children)
                        for (const c of [].concat(children)) {
                            if (c == null) continue;
                            node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
                        }
                    return node;
                }
                const SVG_NS = "http://www.w3.org/2000/svg";
                function elSVG(tag, attrs, children) {
                    const node = document.createElementNS(SVG_NS, tag);
                    if (attrs)
                        for (const k in attrs) {
                            if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
                            else node.setAttribute(k, attrs[k]);
                        }
                    if (children)
                        for (const c of [].concat(children)) {
                            if (c == null) continue;
                            node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
                        }
                    return node;
                }
                function qs(sel, root) {
                    return (root || document).querySelector(sel);
                }
                function qsa(sel, root) {
                    return Array.from((root || document).querySelectorAll(sel));
                }

                function toast(msg) {
                    const host = qs("#toastHost");
                    const t = el("div", { class: "toast" }, msg);
                    host.appendChild(t);
                    requestAnimationFrame(() => t.classList.add("show"));
                    setTimeout(() => {
                        t.classList.remove("show");
                        setTimeout(() => t.remove(), 250);
                    }, 2200);
                }

                /* ---------- App state ---------- */
                const App = {
                    addType: "sale", // 'sale' | 'expense' | 'transfer'
                    selectedCategory: null,
                    transferFrom: "gcash",
                    transferTo: "cash",
                    saleLines: [], // line items staged for the transaction currently being built on the Add page
                    historyFilters: { range: "today", type: "all", category: "all", inventory: "all", search: "", from: null, to: null },
                    reportRange: "today",
                    reportCustom: { from: null, to: null },
                    trendRange: "30d", // '7d' | '30d' | '90d' | 'all' — shared by both trend charts on Reports
                    // Series a person has tapped off in each chart's legend (e.g. hiding Transfers because
                    // a big owner transfer dwarfs day-to-day sales/expenses on the shared scale). Net is off
                    // by default on the flow chart so the chart opens on gross activity, not profit.
                    trendHidden: { balance: [], flow: ["net"] },
                    editingId: null,
                    forecastHorizonDays: 30, // projection window for cash-on-hand / revenue
                    forecastTargetDate: null, // optional ISO date string for "cash on hand by date"
                };

                /* ---------- Routing ---------- */
                function currentRoute() {
                    const h = location.hash.replace("#/", "") || "home";
                    return h.split("?")[0];
                }
                let _lastRenderedRoute = null;
                window.addEventListener("hashchange", () => render({ scroll: "top" }));

                /**
                 * @param {{ scroll?: "top" | "preserve" | "none" }} [opts]
                 * - top: jump to top (route changes)
                 * - preserve: keep scroll position (edits / filter refreshes) — default when re-rendering same route
                 * - none: leave scroll alone
                 */
                async function render(opts) {
                    opts = opts || {};
                    const route = currentRoute();
                    const routeChanged = _lastRenderedRoute !== route;
                    const scrollMode = opts.scroll || (routeChanged ? "top" : "preserve");
                    const y = scrollMode === "preserve" ? window.scrollY || window.pageYOffset || 0 : 0;

                    qsa(".navbtn").forEach((b) => b.classList.toggle("active", b.dataset.route === route));
                    const main = qs("#app");
                    main.innerHTML = "";
                    if (route === "home") main.appendChild(await renderHome());
                    else if (route === "add") main.appendChild(await renderAdd());
                    else if (route === "history") main.appendChild(await renderHistory());
                    else if (route === "reports") main.appendChild(await renderReports());
                    else if (route === "forecast") main.appendChild(await renderForecast());
                    else if (route === "settings") main.appendChild(await renderSettings());
                    else main.appendChild(await renderHome());

                    _lastRenderedRoute = route;
                    if (scrollMode === "top") {
                        window.scrollTo(0, 0);
                    } else if (scrollMode === "preserve") {
                        requestAnimationFrame(() => window.scrollTo(0, y));
                    }
                }

                /** Soft refresh: same route, keep scroll (use after edits instead of full navigate). */
                function softRender() {
                    return render({ scroll: "preserve" });
                }

                async function getPersistedInvestmentSim() {
                    const cid = await getActiveCompanyId();
                    if (cid == null) return null;
                    return getSetting("investmentSim_" + cid, null);
                }
                async function persistInvestmentSim(sim) {
                    const cid = await getActiveCompanyId();
                    if (cid == null) return;
                    await setSetting("investmentSim_" + cid, Object.assign({}, sim, { savedAt: new Date().toISOString() }));
                }

                /* ---------- Data queries ---------- */
                async function allTx() {
                    const cid = await getActiveCompanyId();
                    const all = await dbGetAll("transactions");
                    return all.filter((t) => t.companyId === cid);
                }
                async function companyPresets() {
                    const cid = await getActiveCompanyId();
                    const all = await dbGetAll("presets");
                    return all.filter((p) => p.companyId === cid);
                }
                async function companyTxTemplates(typeFilter) {
                    const cid = await getActiveCompanyId();
                    const all = await dbGetAll("txTemplates");
                    let list = all.filter((t) => t.companyId === cid);
                    if (typeFilter) list = list.filter((t) => t.type === typeFilter);
                    return list
                        .map((t, i) => ({ t, i }))
                        .sort((a, b) => {
                            const oa = a.t.order != null ? a.t.order : a.i;
                            const ob = b.t.order != null ? b.t.order : b.i;
                            return oa - ob;
                        })
                        .map((x) => x.t);
                }

                /* Sort presets for display. Presets carry an explicit `order` (position within their
                   category) once the user has touched reordering or Settings has backfilled it; presets
                   that predate the `order` field fall back to their original (insertion/id) sequence,
                   keeping the sort stable via each preset's index in the input array. */
                function sortPresets(list) {
                    return list
                        .map((p, i) => ({ p, i }))
                        .sort((a, b) => {
                            const oa = a.p.order != null ? a.p.order : a.i;
                            const ob = b.p.order != null ? b.p.order : b.i;
                            return oa - ob;
                        })
                        .map((x) => x.p);
                }

                async function computeAccountBalances(txsOverride) {
                    const company = await getActiveCompany();
                    const startCash = company ? company.startingCash : 0;
                    const startGcash = company ? company.startingGcash : 0;
                    const startBank = company ? company.startingBank : 0;
                    const startReceivable = company ? company.startingReceivable : 0;
                    const txs = txsOverride || (await allTx());
                    const bal = {
                        cash: Number(startCash) || 0,
                        gcash: Number(startGcash) || 0,
                        bank: Number(startBank) || 0,
                        receivable: Number(startReceivable) || 0,
                    };
                    for (const t of txs) {
                        if (t.type === "sale" && bal.hasOwnProperty(t.payment)) bal[t.payment] += Number(t.amount) || 0;
                        else if (t.type === "expense" && bal.hasOwnProperty(t.payment)) bal[t.payment] -= Number(t.amount) || 0;
                        else if (t.type === "transfer") {
                            if (bal.hasOwnProperty(t.fromAccount)) bal[t.fromAccount] -= Number(t.amount) || 0;
                            if (bal.hasOwnProperty(t.toAccount)) bal[t.toAccount] += Number(t.amount) || 0;
                        }
                    }
                    return bal;
                }

                function inRange(dateStr, from, to) {
                    const d = new Date(dateStr).getTime();
                    return d >= from.getTime() && d <= to.getTime();
                }

                function sumBy(txs, pred) {
                    return txs.filter(pred).reduce((s, t) => s + Number(t.amount || 0), 0);
                }

                function txRow(t) {
                    const isSale = t.type === "sale";
                    const isTransfer = t.type === "transfer";
                    const lines = txLines(t);
                    const row = el("div", { class: "txrow", "data-id": t.id });
                    let titleText = t.item;
                    let subtitle;
                    if (isTransfer) {
                        subtitle = `${accountLabel(t.fromAccount)} \u2192 ${accountLabel(t.toAccount)} · ${fmtTime(t.date)}`;
                    } else if (lines.length > 1) {
                        titleText = `${lines.length} items`;
                        const catSet = Array.from(new Set(lines.map((l) => l.category))).join(", ");
                        subtitle = `${catSet} · ${fmtTime(t.date)} · ${paymentLabel(t.payment)}`;
                    } else {
                        subtitle = `${t.category} · ${fmtTime(t.date)} · ${paymentLabel(t.payment)}`;
                    }

                    const titleKids = [];
                    if (isSale && t.id != null) {
                        titleKids.push(el("span", { class: "sale-id" }, "Sale #" + t.id));
                    }
                    titleKids.push(document.createTextNode(titleText || ""));
                    if (isSale) {
                        if (t.excludeFromForecast) {
                            titleKids.push(el("span", { class: "badge-warn", title: "Excluded from Forecast averages and demand rankings (still in books & inventory)" }, "excl. forecast"));

                        if (t.payment === "receivable") {
                            if (t.collectedAt) {
                                titleKids.push(el("span", { class: "badge-inv ok", title: "Receivable collected" }, "collected"));
                            } else {
                                titleKids.push(el("span", { class: "badge-inv missing", title: "Awaiting payment — inventory already tracked" }, "receivable"));
                            }
                        }
                        const recorded = isSaleRecordedInInventory(t);
                        if (recorded === false) {
                            titleKids.push(el("span", { class: "badge-inv missing", title: "No stock-out in Costing for this sale yet" }, "not in inventory"));
                        }
                        const missingNames = lines.map((l) => l.item).filter((n) => n && !hasCostingProduct(n));
                        if (missingNames.length) {
                            titleKids.push(
                                el(
                                    "span",
                                    {
                                        class: "badge-warn",
                                        title: "Not in Costing products: " + missingNames.join(", "),
                                    },
                                    missingNames.length === 1 ? "no Costing" : missingNames.length + " no Costing",
                                ),

                        }
                    }

                    row.appendChild(el("div", { class: "txrow-main" }, [el("div", { class: "txrow-title" }, titleKids), el("div", { class: "txrow-sub" }, subtitle)]));
                    const amtClass = isSale ? "sales" : isTransfer ? "transfer" : "expenses";
                    const sign = isSale ? "+" : isTransfer ? "" : "\u2212";
                    row.appendChild(el("div", { class: "txrow-amt " + amtClass }, sign + fmtPeso(t.amount)));

                    row.addEventListener("click", () => openEditModal(t.id));

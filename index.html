                        const volTop = topByQty[0] ? topByQty[0].name + " (qty " + Math.round(topByQty[0].qty) + ")" : "n/a";
                        let verdict = "";
                        if (price <= 0) verdict = "Enter a price.";
                        else if (cashAfter < 0 && otherIncomeInWindowAmt + liquid < price)
                            verdict = "Not enough liquid today even with expected other income in the window — need credit, SpayLater, larger external income, or wait.";
                        else if (cashAfter < 0)
                            verdict = "Short on liquid today, but expected other income (~" + fmtPeso(otherIncomeInWindowAmt) + ") in the horizon may cover the gap if it arrives on time.";
                        else if (monthsCovered != null && monthsCovered < 1) verdict = "Possible, but remaining cash covers under 1 month of fixed costs — high stress if sales or other income slip.";
                        else if (monthsCovered != null && monthsCovered < 2) verdict = "Tight. Prefer ~2+ months of fixed costs after the buy, or confirm other income timing.";
                        else if (projectedAfter < monthlyRecurring) verdict = "Horizon projection looks thin after the purchase — confirm volume demand (" + volTop + ") justifies the machine.";
                        else

                                "Buffer looks workable on paper (incl. other income in projection). Demand by volume: " + volTop + ". Still allow for ink/maintenance and delayed external income.";

                            name,

                            cashAfter,

                async function applyRemotePos(remote) {
  if (!remote) return;
  const putAll = async (store, arr) => {
    for (const rec of arr || []) {
      if (rec && rec.id != null) await dbPut(store, rec);
    }
  };
  await putAll("transactions", remote.transactions);
  await putAll("presets", remote.presets);
  await putAll("companies", remote.companies);
  await putAll("assets", remote.assets);
  await putAll("recurringExpenses", remote.recurringExpenses);
  await putAll("plannedExpenses", remote.plannedExpenses);
  await putAll("otherIncome", remote.otherIncome);
  await putAll("txTemplates", remote.txTemplates);
  if (remote.settings) {
    for (const [key, value] of Object.entries(remote.settings)) {
      await setSetting(key, value); // your existing helper
    }
  }
  // Refresh current view
  if (typeof render === "function") render();
}

                async function presetManager(cats) {

                        list.innerHTML = "";

                        // Backfill a stable `order` on presets that predate the reordering feature, so
                        // dragging via the up/down buttons has real values to swap from the start.
                        let needsBackfill = presets.some((p) => p.order == null);
                        if (needsBackfill) {
                            for (let i = 0; i < presets.length; i++) {
                                if (presets[i].order !== i) {
                                    presets[i] = Object.assign({}, presets[i], { order: i });
                                    await dbPut("presets", presets[i]);
                                }
                            }
                        }

                        if (presets.length === 0) {
                            list.appendChild(el("div", { class: "empty small" }, "No quick items yet for this category."));

                            const upBtn = el("button", { type: "button", class: "reorder-btn" }, "\u25b2");
                            const downBtn = el("button", { type: "button", class: "reorder-btn" }, "\u25bc");

                            if (idx === presets.length - 1) downBtn.setAttribute("disabled", "disabled");
                            upBtn.addEventListener("click", async () => {
                                if (idx === 0) return;
                                const other = presets[idx - 1];
                                const myOrder = p.order;
                                await dbPut("presets", Object.assign({}, p, { order: other.order }));
                                await dbPut("presets", Object.assign({}, other, { order: myOrder }));
                                refresh();
                            });
                            downBtn.addEventListener("click", async () => {
                                if (idx === presets.length - 1) return;
                                const other = presets[idx + 1];
                                const myOrder = p.order;
                                await dbPut("presets", Object.assign({}, p, { order: other.order }));
                                await dbPut("presets", Object.assign({}, other, { order: myOrder }));
                                refresh();

                            const nameInpRow = el("input", {

                                catSel.appendChild(opt);

                            async function savePresetPatch(patch) {
                                const updated = Object.assign({}, p, patch);

                                // keep local ref in sync for further edits without full refresh when possible
                                Object.assign(p, updated);
                            }

                            nameInpRow.addEventListener("change", async () => {
                                const name = nameInpRow.value.trim();
                                if (!name) {
                                    nameInpRow.value = p.name || "";
                                    toast("Name cannot be empty");
                                    return;
                                }
                                if (name === p.name) return;
                                await savePresetPatch({ name });
                                toast("Preset name saved");
                            });
                            priceInpRow.addEventListener("change", async () => {
                                const price = parseFloat(priceInpRow.value);
                                if (!isFinite(price) || price < 0) {
                                    priceInpRow.value = p.price != null ? p.price : "";
                                    toast("Enter a valid price");
                                    return;
                                }
                                if (price === Number(p.price)) return;
                                await savePresetPatch({ price });
                                toast("Preset price saved");
                            });
                            catSel.addEventListener("change", async () => {
                                const category = catSel.value;

                            const row = el("div", { class: "presetrow" }, [

                            ]);

                                if (!confirm('Delete preset "' + (p.name || "") + '"?')) return;
                                await dbDelete("presets", p.id);
                                refresh();

                            list.appendChild(row);
                        });

                    catSelect.addEventListener("change", refresh);

                    const addBtn = el("button", { type: "button", class: "smallbtn" }, "Add");

                            toast("Enter a valid price");

                        const cid = await getActiveCompanyId();
                        const existingInCat = (await companyPresets()).filter((p) => p.category === catSelect.value);
                        const nextOrder = existingInCat.length ? Math.max(...existingInCat.map((p) => (p.order != null ? p.order : 0))) + 1 : 0;
                        await dbAdd("presets", { type: "sale", category: catSelect.value, name, price, companyId: cid, order: nextOrder });
                        nameInp.value = "";

                        refresh();
                    });

                    card.appendChild(addRow);

                    return card;

                        dbGetAll("transactions"),
                        dbGetAll("presets"),
                        dbGetAll("settings"),
                        dbGetAll("companies"),
                        dbGetAll("assets").catch(() => []),
                        dbGetAll("recurringExpenses").catch(() => []),
                        dbGetAll("plannedExpenses").catch(() => []),
                        dbGetAll("otherIncome").catch(() => []),
                        dbGetAll("txTemplates").catch(() => []),
                    ]);
                    const payload = {
                        app: "little-ledger-pos",
                        exportedAt: new Date().toISOString(),
                        version: 5,
                        transactions,
                        presets,
                        settings: settingsArr,
                        companies,
                        assets,
                        recurringExpenses,
                        plannedExpenses,
                        otherIncome,
                        txTemplates,
                    };
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
                    a.href = url;
                    a.download = `little-ledger-backup-${stamp}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    toast("Database exported");
                }

                async function importDB(file) {
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);
                        if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.presets) || !Array.isArray(data.settings)) {
                            toast("This file doesn\u2019t look like a valid backup");
                            return;
                        }
                        if (!confirm(`Import ${data.transactions.length} transaction(s)? This replaces ALL data currently on this device.`)) return;

                        await dbClear("transactions");
                        await dbClear("presets");
                        await dbClear("settings");
                        await dbClear("companies");
                        try {
                            await dbClear("assets");
                            await dbClear("recurringExpenses");
                            await dbClear("plannedExpenses");
                            await dbClear("otherIncome");
                            await dbClear("txTemplates");
                        } catch (e) {}

                        const hasCompanies = Array.isArray(data.companies) && data.companies.length > 0;
                        if (hasCompanies) {
                            for (const c of data.companies) await dbPut("companies", c);
                            for (const t of data.transactions) await dbPut("transactions", t);
                            for (const p of data.presets) await dbPut("presets", p);
                            for (const s of data.settings) await dbPut("settings", s);
                            if (Array.isArray(data.assets)) for (const a of data.assets) await dbPut("assets", a);
                            if (Array.isArray(data.recurringExpenses)) for (const r of data.recurringExpenses) await dbPut("recurringExpenses", r);
                            if (Array.isArray(data.plannedExpenses)) for (const p of data.plannedExpenses) await dbPut("plannedExpenses", p);
                            if (Array.isArray(data.otherIncome)) for (const o of data.otherIncome) await dbPut("otherIncome", o);
                            if (Array.isArray(data.txTemplates)) for (const t of data.txTemplates) await dbPut("txTemplates", t);
                        } else {
                            // Old single-tenant backup (no companies array) — wrap everything into one company.
                            const legacySettings = {};
                            for (const s of data.settings) legacySettings[s.key] = s.value;
                            const company = {
                                name: legacySettings.businessName || "My Shop",
                                categories: legacySettings.categories || { sale: DEFAULT_SALE_CATEGORIES.slice(), expense: DEFAULT_EXPENSE_CATEGORIES.slice() },
                                startingCash: legacySettings.startingCash || 0,
                                startingGcash: legacySettings.startingGcash || 0,
                                startingBank: legacySettings.startingBank || 0,
                                startingReceivable: legacySettings.startingReceivable || 0,
                                createdAt: new Date().toISOString(),
                            };
                            const cid = await dbAdd("companies", company);
                            for (const t of data.transactions) {
                                t.companyId = cid;
                                await dbPut("transactions", t);
                            }
                            for (const p of data.presets) {
                                p.companyId = cid;
                                await dbPut("presets", p);
                            }
                            await setSetting("activeCompanyId", cid);
                        }
                        toast("Database imported successfully");
                        location.hash = "#/home";
                    } catch (err) {
                        console.error(err);
                        toast("Could not read that file");
                    }
                }

                /* ---------- Init ---------- */
                async function init() {
                    await openDB();
                    await seedIfEmpty();
                    qsa(".navbtn").forEach((b) =>
                        b.addEventListener("click", (e) => {
                            if (b.dataset.route === "add") {
                                App.selectedCategory = null;
                                App.saleLines = [];
                            }
                        }),
                    );
                    if (!location.hash) {
                        // Setting the hash triggers the 'hashchange' listener, which calls render() itself —
                        // don't also call render() here or the first page loads (and re-queries IndexedDB) twice.
                        location.hash = "#/home";
                    } else {
                        // Hash was already set (e.g. reload/deep link) — no hashchange event will fire, so render directly.
                        render();
                    }
                }

                document.addEventListener("DOMContentLoaded", init);
            })();
        </script>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("sw.js").catch((err) => {
                        console.error("SW registration failed:", err);
                    });
                });

                // Auto-refresh once when a new SW version takes control.
                let refreshing = false;
                navigator.serviceWorker.addEventListener("controllerchange", () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            }
        </script>
    </body>
</html>

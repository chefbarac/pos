                    }

                    let itemInp = null;
                    if (isTransfer) {
                        modal.appendChild(el("label", { class: "flabel" }, "Description"));
                        itemInp = el("input", { type: "text", class: "finput", value: t.item });
                        modal.appendChild(itemInp);
                        modal.appendChild(el("label", { class: "flabel" }, "Amount"));
                        modal.appendChild(amtInp);
                    } else {
                        modal.appendChild(amtInp);
                    }

                    let payRow = null,
                        fromRow = null,
                        toRow = null;
                    let editFrom = t.fromAccount,
                        editTo = t.toAccount;
                    if (isTransfer) {
                        modal.appendChild(el("label", { class: "flabel" }, "From"));
                        fromRow = buildAccountChips(editFrom, (v) => {
                            editFrom = v;
                        });
                        modal.appendChild(fromRow);
                        modal.appendChild(el("label", { class: "flabel" }, "To"));
                        toRow = buildAccountChips(editTo, (v) => {
                            editTo = v;
                        });
                        modal.appendChild(toRow);
                    } else {
                        modal.appendChild(el("label", { class: "flabel" }, "Payment Method"));
                        payRow = el("div", { class: "chiprow" });
                        const editPayOptions = t.type === "sale" ? ["cash", "gcash", "bank", "receivable", "other"] : ["cash", "gcash", "bank", "payable", "other"];
                        editPayOptions.forEach((p) => {
                            const chip = el("button", { type: "button", class: "chip pay" + (t.payment === p ? " active" : "") }, paymentLabel(p));
                            chip.dataset.value = p;
                            chip.addEventListener("click", () => {
                                qsa(".chip.pay", payRow).forEach((c) => c.classList.remove("active"));
                                chip.classList.add("active");

                            payRow.appendChild(chip);
                        });
                        modal.appendChild(payRow);
                        if (t.type === "sale" && t.payment === "receivable" && !t.collectedAt) {
                            modal.appendChild(
                                el("div", { class: "help-text", style: "margin-top:8px" }, "This sale is on receivable. Inventory is tracked. Use “Mark as paid” below when the customer pays."),
                            );
                        } else if (t.type === "sale" && t.collectedAt) {
                            modal.appendChild(
                                el(
                                    "div",
                                    { class: "help-text", style: "margin-top:8px" },
                                    "Collected " + new Date(t.collectedAt).toLocaleString("en-PH") + (t.collectedTo ? " → " + accountLabel(t.collectedTo) : "") + ".",
                                ),
                            );
                        } else if (t.type === "expense" && t.payment === "payable" && !t.settledAt) {
                            modal.appendChild(
                                el(
                                    "div",
                                    { class: "help-text", style: "margin-top:8px" },
                                    "This expense is on accounts payable. Use “Mark as paid” below when you settle it from Cash, GCash, or Bank.",
                                ),
                            );
                        } else if (t.type === "expense" && t.settledAt) {
                            modal.appendChild(
                                el(
                                    "div",
                                    { class: "help-text", style: "margin-top:8px" },
                                    "Settled " + new Date(t.settledAt).toLocaleString("en-PH") + (t.settledFrom ? " from " + accountLabel(t.settledFrom) : "") + ".",
                                ),
                            );
                        }
                    }

                    let tenderedInp = null;
                    if (t.type === "sale") {
                        modal.appendChild(el("label", { class: "flabel" }, "Amount Tendered (optional)"));
                        tenderedInp = el("input", { type: "number", class: "finput", value: t.tendered != null ? t.tendered : "", min: "0", step: "0.01" });
                        modal.appendChild(tenderedInp);
                        const changeNow = t.tendered != null ? +(t.tendered - t.amount).toFixed(2) : null;
                        modal.appendChild(
                            el("div", { class: "totalsrow change" + (changeNow != null && changeNow < 0 ? " short" : "") }, [
                                el("span", {}, "Change Due"),
                                el("span", { class: "val" }, changeNow == null ? fmtPeso(0) : changeNow < 0 ? "Short " + fmtPeso(Math.abs(changeNow)) : fmtPeso(changeNow)),
                            ]),
                        );
                    }

                    modal.appendChild(el("label", { class: "flabel" }, "Date & Time"));
                    const dateInp = el("input", { type: "datetime-local", class: "finput", value: toLocalInputValue(new Date(t.date)) });

                    modal.appendChild(el("label", { class: "flabel" }, "Note"));
                    const noteInp = el("input", { type: "text", class: "finput", value: t.note || "" });

                    let excludeForecastChk = null;
                    if (t.type === "sale") {

                        excludeForecastChk = el("input", {

                        if (t.excludeFromForecast) excludeForecastChk.checked = true;
                        exclWrap.appendChild(excludeForecastChk);
                        exclWrap.appendChild(document.createTextNode("Exclude from Forecast (bulk / personal / one-off that skews averages). Sale stays in History, balances, and inventory."));

                    const btnKids = [
                        el("button", { type: "button", class: "bigbtn ghost" }, "Cancel"),
                        el("button", { type: "button", class: "bigbtn danger" }, "Delete"),
                        el("button", { type: "button", class: "bigbtn sale" }, "Save"),

                    if (applyInvBtn) {

                    if (markPaidBtn) {

                    saveBtn.addEventListener("click", async () => {

                            if (newLines.length === 1) {

                            } else if (newLines.length > 1) {

                    overlay.appendChild(modal);

                }

                /* ---------- TREND CHARTS (Reports) ---------- */
                const TREND_RANGES = [
                    ["7d", "7D"],
                    ["30d", "30D"],
                    ["90d", "90D"],
                    ["all", "Monthly"],
                ];

                /* Build the bucket boundaries for a trend range: daily buckets for 7d/30d/90d,
                   or monthly buckets (capped at the most recent 12) for 'all'. */
                function trendBucketDefs(range, earliestTxDate) {
                    const now = new Date();
                    if (range === "all") {
                        const first = earliestTxDate ? new Date(earliestTxDate) : now;
                        let cursor = new Date(first.getFullYear(), first.getMonth(), 1);
                        const endCursor = new Date(now.getFullYear(), now.getMonth(), 1);
                        const buckets = [];
                        while (cursor <= endCursor) {
                            const start = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
                            const end = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0, 23, 59, 59, 999);
                            buckets.push({ label: start.toLocaleDateString("en-PH", { month: "short", year: "2-digit" }), start, end });
                            cursor.setMonth(cursor.getMonth() + 1);
                        }
                        return buckets.slice(-12);
                    }
                    const days = range === "7d" ? 7 : range === "90d" ? 90 : 30;
                    const buckets = [];
                    for (let i = days - 1; i >= 0; i--) {
                        const d = new Date(now);
                        d.setDate(d.getDate() - i);
                        buckets.push({ label: d.toLocaleDateString("en-PH", { month: "short", day: "numeric" }), start: startOfDay(d), end: endOfDay(d) });
                    }
                    return buckets;
                }

                /* Walk all transactions once (oldest→newest) and, for each bucket, record the running
                   account balances as of the bucket's end plus the sales/expenses/transfers that landed
                   inside that bucket. Balances accumulate across the *entire* history (not just the
                   visible window) so the chart always reflects the true running balance. */
                async function computeTrendSeries(range) {
                    const txs = (await allTx()).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
                    const company = await getActiveCompany();
                    let cash = company ? Number(company.startingCash) || 0 : 0;
                    let gcash = company ? Number(company.startingGcash) || 0 : 0;
                    let bank = company ? Number(company.startingBank) || 0 : 0;
                    let receivable = company ? Number(company.startingReceivable) || 0 : 0;
                    let payable = company ? Number(company.startingPayable) || 0 : 0;

                    const buckets = trendBucketDefs(range, txs.length ? txs[0].date : null);
                    let i = 0;
                    const out = [];
                    for (const b of buckets) {
                        let sales = 0,
                            expenses = 0,
                            transfers = 0;
                        while (i < txs.length && new Date(txs[i].date) <= b.end) {
                            const t = txs[i];
                            const amt = Number(t.amount) || 0;
                            if (t.type === "sale") {
                                sales += amt;
                                if (t.payment === "cash") cash += amt;
                                else if (t.payment === "gcash") gcash += amt;
                                else if (t.payment === "bank") bank += amt;
                                else if (t.payment === "receivable") receivable += amt;
                            } else if (t.type === "expense") {
                                expenses += amt;
                                if (t.payment === "cash") cash -= amt;
                                else if (t.payment === "gcash") gcash -= amt;
                                else if (t.payment === "bank") bank -= amt;
                                else if (t.payment === "payable") payable += amt;
                            } else if (t.type === "transfer") {
                                transfers += amt;
                                if (t.fromAccount === "cash") cash -= amt;
                                else if (t.fromAccount === "gcash") gcash -= amt;
                                else if (t.fromAccount === "bank") bank -= amt;
                                else if (t.fromAccount === "receivable") receivable -= amt;
                                else if (t.fromAccount === "payable") payable -= amt;
                                if (t.toAccount === "cash") cash += amt;
                                else if (t.toAccount === "gcash") gcash += amt;
                                else if (t.toAccount === "bank") bank += amt;
                                else if (t.toAccount === "receivable") receivable += amt;
                                else if (t.toAccount === "payable") payable -= amt; // settle AP
                            }
                            i++;
                        }
                        out.push({ label: b.label, cash, gcash, bank, receivable, payable, sales, expenses, transfers, net: sales - expenses });
                    }
                    return out;
                }

                /* Renders a multi-series line chart as an inline SVG with hover/tap support. `series` is
                   the already-filtered list of VISIBLE series — [{ key, color, label }, ...]. Each point
                   in `points` must have a numeric value for every series key. `opts.onHover(idx)` fires
                   on move/tap over a point; `opts.onLeave()` fires when the pointer leaves the chart. */
                function buildTrendChart(points, series, opts) {
                    opts = opts || {};
                    const W = 600,
                        H = 170,
                        padL = 4,
                        padR = 4,
                        padT = 10,
                        padB = 22;
                    const innerW = W - padL - padR,
                        innerH = H - padT - padB;
                    const n = points.length;
                    const vals = [];
                    points.forEach((p) => series.forEach((s) => vals.push(p[s.key])));
                    let min = Math.min(0, ...vals);
                    let max = Math.max(0, ...vals);
                    if (min === max) max = min + 1;
                    const pad = (max - min) * 0.08;
                    min -= pad;
                    max += pad;
                    const range = max - min || 1;

                    function xAt(idx) {
                        return padL + (n <= 1 ? innerW / 2 : (idx / (n - 1)) * innerW);
                    }
                    function yAt(v) {
                        return padT + innerH - ((v - min) / range) * innerH;
                    }

                    const svg = elSVG("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", class: "trendchart" });

                    // zero baseline (only drawn separately from the axis line when values dip negative)
                    if (min < 0 && max > 0) {
                        const y0 = yAt(0);
                        svg.appendChild(elSVG("line", { x1: padL, y1: y0, x2: W - padR, y2: y0, style: "stroke:var(--border);stroke-width:1;stroke-dasharray:3,3" }));
                    }
                    svg.appendChild(elSVG("line", { x1: padL, y1: padT + innerH, x2: W - padR, y2: padT + innerH, style: "stroke:var(--border);stroke-width:1" }));

                    series.forEach((s) => {
                        const d = points.map((p, idx) => `${idx === 0 ? "M" : "L"}${xAt(idx).toFixed(1)},${yAt(p[s.key]).toFixed(1)}`).join(" ");
                        svg.appendChild(elSVG("path", { d, style: `fill:none;stroke:${s.color};stroke-width:2.5`, "stroke-linejoin": "round", "stroke-linecap": "round" }));
                        if (n <= 14) {
                            points.forEach((p, idx) => {
                                svg.appendChild(elSVG("circle", { cx: xAt(idx), cy: yAt(p[s.key]), r: 2.5, style: `fill:${s.color}` }));
                            });
                        } else {
                            const last = points[n - 1];
                            svg.appendChild(elSVG("circle", { cx: xAt(n - 1), cy: yAt(last[s.key]), r: 3, style: `fill:${s.color}` }));
                        }
                    });

                    // x-axis labels: first, middle, last (avoids clutter on longer ranges)
                    const idxs = n <= 1 ? [0] : n <= 5 ? points.map((_, idx) => idx) : [0, Math.round((n - 1) / 2), n - 1];
                    idxs.forEach((idx) => {
                        const anchor = idx === 0 ? "start" : idx === n - 1 ? "end" : "middle";
                        svg.appendChild(elSVG("text", { x: xAt(idx), y: H - 4, "text-anchor": anchor, style: "font-size:10px;fill:var(--ink-soft);font-family:var(--sans)" }, points[idx].label));
                    });

                    // Hover/tap layer: a vertical guide line plus a highlight dot per series, both hidden
                    // until the person moves a pointer (mouse or touch) over the plot area.
                    const guideLine = elSVG("line", {
                        x1: xAt(0),
                        x2: xAt(0),
                        y1: padT,
                        y2: padT + innerH,
                        style: "stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:2,2;opacity:0;pointer-events:none",
                    });
                    svg.appendChild(guideLine);
                    const highlightDots = series.map((s) => elSVG("circle", { r: 4, style: `fill:${s.color};stroke:var(--paper-card);stroke-width:1.5;opacity:0;pointer-events:none` }));
                    highlightDots.forEach((d) => svg.appendChild(d));

                    function setHighlight(idx) {
                        if (idx == null) {
                            guideLine.setAttribute("style", guideLine.getAttribute("style").replace("opacity:1", "opacity:0"));
                            guideLine.style.opacity = 0;
                            highlightDots.forEach((d) => (d.style.opacity = 0));
                            return;
                        }
                        const p = points[idx];
                        const x = xAt(idx);
                        guideLine.setAttribute("x1", x);
                        guideLine.setAttribute("x2", x);
                        guideLine.style.opacity = 0.6;
                        series.forEach((s, i) => {
                            const d = highlightDots[i];
                            d.setAttribute("cx", x);
                            d.setAttribute("cy", yAt(p[s.key]));
                            d.style.opacity = 1;
                        });
                    }

                    if (n > 0) {
                        const hit = elSVG("rect", {
                            x: padL,
                            y: 0,
                            width: innerW,
                            height: H,
                            style: "fill:transparent;pointer-events:all",
                        });
                        svg.insertBefore(hit, guideLine);
                        const indexFromEvent = (e) => {
                            const rect = svg.getBoundingClientRect();
                            if (!rect.width) return 0;
                            const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                            return n <= 1 ? 0 : Math.round(frac * (n - 1));
                        };
                        hit.addEventListener("pointerdown", (e) => {
                            const idx = indexFromEvent(e);
                            setHighlight(idx);
                            opts.onHover && opts.onHover(idx);
                        });
                        hit.addEventListener("pointermove", (e) => {
                            if (e.buttons === 0 && e.pointerType === "mouse") {
                                // plain hover (no button) — still track for mouse
                            }
                            const idx = indexFromEvent(e);
                            setHighlight(idx);
                            opts.onHover && opts.onHover(idx);
                        });
                        hit.addEventListener("pointerleave", () => {
                            setHighlight(null);
                            opts.onLeave && opts.onLeave();
                        });
                    }

                    return svg;
                }

                /* Legend that doubles as a series toggle: tapping an item hides/shows that series and
                   triggers a re-render (via onToggle), letting a person exclude a data group — e.g. large
                   owner Transfers — that's stretching the scale and flattening everything else. */
                function buildChartLegend(points, allSeries, hiddenKeys, onToggle) {
                    const last = points[points.length - 1] || {};
                    return el(
                        "div",
                        { class: "chart-legend" },
                        allSeries.map((s) => {
                            const isHidden = hiddenKeys.includes(s.key);
                            const item = el("button", { type: "button", class: "legend-item" + (isHidden ? " hidden" : "") }, [
                                el("span", { class: "legend-dot", style: `background:${s.color}` }),
                                el("span", {}, s.label),
                                el("span", { class: "legend-val" }, fmtPeso(last[s.key] || 0)),
                            ]);
                            item.addEventListener("click", () => onToggle(s.key));
                            return item;
                        }),
                    );
                }

                /* Readout strip under a chart: shows the exact figures for the hovered/tapped point (or
                   the latest point when nothing is hovered), for only the currently-visible series. */
                function buildChartReadout(point, series) {
                    const roEl = el("div", { class: "chart-readout" });
                    function set(p) {
                        roEl.innerHTML = "";
                        roEl.appendChild(el("span", { class: "ro-label" }, p.label));
                        series.forEach((s) => {
                            roEl.appendChild(
                                el("span", { class: "ro-item" }, [el("span", { class: "ro-dot", style: `background:${s.color}` }), el("span", { class: "ro-val" }, fmtPeso(p[s.key] || 0))]),
                            );
                        });
                    }
                    set(point);
                    return { el: roEl, set };
                }

                /* Flags any visible balance series that dipped below zero within the shown range — a
                   quick warning that a business would have been short on that account at some point. */
                function buildNegativeBalanceWarning(points, visibleSeries) {
                    const flags = [];
                    visibleSeries.forEach((s) => {
                        let lowIdx = -1,
                            lowVal = 0;
                        points.forEach((p, idx) => {
                            if (p[s.key] < lowVal) {
                                lowVal = p[s.key];
                                lowIdx = idx;
                            }
                        });
                        if (lowIdx >= 0) flags.push(`${s.label} went negative (as low as ${fmtPeso(lowVal)} around ${points[lowIdx].label})`);
                    });
                    if (!flags.length) return null;
                    return el("div", { class: "chart-warn" }, [el("span", {}, "\u26a0\ufe0f"), el("span", {}, flags.join(" · "))]);
                }

                function toggleTrendSeries(chartKey, seriesKey) {
                    const list = App.trendHidden[chartKey];
                    const i = list.indexOf(seriesKey);
                    if (i === -1) list.push(seriesKey);
                    else list.splice(i, 1);
                    softRender();
                }

                function buildTrendChartCard(title, points, allSeries, chartKey) {
                    const hidden = App.trendHidden[chartKey];
                    const visible = allSeries.filter((s) => !hidden.includes(s.key));

                    const card = el("div", { class: "card chartcard" });
                    card.appendChild(el("div", { class: "chartcard-title" }, title));
                    card.appendChild(buildChartLegend(points, allSeries, hidden, (key) => toggleTrendSeries(chartKey, key)));

                    if (chartKey === "balance") {
                        const warn = buildNegativeBalanceWarning(points, visible);
                        if (warn) card.appendChild(warn);
                    }

                    if (!visible.length) {
                        card.appendChild(el("div", { class: "empty small" }, "Tap a series above to show it on the chart."));
                        return card;
                    }

                    const last = points[points.length - 1] || {};
                    const readout = buildChartReadout(last, visible);
                    const svg = buildTrendChart(points, visible, {
                        onHover: (idx) => readout.set(points[idx]),
                        onLeave: () => readout.set(last),
                    });
                    card.appendChild(el("div", { class: "charthost" }, svg));
                    card.appendChild(readout.el);
                    return card;
                }

                async function renderTrendSection() {
                    const section = el("div", { class: "section" });
                    section.appendChild(el("div", { class: "section-title" }, "TRENDS"));

                    const rangeRow = el("div", { class: "chiprow" });
                    TREND_RANGES.forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.trendRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.trendRange = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    section.appendChild(rangeRow);
                    section.appendChild(el("div", { class: "help-text" }, "Tap a legend item to hide it from the chart. Hover or tap a point to see exact figures."));

                    const points = await computeTrendSeries(App.trendRange);

                    const balSeries = [
                        { key: "cash", color: "var(--green)", label: "Cash" },
                        { key: "gcash", color: "var(--gold)", label: "GCash" },
                        { key: "bank", color: "var(--ink)", label: "Bank" },
                        { key: "receivable", color: "var(--rust)", label: "Receivable" },
                    ];
                    section.appendChild(buildTrendChartCard("Account Balances", points, balSeries, "balance"));

                    const flowSeries = [
                        { key: "sales", color: "var(--green)", label: "Sales" },
                        { key: "expenses", color: "var(--rust)", label: "Expenses" },
                        { key: "transfers", color: "var(--gold)", label: "Transfers" },
                        { key: "net", color: "var(--ink)", label: "Net" },
                    ];
                    const flowTitle = App.trendRange === "all" ? "Sales, Expenses & Transfers (per month)" : "Sales, Expenses & Transfers (per day)";
                    section.appendChild(buildTrendChartCard(flowTitle, points, flowSeries, "flow"));

                    return section;
                }

                /* ---------- REPORTS ---------- */
                async function renderReports() {
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "Reports"));

                    const rangeCard = el("div", { class: "card" });
                    const rangeRow = el("div", { class: "chiprow" });
                    [
                        ["today", "Today"],
                        ["week", "This Week"],
                        ["month", "This Month"],
                        ["all", "All Time"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.reportRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.reportRange = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    rangeCard.appendChild(rangeRow);
                    wrap.appendChild(rangeCard);

                    let txs = await allTx();
                    const now = new Date();
                    if (App.reportRange === "today") txs = txs.filter((t) => inRange(t.date, startOfDay(now), endOfDay(now)));
                    else if (App.reportRange === "week") txs = txs.filter((t) => inRange(t.date, startOfWeek(now), endOfDay(now)));
                    else if (App.reportRange === "month") txs = txs.filter((t) => inRange(t.date, startOfMonth(now), endOfDay(now)));

                    const sales = sumBy(txs, (t) => t.type === "sale");
                    const expenses = sumBy(txs, (t) => t.type === "expense");
                    const net = sales - expenses;
                    const cashIn = sumBy(txs, (t) => t.type === "sale" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.toAccount === "cash");
                    const cashOut = sumBy(txs, (t) => t.type === "expense" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.fromAccount === "cash");
                    const cashNet = cashIn - cashOut;

                    const summary = el("div", { class: "summary-grid" }, [
                        summaryCard("Total Sales", sales, "sales"),
                        summaryCard("Total Expenses", expenses, "expenses"),
                        summaryCard("Net Cash Flow", net, net >= 0 ? "sales" : "expenses"),
                        summaryCard("Cash Movement", cashNet, cashNet >= 0 ? "sales" : "expenses"),
                    ]);
                    wrap.appendChild(summary);

                    // account balances (all-time, not period-scoped — this is a point-in-time snapshot)
                    const allTxs = await allTx();
                    const bal = await computeAccountBalances(allTxs);
                    const balSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "ACCOUNT BALANCES (ALL-TIME)")]);
                    balSection.appendChild(
                        el("div", { class: "summary-grid" }, [
                            summaryCard("Cash", bal.cash, "sales"),
                            summaryCard("GCash", bal.gcash, "sales"),
                            summaryCard("Bank", bal.bank, "sales"),
                            summaryCard("Receivable", bal.receivable, bal.receivable > 0 ? "expenses" : "sales"),
                        ]),
                    );
                    wrap.appendChild(balSection);

                    // trend charts — balances and sales/expenses/transfers over time
                    wrap.appendChild(await renderTrendSection());

                    // fund transfers this period
                    const transfers = txs.filter((t) => t.type === "transfer").sort((a, b) => new Date(b.date) - new Date(a.date));
                    const transferSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "FUND TRANSFERS THIS PERIOD")]);
                    if (transfers.length === 0) {
                        transferSection.appendChild(el("div", { class: "empty small" }, "No GCash, bank, owner, or business funds transfers in this period."));
                    } else {
                        transfers.forEach((t) => transferSection.appendChild(txRow(t)));
                    }
                    wrap.appendChild(transferSection);

                    // category breakdown (sales) — spread across each transaction's line items
                    const catTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            catTotals[ln.category] = (catTotals[ln.category] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                    const catSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY CATEGORY")]);
                    if (catEntries.length === 0) {
                        catSection.appendChild(el("div", { class: "empty small" }, "No sales in this period yet."));
                    } else {
                        const max = Math.max(...catEntries.map((e) => e[1]));
                        catEntries.forEach(([cat, amt]) => {
                            catSection.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, cat),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: `width:${((amt / max) * 100).toFixed(0)}%` })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                    }
                    wrap.appendChild(catSection);

                    // payment method breakdown
                    const payTotals = { cash: 0, gcash: 0, bank: 0, receivable: 0, payable: 0, other: 0 };
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        const key = payTotals.hasOwnProperty(t.payment) ? t.payment : "other";
                        payTotals[key] = (payTotals[key] || 0) + t.amount;
                    });
                    const paySection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY PAYMENT METHOD")]);
                    const payMax = Math.max(1, ...Object.values(payTotals));
                    Object.entries(payTotals).forEach(([p, amt]) => {
                        paySection.appendChild(
                            el("div", { class: "barrow" }, [
                                el("div", { class: "barrow-label" }, paymentLabel(p)),
                                el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill alt", style: `width:${((amt / payMax) * 100).toFixed(0)}%` })]),
                                el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                            ]),
                        );
                    });
                    wrap.appendChild(paySection);

                    // top items — spread across each transaction's line items
                    const itemTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            itemTotals[ln.item] = (itemTotals[ln.item] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const topItems = Object.entries(itemTotals)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 5);
                    if (topItems.length) {
                        const topSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "TOP ITEMS")]);
                        topItems.forEach(([name, amt], i) => {
                            topSection.appendChild(
                                el("div", { class: "toprow" }, [
                                    el("span", { class: "toprow-rank" }, String(i + 1)),
                                    el("span", { class: "toprow-name" }, name),
                                    el("span", { class: "toprow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                        wrap.appendChild(topSection);
                    }

                    // ---- Financial Statements ----
                    wrap.appendChild(await renderFinancialStatements(txs, allTxs, bal, App.reportRange));

                    return wrap;
                }

                function reportPeriodLabel(range) {
                    if (range === "today") return "Today";
                    if (range === "week") return "This week";
                    if (range === "month") return "This month";
                    return "All time";
                }

                function stmtRow(label, amount, opts) {
                    opts = opts || {};
                    const cls = "stmt-row" + (opts.indent ? " indent" : "") + (opts.section ? " section-head" : "") + (opts.total ? " total" : "") + (opts.grand ? " grand" : "");
                    if (opts.section) {
                        return el("div", { class: cls }, [el("span", {}, label)]);
                    }
                    const amtCls = "stmt-amt" + (opts.signed && amount > 0 ? " pos" : opts.signed && amount < 0 ? " neg" : "");
                    let show = "";
                    if (opts.blank) show = "";
                    else if (opts.text != null) show = String(opts.text);
                    else if (opts.pct) show = fmtPct(amount);
                    else show = fmtPeso(amount);
                    return el("div", { class: cls }, [el("span", {}, label), el("span", { class: amtCls }, show)]);
                }

                function reportPeriodBounds(range, customOpts) {
                    const now = new Date();
                    let from, to;
                    const custom = customOpts || (range === "custom" ? App.metricsCustom || App.reportCustom : App.reportCustom);
                    if (range === "today") {
                        from = startOfDay(now);
                        to = endOfDay(now);
                    } else if (range === "week") {
                        from = startOfWeek(now);
                        to = endOfDay(now);
                    } else if (range === "month") {
                        from = startOfMonth(now);
                        to = endOfDay(now);
                    } else if (range === "quarter") {
                        const m = now.getMonth();
                        const qStart = Math.floor(m / 3) * 3;
                        from = startOfDay(new Date(now.getFullYear(), qStart, 1));
                        to = endOfDay(now);
                    } else if (range === "year") {
                        from = startOfDay(new Date(now.getFullYear(), 0, 1));
                        to = endOfDay(now);
                    } else if (range === "all") {
                        from = null;
                        to = endOfDay(now);
                    } else if (range === "custom" && custom && custom.from) {
                        from = startOfDay(new Date(custom.from));
                        to = custom.to ? endOfDay(new Date(custom.to)) : endOfDay(now);
                    } else {
                        from = startOfDay(now);
                        to = endOfDay(now);
                    }
                    return { from, to };
                }

                /** Previous period of equal length immediately before [from, to]. */
                function previousPeriodBounds(from, to) {
                    if (!from || !to) return { from: null, to: null };
                    const ms = to.getTime() - from.getTime();
                    const prevTo = new Date(from.getTime() - 1);
                    const prevFrom = new Date(prevTo.getTime() - ms);
                    return { from: prevFrom, to: prevTo };
                }

                function growthPct(current, previous) {
                    if (previous == null || !isFinite(previous)) return null;
                    if (previous === 0) return current === 0 ? 0 : null;
                    return ((current - previous) / Math.abs(previous)) * 100;
                }

                function fmtGrowth(pct) {
                    if (pct == null || !isFinite(pct)) return "—";
                    const sign = pct > 0 ? "+" : "";
                    return sign + pct.toFixed(1) + "%";
                }

                function medianOf(nums) {
                    const a = (nums || [])
                        .filter((n) => isFinite(n))
                        .slice()
                        .sort((x, y) => x - y);
                    if (!a.length) return null;
                    const mid = Math.floor(a.length / 2);
                    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
                }

                async function renderFinancialStatements(periodTxs, allTxs, bal, range) {
                    const section = el("div", { class: "section" });
                    section.appendChild(el("div", { class: "section-title" }, "FINANCIAL STATEMENTS"));
                    section.appendChild(
                        el(
                            "div",
                            { class: "help-text" },
                            "Management statements from your POS books. Inventory purchases are assets (not opex); COGS reflects materials consumed. Period follows the chips above.",
                        ),
                    );

                    const periodLabel = reportPeriodLabel(range);
                    const periodBounds = reportPeriodBounds(range);
                    const periodFrom = periodBounds.from;
                    const periodTo = periodBounds.to;

                    const revenue = sumBy(periodTxs, (t) => t.type === "sale");

                    // ---- Costing snapshot (inventory at cost, stock moves for COGS) ----
                    let costingSnap = { ok: false, materials: [], products: [], moves: [], metrics: {} };
                    let inventoryValue = 0;
                    let inventoryDetail = [];
                    let inventoryBelowReorder = 0;
                    let potentialFGRevenue = null;
                    let potentialFGCost = null;
                    let potentialFGProfit = null;
                    let avgMargin = null;
                    try {
                        costingSnap = await loadCostingInventorySnapshot();
                        if (costingSnap.ok) {
                            const inv = computeInventoryAtCost(costingSnap.materials || []);
                            inventoryValue = inv.total;
                            inventoryDetail = inv.lines;
                            inventoryBelowReorder = inv.belowReorder;
                            if (costingSnap.metrics) {
                                if (costingSnap.metrics.avgMargin != null && isFinite(costingSnap.metrics.avgMargin)) {
                                    avgMargin = costingSnap.metrics.avgMargin;
                                }
                                potentialFGRevenue = costingSnap.metrics.totalRevenue;
                                potentialFGCost = costingSnap.metrics.totalCost;
                                potentialFGProfit = costingSnap.metrics.totalProfit;
                            }
                        }
                    } catch (e) {}

                    const matNames = materialNameSetFromSnap(costingSnap);

                    // Split period expenses: inventory purchases vs true operating expenses
                    const split = splitExpensesInventoryVsOpex(periodTxs, matNames);
                    const inventoryPurchases = split.invTotal;
                    const opex = split.opexTotal;
                    const expCats = split.opexCats; // only genuine opex on P&L
                    const invPurchaseCats = split.invCats;

                    // All-time split (for equity retained earnings estimate)
                    const splitAll = splitExpensesInventoryVsOpex(allTxs, matNames);

                    // ---- COGS & inventory timeline ----
                    // Costing opening = intentional physical stock when Costing started (startingQty × cost).
                    // Pre-costing POS inventory purchases are historical books only — already in opening, not re-added.
                    let cogs = null;
                    let cogsSource = "none";
                    let cogsEstimated = false;
                    let endingInventory = inventoryValue;
                    let invFlow = { ins: 0, outs: 0, adjustValue: 0, inCount: 0, outCount: 0, adjustCount: 0 };

                    const costingStartAt = costingSnap.ok ? costingSnap.costingStartAt : null;
                    const costingStartDate = costingStartAt != null ? new Date(costingStartAt) : null;
                    // System opening inventory (always from startingQty — intentional, not a discrepancy)
                    const systemOpeningInventory = costingSnap.ok ? Number(costingSnap.openingInventoryAtStart) || 0 : 0;

                    // Period opening for P&L roll-forward within report window
                    let periodOpeningInventory = null;
                    const matRowsForVal = (costingSnap.materials || []).map((m) => ({
                        id: m.id,
                        startingQty: m.startingQty,
                        costPerUnit: m.costPerUnit,
                    }));

                    if (costingSnap.ok) {
                        if (periodFrom) {
                            periodOpeningInventory = inventoryValueAt(matRowsForVal, costingSnap.moves || [], new Date(periodFrom.getTime() - 1));
                        } else {
                            // All-time / since Costing began: opening = startingQty × cost
                            periodOpeningInventory = systemOpeningInventory;
                        }
                        invFlow = computePeriodInventoryFlow(costingSnap.moves || [], costingSnap.materials || [], periodFrom, periodTo);
                        const actual = computePeriodCogsFromMoves(costingSnap.moves || [], costingSnap.materials || [], periodFrom, periodTo);
                        if (actual.hasData) {
                            cogs = actual.cogs;
                            cogsSource = "stock-outs";
                            cogsEstimated = false;
                        }
                    }

                    // Do NOT derive COGS from POS purchases − ending inventory.
                    if (cogs == null && avgMargin != null && revenue > 0) {
                        cogs = revenue * (1 - avgMargin / 100);
                        cogsSource = "margin-estimate";
                        cogsEstimated = true;
                    }
                    if (cogs == null) cogs = 0;

                    const grossProfit = revenue - cogs;
                    const netIncome = grossProfit - opex;

                    // Post-costing Costing roll-forward (source of truth for inventory asset)
                    // Opening (startingQty) + stock-ins − stock-outs = calculated end
                    const rollOpen = periodOpeningInventory != null ? periodOpeningInventory : systemOpeningInventory;
                    const calcEndingFromCosting = Math.round((rollOpen + invFlow.ins - invFlow.outs) * 100) / 100;
                    const invDiffCosting = Math.round((calcEndingFromCosting - endingInventory) * 100) / 100;

                    // Split POS inventory purchases relative to Costing start (do not double-count pre-opening)
                    let posInvPurchasesPreCosting = 0;
                    let posInvPurchasesPostCosting = 0;
                    periodTxs
                        .filter((t) => t.type === "expense")
                        .forEach((t) => {
                            const lines = txLines(t);
                            let invAmt = 0;
                            lines.forEach((ln) => {
                                const cat = ln.category || t.category || "Other";
                                const item = ln.item || t.item || "";
                                const amt = Number(ln.amount) || 0;
                                if (isInventoryPurchaseLine(cat, item, matNames)) invAmt += amt;
                            });
                            if (invAmt <= 0) return;
                            const txT = new Date(t.date).getTime();
                            if (costingStartAt != null && isFinite(txT) && txT < costingStartAt) {
                                posInvPurchasesPreCosting += invAmt;
                            } else {
                                // No start date known → treat as post (investigate against stock-ins)
                                // If start known and tx on/after start → post
                                posInvPurchasesPostCosting += invAmt;
                            }
                        });
                    // Also all-time split for diagnostics
                    let posInvAllPre = 0,
                        posInvAllPost = 0;
                    allTxs
                        .filter((t) => t.type === "expense")
                        .forEach((t) => {
                            const lines = txLines(t);
                            let invAmt = 0;
                            lines.forEach((ln) => {
                                if (isInventoryPurchaseLine(ln.category || t.category, ln.item || t.item, matNames)) {
                                    invAmt += Number(ln.amount) || 0;
                                }
                            });
                            if (invAmt <= 0) return;
                            const txT = new Date(t.date).getTime();
                            if (costingStartAt != null && isFinite(txT) && txT < costingStartAt) posInvAllPre += invAmt;
                            else posInvAllPost += invAmt;
                        });

                    const invPurchaseVsCostingIns = Math.round((posInvPurchasesPostCosting - invFlow.ins) * 100) / 100;
                    // Only post-costing POS purchases belong in a bridge to Costing stock-ins
                    const calcEndingFromPosPost = Math.round((rollOpen + posInvPurchasesPostCosting - cogs) * 100) / 100;
                    const invDiffPosBridge = Math.round((calcEndingFromPosPost - endingInventory) * 100) / 100;

                    // ---- Income Statement ----
                    const pl = el("div", { class: "card stmt-card" });
                    pl.appendChild(el("div", { class: "stmt-title" }, "Income Statement (P&L)"));
                    pl.appendChild(el("div", { class: "stmt-period" }, periodLabel + " · Revenue − COGS − operating expenses"));
                    pl.appendChild(stmtRow("Revenue", 0, { section: true }));
                    pl.appendChild(stmtRow("Sales / services", revenue, { indent: true }));
                    pl.appendChild(stmtRow("Total revenue", revenue, { total: true }));

                    pl.appendChild(stmtRow("Cost of goods / services", 0, { section: true }));
                    if (cogsSource === "stock-outs") {
                        pl.appendChild(stmtRow("COGS (materials consumed — Costing stock-outs)", cogs, { indent: true }));
                    } else if (cogsSource === "rollforward") {
                        pl.appendChild(stmtRow("COGS (opening + purchases − ending inventory)", cogs, { indent: true }));
                    } else if (cogsSource === "margin-estimate") {
                        pl.appendChild(stmtRow("Estimated COGS @" + fmtPct(avgMargin) + " margin (fallback)", cogs, { indent: true }));
                    } else {
                        pl.appendChild(stmtRow("COGS (no consumption data yet)", cogs, { indent: true }));
                    }
                    pl.appendChild(stmtRow("Gross profit", grossProfit, { total: true, signed: true }));

                    pl.appendChild(stmtRow("Operating expenses", 0, { section: true }));
                    if (expCats.length) {
                        expCats.forEach(([cat, amt]) => pl.appendChild(stmtRow(cat, amt, { indent: true })));
                    } else {
                        pl.appendChild(stmtRow("No operating expenses in period", 0, { indent: true, blank: true }));
                    }
                    pl.appendChild(stmtRow("Total operating expenses", opex, { total: true }));
                    pl.appendChild(stmtRow(cogsEstimated ? "Net income (est.)" : "Net income", netIncome, { grand: true, signed: true }));

                    if (inventoryPurchases > 0) {
                        pl.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Inventory purchases this period (" +
                                    fmtPeso(inventoryPurchases) +
                                    ") are capitalized on the Balance Sheet, not listed as operating expenses. " +
                                    invPurchaseCats
                                        .slice(0, 6)
                                        .map(([c, a]) => c + " " + fmtPeso(a))
                                        .join(" · ") +
                                    (invPurchaseCats.length > 6 ? " …" : "") +
                                    ".",
                            ),
                        );
                    }
                    if (cogsEstimated) {
                        pl.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "COGS is estimated from Costing average margin because material stock-outs for this period were not found. Open Costing / apply POS sales to inventory for actual COGS.",
                            ),
                        );
                    }
                    section.appendChild(pl);

                    // ---- Balance Sheet ----
                    const assets = await companyAssets();
                    const fixedAssets = assets.reduce((s, a) => s + (Number(a.currentValue != null ? a.currentValue : a.cost) || 0), 0);
                    const liquid = (bal.cash || 0) + (bal.gcash || 0) + (bal.bank || 0);
                    const currentAssets = liquid + (bal.receivable || 0) + inventoryValue;
                    const totalAssets = currentAssets + fixedAssets;

                    // Liabilities & equity — AP reconstructed from transaction dates (not entry time)
                    const planned = await companyPlanned();
                    const unpaidPlanned = planned.filter((p) => !p.paid);
                    const plannedMemo = unpaidPlanned.reduce((s, p) => s + (Number(p.amount) || 0), 0);
                    const company = await getActiveCompany();

                    const seedCashCapital =
                        (Number(company && company.startingCash) || 0) +
                        (Number(company && company.startingGcash) || 0) +
                        (Number(company && company.startingBank) || 0) +
                        (Number(company && company.startingReceivable) || 0);
                    const settingsStartingPayable = Number(company && company.startingPayable) || 0;

                    // Reconstruct AP from dated expenses (payment=payable) and settlements (transfer → payable)
                    const endingAPRecon = reconstructPayableBalance(allTxs, company, null);
                    const apAtCostingStart = costingStartAt != null ? reconstructPayableBalance(allTxs, company, costingStartAt) : settingsStartingPayable;
                    const periodFromMs = periodFrom ? periodFrom.getTime() : null;
                    const periodToMs = periodTo ? periodTo.getTime() : null;
                    const openingAP = periodFromMs != null ? reconstructPayableBalance(allTxs, company, periodFromMs) : settingsStartingPayable;
                    const creditsInPeriod = sumPayableCreditsInWindow(allTxs, periodFromMs, periodToMs);
                    const settlementsInPeriod = sumPayableSettlementsInWindow(allTxs, periodFromMs, periodToMs);

                    // Ending AP: ledger running balance should match reconstruction from transaction dates
                    const apBalance = Number(bal.payable) || 0;
                    const apReconGap = Math.round((endingAPRecon - apBalance) * 100) / 100;
                    const liabilities = apBalance; // outstanding AP only (not Forecast planned memos)

                    // AR reconstruction (same date-based principle as AP)
                    const endingARRecon = reconstructReceivableBalance(allTxs, company, null);
                    const arBalance = Number(bal.receivable) || 0;
                    const arReconGap = Math.round((endingARRecon - arBalance) * 100) / 100;
                    const openingAR = periodFromMs != null ? reconstructReceivableBalance(allTxs, company, periodFromMs) : Number(company && company.startingReceivable) || 0;

                    // Opening equity at system start: net assets that existed then
                    // Assets side: cash-side seed + intentional opening inventory
                    // Liability side: AP already outstanding at costing start (from dated credit purchases)
                    const openingInventoryEquity = systemOpeningInventory;
                    const openingEquityAtStart = seedCashCapital + openingInventoryEquity - apAtCostingStart;

                    // Owner / merged business funds — count once from transfers (do not invent a second ₱11k)
                    const ownerContrib = sumBy(allTxs, (t) => t.type === "transfer" && t.fromAccount === "owner");
                    const ownerDraw = sumBy(allTxs, (t) => t.type === "transfer" && t.toAccount === "owner");
                    const businessFundsContrib = sumBy(allTxs, (t) => t.type === "transfer" && t.fromAccount === "businessFunds");
                    const businessFundsDraw = sumBy(allTxs, (t) => t.type === "transfer" && t.toAccount === "businessFunds");
                    // Capital contributions for equity: owner + permanent business-fund merges into the shop
                    const capitalContributions = ownerContrib + businessFundsContrib;
                    const capitalDrawings = ownerDraw + businessFundsDraw;

                    // Accumulated NI after costing/accounting start when known
                    const txsForNi =
                        costingStartAt != null
                            ? allTxs.filter((t) => {
                                  const tt = txTimeMs(t);
                                  return tt >= costingStartAt;
                              })
                            : allTxs;
                    const revenueAll = sumBy(txsForNi, (t) => t.type === "sale");
                    const splitNi = splitExpensesInventoryVsOpex(txsForNi, matNames);
                    let cogsAll = 0;
                    let cogsAllSource = "none";
                    if (costingSnap.ok) {
                        const allOut = computePeriodCogsFromMoves(costingSnap.moves || [], costingSnap.materials || [], costingStartDate, periodTo || new Date());
                        if (allOut.hasData) {
                            cogsAll = allOut.cogs;
                            cogsAllSource = "stock-outs";
                        }
                    }
                    if (cogsAllSource === "none" && avgMargin != null && revenueAll > 0) {
                        cogsAll = revenueAll * (1 - avgMargin / 100);
                        cogsAllSource = "margin-estimate";
                    }
                    const opexAll = splitNi.opexTotal;
                    const accumulatedNetIncome = revenueAll - cogsAll - opexAll;

                    // Equity from actual components — never Assets−Liabilities as "retained earnings"
                    const calculatedEquity = openingEquityAtStart + capitalContributions + accumulatedNetIncome - capitalDrawings;
                    const equityUnexplained = Math.round((totalAssets - liabilities - calculatedEquity) * 100) / 100;
                    const equity = calculatedEquity;
                    const seedCapital = openingEquityAtStart; // for labels/copy that still reference seedCapital
                    const seedCashCapitalDisplay = seedCashCapital;

                    const bs = el("div", { class: "card stmt-card" });
                    bs.appendChild(el("div", { class: "stmt-title" }, "Balance Sheet"));
                    bs.appendChild(el("div", { class: "stmt-period" }, "As of now (point-in-time)"));
                    bs.appendChild(stmtRow("Assets", 0, { section: true }));
                    bs.appendChild(stmtRow("Cash on hand", bal.cash || 0, { indent: true }));
                    bs.appendChild(stmtRow("GCash", bal.gcash || 0, { indent: true }));
                    bs.appendChild(stmtRow("Bank", bal.bank || 0, { indent: true }));
                    bs.appendChild(stmtRow("Accounts receivable", bal.receivable || 0, { indent: true }));
                    bs.appendChild(
                        stmtRow(costingSnap.ok ? "Inventory (materials at cost)" : "Inventory (Costing not linked)", inventoryValue, {
                            indent: true,
                        }),
                    );
                    bs.appendChild(stmtRow("Current assets", currentAssets, { total: true }));
                    bs.appendChild(stmtRow("Fixed assets (equipment, etc.)", fixedAssets, { indent: true }));
                    if (assets.length) {
                        assets.forEach((a) => {
                            const v = Number(a.currentValue != null ? a.currentValue : a.cost) || 0;
                            if (v || a.name) bs.appendChild(stmtRow("· " + (a.name || "Asset"), v, { indent: true }));
                        });
                    }
                    bs.appendChild(stmtRow("Total assets", totalAssets, { grand: true }));

                    bs.appendChild(stmtRow("Liabilities", 0, { section: true }));
                    bs.appendChild(stmtRow("Accounts payable", apBalance, { indent: true }));
                    bs.appendChild(stmtRow("Total liabilities", liabilities, { total: true }));

                    bs.appendChild(stmtRow("Equity", 0, { section: true }));
                    if (Math.abs(seedCashCapital) > 0.005) {
                        bs.appendChild(stmtRow("Opening cash & AR (POS starting balances)", seedCashCapital, { indent: true, signed: true }));
                    }
                    if (Math.abs(openingInventoryEquity) > 0.005) {
                        bs.appendChild(
                            stmtRow("Opening inventory (on hand when Costing started)", openingInventoryEquity, {
                                indent: true,
                                signed: true,
                            }),
                        );
                    }
                    if (Math.abs(apAtCostingStart) > 0.005) {
                        bs.appendChild(
                            stmtRow("− AP already outstanding at Costing/accounting start", -apAtCostingStart, {
                                indent: true,
                                signed: true,
                            }),
                        );
                    }
                    bs.appendChild(stmtRow("Opening equity (net assets at start)", openingEquityAtStart, { indent: true, signed: true }));
                    bs.appendChild(stmtRow("Owner contributions", ownerContrib, { indent: true }));
                    if (Math.abs(businessFundsContrib) > 0.005) {
                        bs.appendChild(stmtRow("Business funds contributed", businessFundsContrib, { indent: true }));
                    }
                    bs.appendChild(stmtRow("Owner drawings", -ownerDraw, { indent: true, signed: true }));
                    if (Math.abs(businessFundsDraw) > 0.005) {
                        bs.appendChild(stmtRow("Business funds withdrawn", -businessFundsDraw, { indent: true, signed: true }));
                    }
                    bs.appendChild(
                        stmtRow(costingStartAt != null ? "Accumulated net income (since Costing start)" : "Accumulated net income (all-time)", accumulatedNetIncome, { indent: true, signed: true }),
                    );
                    bs.appendChild(stmtRow("Total equity (calculated)", calculatedEquity, { total: true, signed: true }));
                    if (ownerContrib > 0 || businessFundsContrib > 0) {
                        bs.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Owner contributions and business-fund inflows are capital (financing), not revenue. Each transfer is counted once from source transactions.",
                            ),
                        );
                    }
                    if (Math.abs(equityUnexplained) > 0.05) {
                        bs.appendChild(stmtRow("Unexplained equity difference", equityUnexplained, { indent: true, signed: true }));
                        bs.appendChild(
                            el(
                                "div",
                                { class: "stmt-note", style: "color:var(--rust)" },
                                "⚠ Equity reconciliation difference: " +
                                    fmtPeso(equityUnexplained) +
                                    ". Assets − Liabilities (" +
                                    fmtPeso(totalAssets - liabilities) +
                                    ") does not equal calculated equity (" +
                                    fmtPeso(calculatedEquity) +
                                    "). Common causes: fixed assets recorded without a matching cash/equity entry, Costing inventory not tied to POS purchases, or starting balances vs history. This amount is NOT booked as retained earnings.",
                            ),
                        );
                    }
                    bs.appendChild(stmtRow("Total liabilities + calculated equity", liabilities + calculatedEquity, { grand: true }));
                    const identityGap = Math.round((totalAssets - (liabilities + calculatedEquity)) * 100) / 100;
                    if (Math.abs(identityGap) > 0.05) {
                        bs.appendChild(
                            el(
                                "div",
                                { class: "stmt-note", style: "color:var(--rust)" },
                                "⚠ Assets (" +
                                    fmtPeso(totalAssets) +
                                    ") ≠ Liabilities + calculated equity (" +
                                    fmtPeso(liabilities + calculatedEquity) +
                                    "). Gap " +
                                    fmtPeso(identityGap) +
                                    " — shown above, not forced into a balancing account.",
                            ),
                        );
                    } else {
                        bs.appendChild(el("div", { class: "stmt-note" }, "Assets = Liabilities + calculated equity ✓"));
                    }
                    if (plannedMemo > 0) {
                        bs.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Memo — unpaid planned obligations in Forecast (not booked as AP): " +
                                    fmtPeso(plannedMemo) +
                                    ". Record a payable expense or settle when they become actual liabilities.",
                            ),
                        );
                    }
                    if (Math.abs(apReconGap) > 0.05) {
                        bs.appendChild(
                            el(
                                "div",
                                { class: "stmt-note", style: "color:var(--rust)" },
                                "⚠ Ledger AP " +
                                    fmtPeso(apBalance) +
                                    " vs reconstructed from transaction dates " +
                                    fmtPeso(endingAPRecon) +
                                    " (Δ " +
                                    fmtPeso(apReconGap) +
                                    "). Statements use ledger AP; check payable expenses and settlements use payment/transfer accounts correctly.",
                            ),
                        );
                    }
                    bs.appendChild(
                        el(
                            "div",
                            { class: "stmt-note" },
                            "Opening equity = opening cash/AR + opening inventory − AP outstanding at inventory-tracking start (transaction dates). " +
                                "Credit purchases increase AP on purchase date; payments settle AP on payment date (purchase is not re-expensed). " +
                                "Accumulated net income uses sales − COGS − operating expenses" +
                                (costingStartAt != null ? " since " + new Date(costingStartAt).toLocaleDateString("en-PH") : "") +
                                " (COGS: " +
                                cogsAllSource +
                                "). Discrepancies are reported, not absorbed into retained earnings.",
                        ),
                    );
                    section.appendChild(bs);

                    // ---- Cash Flow ----
                    const salesCashLike = sumBy(periodTxs, (t) => t.type === "sale" && (t.payment === "cash" || t.payment === "gcash" || t.payment === "bank"));
                    const creditSalesPeriod = sumBy(periodTxs, (t) => t.type === "sale" && t.payment === "receivable");
                    const collections = sumBy(
                        periodTxs,
                        (t) => t.type === "transfer" && t.fromAccount === "receivable" && (t.toAccount === "cash" || t.toAccount === "gcash" || t.toAccount === "bank"),
                    );
                    const apSettlements = sumBy(
                        periodTxs,
                        (t) => t.type === "transfer" && t.toAccount === "payable" && (t.fromAccount === "cash" || t.fromAccount === "gcash" || t.fromAccount === "bank"),
                    );

                    // Cash paid for inventory vs opex (payment method on expense)
                    let invPurchasesCash = 0,
                        invPurchasesCredit = 0,
                        opexCash = 0,
                        opexCredit = 0;
                    periodTxs
                        .filter((t) => t.type === "expense")
                        .forEach((t) => {
                            const lines = txLines(t);
                            let invAmt = 0,
                                opexAmt = 0;
                            lines.forEach((ln) => {
                                const cat = ln.category || t.category || "Other";
                                const item = ln.item || t.item || "";
                                const amt = Number(ln.amount) || 0;
                                if (isInventoryPurchaseLine(cat, item, matNames)) invAmt += amt;
                                else opexAmt += amt;
                            });
                            const pay = t.payment;
                            if (pay === "payable") {
                                invPurchasesCredit += invAmt;
                                opexCredit += opexAmt;
                            } else if (pay === "cash" || pay === "gcash" || pay === "bank") {
                                invPurchasesCash += invAmt;
                                opexCash += opexAmt;
                            }
                        });

                    const arOtherIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "receivable");
                    const arOtherOut = sumBy(
                        periodTxs,
                        (t) =>
                            (t.type === "expense" && t.payment === "receivable") ||
                            (t.type === "transfer" && t.fromAccount === "receivable" && t.toAccount !== "cash" && t.toAccount !== "gcash" && t.toAccount !== "bank"),
                    );

                    const ownerIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.fromAccount === "owner");
                    const ownerOut = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "owner");
                    const businessFundsIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.fromAccount === "businessFunds");
                    const businessFundsOut = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "businessFunds");
                    const investExp = sumBy(periodTxs, (t) => {
                        if (t.type !== "expense") return false;
                        // only true opex investment-like, not inventory stocks
                        const cat = (t.category || "") + " " + (t.item || "");
                        if (isInventoryPurchaseLine(t.category, t.item, matNames)) return false;
                        return /invest|equipment|printer|capital/i.test(cat);
                    });

                    const opsIn = salesCashLike + collections;
                    // Cash inventory purchases + cash opex + AP settlements (when paying prior credit buys/expenses)
                    const opsOut = opexCash + invPurchasesCash + settlementsInPeriod;
                    const opsNet = opsIn - opsOut;
                    const finNet = ownerIn - ownerOut + businessFundsIn - businessFundsOut;
                    const invNet = -investExp;
                    const netCashChange = opsNet + invNet + finNet;

                    const endingAR = arBalance;
                    const periodArIncrease = creditSalesPeriod + arOtherIn - collections - arOtherOut;
                    // openingAR already reconstructed by transaction date above
                    const openCreditSales = sumBy(allTxs, (t) => t.type === "sale" && t.payment === "receivable" && !t.collectedAt);
                    const arGap = Math.round((endingAR - openCreditSales) * 100) / 100;
                    const arRollCheck = Math.round((openingAR + creditSalesPeriod + arOtherIn - collections - arOtherOut - endingAR) * 100) / 100;

                    // Period AP activity uses reconstructed credits/settlements by transaction_date
                    const creditExpensesPeriod = creditsInPeriod; // all payable expenses in window (inv + opex)
                    const endingAP = apBalance;
                    const periodApIncrease = creditsInPeriod - settlementsInPeriod;
                    // Prefer settlementsInPeriod (by date) over apSettlements from periodTxs filter (same if period filter matches dates)
                    const openPayableExpenses = sumBy(allTxs, (t) => t.type === "expense" && t.payment === "payable" && !t.settledAt);
                    const apGap = Math.round((endingAP - openPayableExpenses) * 100) / 100;

                    const cf = el("div", { class: "card stmt-card" });
                    cf.appendChild(el("div", { class: "stmt-title" }, "Cash Flow Statement"));
                    cf.appendChild(el("div", { class: "stmt-period" }, periodLabel + " · Cash, GCash & bank movements"));
                    cf.appendChild(stmtRow("Operating activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Cash sales (cash / GCash / bank)", salesCashLike, { indent: true }));
                    cf.appendChild(stmtRow("Receivable collections", collections, { indent: true }));
                    cf.appendChild(stmtRow("Cash paid for inventory", -invPurchasesCash, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Cash operating expenses", -opexCash, { indent: true, signed: true }));
                    if (settlementsInPeriod > 0) cf.appendChild(stmtRow("Accounts payable settlements", -settlementsInPeriod, { indent: true, signed: true }));
                    if (invPurchasesCredit > 0) cf.appendChild(stmtRow("(memo) Inventory bought on credit — no cash yet", invPurchasesCredit, { indent: true }));
                    if (opexCredit > 0) cf.appendChild(stmtRow("(memo) Operating expenses on credit — no cash yet", opexCredit, { indent: true }));
                    cf.appendChild(stmtRow("Net cash from operations", opsNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Investing activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Equipment / investment-like expenses", -investExp, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Net cash from investing", invNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Financing activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Owner contributions (from Owner)", ownerIn, { indent: true }));
                    cf.appendChild(stmtRow("Owner drawings (to Owner)", -ownerOut, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("From Business Funds", businessFundsIn, { indent: true }));
                    cf.appendChild(stmtRow("To Business Funds", -businessFundsOut, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Net cash from financing", finNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Net change in liquid cash", netCashChange, { grand: true, signed: true }));
                    cf.appendChild(
                        el(
                            "div",
                            { class: "stmt-note" },
                            "Transfers among Cash / GCash / Bank are not revenue or expense. Inventory on credit increases Inventory + AP with no cash movement until settled.",
                        ),
                    );
                    section.appendChild(cf);

                    // ---- AR reconciliation ----
                    const arCard = el("div", { class: "card stmt-card" });
                    arCard.appendChild(el("div", { class: "stmt-title" }, "Accounts receivable reconciliation"));
                    arCard.appendChild(el("div", { class: "stmt-period" }, "Reconstructed from transaction dates. Credit sale → +AR; collection → −AR (collections are not revenue)."));
                    arCard.appendChild(stmtRow("Opening AR (start of period)", openingAR, { indent: true }));
                    arCard.appendChild(stmtRow("+ Credit sales this period", creditSalesPeriod, { indent: true }));
                    if (arOtherIn > 0) arCard.appendChild(stmtRow("+ Other transfers into AR", arOtherIn, { indent: true }));
                    arCard.appendChild(stmtRow("− Collections this period", collections, { indent: true }));
                    if (arOtherOut > 0) arCard.appendChild(stmtRow("− Other AR reductions", arOtherOut, { indent: true }));
                    arCard.appendChild(stmtRow("Ending AR (Balance Sheet ledger)", endingAR, { grand: true }));
                    arCard.appendChild(stmtRow("Ending AR (reconstructed from dates)", endingARRecon, { indent: true }));
                    const arCheck = Math.round((openingAR + creditSalesPeriod + arOtherIn - collections - arOtherOut - endingAR) * 100) / 100;
                    if (Math.abs(arCheck) > 0.05) {
                        arCard.appendChild(el("div", { class: "stmt-note", style: "color:var(--rust)" }, "⚠ AR roll-forward residual: " + fmtPeso(arCheck)));

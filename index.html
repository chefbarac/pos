                }

                /* ---------- TREND CHARTS (Reports) ---------- */
                const TREND_RANGES = [
                    ["7d", "7D"],
                    ["30d", "30D"],
                    ["90d", "90D"],
                    ["all", "Monthly"],
                ];

                /* Build the bucket boundaries for a trend range: daily buckets for 7d/30d/90d,
                   or monthly buckets (capped at the most recent 12) for 'all'. */
                function trendBucketDefs(range, earliestTxDate) {
                    const now = new Date();
                    if (range === "all") {
                        const first = earliestTxDate ? new Date(earliestTxDate) : now;
                        let cursor = new Date(first.getFullYear(), first.getMonth(), 1);
                        const endCursor = new Date(now.getFullYear(), now.getMonth(), 1);
                        const buckets = [];
                        while (cursor <= endCursor) {
                            const start = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
                            const end = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0, 23, 59, 59, 999);
                            buckets.push({ label: start.toLocaleDateString("en-PH", { month: "short", year: "2-digit" }), start, end });
                            cursor.setMonth(cursor.getMonth() + 1);
                        }
                        return buckets.slice(-12);
                    }
                    const days = range === "7d" ? 7 : range === "90d" ? 90 : 30;
                    const buckets = [];
                    for (let i = days - 1; i >= 0; i--) {
                        const d = new Date(now);
                        d.setDate(d.getDate() - i);
                        buckets.push({ label: d.toLocaleDateString("en-PH", { month: "short", day: "numeric" }), start: startOfDay(d), end: endOfDay(d) });
                    }
                    return buckets;
                }

                /* Walk all transactions once (oldest→newest) and, for each bucket, record the running
                   account balances as of the bucket's end plus the sales/expenses/transfers that landed
                   inside that bucket. Balances accumulate across the *entire* history (not just the
                   visible window) so the chart always reflects the true running balance. */
                async function computeTrendSeries(range) {
                    const txs = (await allTx()).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
                    const company = await getActiveCompany();
                    let cash = company ? Number(company.startingCash) || 0 : 0;
                    let gcash = company ? Number(company.startingGcash) || 0 : 0;
                    let bank = company ? Number(company.startingBank) || 0 : 0;
                    let receivable = company ? Number(company.startingReceivable) || 0 : 0;

                    const buckets = trendBucketDefs(range, txs.length ? txs[0].date : null);
                    let i = 0;
                    const out = [];
                    for (const b of buckets) {
                        let sales = 0,
                            expenses = 0,
                            transfers = 0;
                        while (i < txs.length && new Date(txs[i].date) <= b.end) {
                            const t = txs[i];
                            const amt = Number(t.amount) || 0;
                            if (t.type === "sale") {
                                sales += amt;
                                if (t.payment === "cash") cash += amt;
                                else if (t.payment === "gcash") gcash += amt;
                                else if (t.payment === "bank") bank += amt;
                                else if (t.payment === "receivable") receivable += amt;
                            } else if (t.type === "expense") {
                                expenses += amt;
                                if (t.payment === "cash") cash -= amt;
                                else if (t.payment === "gcash") gcash -= amt;
                                else if (t.payment === "bank") bank -= amt;
                            } else if (t.type === "transfer") {
                                transfers += amt;
                                if (t.fromAccount === "cash") cash -= amt;
                                else if (t.fromAccount === "gcash") gcash -= amt;
                                else if (t.fromAccount === "bank") bank -= amt;
                                else if (t.fromAccount === "receivable") receivable -= amt;
                                if (t.toAccount === "cash") cash += amt;
                                else if (t.toAccount === "gcash") gcash += amt;
                                else if (t.toAccount === "bank") bank += amt;
                                else if (t.toAccount === "receivable") receivable += amt;
                            }
                            i++;
                        }
                        out.push({ label: b.label, cash, gcash, bank, receivable, sales, expenses, transfers, net: sales - expenses });
                    }
                    return out;
                }

                /* Renders a multi-series line chart as an inline SVG with hover/tap support. `series` is
                   the already-filtered list of VISIBLE series — [{ key, color, label }, ...]. Each point
                   in `points` must have a numeric value for every series key. `opts.onHover(idx)` fires
                   on move/tap over a point; `opts.onLeave()` fires when the pointer leaves the chart. */
                function buildTrendChart(points, series, opts) {
                    opts = opts || {};
                    const W = 600,
                        H = 170,
                        padL = 4,
                        padR = 4,
                        padT = 10,
                        padB = 22;
                    const innerW = W - padL - padR,
                        innerH = H - padT - padB;
                    const n = points.length;
                    const vals = [];
                    points.forEach((p) => series.forEach((s) => vals.push(p[s.key])));
                    let min = Math.min(0, ...vals);
                    let max = Math.max(0, ...vals);
                    if (min === max) max = min + 1;
                    const pad = (max - min) * 0.08;
                    min -= pad;
                    max += pad;
                    const range = max - min || 1;

                    function xAt(idx) {
                        return padL + (n <= 1 ? innerW / 2 : (idx / (n - 1)) * innerW);
                    }
                    function yAt(v) {
                        return padT + innerH - ((v - min) / range) * innerH;
                    }

                    const svg = elSVG("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", class: "trendchart" });

                    // zero baseline (only drawn separately from the axis line when values dip negative)
                    if (min < 0 && max > 0) {
                        const y0 = yAt(0);
                        svg.appendChild(elSVG("line", { x1: padL, y1: y0, x2: W - padR, y2: y0, style: "stroke:var(--border);stroke-width:1;stroke-dasharray:3,3" }));
                    }
                    svg.appendChild(elSVG("line", { x1: padL, y1: padT + innerH, x2: W - padR, y2: padT + innerH, style: "stroke:var(--border);stroke-width:1" }));

                    series.forEach((s) => {
                        const d = points.map((p, idx) => `${idx === 0 ? "M" : "L"}${xAt(idx).toFixed(1)},${yAt(p[s.key]).toFixed(1)}`).join(" ");
                        svg.appendChild(elSVG("path", { d, style: `fill:none;stroke:${s.color};stroke-width:2.5`, "stroke-linejoin": "round", "stroke-linecap": "round" }));
                        if (n <= 14) {
                            points.forEach((p, idx) => {
                                svg.appendChild(elSVG("circle", { cx: xAt(idx), cy: yAt(p[s.key]), r: 2.5, style: `fill:${s.color}` }));
                            });
                        } else {
                            const last = points[n - 1];
                            svg.appendChild(elSVG("circle", { cx: xAt(n - 1), cy: yAt(last[s.key]), r: 3, style: `fill:${s.color}` }));
                        }
                    });

                    // x-axis labels: first, middle, last (avoids clutter on longer ranges)
                    const idxs = n <= 1 ? [0] : n <= 5 ? points.map((_, idx) => idx) : [0, Math.round((n - 1) / 2), n - 1];
                    idxs.forEach((idx) => {
                        const anchor = idx === 0 ? "start" : idx === n - 1 ? "end" : "middle";
                        svg.appendChild(elSVG("text", { x: xAt(idx), y: H - 4, "text-anchor": anchor, style: "font-size:10px;fill:var(--ink-soft);font-family:var(--sans)" }, points[idx].label));
                    });

                    // Hover/tap layer: a vertical guide line plus a highlight dot per series, both hidden
                    // until the person moves a pointer (mouse or touch) over the plot area.
                    const guideLine = elSVG("line", {
                        x1: xAt(0),
                        x2: xAt(0),
                        y1: padT,
                        y2: padT + innerH,
                        style: "stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:2,2;opacity:0;pointer-events:none",
                    });
                    svg.appendChild(guideLine);
                    const highlightDots = series.map((s) => elSVG("circle", { r: 4, style: `fill:${s.color};stroke:var(--paper-card);stroke-width:1.5;opacity:0;pointer-events:none` }));
                    highlightDots.forEach((d) => svg.appendChild(d));

                    function setHighlight(idx) {
                        if (idx == null) {
                            guideLine.setAttribute("style", guideLine.getAttribute("style").replace("opacity:1", "opacity:0"));
                            guideLine.style.opacity = 0;
                            highlightDots.forEach((d) => (d.style.opacity = 0));
                            return;
                        }
                        const p = points[idx];
                        const x = xAt(idx);
                        guideLine.setAttribute("x1", x);
                        guideLine.setAttribute("x2", x);
                        guideLine.style.opacity = 0.6;
                        series.forEach((s, i) => {
                            const d = highlightDots[i];
                            d.setAttribute("cx", x);
                            d.setAttribute("cy", yAt(p[s.key]));
                            d.style.opacity = 1;
                        });
                    }

                    if (n > 0) {
                        const hit = elSVG("rect", {
                            x: padL,
                            y: 0,
                            width: innerW,
                            height: H,
                            style: "fill:transparent;pointer-events:all",
                        });
                        svg.insertBefore(hit, guideLine);
                        const indexFromEvent = (e) => {
                            const rect = svg.getBoundingClientRect();
                            if (!rect.width) return 0;
                            const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                            return n <= 1 ? 0 : Math.round(frac * (n - 1));
                        };
                        hit.addEventListener("pointerdown", (e) => {
                            const idx = indexFromEvent(e);
                            setHighlight(idx);
                            opts.onHover && opts.onHover(idx);
                        });
                        hit.addEventListener("pointermove", (e) => {
                            if (e.buttons === 0 && e.pointerType === "mouse") {
                                // plain hover (no button) — still track for mouse
                            }
                            const idx = indexFromEvent(e);
                            setHighlight(idx);
                            opts.onHover && opts.onHover(idx);
                        });
                        hit.addEventListener("pointerleave", () => {
                            setHighlight(null);
                            opts.onLeave && opts.onLeave();
                        });
                    }

                    return svg;
                }

                /* Legend that doubles as a series toggle: tapping an item hides/shows that series and
                   triggers a re-render (via onToggle), letting a person exclude a data group — e.g. large
                   owner Transfers — that's stretching the scale and flattening everything else. */
                function buildChartLegend(points, allSeries, hiddenKeys, onToggle) {
                    const last = points[points.length - 1] || {};
                    return el(
                        "div",
                        { class: "chart-legend" },
                        allSeries.map((s) => {
                            const isHidden = hiddenKeys.includes(s.key);
                            const item = el("button", { type: "button", class: "legend-item" + (isHidden ? " hidden" : "") }, [
                                el("span", { class: "legend-dot", style: `background:${s.color}` }),
                                el("span", {}, s.label),
                                el("span", { class: "legend-val" }, fmtPeso(last[s.key] || 0)),
                            ]);
                            item.addEventListener("click", () => onToggle(s.key));
                            return item;
                        }),
                    );
                }

                /* Readout strip under a chart: shows the exact figures for the hovered/tapped point (or
                   the latest point when nothing is hovered), for only the currently-visible series. */
                function buildChartReadout(point, series) {
                    const roEl = el("div", { class: "chart-readout" });
                    function set(p) {
                        roEl.innerHTML = "";
                        roEl.appendChild(el("span", { class: "ro-label" }, p.label));
                        series.forEach((s) => {
                            roEl.appendChild(
                                el("span", { class: "ro-item" }, [el("span", { class: "ro-dot", style: `background:${s.color}` }), el("span", { class: "ro-val" }, fmtPeso(p[s.key] || 0))]),
                            );
                        });
                    }
                    set(point);
                    return { el: roEl, set };
                }

                /* Flags any visible balance series that dipped below zero within the shown range — a
                   quick warning that a business would have been short on that account at some point. */
                function buildNegativeBalanceWarning(points, visibleSeries) {
                    const flags = [];
                    visibleSeries.forEach((s) => {
                        let lowIdx = -1,
                            lowVal = 0;
                        points.forEach((p, idx) => {
                            if (p[s.key] < lowVal) {
                                lowVal = p[s.key];
                                lowIdx = idx;
                            }
                        });
                        if (lowIdx >= 0) flags.push(`${s.label} went negative (as low as ${fmtPeso(lowVal)} around ${points[lowIdx].label})`);
                    });
                    if (!flags.length) return null;
                    return el("div", { class: "chart-warn" }, [el("span", {}, "\u26a0\ufe0f"), el("span", {}, flags.join(" · "))]);
                }

                function toggleTrendSeries(chartKey, seriesKey) {
                    const list = App.trendHidden[chartKey];
                    const i = list.indexOf(seriesKey);
                    if (i === -1) list.push(seriesKey);
                    else list.splice(i, 1);
                    softRender();
                }

                function buildTrendChartCard(title, points, allSeries, chartKey) {
                    const hidden = App.trendHidden[chartKey];
                    const visible = allSeries.filter((s) => !hidden.includes(s.key));

                    const card = el("div", { class: "card chartcard" });
                    card.appendChild(el("div", { class: "chartcard-title" }, title));
                    card.appendChild(buildChartLegend(points, allSeries, hidden, (key) => toggleTrendSeries(chartKey, key)));

                    if (chartKey === "balance") {
                        const warn = buildNegativeBalanceWarning(points, visible);
                        if (warn) card.appendChild(warn);
                    }

                    if (!visible.length) {
                        card.appendChild(el("div", { class: "empty small" }, "Tap a series above to show it on the chart."));
                        return card;
                    }

                    const last = points[points.length - 1] || {};
                    const readout = buildChartReadout(last, visible);
                    const svg = buildTrendChart(points, visible, {
                        onHover: (idx) => readout.set(points[idx]),
                        onLeave: () => readout.set(last),
                    });
                    card.appendChild(el("div", { class: "charthost" }, svg));
                    card.appendChild(readout.el);
                    return card;
                }

                async function renderTrendSection() {
                    const section = el("div", { class: "section" });
                    section.appendChild(el("div", { class: "section-title" }, "TRENDS"));

                    const rangeRow = el("div", { class: "chiprow" });
                    TREND_RANGES.forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.trendRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.trendRange = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    section.appendChild(rangeRow);
                    section.appendChild(el("div", { class: "help-text" }, "Tap a legend item to hide it from the chart. Hover or tap a point to see exact figures."));

                    const points = await computeTrendSeries(App.trendRange);

                    const balSeries = [
                        { key: "cash", color: "var(--green)", label: "Cash" },
                        { key: "gcash", color: "var(--gold)", label: "GCash" },
                        { key: "bank", color: "var(--ink)", label: "Bank" },
                        { key: "receivable", color: "var(--rust)", label: "Receivable" },
                    ];
                    section.appendChild(buildTrendChartCard("Account Balances", points, balSeries, "balance"));

                    const flowSeries = [
                        { key: "sales", color: "var(--green)", label: "Sales" },
                        { key: "expenses", color: "var(--rust)", label: "Expenses" },
                        { key: "transfers", color: "var(--gold)", label: "Transfers" },
                        { key: "net", color: "var(--ink)", label: "Net" },
                    ];
                    const flowTitle = App.trendRange === "all" ? "Sales, Expenses & Transfers (per month)" : "Sales, Expenses & Transfers (per day)";
                    section.appendChild(buildTrendChartCard(flowTitle, points, flowSeries, "flow"));

                    return section;
                }

                /* ---------- REPORTS ---------- */
                async function renderReports() {
                    const wrap = el("div", { class: "page" });
                    wrap.appendChild(el("div", { class: "page-title" }, "Reports"));

                    const rangeCard = el("div", { class: "card" });
                    const rangeRow = el("div", { class: "chiprow" });
                    [
                        ["today", "Today"],
                        ["week", "This Week"],
                        ["month", "This Month"],
                        ["all", "All Time"],
                    ].forEach(([val, label]) => {
                        const chip = el("button", { type: "button", class: "chip" + (App.reportRange === val ? " active" : "") }, label);
                        chip.addEventListener("click", () => {
                            App.reportRange = val;
                            softRender();
                        });
                        rangeRow.appendChild(chip);
                    });
                    rangeCard.appendChild(rangeRow);
                    wrap.appendChild(rangeCard);

                    let txs = await allTx();
                    const now = new Date();
                    if (App.reportRange === "today") txs = txs.filter((t) => inRange(t.date, startOfDay(now), endOfDay(now)));
                    else if (App.reportRange === "week") txs = txs.filter((t) => inRange(t.date, startOfWeek(now), endOfDay(now)));
                    else if (App.reportRange === "month") txs = txs.filter((t) => inRange(t.date, startOfMonth(now), endOfDay(now)));

                    const sales = sumBy(txs, (t) => t.type === "sale");
                    const expenses = sumBy(txs, (t) => t.type === "expense");
                    const net = sales - expenses;
                    const cashIn = sumBy(txs, (t) => t.type === "sale" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.toAccount === "cash");
                    const cashOut = sumBy(txs, (t) => t.type === "expense" && t.payment === "cash") + sumBy(txs, (t) => t.type === "transfer" && t.fromAccount === "cash");
                    const cashNet = cashIn - cashOut;

                    const summary = el("div", { class: "summary-grid" }, [
                        summaryCard("Total Sales", sales, "sales"),
                        summaryCard("Total Expenses", expenses, "expenses"),
                        summaryCard("Net Cash Flow", net, net >= 0 ? "sales" : "expenses"),
                        summaryCard("Cash Movement", cashNet, cashNet >= 0 ? "sales" : "expenses"),
                    ]);
                    wrap.appendChild(summary);

                    // account balances (all-time, not period-scoped — this is a point-in-time snapshot)
                    const allTxs = await allTx();
                    const bal = await computeAccountBalances(allTxs);
                    const balSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "ACCOUNT BALANCES (ALL-TIME)")]);
                    balSection.appendChild(
                        el("div", { class: "summary-grid" }, [
                            summaryCard("Cash", bal.cash, "sales"),
                            summaryCard("GCash", bal.gcash, "sales"),
                            summaryCard("Bank", bal.bank, "sales"),
                            summaryCard("Receivable", bal.receivable, bal.receivable > 0 ? "expenses" : "sales"),
                        ]),
                    );
                    wrap.appendChild(balSection);

                    // trend charts — balances and sales/expenses/transfers over time
                    wrap.appendChild(await renderTrendSection());

                    // fund transfers this period
                    const transfers = txs.filter((t) => t.type === "transfer").sort((a, b) => new Date(b.date) - new Date(a.date));
                    const transferSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "FUND TRANSFERS THIS PERIOD")]);
                    if (transfers.length === 0) {
                        transferSection.appendChild(el("div", { class: "empty small" }, "No GCash, bank, owner, or business funds transfers in this period."));
                    } else {
                        transfers.forEach((t) => transferSection.appendChild(txRow(t)));
                    }
                    wrap.appendChild(transferSection);

                    // category breakdown (sales) — spread across each transaction's line items
                    const catTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            catTotals[ln.category] = (catTotals[ln.category] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                    const catSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY CATEGORY")]);
                    if (catEntries.length === 0) {
                        catSection.appendChild(el("div", { class: "empty small" }, "No sales in this period yet."));
                    } else {
                        const max = Math.max(...catEntries.map((e) => e[1]));
                        catEntries.forEach(([cat, amt]) => {
                            catSection.appendChild(
                                el("div", { class: "barrow" }, [
                                    el("div", { class: "barrow-label" }, cat),
                                    el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill", style: `width:${((amt / max) * 100).toFixed(0)}%` })]),
                                    el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                    }
                    wrap.appendChild(catSection);

                    // payment method breakdown
                    const payTotals = { cash: 0, gcash: 0, bank: 0, receivable: 0, other: 0 };
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        const key = payTotals.hasOwnProperty(t.payment) ? t.payment : "other";
                        payTotals[key] = (payTotals[key] || 0) + t.amount;
                    });
                    const paySection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "SALES BY PAYMENT METHOD")]);
                    const payMax = Math.max(1, ...Object.values(payTotals));
                    Object.entries(payTotals).forEach(([p, amt]) => {
                        paySection.appendChild(
                            el("div", { class: "barrow" }, [
                                el("div", { class: "barrow-label" }, paymentLabel(p)),
                                el("div", { class: "barrow-track" }, [el("div", { class: "barrow-fill alt", style: `width:${((amt / payMax) * 100).toFixed(0)}%` })]),
                                el("div", { class: "barrow-amt" }, fmtPeso(amt)),
                            ]),
                        );
                    });
                    wrap.appendChild(paySection);

                    // top items — spread across each transaction's line items
                    const itemTotals = {};
                    txs.filter((t) => t.type === "sale").forEach((t) => {
                        txLines(t).forEach((ln) => {
                            itemTotals[ln.item] = (itemTotals[ln.item] || 0) + (Number(ln.amount) || 0);
                        });
                    });
                    const topItems = Object.entries(itemTotals)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 5);
                    if (topItems.length) {
                        const topSection = el("div", { class: "section" }, [el("div", { class: "section-title" }, "TOP ITEMS")]);
                        topItems.forEach(([name, amt], i) => {
                            topSection.appendChild(
                                el("div", { class: "toprow" }, [
                                    el("span", { class: "toprow-rank" }, String(i + 1)),
                                    el("span", { class: "toprow-name" }, name),
                                    el("span", { class: "toprow-amt" }, fmtPeso(amt)),
                                ]),
                            );
                        });
                        wrap.appendChild(topSection);
                    }

                    // ---- Financial Statements ----
                    wrap.appendChild(await renderFinancialStatements(txs, allTxs, bal, App.reportRange));

                    return wrap;
                }

                function reportPeriodLabel(range) {
                    if (range === "today") return "Today";
                    if (range === "week") return "This week";
                    if (range === "month") return "This month";
                    return "All time";
                }

                function stmtRow(label, amount, opts) {
                    opts = opts || {};
                    const cls = "stmt-row" + (opts.indent ? " indent" : "") + (opts.section ? " section-head" : "") + (opts.total ? " total" : "") + (opts.grand ? " grand" : "");
                    if (opts.section) {
                        return el("div", { class: cls }, [el("span", {}, label)]);
                    }
                    const amtCls = "stmt-amt" + (opts.signed && amount > 0 ? " pos" : opts.signed && amount < 0 ? " neg" : "");
                    const show = opts.blank ? "" : fmtPeso(amount);
                    return el("div", { class: cls }, [el("span", {}, label), el("span", { class: amtCls }, show)]);
                }

                /**
                 * Income Statement (P&L), Balance Sheet, Cash Flow — management view from POS data.
                 * COGS uses Costing weighted avg margin when available; otherwise expenses only.
                 */
                async function renderFinancialStatements(periodTxs, allTxs, bal, range) {
                    const section = el("div", { class: "section" });
                    section.appendChild(el("div", { class: "section-title" }, "FINANCIAL STATEMENTS"));
                    section.appendChild(
                        el("div", { class: "help-text" }, "Management statements from your POS books. Not a formal audit — good for decisions and AI discussion. Period follows the chips above."),
                    );

                    const periodLabel = reportPeriodLabel(range);
                    const revenue = sumBy(periodTxs, (t) => t.type === "sale");
                    const opex = sumBy(periodTxs, (t) => t.type === "expense");

                    // Expense breakdown by category for P&L detail
                    const expByCat = {};
                    periodTxs
                        .filter((t) => t.type === "expense")
                        .forEach((t) => {
                            txLines(t).forEach((ln) => {
                                const cat = ln.category || t.category || "Other";
                                expByCat[cat] = (expByCat[cat] || 0) + (Number(ln.amount) || 0);
                            });
                        });
                    const expCats = Object.entries(expByCat).sort((a, b) => b[1] - a[1]);

                    // Costing margin → estimated COGS
                    let avgMargin = null;
                    let estimatedCogs = null;
                    let grossProfit = null;
                    try {
                        const snap = await loadCostingInventorySnapshot();
                        if (snap.ok && snap.metrics && snap.metrics.avgMargin != null && isFinite(snap.metrics.avgMargin)) {
                            avgMargin = snap.metrics.avgMargin;
                            estimatedCogs = revenue * (1 - avgMargin / 100);
                            grossProfit = revenue - estimatedCogs;
                        }
                    } catch (e) {}

                    // Other income memo (forecast sources — not always booked as POS txs)
                    let otherIncomeMemo = 0;
                    try {
                        const oi = await companyOtherIncome();
                        otherIncomeMemo = (oi || []).filter((o) => !o.received).reduce((s, o) => s + (Number(o.amount) || 0), 0);
                    } catch (e) {}

                    const netIncome = avgMargin != null ? grossProfit - opex : revenue - opex;

                    // ---- Income Statement ----
                    const pl = el("div", { class: "card stmt-card" });
                    pl.appendChild(el("div", { class: "stmt-title" }, "Income Statement (P&L)"));
                    pl.appendChild(el("div", { class: "stmt-period" }, periodLabel + " · Revenue − costs"));
                    pl.appendChild(stmtRow("Revenue", 0, { section: true }));
                    pl.appendChild(stmtRow("Sales / services", revenue, { indent: true }));
                    pl.appendChild(stmtRow("Total revenue", revenue, { total: true }));
                    if (avgMargin != null) {
                        pl.appendChild(stmtRow("Cost of goods / services", 0, { section: true }));
                        pl.appendChild(stmtRow("Estimated COGS (" + fmtPct(avgMargin) + " margin)", estimatedCogs, { indent: true }));
                        pl.appendChild(stmtRow("Gross profit", grossProfit, { total: true, signed: true }));
                    }
                    pl.appendChild(stmtRow("Operating expenses", 0, { section: true }));
                    if (expCats.length) {
                        expCats.forEach(([cat, amt]) => pl.appendChild(stmtRow(cat, amt, { indent: true })));
                    } else {
                        pl.appendChild(stmtRow("No expenses in period", 0, { indent: true, blank: true }));
                    }
                    pl.appendChild(stmtRow("Total operating expenses", opex, { total: true }));
                    pl.appendChild(stmtRow(avgMargin != null ? "Net income (est.)" : "Net (sales − expenses)", netIncome, { grand: true, signed: true }));
                    pl.appendChild(
                        el(
                            "div",
                            { class: "stmt-note" },
                            avgMargin != null
                                ? "COGS is estimated from Costing weighted avg margin applied to period sales (not item-level actual cost). Owner drawings and internal transfers are not operating expenses."
                                : "Open Costing with priced products to estimate COGS and gross profit. Until then, Net is sales minus recorded expenses only.",
                        ),
                    );
                    section.appendChild(pl);

                    // ---- Balance Sheet ----
                    const assets = await companyAssets();
                    const fixedAssets = assets.reduce((s, a) => s + (Number(a.currentValue != null ? a.currentValue : a.cost) || 0), 0);
                    const liquid = (bal.cash || 0) + (bal.gcash || 0) + (bal.bank || 0);
                    const currentAssets = liquid + (bal.receivable || 0);
                    const totalAssets = currentAssets + fixedAssets;

                    const planned = await companyPlanned();
                    const unpaidPlanned = planned.filter((p) => !p.paid);
                    const liabilities = unpaidPlanned.reduce((s, p) => s + (Number(p.amount) || 0), 0);
                    const equity = totalAssets - liabilities;

                    const bs = el("div", { class: "card stmt-card" });
                    bs.appendChild(el("div", { class: "stmt-title" }, "Balance Sheet"));
                    bs.appendChild(el("div", { class: "stmt-period" }, "As of now (point-in-time)"));
                    bs.appendChild(stmtRow("Assets", 0, { section: true }));
                    bs.appendChild(stmtRow("Cash on hand", bal.cash || 0, { indent: true }));
                    bs.appendChild(stmtRow("GCash", bal.gcash || 0, { indent: true }));
                    bs.appendChild(stmtRow("Bank", bal.bank || 0, { indent: true }));
                    bs.appendChild(stmtRow("Accounts receivable", bal.receivable || 0, { indent: true }));
                    bs.appendChild(stmtRow("Current assets", currentAssets, { total: true }));
                    bs.appendChild(stmtRow("Fixed assets (equipment, etc.)", fixedAssets, { indent: true }));
                    if (assets.length) {
                        assets.forEach((a) => {
                            const v = Number(a.currentValue != null ? a.currentValue : a.cost) || 0;
                            if (v || a.name) bs.appendChild(stmtRow("· " + (a.name || "Asset"), v, { indent: true }));
                        });
                    }
                    bs.appendChild(stmtRow("Total assets", totalAssets, { grand: true }));
                    bs.appendChild(stmtRow("Liabilities", 0, { section: true }));
                    if (unpaidPlanned.length) {
                        unpaidPlanned.forEach((p) => {
                            bs.appendChild(stmtRow((p.name || "Obligation") + (p.type ? " [" + p.type + "]" : ""), Number(p.amount) || 0, { indent: true }));
                        });
                    } else {
                        bs.appendChild(stmtRow("No unpaid planned obligations recorded", 0, { indent: true, blank: true }));
                    }
                    bs.appendChild(stmtRow("Total liabilities", liabilities, { total: true }));
                    bs.appendChild(stmtRow("Equity (assets − liabilities)", equity, { grand: true, signed: true }));
                    bs.appendChild(
                        el(
                            "div",
                            { class: "stmt-note" },
                            "Liabilities here are unpaid items from Forecast → Planned expenses (e.g. SpayLater). Formal loans not logged there won’t appear. Equity is a plug for management use.",
                        ),
                    );
                    section.appendChild(bs);

                    // ---- Cash Flow ----
                    const salesCashLike = sumBy(periodTxs, (t) => t.type === "sale" && (t.payment === "cash" || t.payment === "gcash" || t.payment === "bank"));
                    // Gross credit sales booked in the period (whether or not later collected)
                    const creditSalesPeriod = sumBy(periodTxs, (t) => t.type === "sale" && t.payment === "receivable");
                    const expCashLike = sumBy(periodTxs, (t) => t.type === "expense" && (t.payment === "cash" || t.payment === "gcash" || t.payment === "bank"));
                    // Collections: transfers receivable → cash/gcash/bank
                    const collections = sumBy(
                        periodTxs,
                        (t) => t.type === "transfer" && t.fromAccount === "receivable" && (t.toAccount === "cash" || t.toAccount === "gcash" || t.toAccount === "bank"),
                    );
                    // Other AR movements in period (rare: transfer into receivable, or expense paid via receivable)
                    const arOtherIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "receivable");
                    const arOtherOut = sumBy(
                        periodTxs,
                        (t) =>
                            (t.type === "expense" && t.payment === "receivable") ||
                            (t.type === "transfer" && t.fromAccount === "receivable" && t.toAccount !== "cash" && t.toAccount !== "gcash" && t.toAccount !== "bank"),
                    );

                    // Owner / Business Funds / financing style transfers
                    const ownerIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.fromAccount === "owner");
                    const ownerOut = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "owner");
                    const businessFundsIn = sumBy(periodTxs, (t) => t.type === "transfer" && t.fromAccount === "businessFunds");
                    const businessFundsOut = sumBy(periodTxs, (t) => t.type === "transfer" && t.toAccount === "businessFunds");
                    // Investing-ish: expenses tagged investment or planned investment payments
                    const investExp = sumBy(periodTxs, (t) => t.type === "expense" && /invest|equipment|printer|capital/i.test((t.category || "") + " " + (t.item || "")));

                    const opsIn = salesCashLike + collections;
                    const opsOut = expCashLike;
                    const opsNet = opsIn - opsOut;
                    const finNet = ownerIn - ownerOut + businessFundsIn - businessFundsOut;
                    const invNet = -investExp;
                    const netCashChange = opsNet + invNet + finNet;

                    // AR rollforward so BS receivable and period activity reconcile
                    // Ending AR (balance sheet) = opening + credit sales − collections ± other
                    // Opening = ending − period net AR change (works for any report range)
                    const endingAR = Number(bal.receivable) || 0;
                    const periodArIncrease = creditSalesPeriod + arOtherIn - collections - arOtherOut;
                    const openingAR = endingAR - periodArIncrease;
                    // Still-open credit sales (sale rows not marked collected) — informational; ledger AR is source of truth
                    const openCreditSales = sumBy(allTxs, (t) => t.type === "sale" && t.payment === "receivable" && !t.collectedAt);
                    const arGap = Math.round((endingAR - openCreditSales) * 100) / 100;

                    const cf = el("div", { class: "card stmt-card" });
                    cf.appendChild(el("div", { class: "stmt-title" }, "Cash Flow Statement"));
                    cf.appendChild(el("div", { class: "stmt-period" }, periodLabel + " · Cash, GCash & bank movements"));
                    cf.appendChild(stmtRow("Operating activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Cash sales (cash / GCash / bank)", salesCashLike, { indent: true }));
                    cf.appendChild(stmtRow("Receivable collections", collections, { indent: true }));
                    cf.appendChild(stmtRow("Cash operating expenses", -expCashLike, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Net cash from operations", opsNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Investing activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Equipment / investment-like expenses", -investExp, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Net cash from investing", invNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Financing activities", 0, { section: true }));
                    cf.appendChild(stmtRow("Owner contributions (from Owner)", ownerIn, { indent: true }));
                    cf.appendChild(stmtRow("Owner drawings (to Owner)", -ownerOut, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("From Business Funds", businessFundsIn, { indent: true }));
                    cf.appendChild(stmtRow("To Business Funds", -businessFundsOut, { indent: true, signed: true }));
                    cf.appendChild(stmtRow("Net cash from financing", finNet, { total: true, signed: true }));
                    cf.appendChild(stmtRow("Net change in liquid cash", netCashChange, { grand: true, signed: true }));
                    section.appendChild(cf);

                    // ---- Accounts receivable reconciliation (ties BS ↔ period activity) ----
                    const arCard = el("div", { class: "card stmt-card" });
                    arCard.appendChild(el("div", { class: "stmt-title" }, "Accounts receivable reconciliation"));
                    arCard.appendChild(el("div", { class: "stmt-period" }, "Why BS receivable can differ from “credit sales this period” — those are different measures"));
                    arCard.appendChild(stmtRow("Opening AR (start of period)", openingAR, { indent: true }));
                    arCard.appendChild(stmtRow("+ Credit sales booked this period", creditSalesPeriod, { indent: true }));
                    if (arOtherIn > 0) arCard.appendChild(stmtRow("+ Other transfers into AR", arOtherIn, { indent: true }));
                    arCard.appendChild(stmtRow("− Collections this period", collections, { indent: true }));
                    if (arOtherOut > 0) arCard.appendChild(stmtRow("− Other AR reductions", arOtherOut, { indent: true }));
                    arCard.appendChild(stmtRow("Ending AR (Balance Sheet)", endingAR, { grand: true }));
                    arCard.appendChild(
                        el(
                            "div",
                            { class: "stmt-note" },
                            "Credit sales this period (" +
                                fmtPeso(creditSalesPeriod) +
                                ") is activity, not the unpaid balance. " +
                                "Ending AR on the Balance Sheet is what customers still owe after collections. " +
                                (Math.abs(periodArIncrease) > 0.005 ? "Net AR change this period: " + fmtPeso(periodArIncrease) + "." : "No net AR change this period."),
                        ),
                    );
                    if (Math.abs(arGap) > 0.05) {
                        arCard.appendChild(
                            el(
                                "div",
                                { class: "stmt-note" },
                                "Note: sum of open receivable sales (not marked collected) is " +
                                    fmtPeso(openCreditSales) +
                                    " vs ledger AR " +
                                    fmtPeso(endingAR) +
                                    " (Δ " +
                                    fmtPeso(arGap) +
                                    "). Often starting receivable, a collection without Mark as paid, or Mark as paid without a transfer. Ledger AR on the Balance Sheet is the figure to use.",
                            ),
                        );
                    }
                    section.appendChild(arCard);

                    // Copy-friendly block for AI
                    const copyCard = el("div", { class: "card stmt-card" });
                    copyCard.appendChild(el("div", { class: "stmt-title" }, "Copy statements for AI"));
                    const text = [
                        "=== Financial statements (" + periodLabel + ") ===",
                        "",
                        "INCOME STATEMENT",
                        "Revenue (sales): " + fmtPeso(revenue),
                        avgMargin != null ? "Est. COGS @" + fmtPct(avgMargin) + " margin: " + fmtPeso(estimatedCogs) : "COGS: (not estimated — no Costing margin)",
                        avgMargin != null ? "Gross profit: " + fmtPeso(grossProfit) : null,
                        "Operating expenses: " + fmtPeso(opex),
                        expCats.map(([c, a]) => "  - " + c + ": " + fmtPeso(a)).join("\n"),
                        "Net income (est.): " + fmtPeso(netIncome),
                        "",
                        "BALANCE SHEET (as of now)",
                        "Cash: " + fmtPeso(bal.cash),
                        "GCash: " + fmtPeso(bal.gcash),
                        "Bank: " + fmtPeso(bal.bank),
                        "Accounts receivable (ending): " + fmtPeso(endingAR),
                        "Fixed assets: " + fmtPeso(fixedAssets),
                        "Total assets: " + fmtPeso(totalAssets),
                        "Liabilities (unpaid planned): " + fmtPeso(liabilities),
                        "Equity (plug): " + fmtPeso(equity),
                        "",
                        "AR RECONCILIATION (" + periodLabel + ")",
                        "Opening AR: " + fmtPeso(openingAR),
                        "+ Credit sales booked this period: " + fmtPeso(creditSalesPeriod),
                        "− Collections this period: " + fmtPeso(collections),
                        "= Ending AR (matches Balance Sheet): " + fmtPeso(endingAR),
                        "Note: credit sales this period is period activity, NOT the unpaid balance.",
                        "",
                        "CASH FLOW (" + periodLabel + ")",
                        "Net from operations: " + fmtPeso(opsNet),
                        "Net from investing: " + fmtPeso(invNet),
                        "Owner contributions: " + fmtPeso(ownerIn),
                        "Owner drawings: " + fmtPeso(ownerOut),
                        "From Business Funds: " + fmtPeso(businessFundsIn),
                        "To Business Funds: " + fmtPeso(businessFundsOut),
                        "Net from financing: " + fmtPeso(finNet),
                        "Net change in liquid cash: " + fmtPeso(netCashChange),
                    ]
                        .filter((line) => line != null && line !== "")
                        .join("\n");
                    const ta = el("textarea", {
                        class: "finput",
                        style: "min-height:120px;font-family:var(--mono);font-size:11.5px;line-height:1.4;resize:vertical",
                        readonly: "readonly",
                    });
                    ta.value = text;
                    copyCard.appendChild(ta);
                    const copyBtn = el("button", { type: "button", class: "bigbtn sale small2" }, "Copy statements");
                    copyBtn.addEventListener("click", async () => {

                }
                function summaryCard(label, amount, cls) {
                    return el("div", { class: "summary-card" }, [el("div", { class: "sc-label" }, label), el("div", { class: "sc-value " + cls }, fmtPeso(amount))]);
                }
                function summaryCardText(label, text, cls) {
                    return el("div", { class: "summary-card" }, [el("div", { class: "sc-label" }, label), el("div", { class: "sc-value " + (cls || "") }, text)]);
                }
                function fmtPct(n) {
                    if (n == null || !isFinite(Number(n))) return "—";
                    return Number(n).toFixed(1).replace(/\.0$/, "") + "%";
                }

                /* ---------- FORECAST ---------- */
                const DEFAULT_ASSET_SEED = [
                    { name: "PC / Computer", category: "Equipment", cost: 0, currentValue: 0 },
                    { name: "Printer", category: "Equipment", cost: 0, currentValue: 0 },
                    { name: "Laminator", category: "Equipment", cost: 0, currentValue: 0 },
                ];
                const DEFAULT_RECURRING_SEED = [
                    { name: "Electricity", amount: 0, frequency: "monthly" },
                    { name: "WiFi / Internet", amount: 0, frequency: "monthly" },
                    { name: "Labor / Salary", amount: 0, frequency: "monthly" },
                    { name: "Maintenance", amount: 0, frequency: "monthly" },
                ];

                async function companyAssets() {
                    const cid = await getActiveCompanyId();
                    return (await dbGetAll("assets")).filter((a) => a.companyId === cid);
                }
                async function companyRecurring() {

                }

                }
                async function companyOtherIncome() {

                }

                async function seedForecastIfEmpty() {
                    const cid = await getActiveCompanyId();
                    if (cid == null) return;
                    const assets = await companyAssets();
                    if (assets.length === 0) {
                        for (const a of DEFAULT_ASSET_SEED) {
                            await dbAdd("assets", Object.assign({ companyId: cid, purchaseDate: "", notes: "", createdAt: new Date().toISOString() }, a));
                        }
                    }
                    const rec = await companyRecurring();
                    if (rec.length === 0) {
                        for (const r of DEFAULT_RECURRING_SEED) {
                            await dbAdd("recurringExpenses", Object.assign({ companyId: cid, notes: "", createdAt: new Date().toISOString() }, r));
                        }
                    }
                    // Optional example row for external income (e.g. copra) — only if store is empty
                    const other = await companyOtherIncome();
                    if (other.length === 0) {
                        await dbAdd("otherIncome", {
                            companyId: cid,
                            name: "Copra sale",
                            amount: 0,
                            frequency: "monthly",
                            expectedDate: "",
                            notes: "Other income that can support shop investments (set amount when expected)",
                            createdAt: new Date().toISOString(),
                        });
                    }
                }

                /** Expected other income over a horizon (days). monthly/weekly/daily prorated; one-time counted if due in window or no date. */
                function otherIncomeInWindow(items, horizonDays, now, horizonEnd) {
                    let total = 0;
                    const details = [];
                    (items || []).forEach((o) => {
                        if (o.received) return;
                        const amt = Number(o.amount) || 0;
                        if (amt <= 0) return;
                        const freq = o.frequency || "one-time";
                        let inWindow = 0;
                        if (freq === "monthly") inWindow = (amt / 30) * horizonDays;
                        else if (freq === "weekly") inWindow = (amt / 7) * horizonDays;
                        else if (freq === "daily") inWindow = amt * horizonDays;
                        else if (freq === "yearly") inWindow = (amt / 365) * horizonDays;
                        else {
                            // one-time: include if expectedDate in window, or no date (treat as expected within horizon)
                            if (!o.expectedDate) inWindow = amt;
                            else {
                                const d = startOfDay(new Date(o.expectedDate));
                                if (d >= now && d <= horizonEnd) inWindow = amt;
                            }
                        }
                        if (inWindow > 0) {
                            total += inWindow;
                            details.push({ name: o.name, amount: inWindow, frequency: freq });
                        }
                    });
                    return { total, details };
                }

                function monthlyFromFrequency(amount, frequency) {
                    const a = Number(amount) || 0;
                    if (frequency === "weekly") return a * (52 / 12);
                    if (frequency === "daily") return a * 30;
                    if (frequency === "yearly") return a / 12;
                    return a; // monthly
                }

                function daysInHorizon(horizonDays, targetDateStr) {
                    if (targetDateStr) {
                        const target = startOfDay(new Date(targetDateStr));
                        const now = startOfDay(new Date());
                        const diff = Math.round((target - now) / 86400000);
                        return Math.max(1, diff);
                    }
                    return Math.max(1, Number(horizonDays) || 30);
                }

                /** Sales marked excludeFromForecast stay in books/inventory but are ignored by Forecast averages & demand. */
                function isExcludedFromForecast(t) {
                    return !!(t && t.excludeFromForecast);
                }

                /** Average daily sales from the last N days (calendar days). Excludes forecast-excluded sales. */
                async function computeAvgDailySales(lookbackDays) {
                    const txs = await allTx();
                    const now = new Date();
                    const from = startOfDay(now);
                    from.setDate(from.getDate() - (lookbackDays - 1));
                    const inRangeSales = txs.filter((t) => t.type === "sale" && inRange(t.date, from, endOfDay(now)));
                    const excluded = inRangeSales.filter(isExcludedFromForecast);
                    const sales = inRangeSales.filter((t) => !isExcludedFromForecast(t));
                    const total = sumBy(sales, () => true);
                    const excludedTotal = sumBy(excluded, () => true);
                    // Use calendar days so quiet days pull the average down realistically
                    return {
                        total,
                        avgDaily: total / lookbackDays,
                        count: sales.length,
                        lookbackDays,
                        excludedCount: excluded.length,
                        excludedTotal,
                    };
                }

                /**
                 * Match Costing's materialCurrentQty:
                 * startingQty + sum(in) − sum(out), with type "adjust" setting absolute qty.
                 * Previously we only summed moves (from 0), so POS sales stock-outs without
                 * matching stock-ins showed negative inventory even when startingQty was set.
                 */
                function costingMaterialCurrentQty(mat, moves) {
                    let qty = Number(mat.startingQty) || 0;
                    const sorted = (moves || [])
                        .filter((m) => m.materialId === mat.id)
                        .slice()
                        .sort((a, b) => (a.date || 0) - (b.date || 0) || (a.id || 0) - (b.id || 0));
                    sorted.forEach((m) => {
                        const q = Number(m.qty) || 0;
                        if (m.type === "in") qty += q;
                        else if (m.type === "out") qty -= q;
                        else if (m.type === "adjust") qty = q;
                    });
                    return qty;
                }

                async function loadCostingInventorySnapshot() {
                    const result = { materials: [], products: [], ok: false, message: "" };
                    try {
                        const cdb = await openCostingDB();
                        if (!cdb.objectStoreNames.contains("materials")) {
                            result.message = "Costing materials not available";
                            return result;
                        }
                        const materials = await costingReq(cdb.transaction("materials", "readonly").objectStore("materials").getAll());
                        const products = cdb.objectStoreNames.contains("products") ? await costingReq(cdb.transaction("products", "readonly").objectStore("products").getAll()) : [];
                        let moves = [];
                        if (cdb.objectStoreNames.contains("stockMoves")) {
                            moves = await costingReq(cdb.transaction("stockMoves", "readonly").objectStore("stockMoves").getAll());
                        }
                        result.materials = (materials || []).map((m) => {
                            const stock = costingMaterialCurrentQty(m, moves);
                            return {
                                id: m.id,
                                name: m.name || "Material",
                                unit: m.unit || "",
                                stock,
                                startingQty: Number(m.startingQty) || 0,
                                // Costing field is reorderLevel (not reorderAt)
                                reorderAt: m.reorderLevel != null ? Number(m.reorderLevel) : m.reorderAt != null ? Number(m.reorderAt) : null,
                                costPerUnit: Number(m.costPerUnit) || Number(m.unitCost) || null,
                            };
                        });
                        result.products = products || [];
                        // Same weighted avg margin as Costing Products tab (sellable units × product margin)
                        result.metrics = computeCostingProductMetrics(result.products, result.materials, moves);
                        result.ok = true;
                        return result;
                    } catch (e) {
                        result.message = String(e && e.message ? e.message : e);
                        return result;
                    }
                }

                /**
                 * Mirrors Costing's Products summary chips:
                 * - product margin = (sellingPrice − costItems sum) / sellingPrice × 100
                 * - avg margin = Σ(margin × sellableUnits) / Σ(sellableUnits)
                 * Sellable units: bottleneck from non-optional recipe lines vs material stock;
                 * products with no recipe count as 1 unit so list prices still roll up.
                 */
                function computeCostingProductMetrics(products, materials, moves) {
                    const empty = {
                        avgMargin: null,
                        productCount: 0,
                        unitsSum: 0,
                        totalCost: 0,
                        totalRevenue: 0,
                        totalProfit: 0,
                        simpleAvgMargin: null,
                    };
                    if (!products || !products.length) return empty;

                    const stockById = {};
                    (materials || []).forEach((m) => {
                        // materials may already have .stock from snapshot, else recompute
                        stockById[m.id] = m.stock != null ? Number(m.stock) : costingMaterialCurrentQty(m, moves);
                    });

                    function recipeLines(p) {
                        if (!p || !p.costItems) return [];
                        return p.costItems
                            .filter((c) => c.materialId && c.invQty != null && Number(c.invQty) > 0 && !c.optional)
                            .map((c) => ({ materialId: c.materialId, qty: Number(c.invQty) || 0 }));
                    }

                    // Allocate stock across products in name order (same spirit as Costing bottleneck)
                    const remaining = Object.assign({}, stockById);
                    const unitsById = {};
                    products
                        .slice()
                        .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
                        .forEach((p) => {
                            const lines = recipeLines(p);
                            if (!lines.length) {
                                unitsById[p.id] = 1;
                                return;
                            }
                            let max = Infinity;
                            lines.forEach((ln) => {
                                const avail = remaining[ln.materialId] != null ? remaining[ln.materialId] : 0;
                                const per = Number(ln.qty) || 0;
                                if (per <= 0) return;
                                max = Math.min(max, avail / per);
                            });
                            const units = isFinite(max) ? Math.max(0, Math.floor(max)) : 0;
                            unitsById[p.id] = units;
                            lines.forEach((ln) => {
                                remaining[ln.materialId] = (remaining[ln.materialId] || 0) - units * (Number(ln.qty) || 0);
                            });
                        });

                    let totalCost = 0,
                        totalRevenue = 0,
                        marginWeighted = 0,
                        unitsSum = 0,
                        simpleMarginSum = 0,
                        simpleCount = 0;

                    products.forEach((p) => {
                        const cost = (p.costItems || []).reduce((s, c) => s + (Number(c.amount) || 0), 0);
                        const price = Number(p.sellingPrice) || 0;
                        const profit = price - cost;
                        const margin = price > 0 ? (profit / price) * 100 : 0;
                        const lines = recipeLines(p);
                        const units = lines.length ? Number(unitsById[p.id]) || 0 : 1;
                        totalCost += units * cost;
                        totalRevenue += units * price;
                        if (units > 0 && isFinite(margin)) {
                            marginWeighted += margin * units;
                            unitsSum += units;
                        }
                        if (price > 0 && isFinite(margin)) {
                            simpleMarginSum += margin;
                            simpleCount++;
                        }
                    });

                    const totalProfit = totalRevenue - totalCost;
                    return {
                        avgMargin: unitsSum ? marginWeighted / unitsSum : simpleCount ? simpleMarginSum / simpleCount : null,
                        simpleAvgMargin: simpleCount ? simpleMarginSum / simpleCount : null,
                        productCount: products.length,
                        unitsSum,
                        totalCost,
                        totalRevenue,
                        totalProfit,
                    };
                }

                /** Top sold item names from POS history — drives equipment / consumable suggestions. */
                /**
                 * Returns { byAmount, byQty, all } so demand can be judged by unit volume,
                 * not only peso value (high unit price can overstate demand for low-volume SKUs).
                 */
                async function topSoldItems(lookbackDays, limit) {
                    const txs = await allTx();
                    const now = new Date();
                    const from = startOfDay(now);
                    from.setDate(from.getDate() - (lookbackDays - 1));
                    const totals = {};
                    const qtys = {};
                    txs.filter((t) => t.type === "sale" && inRange(t.date, from, endOfDay(now)) && !isExcludedFromForecast(t)).forEach((t) => {
                        txLines(t).forEach((ln) => {
                            const name = (ln.item || "").trim();
                            if (!name) return;
                            totals[name] = (totals[name] || 0) + (Number(ln.amount) || 0);
                            qtys[name] = (qtys[name] || 0) + (Number(ln.qty) || 1);
                        });
                    });
                    const all = Object.keys(totals).map((name) => ({
                        name,
                        amount: totals[name],
                        qty: qtys[name],
                        unitPrice: qtys[name] > 0 ? totals[name] / qtys[name] : 0,
                    }));
                    const lim = limit || 10;
                    const byAmount = all
                        .slice()
                        .sort((a, b) => b.amount - a.amount)
                        .slice(0, lim);
                    const byQty = all
                        .slice()
                        .sort((a, b) => b.qty - a.qty || b.amount - a.amount)
                        .slice(0, lim);
                    return { byAmount, byQty, all };
                }

                function categorizeDemand(topByQty, topByAmount) {
                    const buckets = {
                        print: { qty: 0, amount: 0, labels: [] },
                        laminate: { qty: 0, amount: 0, labels: [] },
                        photo: { qty: 0, amount: 0, labels: [] },
                        ukay: { qty: 0, amount: 0, labels: [] },
                        supplies: { qty: 0, amount: 0, labels: [] },
                        other: { qty: 0, amount: 0, labels: [] },
                    };
                    function bucket(name) {
                        const n = (name || "").toLowerCase();
                        if (/laminat/.test(n)) return "laminate";
                        if (/print|photocopy|xerox|copy|scan|document|b&w|colored|bond paper/.test(n)) return "print";
                        if (/photo|picture|id\b|passport/.test(n)) return "photo";
                        if (/ukay|shirt|clothes|apparel/.test(n)) return "ukay";
                        if (/ballpen|notebook|pencil|paper|supplies/.test(n)) return "supplies";
                        return "other";
                    }
                    const seen = new Set();
                    [...(topByQty || []), ...(topByAmount || [])].forEach((t) => {
                        if (!t || seen.has(t.name)) return;
                        seen.add(t.name);
                        const b = bucket(t.name);
                        buckets[b].qty += Number(t.qty) || 0;
                        buckets[b].amount += Number(t.amount) || 0;
                        buckets[b].labels.push(t.name);
                    });
                    return buckets;
                }

                function equipmentHintsFromSales(topByQty, topByAmount) {
                    const buckets = categorizeDemand(topByQty, topByAmount);
                    const ranked = Object.entries(buckets)
                        .filter(([k]) => k !== "other")
                        .map(([key, v]) => ({ key, qty: v.qty, amount: v.amount, labels: v.labels }))
                        .filter((x) => x.qty > 0 || x.amount > 0)
                        .sort((a, b) => b.qty - a.qty || b.amount - a.amount);

                    const hints = [];
                    const leader = ranked[0];
                    const byKey = (k) => ranked.find((r) => r.key === k);

                    const print = byKey("print");
                    const laminate = byKey("laminate");
                    const photo = byKey("photo");
                    const ukay = byKey("ukay");

                    if (print && (print.qty > 0 || print.amount > 0)) {
                        const volLead = !leader || leader.key === "print" || print.qty >= (leader.qty || 0) * 0.5;
                        hints.push({
                            equipment: "Printer / high-volume printer",
                            reason:
                                "Print/copy volume: ~" +
                                Math.round(print.qty) +
                                " units / " +
                                fmtPeso(print.amount) +
                                " revenue in the lookback. " +
                                (volLead
                                    ? "Highest (or near-highest) unit demand — capacity or a backup unit protects throughput."
                                    : "Meaningful print volume; weigh vs other categories by units, not only peso totals."),
                            priority: volLead || print.qty >= 20 ? "high" : "medium",
                        });
                    }
                    if (laminate && laminate.qty > 0) {
                        // High peso / low qty should not auto-rank above print volume
                        const qtyLead = leader && leader.key === "laminate";
                        hints.push({
                            equipment: "Laminator (or second unit)",
                            reason:
                                "Lamination: ~" +
                                Math.round(laminate.qty) +
                                " units / " +
                                fmtPeso(laminate.amount) +
                                ". " +
                                (qtyLead
                                    ? "Leads by unit volume — film + reliable laminator matter."
                                    : "May look large in ₱ if unit price is high; unit count is lower than print/copy — do not treat revenue alone as demand."),
                            priority: qtyLead ? "high" : laminate.qty >= 15 ? "medium" : "low",
                        });
                    }
                    if (photo && photo.qty > 0) {
                        hints.push({
                            equipment: "Photo printer / ID camera setup",
                            reason: "Photo/ID: ~" + Math.round(photo.qty) + " units / " + fmtPeso(photo.amount) + " — dedicated gear helps if volume keeps growing.",
                            priority: photo.qty >= 10 ? "medium" : "low",
                        });
                    }
                    if (ukay && (ukay.qty > 0 || ukay.amount > 0)) {
                        hints.push({
                            equipment: "Display / storage for apparel",
                            reason: "Ukay-ukay volume benefits more from display space than print hardware.",
                            priority: "low",
                        });
                    }
                    if (!hints.length && (topByQty || []).length) {
                        hints.push({
                            equipment: "Review top SKUs by unit volume before big hardware buys",
                            reason: "Match the next equipment peso to #1 by quantity (jobs/units), not only #1 by revenue.",
                            priority: "low",
                        });
                    }
                    return hints;
                }

                function replenishmentSuggestions(materials, topItems, avgDailySales) {
                    const suggestions = [];
                    const topNames = topItems.map((t) => t.name.toLowerCase());
                    const consumableKeywords = ["bond", "paper", "film", "laminat", "ink", "toner", "photo paper", "a4", "legal"];
                    materials.forEach((m) => {
                        const name = (m.name || "").toLowerCase();
                        const isConsumable = consumableKeywords.some((k) => name.includes(k));
                        if (!isConsumable && m.reorderAt == null) return;
                        const stock = Number(m.stock) || 0;
                        const reorder = m.reorderAt != null ? m.reorderAt : isConsumable ? 50 : null;
                        if (reorder == null) return;
                        // Rough daily use: if material name appears in top sold items, scale by qty share
                        let dailyUse = 0;
                        topItems.forEach((ti) => {
                            if (ti.name.toLowerCase().includes(name.split(" ")[0]) || name.includes(ti.name.toLowerCase().split(" ")[0])) {
                                dailyUse += (ti.qty || 0) / 30;
                            }
                        });
                        if (!dailyUse && isConsumable) dailyUse = Math.max(1, stock > 0 ? stock / 60 : 5); // fallback burn rate
                        const daysLeft = dailyUse > 0 ? stock / dailyUse : stock > 0 ? 999 : 0;
                        const need = stock <= reorder || daysLeft < 14;
                        if (!need && stock > reorder) return;
                        const targetDays = 30;
                        const suggestedQty = Math.max(0, Math.ceil(dailyUse * targetDays - stock));
                        suggestions.push({
                            name: m.name,
                            stock,
                            unit: m.unit || "pcs",
                            daysLeft: daysLeft >= 999 ? null : Math.round(daysLeft),
                            suggestedQty: suggestedQty || Math.max(reorder - stock, 0),
                            reorderAt: reorder,
                            priority: stock <= 0 ? "critical" : daysLeft < 7 ? "high" : "medium",
                        });
                    });
                    // Also suggest from sales names when Costing has no materials
                    if (!suggestions.length && topItems.length) {
                        topItems.slice(0, 5).forEach((ti) => {
                            const n = ti.name.toLowerCase();
                            if (consumableKeywords.some((k) => n.includes(k)) || /paper|film|ink|toner|pen|notebook/.test(n)) {
                                suggestions.push({
                                    name: ti.name,
                                    stock: null,
                                    unit: "based on sales",
                                    daysLeft: null,
                                    suggestedQty: Math.max(10, Math.ceil((ti.qty || 0) * 1.2)),
                                    reorderAt: null,
                                    priority: "medium",
                                    note: "From recent sales volume (Costing stock not linked)",
                                });
                            }
                        });
                    }
                    return suggestions.sort((a, b) => {
                        const rank = { critical: 0, high: 1, medium: 2, low: 3 };
                        return (rank[a.priority] || 9) - (rank[b.priority] || 9);
                    });
                }

                async function renderForecast() {

                    // Projected gross profit from sales using Costing weighted avg margin (margin = profit/price)
                    const projectedGrossProfit = avgMarginPct != null ? projectedRevenue * (avgMarginPct / 100) : null;
                    const projectedCogs = avgMarginPct != null ? projectedRevenue - projectedGrossProfit : null;
                    const projectedRecurring = (monthlyRecurring / 30) * horizonDays;
                    const now = startOfDay(new Date());
                    const horizonEnd = new Date(now);
                    horizonEnd.setDate(horizonEnd.getDate() + horizonDays);
                    const plannedUnpaid = planned.filter((p) => !p.paid);
                    const plannedInWindow = plannedUnpaid
                        .filter((p) => {
                            if (!p.dueDate) return true; // unknown due → count in window as caution
                            const d = startOfDay(new Date(p.dueDate));
                            return d >= now && d <= horizonEnd;
                        })
                        .reduce((s, p) => s + (Number(p.amount) || 0), 0);
                    const otherInc = otherIncomeInWindow(otherIncomeList, horizonDays, now, horizonEnd);
                    const otherIncomeInWindowAmt = otherInc.total;
                    const projectedCash = liquid + projectedRevenue + otherIncomeInWindowAmt + (bal.receivable || 0) - projectedRecurring - plannedInWindow;

                        const cashAfter = liquid - price;
